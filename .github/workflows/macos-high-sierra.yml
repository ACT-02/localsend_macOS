name: LocalSend macOS High Sierra Backport

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.9"
  RUST_VERSION: "1.97.1"
  LEGACY_MACOS_TARGET: "10.13"
  MACOSX_DEPLOYMENT_TARGET: "10.13"

jobs:
  build:
    name: Build LocalSend for macOS High Sierra
    runs-on: macos-15-intel

    steps:
      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive


      # ============================================================
      # Toolchains
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - name: Show build environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Flutter"
          echo "============================================================"
          flutter --version

          echo
          echo "============================================================"
          echo "Dart"
          echo "============================================================"
          dart --version

          echo
          echo "============================================================"
          echo "Rust"
          echo "============================================================"
          rustc --version
          cargo --version
          rustup show

          echo
          echo "============================================================"
          echo "Xcode"
          echo "============================================================"
          xcodebuild -version

          echo
          echo "============================================================"
          echo "macOS runner"
          echo "============================================================"
          sw_vers
          uname -a
          uname -m

          echo
          echo "High Sierra target: ${LEGACY_MACOS_TARGET}"


      # ============================================================
      # Flutter / Rust dependencies
      # ============================================================

      - name: Clean Flutter build
        working-directory: app
        run: flutter clean

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Prepare Cargokit
        working-directory: packages/localsend_isolates/rust_builder/cargokit/build_tool
        run: flutter pub get

      - name: Verify Rust workspace
        shell: bash
        run: |
          set -euxo pipefail

          test -f Cargo.toml
          test -f rust-toolchain.toml
          test -f packages/localsend_isolates/rust/Cargo.toml

          cargo metadata \
            --format-version=1 \
            --no-deps \
            > /tmp/cargo-metadata.json

          python3 - <<'PY'
          import json

          with open("/tmp/cargo-metadata.json", "r") as f:
              metadata = json.load(f)

          print("Rust workspace packages:")
          for package in metadata["packages"]:
              print(f"  {package['name']} {package['version']}")
              print(f"    {package['manifest_path']}")
          PY


      # ============================================================
      # High Sierra backport
      # ============================================================

      - name: Patch LocalSend for High Sierra
        shell: bash
        run: |
          set -euxo pipefail

          PBX="app/macos/Runner.xcodeproj/project.pbxproj"
          PODFILE="app/macos/Podfile"
          RELEASE_XCCONFIG="app/macos/Runner/Configs/Release.xcconfig"
          APP_DELEGATE="app/macos/Runner/AppDelegate.swift"
          PACKAGE_RESOLVED="app/macos/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"

          echo "============================================================"
          echo "Patching LocalSend for macOS High Sierra 10.13"
          echo "Architecture: x86_64"
          echo "============================================================"


          # --------------------------------------------------------
          # 1. Patch Xcode project
          #
          # Flutter 3.41.9 contains a migration which changes literal
          #
          #     MACOSX_DEPLOYMENT_TARGET = 10.13;
          #
          # back to:
          #
          #     MACOSX_DEPLOYMENT_TARGET = 10.15;
          #
          # Therefore do NOT put a literal 10.13 in the pbxproj.
          #
          # Use:
          #
          #     $(LOCALSEND_LEGACY_MACOS_TARGET)
          #
          # instead.
          # --------------------------------------------------------

          python3 <<'PY'
          from pathlib import Path
          import re

          pbx = Path("app/macos/Runner.xcodeproj/project.pbxproj")
          text = pbx.read_text()

          # --------------------------------------------------------
          # Deployment target
          # --------------------------------------------------------

          text = re.sub(
              r'MACOSX_DEPLOYMENT_TARGET = [0-9.]+;',
              'MACOSX_DEPLOYMENT_TARGET = "$(LOCALSEND_LEGACY_MACOS_TARGET)";',
              text,
          )


          # --------------------------------------------------------
          # Remove upstream Apple Developer signing
          # --------------------------------------------------------

          text = re.sub(
              r'DEVELOPMENT_TEAM = [A-Z0-9]+;',
              'DEVELOPMENT_TEAM = "";',
              text,
          )

          text = text.replace(
              "CODE_SIGN_STYLE = Automatic;",
              "CODE_SIGN_STYLE = Manual;",
          )

          text = re.sub(
              r'CODE_SIGN_IDENTITY = "(?:Apple Development|Mac Development|Mac Developer)";',
              'CODE_SIGN_IDENTITY = "-";',
              text,
          )

          text = re.sub(
              r'("CODE_SIGN_IDENTITY\[sdk=macosx\*\]"\s*=\s*)'
              r'"(?:Apple Development|Mac Development|Mac Developer)";',
              r'\1"-";',
              text,
          )

          text = re.sub(
              r'PROVISIONING_PROFILE_SPECIFIER = "[^"]*";',
              'PROVISIONING_PROFILE_SPECIFIER = "";',
              text,
          )

          text = re.sub(
              r'PROVISIONING_PROFILE = "[^"]*";',
              'PROVISIONING_PROFILE = "";',
              text,
          )


          # --------------------------------------------------------
          # DockProgress backport
          #
          # Current LocalSend:
          #     DockProgress >= 4.3.1
          #
          # DockProgress 4.x requires a newer macOS.
          #
          # DockProgress 3.2.0 still supports macOS 10.12 and retains
          # the APIs LocalSend currently uses:
          #
          #     DockProgress.style
          #     DockProgress.progress
          #
          # --------------------------------------------------------

          dock_regex = re.compile(
              r'('
              r'XCRemoteSwiftPackageReference "DockProgress".*?'
              r'requirement = \{'
              r')'
              r'.*?'
              r'(\};)',
              re.DOTALL,
          )

          match = dock_regex.search(text)

          if not match:
              raise SystemExit(
                  "ERROR: Could not locate DockProgress package requirement."
              )

          replacement = (
              match.group(1)
              + '''
                  kind = exactVersion;
                  version = 3.2.0;
          '''
              + match.group(2)
          )

          text = (
              text[:match.start()]
              + replacement
              + text[match.end():]
          )

          pbx.write_text(text)
          PY


          # --------------------------------------------------------
          # 2. Patch the REAL Release xcconfig
          #
          # This is:
          #
          # app/macos/Runner/Configs/Release.xcconfig
          #
          # NOT app/macos/Flutter/Release.xcconfig.
          #
          # Project-level settings inherited by Runner,
          # ShareExtension and Swift Package build graph.
          # --------------------------------------------------------

          cat >> "$RELEASE_XCCONFIG" <<'EOF'

          // ========================================================
          // LocalSend macOS High Sierra Backport
          // ========================================================

          LOCALSEND_LEGACY_MACOS_TARGET = 10.13
          MACOSX_DEPLOYMENT_TARGET = $(LOCALSEND_LEGACY_MACOS_TARGET)

          // High Sierra is Intel-only.
          ARCHS = x86_64
          EXCLUDED_ARCHS = arm64
          ONLY_ACTIVE_ARCH = YES

          // CI / local legacy build uses ad-hoc signing.
          CODE_SIGN_IDENTITY = -
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM =

          EOF


          # --------------------------------------------------------
          # 3. Patch CocoaPods
          #
          # Again, do not write:
          #
          #     platform :osx, '10.13'
          #
          # because Flutter 3.41.9 detects that exact string and
          # automatically rewrites it to 10.15.
          #
          # Ruby variable defeats that migration while CocoaPods still
          # receives 10.13.
          # --------------------------------------------------------

          python3 <<'PY'
          from pathlib import Path
          import re

          podfile = Path("app/macos/Podfile")
          text = podfile.read_text()

          # Replace:
          #
          # platform :osx, '11.0'
          #
          # with:
          #
          # legacy_macos_target = '10.13'
          # platform :osx, legacy_macos_target

          text = re.sub(
              r"^platform\s+:osx,\s*['\"][0-9.]+['\"]",
              "legacy_macos_target = '10.13'\n"
              "platform :osx, legacy_macos_target",
              text,
              count=1,
              flags=re.MULTILINE,
          )


          # Replace the hard-coded Pod deployment target.
          text = re.sub(
              r"config\.build_settings\[['\"]MACOSX_DEPLOYMENT_TARGET['\"]\]"
              r"\s*=\s*['\"][0-9.]+['\"]",
              "config.build_settings['MACOSX_DEPLOYMENT_TARGET'] = "
              "legacy_macos_target",
              text,
          )


          # --------------------------------------------------------
          # ShareExtension compiles Runner/Shared.swift.
          #
          # Shared.swift imports Defaults, so ShareExtension needs a
          # proper CocoaPods target containing Defaults too.
          # --------------------------------------------------------

          if "target 'ShareExtension' do" not in text:
              share_extension = r"""
          target 'ShareExtension' do
            use_frameworks!
            use_modular_headers!

            pod 'Defaults', '~> 4.2'
          end

          """

              text = text.replace(
                  "\npost_install do |installer|",
                  "\n" + share_extension + "post_install do |installer|",
                  1,
              )

          if "target 'ShareExtension' do" not in text:
              raise SystemExit(
                  "ERROR: Failed to add ShareExtension CocoaPods target."
              )

          podfile.write_text(text)
          PY


          # --------------------------------------------------------
          # 4. Remove @MainActor from LocalSend native glue
          #
          # This method itself contains no async/await/Task work.
          # Avoid introducing a Swift Concurrency runtime dependency
          # into a High Sierra build.
          # --------------------------------------------------------

          python3 <<'PY'
          from pathlib import Path

          path = Path("app/macos/Runner/AppDelegate.swift")
          text = path.read_text()

          text = text.replace(
              "@MainActor private func handleFlutterCall",
              "private func handleFlutterCall",
          )

          path.write_text(text)
          PY


          # --------------------------------------------------------
          # 5. Force SwiftPM to resolve DockProgress 3.2.0 instead of
          # the committed 4.3.1 resolution.
          # --------------------------------------------------------

          rm -f "$PACKAGE_RESOLVED"


          # --------------------------------------------------------
          # Diagnostics
          # --------------------------------------------------------

          echo
          echo "============================================================"
          echo "Xcode deployment settings after patch"
          echo "============================================================"

          grep -nE \
            'MACOSX_DEPLOYMENT_TARGET|LOCALSEND_LEGACY_MACOS_TARGET' \
            "$PBX" \
            || true

          echo
          echo "============================================================"
          echo "Signing settings after patch"
          echo "============================================================"

          grep -nE \
            'DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE' \
            "$PBX" \
            || true

          echo
          echo "============================================================"
          echo "Release.xcconfig"
          echo "============================================================"

          cat "$RELEASE_XCCONFIG"

          echo
          echo "============================================================"
          echo "Podfile"
          echo "============================================================"

          cat "$PODFILE"

          echo
          echo "============================================================"
          echo "DockProgress package reference"
          echo "============================================================"

          grep -A12 -B2 \
            'XCRemoteSwiftPackageReference "DockProgress"' \
            "$PBX" \
            || true

          echo
          echo "============================================================"
          echo "AppDelegate MainActor check"
          echo "============================================================"

          grep -n \
            'MainActor\|handleFlutterCall' \
            "$APP_DELEGATE" \
            || true


      # ============================================================
      # Validate patch before touching Xcode
      # ============================================================

      - name: Validate High Sierra patch
        shell: bash
        run: |
          set -euxo pipefail

          PBX="app/macos/Runner.xcodeproj/project.pbxproj"
          PODFILE="app/macos/Podfile"

          # Upstream certificate must be gone.
          if grep -q "3W7H4PYMCV" "$PBX"; then
            echo "ERROR: Upstream LocalSend Team ID still exists."
            grep -n "3W7H4PYMCV" "$PBX"
            exit 1
          fi

          # Flutter migrator-triggering literal must not exist.
          if grep -q 'MACOSX_DEPLOYMENT_TARGET = 10.13;' "$PBX"; then
            echo "ERROR: Literal 10.13 exists in pbxproj."
            echo "Flutter 3.41.9 would migrate it back to 10.15."
            exit 1
          fi

          if grep -q "platform :osx, '10.13'" "$PODFILE"; then
            echo "ERROR: Literal 10.13 exists in Podfile."
            echo "Flutter 3.41.9 would migrate it back to 10.15."
            exit 1
          fi

          # DockProgress 4.x must be gone.
          if grep -A8 \
            'XCRemoteSwiftPackageReference "DockProgress"' \
            "$PBX" \
            | grep -q '4.3.1'; then
            echo "ERROR: DockProgress 4.3.1 is still configured."
            exit 1
          fi

          # ShareExtension must now have a Pods target.
          if ! grep -q "target 'ShareExtension' do" "$PODFILE"; then
            echo "ERROR: ShareExtension CocoaPods target missing."
            exit 1
          fi

          echo "Static patch validation passed."


      # ============================================================
      # CocoaPods
      # ============================================================

      - name: Install CocoaPods dependencies
        working-directory: app/macos
        shell: bash
        run: |
          set -euxo pipefail

          pod install

          echo
          echo "============================================================"
          echo "Generated CocoaPods targets"
          echo "============================================================"

          find "Pods/Target Support Files" \
            -maxdepth 1 \
            -type d \
            -print \
            | sort

          echo
          echo "============================================================"
          echo "ShareExtension Pods integration"
          echo "============================================================"

          test -d "Pods/Target Support Files/Pods-ShareExtension"

          find "Pods/Target Support Files/Pods-ShareExtension" \
            -maxdepth 1 \
            -type f \
            -print \
            | sort


      # ============================================================
      # Resolve Swift Package dependencies
      # ============================================================

      - name: Resolve Swift packages
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          xcodebuild \
            -resolvePackageDependencies \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner

          PACKAGE_RESOLVED="macos/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"

          echo
          echo "============================================================"
          echo "Resolved Swift packages"
          echo "============================================================"

          cat "$PACKAGE_RESOLVED"

          python3 <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "macos/Runner.xcodeproj/project.xcworkspace/"
              "xcshareddata/swiftpm/Package.resolved"
          )

          data = json.loads(path.read_text())

          versions = {}

          for pin in data.get("pins", []):
              identity = pin.get("identity")
              version = pin.get("state", {}).get("version")
              versions[identity] = version

          print("Resolved package versions:")
          for name, version in versions.items():
              print(f"  {name}: {version}")

          dock = versions.get("dockprogress")

          if dock != "3.2.0":
              raise SystemExit(
                  f"ERROR: DockProgress resolved to {dock!r}, expected 3.2.0"
              )

          launch = versions.get("launchatlogin-legacy")

          if launch != "5.0.2":
              print(
                  "WARNING: LaunchAtLogin-Legacy resolved to "
                  f"{launch!r}; expected current LocalSend version 5.0.2."
              )
          PY


      # ============================================================
      # Let Flutter generate its normal macOS configuration.
      #
      # This deliberately runs AFTER our migration-safe patches.
      # ============================================================

      - name: Generate Flutter macOS configuration
        working-directory: app
        shell: bash
        run: |
          set -o pipefail

          flutter build macos \
            --release \
            --config-only \
            -v \
            2>&1 | tee ../flutter-config-only.log


      # ============================================================
      # Make sure Flutter did not silently restore Catalina.
      # ============================================================

      - name: Verify Flutter did not migrate target
        shell: bash
        run: |
          set -euxo pipefail

          PBX="app/macos/Runner.xcodeproj/project.pbxproj"
          PODFILE="app/macos/Podfile"

          echo "============================================================"
          echo "Check source files after flutter --config-only"
          echo "============================================================"

          if grep -q 'MACOSX_DEPLOYMENT_TARGET = 10.15;' "$PBX"; then
            echo "ERROR:"
            echo "Flutter restored a literal macOS 10.15 deployment target:"
            grep -n 'MACOSX_DEPLOYMENT_TARGET = 10.15;' "$PBX"
            exit 1
          fi

          if grep -q "platform :osx, '10.15'" "$PODFILE"; then
            echo "ERROR:"
            echo "Flutter restored Podfile platform to macOS 10.15:"
            grep -n "platform :osx, '10.15'" "$PODFILE"
            exit 1
          fi

          echo "Flutter migration bypass survived."


      # ============================================================
      # Inspect the settings Xcode ACTUALLY sees.
      # ============================================================

      - name: Verify effective Xcode build settings
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p ../diagnostics

          echo "============================================================"
          echo "Runner effective Release settings"
          echo "============================================================"

          xcodebuild \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -showBuildSettings \
            > ../diagnostics/runner-build-settings.txt

          grep -E \
            '(^| )[A-Z_]*(ARCHS|EXCLUDED_ARCHS|ONLY_ACTIVE_ARCH|MACOSX_DEPLOYMENT_TARGET|LOCALSEND_LEGACY_MACOS_TARGET)[A-Z_]* =' \
            ../diagnostics/runner-build-settings.txt \
            || true

          echo
          echo "============================================================"
          echo "ShareExtension effective Release settings"
          echo "============================================================"

          xcodebuild \
            -project macos/Runner.xcodeproj \
            -target ShareExtension \
            -configuration Release \
            -showBuildSettings \
            > ../diagnostics/shareextension-build-settings.txt

          grep -E \
            '(^| )[A-Z_]*(ARCHS|EXCLUDED_ARCHS|ONLY_ACTIVE_ARCH|MACOSX_DEPLOYMENT_TARGET|LOCALSEND_LEGACY_MACOS_TARGET)[A-Z_]* =' \
            ../diagnostics/shareextension-build-settings.txt \
            || true

          echo
          echo "============================================================"
          echo "Hard validation"
          echo "============================================================"

          python3 <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("../diagnostics/runner-build-settings.txt"),
              Path("../diagnostics/shareextension-build-settings.txt"),
          ]

          for path in files:
              text = path.read_text()

              print(f"Checking {path}")

              deployment = re.findall(
                  r"^\s*MACOSX_DEPLOYMENT_TARGET\s*=\s*(.+?)\s*$",
                  text,
                  flags=re.MULTILINE,
              )

              archs = re.findall(
                  r"^\s*ARCHS\s*=\s*(.+?)\s*$",
                  text,
                  flags=re.MULTILINE,
              )

              excluded = re.findall(
                  r"^\s*EXCLUDED_ARCHS\s*=\s*(.*?)\s*$",
                  text,
                  flags=re.MULTILINE,
              )

              print("  deployment:", deployment[:3])
              print("  archs:", archs[:3])
              print("  excluded:", excluded[:3])

              if not deployment or deployment[0] != "10.13":
                  raise SystemExit(
                      f"ERROR: {path} is not targeting macOS 10.13"
                  )

              if not archs or "x86_64" not in archs[0].split():
                  raise SystemExit(
                      f"ERROR: {path} is not building x86_64"
                  )

              if excluded and "arm64" not in excluded[0].split():
                  raise SystemExit(
                      f"ERROR: {path} does not exclude arm64"
                  )

          print("Effective Xcode settings are correct.")
          PY


      # ============================================================
      # Build
      #
      # rust_lib_localsend_app is intentionally NOT built by a
      # separate cargo build step. Cargokit builds it through the
      # Flutter/Xcode native build.
      # ============================================================

      - name: Build macOS app
        working-directory: app
        shell: bash
        env:
          ARCHS: x86_64
          EXCLUDED_ARCHS: arm64
        run: |
          set -o pipefail

          echo "============================================================"
          echo "Building LocalSend"
          echo
          echo "Target OS:      macOS High Sierra 10.13"
          echo "Architecture:   x86_64"
          echo "Flutter:        ${FLUTTER_VERSION}"
          echo "Rust:           ${RUST_VERSION}"
          echo "DockProgress:   3.2.0"
          echo "============================================================"

          flutter build macos \
            --release \
            -v \
            2>&1 | tee ../flutter-macos-build.log


      # ============================================================
      # Locate final application
      # ============================================================

      - name: Locate built application
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          APP="$(
            find build/macos/Build/Products/Release \
              -maxdepth 1 \
              -type d \
              -name '*.app' \
              -print \
              -quit
          )"

          if [ -z "$APP" ]; then
            echo "ERROR: No .app bundle was produced."
            exit 1
          fi

          EXECUTABLE="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$APP/Contents/Info.plist"
          )"

          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "APP_EXECUTABLE=$EXECUTABLE" >> "$GITHUB_ENV"

          echo "Application:"
          echo "$APP"

          echo
          echo "Executable:"
          echo "$EXECUTABLE"


      # ============================================================
      # Verify final architecture
      # ============================================================

      - name: Verify x86_64 application
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          MAIN="$APP/Contents/MacOS/$APP_EXECUTABLE"

          file "$MAIN"
          lipo -info "$MAIN"

          ARCHES="$(lipo -archs "$MAIN")"

          echo "Architectures: $ARCHES"

          if ! echo "$ARCHES" | grep -qw x86_64; then
            echo "ERROR: Main application does not contain x86_64."
            exit 1
          fi

          if echo "$ARCHES" | grep -qw arm64; then
            echo "ERROR: arm64 unexpectedly remains in main executable."
            exit 1
          fi


      # ============================================================
      # Audit every Mach-O binary
      #
      # This is where we will discover whether FlutterMacOS.framework
      # or a plugin still has a minimum OS newer than High Sierra.
      # ============================================================

      - name: Audit Mach-O deployment targets
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p ../diagnostics

          REPORT="../diagnostics/macho-deployment-targets.txt"

          : > "$REPORT"

          find "$APP" -type f -print0 |
          while IFS= read -r -d '' FILE; do

            if file "$FILE" | grep -q "Mach-O"; then
              {
                echo
                echo "============================================================"
                echo "$FILE"
                echo "============================================================"

                file "$FILE"

                echo
                echo "--- Architectures ---"
                lipo -archs "$FILE" 2>/dev/null || true

                echo
                echo "--- Deployment load commands ---"

                otool -l "$FILE" |
                awk '
                  /cmd LC_VERSION_MIN_MACOSX/ {
                    capture=1
                    count=0
                  }

                  /cmd LC_BUILD_VERSION/ {
                    capture=1
                    count=0
                  }

                  capture {
                    print
                    count++

                    if (count >= 10) {
                      capture=0
                    }
                  }
                '

                echo
                echo "--- Linked libraries ---"
                otool -L "$FILE" || true

              } | tee -a "$REPORT"
            fi

          done


      # ============================================================
      # Separate linked-library report
      # ============================================================

      - name: Audit linked libraries
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p ../diagnostics

          REPORT="../diagnostics/linked-libraries.txt"
          : > "$REPORT"

          find "$APP" -type f -print0 |
          while IFS= read -r -d '' FILE; do

            if file "$FILE" | grep -q "Mach-O"; then
              {
                echo
                echo "============================================================"
                echo "$FILE"
                echo "============================================================"
                otool -L "$FILE" || true
              } >> "$REPORT"
            fi

          done

          cat "$REPORT"


      # ============================================================
      # Inspect signatures and entitlements
      #
      # Do NOT run:
      #
      #     codesign --deep --force
      #
      # over the final bundle. That could destroy nested extension
      # entitlements. Xcode has already ad-hoc signed each target.
      # ============================================================

      - name: Inspect code signatures
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p ../diagnostics

          REPORT="../diagnostics/codesign-report.txt"

          {
            echo "============================================================"
            echo "Main application signature"
            echo "============================================================"

            codesign -dvvv "$APP" 2>&1 || true

            echo
            echo "============================================================"
            echo "Main application entitlements"
            echo "============================================================"

            codesign \
              -d \
              --entitlements :- \
              "$APP" \
              2>&1 || true

            echo
            echo "============================================================"
            echo "Embedded extensions"
            echo "============================================================"

            find "$APP" -type d -name '*.appex' -print |
            while read -r EXTENSION; do
              echo
              echo "------------------------------------------------------------"
              echo "$EXTENSION"
              echo "------------------------------------------------------------"

              codesign -dvvv "$EXTENSION" 2>&1 || true

              codesign \
                -d \
                --entitlements :- \
                "$EXTENSION" \
                2>&1 || true
            done

          } | tee "$REPORT"

          echo
          echo "============================================================"
          echo "Verify complete bundle"
          echo "============================================================"

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=4 \
            "$APP"


      # ============================================================
      # Package
      # ============================================================

      - name: Package High Sierra build
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p release

          OUTPUT="release/LocalSend-macOS-High-Sierra-10.13-x86_64.zip"

          rm -f "$OUTPUT"

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$APP" \
            "$OUTPUT"

          echo "Created:"
          ls -lh "$OUTPUT"


      # ============================================================
      # Upload final build
      # ============================================================

      - name: Upload High Sierra build
        uses: actions/upload-artifact@v4
        with:
          name: LocalSend-macOS-High-Sierra-10.13-x86_64
          path: app/release/LocalSend-macOS-High-Sierra-10.13-x86_64.zip
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # Diagnostics are uploaded even if compilation fails.
      # ============================================================

      - name: Collect source diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostics

          cp \
            app/macos/Runner.xcodeproj/project.pbxproj \
            diagnostics/project.pbxproj.after-patch \
            2>/dev/null || true

          cp \
            app/macos/Podfile \
            diagnostics/Podfile.after-patch \
            2>/dev/null || true

          cp \
            app/macos/Runner/Configs/Release.xcconfig \
            diagnostics/Release.xcconfig.after-patch \
            2>/dev/null || true

          cp \
            app/macos/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved \
            diagnostics/Package.resolved.after-patch \
            2>/dev/null || true

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LocalSend-High-Sierra-build-diagnostics
          path: |
            flutter-config-only.log
            flutter-macos-build.log
            diagnostics/
          if-no-files-found: warn
          retention-days: 30
