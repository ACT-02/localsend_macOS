      # ============================================================
      # Compiler diagnostics
      # ============================================================

      - name: Extract compiler errors
        if: failure()
        shell: bash
        run: |
          set +e

          mkdir -p \
            diagnostics


          if [ -f flutter-macos-build.log ]; then

            python3 <<'PY'
          from pathlib import Path
          import re

          source = Path(
              "flutter-macos-build.log"
          )

          lines = source.read_text(
              errors="replace"
          ).splitlines()


          real_error_pattern = re.compile(
              r"(?:"
              r"\berror:"
              r"|"
              r"\bfatal error:"
              r"|"
              r"Undefined symbols for architecture"
              r"|"
              r"symbol\(s\) not found for architecture"
              r"|"
              r"ld: "
              r"|"
              r"clang: error:"
              r"|"
              r"Command .* failed with a nonzero exit code"
              r"|"
              r"PhaseScriptExecution .* failed"
              r"|"
              r"\*\* BUILD FAILED \*\*"
              r"|"
              r"The following build commands failed:"
              r")"
          )


          hits = [
              index
              for index, line in enumerate(lines)
              if real_error_pattern.search(
                  line
              )
          ]


          ranges = []


          for index in hits:

              start = max(
                  0,
                  index - 18,
              )

              end = min(
                  len(lines),
                  index + 26,
              )

              if (
                  ranges
                  and start <= ranges[-1][1]
              ):
                  ranges[-1] = (
                      ranges[-1][0],
                      max(
                          ranges[-1][1],
                          end,
                      ),
                  )
              else:
                  ranges.append(
                      (start, end)
                  )


          output = []


          for start, end in ranges:

              output.append(
                  "=" * 100
              )

              for index in range(
                  start,
                  end,
              ):
                  output.append(
                      f"{index + 1}: "
                      f"{lines[index]}"
                  )


          Path(
              "diagnostics/"
              "compiler-errors.txt"
          ).write_text(
              "\n".join(output)
              + (
                  "\n"
                  if output
                  else ""
              )
          )


          availability_pattern = re.compile(
              r"(?:"
              r"warning:.*only available in macOS"
              r"|"
              r"note:.*introduced in macOS"
              r"|"
              r"marked as being introduced in macOS"
              r")"
          )


          availability = [
              f"{index + 1}: {line}"
              for index, line in enumerate(lines)
              if availability_pattern.search(
                  line
              )
          ]


          Path(
              "diagnostics/"
              "availability-warnings.txt"
          ).write_text(
              "\n".join(
                  availability
              )
              + (
                  "\n"
                  if availability
                  else ""
              )
          )


          tail = lines[
              max(
                  0,
                  len(lines) - 1500,
              ):
          ]


          Path(
              "diagnostics/"
              "build-tail.txt"
          ).write_text(
              "\n".join(
                  tail
              )
              + "\n"
          )


          print(
              "============================================================"
          )

          print(
              "REAL COMPILER / LINKER ERRORS"
          )

          print(
              "============================================================"
          )


          error_file = Path(
              "diagnostics/"
              "compiler-errors.txt"
          )


          if (
              error_file.exists()
              and error_file.stat().st_size
          ):
              print(
                  error_file.read_text()
              )
          else:
              print(
                  "No explicit compiler/linker error "
                  "was matched."
              )

              print(
                  "See diagnostics/build-tail.txt."
              )
          PY

          fi


      # ============================================================
      # Locate app
      # ============================================================

      - name: Locate built application
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          APP="$(
            find \
              build/macos/Build/Products/Release \
              -maxdepth 1 \
