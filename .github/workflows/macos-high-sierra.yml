          )"


          echo \
            "APP=$APP" \
            >> "$GITHUB_ENV"


          echo \
            "APP_EXECUTABLE=$EXECUTABLE" \
            >> "$GITHUB_ENV"


          echo "APP=$APP"

          echo "EXECUTABLE=$EXECUTABLE"


      # ============================================================
      # Repair LaunchAtLogin helper signature
      #
      # The helper is copied and modified by LaunchAtLogin's build
      # script. On this ad-hoc CI build its Info.plist resource seal
      # can end up invalid after the remaining Xcode build phases.
      #
      # Do NOT use codesign --deep to re-sign the entire app.
      #
      # Sign inside-out:
      #
      #   1. Preserve main app entitlements
      #   2. Re-sign LaunchAtLoginHelper.app only
      #   3. Verify helper
      #   4. Re-sign outer LocalSend.app last
      # ============================================================

      - name: Repair LaunchAtLogin helper signature
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p \
            ../diagnostics


          HELPER="$APP/Contents/Library/LoginItems/LaunchAtLoginHelper.app"

          MAIN_ENTITLEMENTS="../diagnostics/LocalSend.entitlements.before-resign.plist"

          HELPER_ENTITLEMENTS="../diagnostics/LaunchAtLoginHelper.entitlements.plist"


          if [ ! -d "$HELPER" ]; then

            echo "ERROR:"
            echo "LaunchAtLoginHelper.app is missing:"
            echo "$HELPER"

            exit 1
          fi


          echo "============================================================"
          echo "LaunchAtLogin helper before repair"
          echo "============================================================"


          find "$HELPER" \
            -maxdepth 3 \
            -print \
            | sort \
            | head -200


          echo
          echo "============================================================"
          echo "Helper Info.plist"
          echo "============================================================"


          test -f \
            "$HELPER/Contents/Info.plist"


          plutil -lint \
            "$HELPER/Contents/Info.plist"


          cp \
            "$HELPER/Contents/Info.plist" \
            ../diagnostics/LaunchAtLoginHelper.Info.plist.before-resign


          /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleIdentifier' \
            "$HELPER/Contents/Info.plist" \
            | tee \
              ../diagnostics/LaunchAtLoginHelper.bundle-id.txt


          echo
          echo "============================================================"
          echo "Main app entitlements before repair"
          echo "============================================================"


          codesign \
            --display \
            --entitlements - \
            --xml \
            "$APP" \
            2> ../diagnostics/LocalSend.codesign-display.before-resign.txt \
          | plutil \
              -convert xml1 \
              -o "$MAIN_ENTITLEMENTS" \
              -


          plutil -lint \
            "$MAIN_ENTITLEMENTS"


          cat \
            "$MAIN_ENTITLEMENTS"


          echo
          echo "============================================================"
          echo "LaunchAtLogin helper entitlements"
          echo "============================================================"


          # LaunchAtLogin-Legacy 5.0.2 ships exactly this entitlement
          # for the legacy login helper.
          cat > "$HELPER_ENTITLEMENTS" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.app-sandbox</key>
            <true/>
          </dict>
          </plist>
          EOF


          plutil -lint \
            "$HELPER_ENTITLEMENTS"


          cat \
            "$HELPER_ENTITLEMENTS"


          echo
          echo "============================================================"
          echo "Existing helper signature"
          echo "============================================================"


          codesign \
            --display \
            --verbose=4 \
            "$HELPER" \
            2>&1 \
            | tee \
              ../diagnostics/LaunchAtLoginHelper.codesign.before-resign.txt \
            || true


          echo
          echo "============================================================"
          echo "Re-sign helper only"
          echo "============================================================"


          # Do not use --deep here.
          #
          # The embedded Swift runtime dylibs were already signed by
          # the LaunchAtLogin package and previously validated. We
          # only replace the helper app's outer resource seal.
          codesign \
            --force \
            --sign - \
            --options runtime \
            --preserve-metadata=identifier,requirements \
            --entitlements \
              "$HELPER_ENTITLEMENTS" \
            "$HELPER"


          codesign \
            --verify \
            --strict \
            --verbose=4 \
            "$HELPER" \
            2>&1 \
            | tee \
              ../diagnostics/LaunchAtLoginHelper.verify.after-resign.txt


          echo
          echo "============================================================"
          echo "Re-sign outer LocalSend.app last"
          echo "============================================================"


          # Re-signing the nested helper changes the outer app's
          # resource seal, therefore the parent app must be signed
          # again after the helper.
          #
          # Preserve the entitlements Xcode actually embedded instead
          # of using Runner/Release.entitlements directly, because the
          # source file contains build-setting substitutions.
          codesign \
            --force \
            --sign - \
            --preserve-metadata=identifier,requirements,flags \
            --entitlements \
              "$MAIN_ENTITLEMENTS" \
            "$APP"


          echo
          echo "============================================================"
          echo "Main app signature after repair"
          echo "============================================================"


          codesign \
            --display \
            --verbose=4 \
            "$APP" \
            2>&1 \
            | tee \
              ../diagnostics/LocalSend.codesign.after-resign.txt


          echo
          echo "============================================================"
          echo "Main app entitlements after repair"
          echo "============================================================"


          codesign \
            --display \
            --entitlements - \
            --xml \
            "$APP" \
            2>/dev/null \
          | plutil \
              -convert xml1 \
              -o ../diagnostics/LocalSend.entitlements.after-resign.plist \
              -


          plutil -lint \
            ../diagnostics/LocalSend.entitlements.after-resign.plist


          cat \
            ../diagnostics/LocalSend.entitlements.after-resign.plist


      # ============================================================
      # x86_64 verification
      # ============================================================

      - name: Verify x86_64 application
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          MAIN="$APP/Contents/MacOS/$APP_EXECUTABLE"

          file "$MAIN"

          lipo \
            -info \
            "$MAIN"

          ARCHES="$(
            lipo \
              -archs \
              "$MAIN"
          )"


          echo "Architectures: $ARCHES"


          if ! echo "$ARCHES" \
            | grep -qw x86_64; then

            echo "ERROR:"
            echo "Main executable lacks x86_64."

            exit 1
          fi


          if echo "$ARCHES" \
            | grep -qw arm64; then

            echo "ERROR:"
            echo "arm64 unexpectedly remains."

            exit 1
          fi


      # ============================================================
      # Mach-O audit
      # ============================================================

      - name: Audit Mach-O deployment targets
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p \
            ../diagnostics

          REPORT="../diagnostics/macho-deployment-targets.txt"

          : > "$REPORT"


          find "$APP" \
            -type f \
            -print0 \
          | while IFS= read -r -d '' FILE; do

              if file "$FILE" \
                | grep -q "Mach-O"; then

                {
                  echo
                  echo "============================================================"
                  echo "$FILE"
                  echo "============================================================"

                  file "$FILE"

                  echo
                  echo "--- Architectures ---"

                  lipo \
                    -archs \
                    "$FILE" \
                    2>/dev/null \
                    || true

                  echo
                  echo "--- Deployment ---"

                  otool \
                    -l \
                    "$FILE" \
                  | awk '
                      /cmd LC_VERSION_MIN_MACOSX/ {
                        capture=1
                        count=0
                      }

                      /cmd LC_BUILD_VERSION/ {
                        capture=1
                        count=0
                      }

                      capture {
                        print
                        count++

                        if (count >= 10) {
                          capture=0
                        }
                      }
                    '

                  echo
                  echo "--- Linked libraries ---"

                  otool \
                    -L \
                    "$FILE" \
                    || true

                } | tee -a "$REPORT"

              fi

            done


      # ============================================================
      # Signature / entitlement inspection
      # ============================================================

      - name: Inspect code signatures
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p \
            ../diagnostics

          REPORT="../diagnostics/codesign-report.txt"


          {
            echo "============================================================"
            echo "Main application"
            echo "============================================================"

            codesign \
              --display \
              --verbose=4 \
              "$APP" \
              2>&1 \
              || true


            echo
            echo "============================================================"
            echo "Main entitlements"
            echo "============================================================"


            # Modern syntax: '-' rather than deprecated ':-'.
            codesign \
              --display \
              --entitlements - \
              --xml \
              "$APP" \
              2>/dev/null \
              || true


            echo
            echo "============================================================"
            echo "LaunchAtLogin helper"
            echo "============================================================"


            HELPER="$APP/Contents/Library/LoginItems/LaunchAtLoginHelper.app"


            if [ -d "$HELPER" ]; then

              codesign \
                --display \
                --verbose=4 \
                "$HELPER" \
                2>&1 \
                || true


              echo
              echo "LaunchAtLogin helper entitlements:"


              codesign \
                --display \
                --entitlements - \
                --xml \
                "$HELPER" \
                2>/dev/null \
                || true

            fi


            echo
            echo "============================================================"
            echo "Extensions"
            echo "============================================================"


            find "$APP" \
              -type d \
              -name '*.appex' \
              -print \
            | while read -r EXTENSION; do

                echo
                echo "------------------------------------------------------------"
                echo "$EXTENSION"
                echo "------------------------------------------------------------"


                codesign \
                  --display \
                  --verbose=4 \
                  "$EXTENSION" \
                  2>&1 \
                  || true


                codesign \
                  --display \
                  --entitlements - \
                  --xml \
                  "$EXTENSION" \
                  2>/dev/null \
                  || true

              done

          } | tee "$REPORT"


          echo
          echo "============================================================"
          echo "Verify complete application bundle"
          echo "============================================================"


          # Verification may be deep. Signing above was intentionally
          # NOT done using --deep.
          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=4 \
            "$APP"


      # ============================================================
      # Package
      # ============================================================

      - name: Package High Sierra build
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p \
            release

          OUTPUT="release/LocalSend-macOS-High-Sierra-10.13-x86_64.zip"

          rm -f \
            "$OUTPUT"

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$APP" \
            "$OUTPUT"

          ls -lh \
            "$OUTPUT"


      # ============================================================
      # Upload successful application
      #
      # Retry once if GitHub Artifact Service itself times out.
      # ============================================================

      - name: Upload High Sierra build
        id: upload_build
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: LocalSend-macOS-High-Sierra-10.13-x86_64
          path: app/release/LocalSend-macOS-High-Sierra-10.13-x86_64.zip
          if-no-files-found: error
          retention-days: 30


      - name: Retry High Sierra build upload
        id: upload_build_retry
        if: steps.upload_build.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: LocalSend-macOS-High-Sierra-10.13-x86_64-retry
          path: app/release/LocalSend-macOS-High-Sierra-10.13-x86_64.zip
          if-no-files-found: error
          retention-days: 30


      - name: Verify High Sierra build upload
        if: >
          steps.upload_build.outcome == 'failure' &&
          steps.upload_build_retry.outcome == 'failure'
        shell: bash
        run: |
          echo "ERROR:"
          echo "Both build artifact upload attempts failed."
          exit 1


      # ============================================================
      # Diagnostics
      # ============================================================

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p \
            diagnostics


          cp \
            app/macos/Runner.xcodeproj/project.pbxproj \
            diagnostics/project.pbxproj.after-patch \
            2>/dev/null


          cp \
            app/macos/Podfile \
            diagnostics/Podfile.after-patch \
            2>/dev/null


          cp \
            app/macos/Podfile.lock \
            diagnostics/Podfile.lock.after-patch \
            2>/dev/null


          cp \
            app/pubspec.yaml \
            diagnostics/pubspec.yaml.after-foss-strip \
            2>/dev/null


          cp \
            app/.flutter-plugins-dependencies \
            diagnostics/flutter-plugins-dependencies.json \
            2>/dev/null


          cp \
            app/macos/Runner/Configs/Release.xcconfig \
            diagnostics/Release.xcconfig.after-patch \
            2>/dev/null


          cp \
            flutter-config-first.log \
            diagnostics/flutter-config-first.log \
            2>/dev/null


          cp \
            flutter-config-final.log \
            diagnostics/flutter-config-final.log \
            2>/dev/null


          cp \
            pod-install.log \
            diagnostics/pod-install.log \
            2>/dev/null


          cp \
            pod-env.log \
            diagnostics/pod-env.log \
            2>/dev/null


          cp \
            swiftpm-resolve.log \
            diagnostics/swiftpm-resolve.log \
            2>/dev/null


          cp \
            flutter-macos-build.log \
            diagnostics/flutter-macos-build.log \
            2>/dev/null


          cp \
            flutter-pub-deps.txt \
            diagnostics/flutter-pub-deps.txt \
            2>/dev/null


          cp \
            flutter-podhelper.rb.original \
            diagnostics/flutter-podhelper.rb.original \
            2>/dev/null


          cp \
            "$FLUTTER_ROOT/packages/flutter_tools/bin/podhelper.rb" \
            diagnostics/flutter-podhelper.rb.after-patch \
            2>/dev/null


          cp \
            app/macos/Flutter/ephemeral/FlutterMacOS.podspec \
            diagnostics/FlutterMacOS.podspec.generated \
            2>/dev/null


          cp \
            app/macos/Flutter/ephemeral/Flutter-Generated.xcconfig \
            diagnostics/Flutter-Generated.xcconfig \
            2>/dev/null


          # --------------------------------------------------------
          # ShareExtension
          # --------------------------------------------------------

          cp \
            app/macos/ShareExtension/Utilities.swift \
            diagnostics/ShareExtension-Utilities.high-sierra.swift \
            2>/dev/null


          cp \
            app/macos/ShareExtension/Utilities.swift.high-sierra-original \
            diagnostics/ShareExtension-Utilities.original.swift \
            2>/dev/null


          cp \
            app/macos/ShareExtension/ShareController.swift \
            diagnostics/ShareController.high-sierra.swift \
            2>/dev/null


          cp \
            app/macos/ShareExtension/ShareController.swift.high-sierra-original \
            diagnostics/ShareController.original.swift \
            2>/dev/null


          # --------------------------------------------------------
          # Package.resolved
          # --------------------------------------------------------

          python3 <<'PY'
          from pathlib import Path
          import shutil

          source = Path(
              "app/macos"
          )

          destination = Path(
              "diagnostics"
          )

          destination.mkdir(
              parents=True,
              exist_ok=True,
          )

          files = sorted(
              path
              for path in source.rglob(
                  "Package.resolved"
              )
              if path.parent.name == "swiftpm"
          )

          for index, path in enumerate(
              files,
              start=1,
          ):
              relative = path.relative_to(
                  source
              )

              safe_name = (
                  str(relative)
                  .replace("/", "__")
                  .replace(" ", "_")
              )

              output = destination / (
                  f"Package.resolved."
                  f"{index}__"
                  f"{safe_name}"
              )

              shutil.copy2(
                  path,
                  output,
              )
          PY


          # --------------------------------------------------------
          # Patched plugin podspecs
          # --------------------------------------------------------

          python3 <<'PY'
          import json
          import shutil
          from pathlib import Path

          plugins_file = Path(
              "app/.flutter-plugins-dependencies"
          )

          destination = Path(
              "diagnostics/plugin-podspecs"
          )

          destination.mkdir(
              parents=True,
              exist_ok=True,
          )

          if plugins_file.exists():

              data = json.loads(
                  plugins_file.read_text()
              )

              for plugin in (
                  data
                  .get("plugins", {})
                  .get("macos", [])
              ):
                  name = plugin.get("name")
                  raw_path = plugin.get("path")

                  if not name or not raw_path:
                      continue

                  platform_dir = (
                      "darwin"
                      if plugin.get(
                          "shared_darwin_source",
                          False,
                      )
                      else "macos"
                  )

                  podspec = (
                      Path(raw_path)
                      / platform_dir
                      / f"{name}.podspec"
                  )

                  if podspec.exists():
                      shutil.copy2(
                          podspec,
                          destination
                          / f"{name}.podspec.after-patch",
                      )

                  backup = podspec.with_suffix(
                      podspec.suffix
                      + ".high-sierra-original"
                  )

                  if backup.exists():
                      shutil.copy2(
                          backup,
                          destination
                          / f"{name}.podspec.original",
                      )
          PY


          # --------------------------------------------------------
          # connectivity_plus
          # --------------------------------------------------------

          CONNECTIVITY_ROOT="$(
            python3 <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "app/.flutter-plugins-dependencies"
          )

          if path.exists():

              data = json.loads(
                  path.read_text()
              )

              for plugin in (
                  data
                  .get("plugins", {})
                  .get("macos", [])
              ):
                  if plugin.get("name") == "connectivity_plus":
                      print(
                          plugin.get(
                              "path",
                              "",
                          )
                      )

                      break
          PY
          )"


          if [ -n "$CONNECTIVITY_ROOT" ]; then

            CONNECTIVITY_PROVIDER="$CONNECTIVITY_ROOT/macos/connectivity_plus/Sources/connectivity_plus/PathMonitorConnectivityProvider.swift"

            CONNECTIVITY_PODSPEC="$CONNECTIVITY_ROOT/macos/connectivity_plus.podspec"


            cp \
              "$CONNECTIVITY_PROVIDER" \
              diagnostics/ConnectivityProvider.high-sierra.swift \
              2>/dev/null


            cp \
              "${CONNECTIVITY_PROVIDER}.high-sierra-original" \
              diagnostics/ConnectivityProvider.original.swift \
              2>/dev/null


            cp \
              "$CONNECTIVITY_PODSPEC" \
              diagnostics/connectivity_plus.podspec.after-patch \
              2>/dev/null


            cp \
              "${CONNECTIVITY_PODSPEC}.high-sierra-specific-original" \
              diagnostics/connectivity_plus.podspec.before-specific-patch \
              2>/dev/null

          fi


          # --------------------------------------------------------
          # gal
          # --------------------------------------------------------

          PUB_CACHE_ROOT="${PUB_CACHE:-$HOME/.pub-cache}"

          GAL_SWIFT="$(
            find "$PUB_CACHE_ROOT" \
              -type f \
              -path '*/gal-2.3.3/darwin/gal/Sources/gal/GalPlugin.swift' \
              -print \
              -quit
          )"


          if [ -n "$GAL_SWIFT" ]; then

            cp \
              "$GAL_SWIFT" \
              diagnostics/GalPlugin.swift.after-patch \
              2>/dev/null


            cp \
              "${GAL_SWIFT}.original" \
              diagnostics/GalPlugin.swift.original \
              2>/dev/null

          fi


      # ============================================================
      # Pack diagnostics into one file.
      #
      # This reduces upload bookkeeping and avoids trying to upload
      # dozens of individual diagnostic files.
      # ============================================================

      - name: Pack diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          rm -f \
            LocalSend-High-Sierra-build-diagnostics.zip


          if [ -d diagnostics ]; then

            ditto \
              -c \
              -k \
              --sequesterRsrc \
              --keepParent \
              diagnostics \
              LocalSend-High-Sierra-build-diagnostics.zip


            ls -lh \
              LocalSend-High-Sierra-build-diagnostics.zip

          else

            echo "No diagnostics directory exists."

          fi


      # ============================================================
      # Diagnostics artifact
      #
      # GitHub's ArtifactService can occasionally time out while
      # creating an artifact. Do not let that hide the actual build
      # result. Retry once under a different artifact name.
      # ============================================================

      - name: Upload build diagnostics
        id: upload_diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: LocalSend-High-Sierra-build-diagnostics
          path: LocalSend-High-Sierra-build-diagnostics.zip
          if-no-files-found: warn
          retention-days: 30


      - name: Retry build diagnostics upload
        if: >
          always() &&
          steps.upload_diagnostics.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: LocalSend-High-Sierra-build-diagnostics-retry
          path: LocalSend-High-Sierra-build-diagnostics.zip
          if-no-files-found: warn
          retention-days: 30
