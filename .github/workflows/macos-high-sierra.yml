      - name: Backport ShareExtension for High Sierra
        shell: bash
        run: |
          set -euxo pipefail

          UTILITIES="app/macos/ShareExtension/Utilities.swift"

          SHARE_CONTROLLER="app/macos/ShareExtension/ShareController.swift"

          test -f "$UTILITIES"
          test -f "$SHARE_CONTROLLER"

          cp \
            "$UTILITIES" \
            "${UTILITIES}.high-sierra-original"

          cp \
            "$SHARE_CONTROLLER" \
            "${SHARE_CONTROLLER}.high-sierra-original"


          cat > "$UTILITIES" <<'SWIFT'
          import AppKit
          import Foundation

          extension Sequence where Element: Sequence {

            func flatten()
              -> [Element.Element]
            {
              return flatMap {
                $0
              }
            }
          }


          struct TextContent {
            var title:
              String?

            var body:
              String?
          }


          extension NSExtensionContext {

            var inputItemsTyped:
              [NSExtensionItem]
            {
              return inputItems
                as? [NSExtensionItem]
                ?? []
            }


            var attachments:
              [NSItemProvider]
            {
              return inputItemsTyped
                .compactMap {
                  $0.attachments
                }
                .flatten()
            }


            var textContent:
              TextContent
            {
              return TextContent(
                title:
                  inputItemsTyped
                    .first?
                    .attributedTitle?
                    .string,
                body:
                  inputItemsTyped
                    .first?
                    .attributedContentText?
                    .string
              )
            }
          }


          extension NSError {

            static let userCancelled =
              NSError(
                domain:
                  NSCocoaErrorDomain,
                code:
                  NSUserCancelledError,
                userInfo:
                  nil
              )
          }


          typealias ExtensionRunCompletion =
            (
              [NSExtensionItem],
              Error?
            ) -> Void


          class ExtensionController:
            NSViewController
          {
            override func loadView() {
              view =
                NSView(
                  frame:
                    .zero
                )

              guard let context =
                extensionContext
              else {
                return
              }

              run(
                context
              ) {
                items,
                error in

                DispatchQueue
                  .main
                  .async {

                    if let error =
                      error
                    {
                      context
                        .cancelRequest(
                          withError:
                            error
                        )

                      return
                    }

                    context
                      .completeRequest(
                        returningItems:
                          items,
                        completionHandler:
                          nil
                      )
                  }
              }
            }


            func run(
              _ context:
                NSExtensionContext,
              completion:
                @escaping
                ExtensionRunCompletion
            ) {
              completion(
                [],
                nil
              )
            }
          }


          private func isAppRunning(
            at url:
              URL
          ) -> Bool
          {
            return NSWorkspace
              .shared
              .runningApplications
              .contains {
                application in

                application
                  .bundleURL
                  == url
              }
          }


          func launchAppIfNeeded(
            appURL:
              URL
          ) {
            guard !isAppRunning(
              at:
                appURL
            )
            else {
              return
            }

            let success =
              NSWorkspace
                .shared
                .open(
                  appURL
                )

            if success {
              print(
                "Containing application "
                + "launch requested successfully"
              )
            } else {
              print(
                "Failed to request containing "
                + "application launch"
              )
            }
          }


          func getParentAppURL()
            -> URL
          {
            return Bundle
              .main
              .bundleURL
              .deletingLastPathComponent()
              .deletingLastPathComponent()
              .deletingLastPathComponent()
          }
          SWIFT


          cat > "$SHARE_CONTROLLER" <<'SWIFT'
          import Foundation
          import Defaults

          final class ShareController:
            ExtensionController
          {
            private let urlTypeIdentifier =
              "public.url"


            override func run(
              _ context:
                NSExtensionContext,
              completion:
                @escaping
                ExtensionRunCompletion
            ) {
              let providers =
                context.attachments

              let group =
                DispatchGroup()

              let lock =
                NSLock()

              var urls:
                [URL] = []

              var sharedString:
                String?


              for provider in providers {

                guard
                  provider
                    .hasItemConformingToTypeIdentifier(
                      urlTypeIdentifier
                    )
                else {
                  print(
                    "This attachment type "
                    + "is not supported yet"
                  )

                  continue
                }


                group.enter()


                provider.loadItem(
                  forTypeIdentifier:
                    urlTypeIdentifier,
                  options:
                    nil
                ) {
                  item,
                  error in

                  defer {
                    group.leave()
                  }


                  if let error =
                    error
                  {
                    print(
                      "Failed to load URL: "
                      + error.localizedDescription
                    )

                    return
                  }


                  guard let url =
                    self.url(
                      from:
                        item
                    )
                  else {
                    print(
                      "Failed to convert "
                      + "shared item to URL"
                    )

                    return
                  }


                  lock.lock()

                  if url.isFileURL {
                    urls.append(
                      url
                    )
                  } else {
                    sharedString =
                      url.absoluteString
                  }

                  lock.unlock()
                }
              }


              group.notify(
                queue:
                  .main
              ) {
                lock.lock()

                let collectedURLs =
                  urls

                var collectedString =
                  sharedString

                lock.unlock()


                if let body =
                  context
                    .textContent
                    .body
                {
                  collectedString =
                    body
                }


                if (
                  collectedURLs.isEmpty
                  && collectedString == nil
                ) {
                  completion(
                    [],
                    NSError.userCancelled
                  )

                  return
                }


                let bookmarks:
                  [Data] =
                  collectedURLs
                    .compactMap {
                      url in

                      createBookmarkForFile(
                        at:
                          url
                      )
                    }


                Defaults[
                  .pendingFiles
                ].append(
                  contentsOf:
                    bookmarks
                )


                if let string =
                  collectedString
                {
                  Defaults[
                    .pendingStrings
                  ].append(
                    string
                  )
                }


                let appURL =
                  getParentAppURL()


                launchAppIfNeeded(
                  appURL:
                    appURL
                )


                completion(
                  [],
                  nil
                )
              }
            }


            private func url(
              from item:
                Any?
            ) -> URL?
            {
              if let value =
                item as? URL
              {
                return value
              }


              if let value =
                item as? NSURL
              {
                return value
                  as URL
              }


              if let value =
                item as? String
              {
                if let parsed =
                  URL(
                    string:
                      value
                  ),
                  parsed.scheme != nil
                {
                  return parsed
                }

                return URL(
                  fileURLWithPath:
                    value
                )
              }


              if let value =
                item as? NSString
              {
                let string =
                  value as String

                if let parsed =
                  URL(
                    string:
                      string
                  ),
                  parsed.scheme != nil
                {
                  return parsed
                }

                return URL(
                  fileURLWithPath:
                    string
                )
              }


              return nil
            }
          }
          SWIFT


          echo "============================================================"
          echo "Utilities.swift after High Sierra patch"
          echo "============================================================"

          cat "$UTILITIES"

