              -print \
              -quit
          )"


          if [ -z "$APP" ]; then

            echo "ERROR:"
            echo "No .app bundle was produced."

            exit 1
          fi


          EXECUTABLE="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
