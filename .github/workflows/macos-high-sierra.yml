              --verbose=4 \
              "$APP/Contents/Library/LoginItems/LaunchAtLoginHelper.app" \
              2>&1

          } | tee \
            ../diagnostics/codesign-report.txt


          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=4 \
            "$APP"


      # ============================================================
      # Package
      # ============================================================

      - name: Package High Sierra build
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p \
            release


          OUTPUT="release/LocalSend-macOS-High-Sierra-10.13-x86_64.zip"


          rm -f \
            "$OUTPUT"


          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$APP" \
            "$OUTPUT"


          ls -lh \
            "$OUTPUT"


      # ============================================================
      # Build artifact
      # ============================================================

      - name: Upload High Sierra build
        id: upload_build
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: LocalSend-macOS-High-Sierra-10.13-x86_64
          path: app/release/LocalSend-macOS-High-Sierra-10.13-x86_64.zip
          if-no-files-found: error
          retention-days: 30


      - name: Retry High Sierra build upload
        if: steps.upload_build.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: LocalSend-macOS-High-Sierra-10.13-x86_64-retry
          path: app/release/LocalSend-macOS-High-Sierra-10.13-x86_64.zip
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # Diagnostics
      # ============================================================

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p \
            diagnostics


          cp \
            app/macos/Runner.xcodeproj/project.pbxproj \
            diagnostics/project.pbxproj.after-patch \
            2>/dev/null


          cp \
            app/macos/Podfile \
            diagnostics/Podfile.after-patch \
            2>/dev/null


          cp \
            app/macos/Podfile.lock \
            diagnostics/Podfile.lock.after-patch \
            2>/dev/null


          cp \
            app/pubspec.yaml \
            diagnostics/pubspec.yaml.after-foss-strip \
            2>/dev/null


          cp \
            app/.flutter-plugins-dependencies \
            diagnostics/flutter-plugins-dependencies.json \
            2>/dev/null


          cp \
            app/macos/Runner/Configs/Release.xcconfig \
            diagnostics/Release.xcconfig.after-patch \
            2>/dev/null


          cp \
            app/macos/Runner/Shared.swift \
            diagnostics/Runner-Shared.after-patch.swift \
            2>/dev/null


          cp \
            app/macos/ShareExtension/Utilities.swift \
            diagnostics/ShareExtension-Utilities.high-sierra.swift \
            2>/dev/null


          cp \
            app/macos/ShareExtension/ShareController.swift \
            diagnostics/ShareController.high-sierra.swift \
            2>/dev/null


          cp \
            flutter-config-first.log \
            diagnostics/flutter-config-first.log \
            2>/dev/null


          cp \
            flutter-config-final.log \
            diagnostics/flutter-config-final.log \
            2>/dev/null


          cp \
            flutter-macos-build.log \
            diagnostics/flutter-macos-build.log \
            2>/dev/null


          cp \
            pod-install.log \
            diagnostics/pod-install.log \
            2>/dev/null


          cp \
            pod-env.log \
            diagnostics/pod-env.log \
            2>/dev/null


          cp \
            swiftpm-resolve.log \
            diagnostics/swiftpm-resolve.log \
            2>/dev/null


          cp \
            flutter-pub-deps.txt \
            diagnostics/flutter-pub-deps.txt \
            2>/dev/null


          cp \
            flutter-podhelper.rb.original \
            diagnostics/flutter-podhelper.rb.original \
            2>/dev/null


          cp \
            "$FLUTTER_ROOT/packages/flutter_tools/bin/podhelper.rb" \
            diagnostics/flutter-podhelper.rb.after-patch \
            2>/dev/null


          cp \
            app/macos/Flutter/ephemeral/FlutterMacOS.podspec \
            diagnostics/FlutterMacOS.podspec.generated \
            2>/dev/null


          # Current final Flutter engine binary.
          FINAL_FLUTTER="$(
            find \
              app/build/macos/Build/Products/Release \
              -path '*/FlutterMacOS.framework/Versions/A/FlutterMacOS' \
              -type f \
              -print \
              -quit
          )"


          if [ -n "$FINAL_FLUTTER" ]; then

            cp \
              "$FINAL_FLUTTER" \
              diagnostics/FlutterMacOS.after-backport \
              2>/dev/null

          fi


      # ============================================================
      # Pack diagnostics
      # ============================================================

      - name: Pack diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          rm -f \
            LocalSend-High-Sierra-build-diagnostics.zip


          if [ -d diagnostics ]; then

            ditto \
              -c \
              -k \
              --sequesterRsrc \
              --keepParent \
              diagnostics \
              LocalSend-High-Sierra-build-diagnostics.zip

          fi


      # ============================================================
      # Diagnostics upload
      # ============================================================

      - name: Upload build diagnostics
        id: upload_diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: LocalSend-High-Sierra-build-diagnostics
          path: LocalSend-High-Sierra-build-diagnostics.zip
          if-no-files-found: warn
          retention-days: 30


      - name: Retry diagnostics upload
        if: >
          always() &&
          steps.upload_diagnostics.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: LocalSend-High-Sierra-build-diagnostics-retry
          path: LocalSend-High-Sierra-build-diagnostics.zip
          if-no-files-found: warn
          retention-days: 30
