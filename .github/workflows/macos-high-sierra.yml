name: LocalSend macOS High Sierra Backport

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.9"
  RUST_VERSION: "1.97.1"

  # Target system.
  LEGACY_MACOS_TARGET: "10.13"
  MACOSX_DEPLOYMENT_TARGET: "10.13"

jobs:
  build:
    name: Build LocalSend for macOS High Sierra
    runs-on: macos-15-intel

    steps:
      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive


      # ============================================================
      # Toolchains
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - name: Show build environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Flutter"
          echo "============================================================"
          flutter --version

          echo
          echo "============================================================"
          echo "Dart"
          echo "============================================================"
          dart --version

          echo
          echo "============================================================"
          echo "Rust"
          echo "============================================================"
          rustc --version
          cargo --version
          rustup show

          echo
          echo "============================================================"
          echo "Xcode"
          echo "============================================================"
          xcodebuild -version

          echo
          echo "============================================================"
          echo "Runner"
          echo "============================================================"
          sw_vers
          uname -a
          uname -m

          echo
          echo "Target macOS: ${LEGACY_MACOS_TARGET}"
          echo "Target architecture: x86_64"


      # ============================================================
      # Dependencies
      # ============================================================

      - name: Clean Flutter build
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail
          flutter clean

      - name: Flutter pub get
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail
          flutter pub get

      - name: Prepare Cargokit
        working-directory: packages/localsend_isolates/rust_builder/cargokit/build_tool
        shell: bash
        run: |
          set -euxo pipefail
          flutter pub get

      - name: Verify Rust workspace
        shell: bash
        run: |
          set -euxo pipefail

          test -f Cargo.toml
          test -f rust-toolchain.toml
          test -f packages/localsend_isolates/rust/Cargo.toml

          cargo metadata \
            --format-version=1 \
            --no-deps \
            > /tmp/cargo-metadata.json

          python3 <<'PY'
          import json

          with open("/tmp/cargo-metadata.json", "r") as f:
              metadata = json.load(f)

          print("Rust workspace packages:")

          for package in metadata["packages"]:
              print(f"  {package['name']} {package['version']}")
              print(f"    {package['manifest_path']}")
          PY


      # ============================================================
      # High Sierra backport
      # ============================================================

      - name: Patch LocalSend for High Sierra
        shell: bash
        run: |
          set -euxo pipefail

          PBX="app/macos/Runner.xcodeproj/project.pbxproj"
          PODFILE="app/macos/Podfile"
          RELEASE_XCCONFIG="app/macos/Runner/Configs/Release.xcconfig"
          APP_DELEGATE="app/macos/Runner/AppDelegate.swift"

          echo "============================================================"
          echo "LocalSend macOS High Sierra backport"
          echo "Target: macOS 10.13 / x86_64"
          echo "============================================================"


          # ========================================================
          # 1. Xcode project
          #
          # Flutter 3.41.9 explicitly migrates literal:
          #
          #   MACOSX_DEPLOYMENT_TARGET = 10.13;
          #
          # back to 10.15.
          #
          # So all pbxproj deployment targets use an indirect
          # variable instead:
          #
          #   $(LOCALSEND_LEGACY_MACOS_TARGET)
          #
          # ========================================================

          python3 <<'PY'
          from pathlib import Path
          import re

          pbx = Path("app/macos/Runner.xcodeproj/project.pbxproj")
          text = pbx.read_text()


          # --------------------------------------------------------
          # Deployment targets
          # --------------------------------------------------------

          text = re.sub(
              r'MACOSX_DEPLOYMENT_TARGET = [0-9.]+;',
              'MACOSX_DEPLOYMENT_TARGET = "$(LOCALSEND_LEGACY_MACOS_TARGET)";',
              text,
          )


          # --------------------------------------------------------
          # Signing
          #
          # Remove LocalSend upstream developer identity.
          # GitHub CI uses ad-hoc signing.
          # --------------------------------------------------------

          text = re.sub(
              r'DEVELOPMENT_TEAM = [A-Z0-9]+;',
              'DEVELOPMENT_TEAM = "";',
              text,
          )

          text = text.replace(
              "CODE_SIGN_STYLE = Automatic;",
              "CODE_SIGN_STYLE = Manual;",
          )

          text = re.sub(
              r'CODE_SIGN_IDENTITY = "(?:Apple Development|Mac Development|Mac Developer)";',
              'CODE_SIGN_IDENTITY = "-";',
              text,
          )

          text = re.sub(
              r'("CODE_SIGN_IDENTITY\[sdk=macosx\*\]"\s*=\s*)'
              r'"(?:Apple Development|Mac Development|Mac Developer)";',
              r'\1"-";',
              text,
          )

          text = re.sub(
              r'PROVISIONING_PROFILE_SPECIFIER = "[^"]*";',
              'PROVISIONING_PROFILE_SPECIFIER = "";',
              text,
          )

          text = re.sub(
              r'PROVISIONING_PROFILE = "[^"]*";',
              'PROVISIONING_PROFILE = "";',
              text,
          )


          # --------------------------------------------------------
          # DockProgress
          #
          # Current LocalSend requests >= 4.3.1.
          #
          # Backport to 3.2.0, whose deployment target remains
          # compatible with High Sierra.
          # --------------------------------------------------------

          dock_pattern = re.compile(
              r'('
              r'XCRemoteSwiftPackageReference "DockProgress" \*/ = \{'
              r'.*?'
              r'repositoryURL = "https://github\.com/sindresorhus/DockProgress";'
              r'.*?'
              r'requirement = \{'
              r')'
              r'.*?'
              r'(\};)',
              re.DOTALL,
          )

          match = dock_pattern.search(text)

          if not match:
              raise SystemExit(
                  "ERROR: Could not locate DockProgress package requirement."
              )

          new_requirement = (
              match.group(1)
              + "\n"
              + "\t\t\t\tkind = exactVersion;\n"
              + "\t\t\t\tversion = 3.2.0;\n"
              + "\t\t\t"
              + match.group(2)
          )

          text = (
              text[:match.start()]
              + new_requirement
              + text[match.end():]
          )

          pbx.write_text(text)
          PY


          # ========================================================
          # 2. Actual Release xcconfig
          #
          # This is the Release configuration actually inherited by
          # the Xcode project.
          # ========================================================

          cat >> "$RELEASE_XCCONFIG" <<'EOF'

          // ========================================================
          // LocalSend macOS High Sierra Backport
          // ========================================================

          LOCALSEND_LEGACY_MACOS_TARGET = 10.13
          MACOSX_DEPLOYMENT_TARGET = $(LOCALSEND_LEGACY_MACOS_TARGET)

          // High Sierra has no Apple Silicon support.
          ARCHS = x86_64
          EXCLUDED_ARCHS = arm64
          ONLY_ACTIVE_ARCH = YES

          // CI ad-hoc signing.
          CODE_SIGN_IDENTITY = -
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM =

          EOF


          # ========================================================
          # 3. CocoaPods
          #
          # Do NOT use:
          #
          #   platform :osx, '10.13'
          #
          # because Flutter recognizes that literal and migrates it.
          #
          # Using a Ruby variable still gives CocoaPods 10.13 while
          # avoiding Flutter's textual migration.
          # ========================================================

          python3 <<'PY'
          from pathlib import Path
          import re

          podfile = Path("app/macos/Podfile")
          text = podfile.read_text()


          # --------------------------------------------------------
          # Global platform
          # --------------------------------------------------------

          text = re.sub(
              r"^platform\s+:osx,\s*['\"][0-9.]+['\"]",
              "legacy_macos_target = '10.13'\n"
              "platform :osx, legacy_macos_target",
              text,
              count=1,
              flags=re.MULTILINE,
          )


          # --------------------------------------------------------
          # Every generated Pod target
          # --------------------------------------------------------

          text = re.sub(
              r"config\.build_settings\[['\"]MACOSX_DEPLOYMENT_TARGET['\"]\]"
              r"\s*=\s*['\"][0-9.]+['\"]",
              "config.build_settings['MACOSX_DEPLOYMENT_TARGET'] = "
              "legacy_macos_target",
              text,
          )


          # --------------------------------------------------------
          # ShareExtension
          #
          # Runner/Shared.swift is also compiled as part of
          # ShareExtension and imports Defaults.
          #
          # Therefore ShareExtension needs an explicit CocoaPods
          # target which links Defaults.
          # --------------------------------------------------------

          if "target 'ShareExtension' do" not in text:
              share_target = """
          target 'ShareExtension' do
            use_frameworks!
            use_modular_headers!

            pod 'Defaults', '~> 4.2'
          end

          """

              text = text.replace(
                  "\npost_install do |installer|",
                  "\n" + share_target + "post_install do |installer|",
                  1,
              )

          if "target 'ShareExtension' do" not in text:
              raise SystemExit(
                  "ERROR: Failed to add ShareExtension CocoaPods target."
              )

          podfile.write_text(text)
          PY


          # ========================================================
          # 4. Avoid unnecessary Swift Concurrency dependency.
          # ========================================================

          python3 <<'PY'
          from pathlib import Path

          path = Path("app/macos/Runner/AppDelegate.swift")
          text = path.read_text()

          text = text.replace(
              "@MainActor private func handleFlutterCall",
              "private func handleFlutterCall",
          )

          path.write_text(text)
          PY


          # ========================================================
          # 5. Remove BOTH committed SwiftPM resolution files.
          #
          # Xcode may use either the project workspace or the outer
          # Runner workspace depending on how package resolution is
          # invoked.
          #
          # Do not assume where Xcode will recreate Package.resolved.
          # ========================================================

          rm -f \
            app/macos/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved \
            app/macos/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved


          # ========================================================
          # Patch diagnostics
          # ========================================================

          echo
          echo "============================================================"
          echo "Deployment-target settings"
          echo "============================================================"

          grep -nE \
            'MACOSX_DEPLOYMENT_TARGET|LOCALSEND_LEGACY_MACOS_TARGET' \
            "$PBX" \
            || true

          echo
          echo "============================================================"
          echo "Signing settings"
          echo "============================================================"

          grep -nE \
            'DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE' \
            "$PBX" \
            || true

          echo
          echo "============================================================"
          echo "Release.xcconfig"
          echo "============================================================"

          cat "$RELEASE_XCCONFIG"

          echo
          echo "============================================================"
          echo "Podfile"
          echo "============================================================"

          cat "$PODFILE"

          echo
          echo "============================================================"
          echo "DockProgress"
          echo "============================================================"

          grep -A12 -B2 \
            'XCRemoteSwiftPackageReference "DockProgress"' \
            "$PBX" \
            || true

          echo
          echo "============================================================"
          echo "AppDelegate"
          echo "============================================================"

          grep -n \
            'MainActor\|handleFlutterCall' \
            "$APP_DELEGATE" \
            || true


      # ============================================================
      # Static validation
      # ============================================================

      - name: Validate High Sierra patch
        shell: bash
        run: |
          set -euxo pipefail

          PBX="app/macos/Runner.xcodeproj/project.pbxproj"
          PODFILE="app/macos/Podfile"

          echo "============================================================"
          echo "Validate upstream signing removal"
          echo "============================================================"

          if grep -q "3W7H4PYMCV" "$PBX"; then
            echo "ERROR: Upstream LocalSend Team ID remains:"
            grep -n "3W7H4PYMCV" "$PBX"
            exit 1
          fi


          echo
          echo "============================================================"
          echo "Validate Flutter migration bypass"
          echo "============================================================"

          if grep -q 'MACOSX_DEPLOYMENT_TARGET = 10.13;' "$PBX"; then
            echo "ERROR: Literal 10.13 exists in project.pbxproj."
            echo "Flutter 3.41.9 would migrate this to 10.15."
            exit 1
          fi

          if grep -q "platform :osx, '10.13'" "$PODFILE"; then
            echo "ERROR: Literal 10.13 exists in Podfile."
            echo "Flutter 3.41.9 would migrate this to 10.15."
            exit 1
          fi


          echo
          echo "============================================================"
          echo "Validate DockProgress backport"
          echo "============================================================"

          python3 <<'PY'
          from pathlib import Path

          text = Path(
              "app/macos/Runner.xcodeproj/project.pbxproj"
          ).read_text()

          if "version = 3.2.0;" not in text:
              raise SystemExit(
                  "ERROR: DockProgress 3.2.0 requirement was not written."
              )

          print("DockProgress requirement is 3.2.0.")
          PY


          echo
          echo "============================================================"
          echo "Validate ShareExtension CocoaPods target"
          echo "============================================================"

          if ! grep -q "target 'ShareExtension' do" "$PODFILE"; then
            echo "ERROR: ShareExtension CocoaPods target is absent."
            exit 1
          fi

          echo
          echo "Static patch validation passed."


      # ============================================================
      # Flutter configuration
      #
      # This runs Flutter's normal project migrations, generates
      # xcconfig files and runs CocoaPods without compiling the app.
      # ============================================================

      - name: Generate Flutter macOS configuration
        working-directory: app
        shell: bash
        run: |
          set -o pipefail

          flutter build macos \
            --release \
            --config-only \
            -v \
            2>&1 | tee ../flutter-config-only.log


      # ============================================================
      # Make sure Flutter did not rewrite us to Catalina.
      # ============================================================

      - name: Verify Flutter migration bypass
        shell: bash
        run: |
          set -euxo pipefail

          PBX="app/macos/Runner.xcodeproj/project.pbxproj"
          PODFILE="app/macos/Podfile"

          echo "============================================================"
          echo "Checking project after Flutter --config-only"
          echo "============================================================"

          if grep -q 'MACOSX_DEPLOYMENT_TARGET = 10.15;' "$PBX"; then
            echo "ERROR: Flutter restored literal macOS 10.15."
            grep -n 'MACOSX_DEPLOYMENT_TARGET = 10.15;' "$PBX"
            exit 1
          fi

          if grep -q "platform :osx, '10.15'" "$PODFILE"; then
            echo "ERROR: Flutter restored Podfile to macOS 10.15."
            grep -n "platform :osx, '10.15'" "$PODFILE"
            exit 1
          fi

          echo "Flutter migration bypass survived."


      # ============================================================
      # Verify CocoaPods integration after Flutter generated it.
      # ============================================================

      - name: Verify ShareExtension CocoaPods integration
        working-directory: app/macos
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Generated CocoaPods targets"
          echo "============================================================"

          find "Pods/Target Support Files" \
            -maxdepth 1 \
            -type d \
            -print \
            | sort

          echo
          echo "============================================================"
          echo "ShareExtension"
          echo "============================================================"

          if [ ! -d "Pods/Target Support Files/Pods-ShareExtension" ]; then
            echo "ERROR: Pods-ShareExtension was not generated."
            exit 1
          fi

          find "Pods/Target Support Files/Pods-ShareExtension" \
            -maxdepth 1 \
            -type f \
            -print \
            | sort


      # ============================================================
      # Swift Package Manager
      #
      # IMPORTANT:
      #
      # Package.resolved is intentionally NOT assigned to one fixed
      # path. Xcode has both:
      #
      #   Runner.xcworkspace
      #
      # and:
      #
      #   Runner.xcodeproj/project.xcworkspace
      #
      # available in this project.
      #
      # Resolve first, then locate whatever Package.resolved Xcode
      # actually created.
      # ============================================================

      - name: Resolve Swift packages
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Resolve Swift packages"
          echo "============================================================"

          xcodebuild \
            -resolvePackageDependencies \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            2>&1 | tee ../swiftpm-resolve.log


          echo
          echo "============================================================"
          echo "Locate Package.resolved dynamically"
          echo "============================================================"

          python3 <<'PY'
          import json
          from pathlib import Path


          macos = Path("macos")

          files = sorted(
              p
              for p in macos.rglob("Package.resolved")
              if p.parent.name == "swiftpm"
          )

          if not files:
              print(
                  "ERROR: xcodebuild resolved the package graph, "
                  "but no Package.resolved exists under app/macos."
              )
              raise SystemExit(1)


          print(
              f"Found {len(files)} Package.resolved file(s):"
          )

          for path in files:
              print(f"  {path}")


          print()
          print("============================================================")
          print("Resolved package contents")
          print("============================================================")


          active_files = []

          for path in files:
              print()
              print("------------------------------------------------------------")
              print(path)
              print("------------------------------------------------------------")

              raw = path.read_text()
              print(raw)

              try:
                  data = json.loads(raw)
              except Exception as exc:
                  print(f"WARNING: unable to parse {path}: {exc}")
                  continue

              versions = {}

              for pin in data.get("pins", []):
                  identity = pin.get("identity", "")
                  version = pin.get("state", {}).get("version")
                  versions[identity] = version

              if "dockprogress" in versions:
                  active_files.append((path, versions))


          if not active_files:
              raise SystemExit(
                  "ERROR: No Package.resolved contains DockProgress."
              )


          print()
          print("============================================================")
          print("Validate package versions")
          print("============================================================")

          for path, versions in active_files:
              dock = versions.get("dockprogress")
              launch = versions.get("launchatlogin-legacy")

              print()
              print(f"File: {path}")
              print(f"  DockProgress: {dock}")
              print(f"  LaunchAtLogin-Legacy: {launch}")

              if dock != "3.2.0":
                  raise SystemExit(
                      f"ERROR: {path}: DockProgress resolved to "
                      f"{dock!r}; expected '3.2.0'."
                  )

              if launch != "5.0.2":
                  raise SystemExit(
                      f"ERROR: {path}: LaunchAtLogin-Legacy resolved "
                      f"to {launch!r}; expected '5.0.2'."
                  )


          print()
          print("SwiftPM resolution is correct.")
          PY


      # ============================================================
      # Verify settings Xcode REALLY sees.
      # ============================================================

      - name: Verify effective Xcode build settings
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p ../diagnostics

          echo "============================================================"
          echo "Runner effective Release settings"
          echo "============================================================"

          xcodebuild \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -showBuildSettings \
            > ../diagnostics/runner-build-settings.txt

          grep -E \
            'ARCHS|EXCLUDED_ARCHS|ONLY_ACTIVE_ARCH|MACOSX_DEPLOYMENT_TARGET|LOCALSEND_LEGACY_MACOS_TARGET' \
            ../diagnostics/runner-build-settings.txt \
            || true


          echo
          echo "============================================================"
          echo "ShareExtension effective Release settings"
          echo "============================================================"

          xcodebuild \
            -project macos/Runner.xcodeproj \
            -target ShareExtension \
            -configuration Release \
            -showBuildSettings \
            > ../diagnostics/shareextension-build-settings.txt

          grep -E \
            'ARCHS|EXCLUDED_ARCHS|ONLY_ACTIVE_ARCH|MACOSX_DEPLOYMENT_TARGET|LOCALSEND_LEGACY_MACOS_TARGET' \
            ../diagnostics/shareextension-build-settings.txt \
            || true


          echo
          echo "============================================================"
          echo "Hard validation"
          echo "============================================================"

          python3 <<'PY'
          from pathlib import Path
          import re


          files = [
              Path("../diagnostics/runner-build-settings.txt"),
              Path("../diagnostics/shareextension-build-settings.txt"),
          ]


          for path in files:
              text = path.read_text()

              print()
              print(f"Checking {path}")


              deployments = re.findall(
                  r"^\s*MACOSX_DEPLOYMENT_TARGET\s*=\s*(.*?)\s*$",
                  text,
                  flags=re.MULTILINE,
              )

              archs = re.findall(
                  r"^\s*ARCHS\s*=\s*(.*?)\s*$",
                  text,
                  flags=re.MULTILINE,
              )

              excluded = re.findall(
                  r"^\s*EXCLUDED_ARCHS\s*=\s*(.*?)\s*$",
                  text,
                  flags=re.MULTILINE,
              )


              print("  MACOSX_DEPLOYMENT_TARGET:", deployments[:3])
              print("  ARCHS:", archs[:3])
              print("  EXCLUDED_ARCHS:", excluded[:3])


              if not deployments:
                  raise SystemExit(
                      f"ERROR: {path}: no deployment target."
                  )

              if deployments[0] != "10.13":
                  raise SystemExit(
                      f"ERROR: {path}: deployment target is "
                      f"{deployments[0]!r}, expected '10.13'."
                  )


              if not archs:
                  raise SystemExit(
                      f"ERROR: {path}: ARCHS is absent."
                  )

              if "x86_64" not in archs[0].split():
                  raise SystemExit(
                      f"ERROR: {path}: ARCHS does not contain x86_64."
                  )


              if excluded:
                  if "arm64" not in excluded[0].split():
                      raise SystemExit(
                          f"ERROR: {path}: arm64 is not excluded."
                      )


          print()
          print("Effective Xcode build settings are correct.")
          PY


      # ============================================================
      # Build
      #
      # No manual cargo build here.
      #
      # rust_lib_localsend_app is compiled by Cargokit as part of
      # Flutter/Xcode's native build.
      # ============================================================

      - name: Build macOS app
        working-directory: app
        shell: bash
        env:
          ARCHS: x86_64
          EXCLUDED_ARCHS: arm64
        run: |
          set -o pipefail

          echo "============================================================"
          echo "Building LocalSend"
          echo
          echo "Target OS:       macOS High Sierra 10.13"
          echo "Architecture:    x86_64"
          echo "Flutter:         ${FLUTTER_VERSION}"
          echo "Rust:            ${RUST_VERSION}"
          echo "DockProgress:    3.2.0"
          echo "============================================================"

          flutter build macos \
            --release \
            -v \
            2>&1 | tee ../flutter-macos-build.log


      # ============================================================
      # Locate application
      # ============================================================

      - name: Locate built application
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          APP="$(
            find build/macos/Build/Products/Release \
              -maxdepth 1 \
              -type d \
              -name '*.app' \
              -print \
              -quit
          )"

          if [ -z "$APP" ]; then
            echo "ERROR: No .app bundle was produced."
            exit 1
          fi

          EXECUTABLE="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$APP/Contents/Info.plist"
          )"

          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "APP_EXECUTABLE=$EXECUTABLE" >> "$GITHUB_ENV"

          echo "Application:"
          echo "$APP"

          echo
          echo "Executable:"
          echo "$EXECUTABLE"


      # ============================================================
      # Architecture check
      # ============================================================

      - name: Verify x86_64 application
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          MAIN="$APP/Contents/MacOS/$APP_EXECUTABLE"

          echo "============================================================"
          echo "Main executable"
          echo "============================================================"

          file "$MAIN"

          echo
          lipo -info "$MAIN"

          ARCHES="$(lipo -archs "$MAIN")"

          echo
          echo "Architectures: $ARCHES"


          if ! echo "$ARCHES" | grep -qw x86_64; then
            echo "ERROR: Main application lacks x86_64."
            exit 1
          fi


          if echo "$ARCHES" | grep -qw arm64; then
            echo "ERROR: arm64 unexpectedly remains in the app."
            exit 1
          fi


      # ============================================================
      # Audit every Mach-O.
      #
      # The app itself saying 10.13 does not prove its embedded
      # Flutter engine/plugins are High Sierra compatible.
      # ============================================================

      - name: Audit Mach-O deployment targets
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p ../diagnostics

          REPORT="../diagnostics/macho-deployment-targets.txt"

          : > "$REPORT"

          find "$APP" -type f -print0 |
          while IFS= read -r -d '' FILE; do

            if file "$FILE" | grep -q "Mach-O"; then

              {
                echo
                echo "============================================================"
                echo "$FILE"
                echo "============================================================"

                file "$FILE"

                echo
                echo "--- Architectures ---"
                lipo -archs "$FILE" 2>/dev/null || true

                echo
                echo "--- Deployment load commands ---"

                otool -l "$FILE" |
                awk '
                  /cmd LC_VERSION_MIN_MACOSX/ {
                    capture=1
                    count=0
                  }

                  /cmd LC_BUILD_VERSION/ {
                    capture=1
                    count=0
                  }

                  capture {
                    print
                    count++

                    if (count >= 10) {
                      capture=0
                    }
                  }
                '

                echo
                echo "--- Linked libraries ---"
                otool -L "$FILE" || true

              } | tee -a "$REPORT"

            fi

          done


      # ============================================================
      # Linked-library audit
      # ============================================================

      - name: Audit linked libraries
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p ../diagnostics

          REPORT="../diagnostics/linked-libraries.txt"

          : > "$REPORT"

          find "$APP" -type f -print0 |
          while IFS= read -r -d '' FILE; do

            if file "$FILE" | grep -q "Mach-O"; then

              {
                echo
                echo "============================================================"
                echo "$FILE"
                echo "============================================================"
                otool -L "$FILE" || true
              } >> "$REPORT"

            fi

          done

          cat "$REPORT"


      # ============================================================
      # Signatures / entitlements
      #
      # Do NOT blindly run:
      #
      #   codesign --deep --force
      #
      # over the completed application, because doing that can
      # overwrite nested ShareExtension entitlements.
      # ============================================================

      - name: Inspect code signatures
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p ../diagnostics

          REPORT="../diagnostics/codesign-report.txt"

          {
            echo "============================================================"
            echo "Main application signature"
            echo "============================================================"

            codesign -dvvv "$APP" 2>&1 || true

            echo
            echo "============================================================"
            echo "Main application entitlements"
            echo "============================================================"

            codesign \
              -d \
              --entitlements :- \
              "$APP" \
              2>&1 || true

            echo
            echo "============================================================"
            echo "Embedded extensions"
            echo "============================================================"

            find "$APP" -type d -name '*.appex' -print |
            while read -r EXTENSION; do

              echo
              echo "------------------------------------------------------------"
              echo "$EXTENSION"
              echo "------------------------------------------------------------"

              codesign -dvvv "$EXTENSION" 2>&1 || true

              codesign \
                -d \
                --entitlements :- \
                "$EXTENSION" \
                2>&1 || true

            done

          } | tee "$REPORT"


          echo
          echo "============================================================"
          echo "Verify bundle"
          echo "============================================================"

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=4 \
            "$APP"


      # ============================================================
      # Package
      # ============================================================

      - name: Package High Sierra build
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p release

          OUTPUT="release/LocalSend-macOS-High-Sierra-10.13-x86_64.zip"

          rm -f "$OUTPUT"

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$APP" \
            "$OUTPUT"

          echo
          echo "Created:"
          ls -lh "$OUTPUT"


      # ============================================================
      # Upload build
      # ============================================================

      - name: Upload High Sierra build
        uses: actions/upload-artifact@v4
        with:
          name: LocalSend-macOS-High-Sierra-10.13-x86_64
          path: app/release/LocalSend-macOS-High-Sierra-10.13-x86_64.zip
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # Diagnostics
      #
      # Always run these even if compilation failed.
      # ============================================================

      - name: Collect source diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p diagnostics


          cp \
            app/macos/Runner.xcodeproj/project.pbxproj \
            diagnostics/project.pbxproj.after-patch \
            2>/dev/null


          cp \
            app/macos/Podfile \
            diagnostics/Podfile.after-patch \
            2>/dev/null


          cp \
            app/macos/Runner/Configs/Release.xcconfig \
            diagnostics/Release.xcconfig.after-patch \
            2>/dev/null


          # --------------------------------------------------------
          # Collect every Package.resolved dynamically.
          #
          # No fixed Xcode workspace path here.
          # --------------------------------------------------------

          python3 <<'PY'
          from pathlib import Path
          import shutil


          source = Path("app/macos")
          destination = Path("diagnostics")

          destination.mkdir(parents=True, exist_ok=True)


          files = sorted(
              p
              for p in source.rglob("Package.resolved")
              if p.parent.name == "swiftpm"
          )


          for index, path in enumerate(files, start=1):
              relative = path.relative_to(source)

              safe_name = str(relative).replace("/", "__")

              output = destination / (
                  f"Package.resolved.{index}__{safe_name}"
              )

              shutil.copy2(path, output)

              print(f"Copied {path} -> {output}")
          PY


          cp \
            swiftpm-resolve.log \
            diagnostics/swiftpm-resolve.log \
            2>/dev/null


          cp \
            flutter-config-only.log \
            diagnostics/flutter-config-only.log \
            2>/dev/null


          cp \
            flutter-macos-build.log \
            diagnostics/flutter-macos-build.log \
            2>/dev/null


      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LocalSend-High-Sierra-build-diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30
