      # ============================================================
      # Final Mach-O audit
      # ============================================================

      - name: Audit final Mach-O deployment targets
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          REPORT="../diagnostics/macho-deployment-targets.txt"

          : > \
            "$REPORT"


          find "$APP" \
            -type f \
            -print0 \
          | while IFS= read -r -d '' FILE
            do

              if ! file "$FILE" \
                | grep -q \
                  'Mach-O'; then

                continue
              fi


              {
                echo
                echo "============================================================"
                echo "$FILE"
