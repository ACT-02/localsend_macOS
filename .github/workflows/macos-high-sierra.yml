name: LocalSend macOS High Sierra Backport

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.9"
  RUST_VERSION: "1.97.1"
  LEGACY_MACOS_TARGET: "10.13"
  MACOSX_DEPLOYMENT_TARGET: "10.13"

jobs:
  build:
    name: Build LocalSend for macOS High Sierra
    runs-on: macos-15-intel

    steps:
      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive


      # ============================================================
      # Flutter
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true


      # ============================================================
      # Rust
      # ============================================================

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy


      # ============================================================
      # Flutter 3.41.9 generates an ephemeral FlutterMacOS podspec
      # with minimum macOS 10.15.
      #
      # Patch the generator itself.
      # ============================================================

      - name: Backport FlutterMacOS podspec generator
        shell: bash
        run: |
          set -euxo pipefail

          PODHELPER="$FLUTTER_ROOT/packages/flutter_tools/bin/podhelper.rb"

          test -f "$PODHELPER"

          cp \
            "$PODHELPER" \
            flutter-podhelper.rb.original

          python3 - "$PODHELPER" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          if "s.osx.deployment_target = '10.13'" not in text:
              text, count = re.subn(
                  r"s\.osx\.deployment_target\s*=\s*['\"]10\.15['\"]",
                  "s.osx.deployment_target = '10.13'",
                  text,
                  count=1,
              )

              if count != 1:
                  raise SystemExit(
                      "ERROR: Flutter 3.41.9 FlutterMacOS "
                      "deployment target was not found."
                  )

              path.write_text(text)

          final = path.read_text()

          if "s.osx.deployment_target = '10.13'" not in final:
              raise SystemExit(
                  "ERROR: FlutterMacOS podspec generator "
                  "was not patched to 10.13."
              )

          print(
              "FlutterMacOS podspec generator -> macOS 10.13"
          )
          PY

          grep -n \
            "s.osx.deployment_target" \
            "$PODHELPER"


      # ============================================================
      # Environment
      # ============================================================

      - name: Show build environment
        shell: bash
        run: |
          set -euxo pipefail

          flutter --version
          dart --version

          rustc --version
          cargo --version

          xcodebuild -version

          sw_vers
          uname -a
          uname -m

          ruby --version
          pod --version

          xcrun --find vtool
          xcrun --find install_name_tool

          echo
          echo "Target macOS: ${LEGACY_MACOS_TARGET}"
          echo "Architecture: x86_64"


      # ============================================================
      # Remove in_app_purchase / StoreKit using LocalSend's own
      # FOSS dependency-removal mechanism.
      # ============================================================

      - name: Remove in-app purchases
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          pubspec = Path(
              "app/pubspec.yaml"
          )

          lines = pubspec.read_text().splitlines()

          marked = [
              line
              for line in lines
              if "# [FOSS_REMOVE]" in line
          ]

          if not marked:
              raise SystemExit(
                  "ERROR: No FOSS_REMOVE dependency found."
              )

          pubspec.write_text(
              "\n".join(
                  line
                  for line in lines
                  if "# [FOSS_REMOVE]" not in line
              )
              + "\n"
          )


          files = [
              Path(
                  "app/lib/config/init.dart"
              ),
              Path(
                  "app/lib/pages/donation/"
                  "donation_page.dart"
              ),
              Path(
                  "app/lib/pages/donation/"
                  "donation_page_vm.dart"
              ),
          ]


          for path in files:
              text = path.read_text()

              if "// [FOSS_REMOVE_START]" not in text:
                  raise SystemExit(
                      f"ERROR: Missing FOSS_REMOVE_START in {path}"
                  )

              if "// [FOSS_REMOVE_END]" not in text:
                  raise SystemExit(
                      f"ERROR: Missing FOSS_REMOVE_END in {path}"
                  )

              text = text.replace(
                  "// [FOSS_REMOVE_START]",
                  "/*",
              )

              text = text.replace(
                  "// [FOSS_REMOVE_END]",
                  "*/",
              )

              path.write_text(text)


          purchase_provider = Path(
              "app/lib/provider/purchase_provider.dart"
          )

          if not purchase_provider.exists():
              raise SystemExit(
                  "ERROR: purchase_provider.dart missing."
              )

          purchase_provider.unlink()


          donation_page = Path(
              "app/lib/pages/donation/donation_page.dart"
          )

          text = donation_page.read_text()

          text = text.replace(
              "donationPageVmProvider",
              "donationPageNoopVmProvider",
          )

          donation_page.write_text(text)


          if "in_app_purchase:" in pubspec.read_text():
              raise SystemExit(
                  "ERROR: in_app_purchase still present."
              )
          PY

          rm -f \
            app/macos/Podfile.lock


      # ============================================================
      # Flutter dependencies
      # ============================================================

      - name: Flutter clean
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail
          flutter clean

      - name: Flutter pub get
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail
          flutter pub get


      # ============================================================
      # Dependency validation
      # ============================================================

      - name: Verify StoreKit removal
        shell: bash
        run: |
          set -euxo pipefail

          cd app

          flutter pub deps \
            --style=compact \
            > ../flutter-pub-deps.txt

          cd ..


          if grep -E \
            '(^|[[:space:]])in_app_purchase(_storekit)?([[:space:]]|$)' \
            flutter-pub-deps.txt; then

            echo "ERROR:"
            echo "in_app_purchase remains in dependency graph."

            exit 1
          fi


          if grep -q \
            'in_app_purchase_storekit' \
            app/.flutter-plugins-dependencies; then

            echo "ERROR:"
            echo "StoreKit plugin remains in Flutter plugin graph."

            exit 1
          fi


      # ============================================================
      # Backport all actual macOS Flutter plugin podspec declarations
      # to 10.13.
      # ============================================================

      - name: Backport macOS Flutter plugin podspecs
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p \
            diagnostics

          cp \
            app/.flutter-plugins-dependencies \
            diagnostics/flutter-plugins-dependencies.json


          python3 <<'PY'
          import json
          import re
          import shutil
          from pathlib import Path


          plugins_file = Path(
              "app/.flutter-plugins-dependencies"
          )

          data = json.loads(
              plugins_file.read_text()
          )


          plugins = (
              data
              .get("plugins", {})
              .get("macos", [])
          )


          report = []


          for plugin in plugins:
              name = plugin.get(
                  "name"
              )

              raw_path = plugin.get(
                  "path"
              )


              if not name or not raw_path:
                  continue


              if not plugin.get(
                  "native_build",
                  True,
              ):
                  continue


              platform_dir = (
                  "darwin"
                  if plugin.get(
                      "shared_darwin_source",
                      False,
                  )
                  else "macos"
              )


              podspec = (
                  Path(raw_path)
                  / platform_dir
                  / f"{name}.podspec"
              )


              if not podspec.exists():
                  report.append({
                      "plugin": name,
                      "status": "no podspec",
                  })

                  continue


              original = podspec.read_text()
              text = original


              text = re.sub(
                  r"("
                  r"[A-Za-z_][A-Za-z0-9_]*"
                  r"\.osx\.deployment_target"
                  r"\s*=\s*"
                  r")"
                  r"(['\"])"
                  r"[0-9.]+"
                  r"\2",
                  r"\1'10.13'",
                  text,
              )


              text = re.sub(
                  r"("
                  r"[A-Za-z_][A-Za-z0-9_]*"
                  r"\.platform"
                  r"\s*=\s*"
                  r":osx"
                  r"\s*,\s*"
                  r")"
                  r"(['\"])"
                  r"[0-9.]+"
                  r"\2",
                  r"\1'10.13'",
                  text,
              )


              if text != original:
                  backup = podspec.with_suffix(
                      podspec.suffix
                      + ".high-sierra-original"
                  )

                  if not backup.exists():
                      shutil.copy2(
                          podspec,
                          backup,
                      )

                  podspec.write_text(
                      text
                  )

                  status = "patched"
              else:
                  status = "unchanged"


              report.append({
                  "plugin": name,
                  "podspec": str(
                      podspec
                  ),
                  "status": status,
              })


              print(
                  f"{name}: {status}"
              )


          Path(
              "diagnostics/"
              "plugin-podspec-backport-report.json"
          ).write_text(
              json.dumps(
                  report,
                  indent=2,
              )
              + "\n"
          )
          PY


      # ============================================================
      # gal
      # ============================================================

      - name: Backport gal for High Sierra
        shell: bash
        run: |
          set -euxo pipefail

          PUB_CACHE_ROOT="${PUB_CACHE:-$HOME/.pub-cache}"

          GAL_SWIFT="$(
            find "$PUB_CACHE_ROOT" \
              -type f \
              -path '*/gal-2.3.3/darwin/gal/Sources/gal/GalPlugin.swift' \
              -print \
              -quit
          )"


          if [ -z "$GAL_SWIFT" ]; then
            echo "ERROR: GalPlugin.swift not found."
            exit 1
          fi


          cp \
            "$GAL_SWIFT" \
            "${GAL_SWIFT}.original"


          cat > "$GAL_SWIFT" <<'SWIFT'
          import Cocoa
          import FlutterMacOS

          public class GalPlugin:
            NSObject,
            FlutterPlugin
          {
            public static func register(
              with registrar:
                FlutterPluginRegistrar
            ) {
              let channel =
                FlutterMethodChannel(
                  name: "gal",
                  binaryMessenger:
                    registrar.messenger
                )

              let instance =
                GalPlugin()

              registrar
                .addMethodCallDelegate(
                  instance,
                  channel:
                    channel
                )
            }


            public func handle(
              _ call:
                FlutterMethodCall,
              result:
                @escaping
                FlutterResult
            ) {
              switch call.method {

              case "hasAccess":
                result(false)

              case "requestAccess":
                result(false)

              case "putVideo",
                   "putImage",
                   "putImageBytes":

                result(
                  FlutterError(
                    code:
                      "ACCESS_DENIED",
                    message:
                      "Direct Photos-library saving "
                      + "is unavailable in this "
                      + "High Sierra build.",
                    details:
                      nil
                  )
                )

              case "open":

                if let url =
                  URL(
                    string:
                      "photos://"
                  )
                {
                  _ =
                    NSWorkspace
                      .shared
                      .open(
                        url
                      )
                }

                result(nil)

              default:

                result(
                  FlutterMethodNotImplemented
                )
              }
            }
          }
          SWIFT


          if grep -E \
            '^[[:space:]]*import[[:space:]]+Photos([[:space:]]|$)' \
            "$GAL_SWIFT"; then

            echo "ERROR:"
            echo "PhotoKit import remains in gal."

            exit 1
          fi


      # ============================================================
      # connectivity_plus
      # ============================================================

      - name: Backport connectivity_plus for High Sierra
        shell: bash
        run: |
          set -euxo pipefail

          CONNECTIVITY_ROOT="$(
            python3 <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path(
                  "app/.flutter-plugins-dependencies"
              ).read_text()
          )

          for plugin in (
              data
              .get("plugins", {})
              .get("macos", [])
          ):
              if plugin.get("name") == "connectivity_plus":
                  print(
                      plugin["path"]
                  )
                  break
          PY
          )"


          if [ -z "$CONNECTIVITY_ROOT" ]; then
            echo "ERROR:"
            echo "connectivity_plus missing."
            exit 1
          fi


          CONNECTIVITY_SOURCE="$CONNECTIVITY_ROOT/macos/connectivity_plus/Sources/connectivity_plus"

          CONNECTIVITY_PROVIDER="$CONNECTIVITY_SOURCE/PathMonitorConnectivityProvider.swift"

          CONNECTIVITY_PODSPEC="$CONNECTIVITY_ROOT/macos/connectivity_plus.podspec"


          test -f \
            "$CONNECTIVITY_PROVIDER"

          test -f \
            "$CONNECTIVITY_PODSPEC"


          cp \
            "$CONNECTIVITY_PROVIDER" \
            "${CONNECTIVITY_PROVIDER}.high-sierra-original"


          cat > "$CONNECTIVITY_PROVIDER" <<'SWIFT'
          import Foundation
          import SystemConfiguration
          import CoreWLAN
          import Darwin

          public class PathMonitorConnectivityProvider:
            NSObject,
            ConnectivityProvider
          {
            private let queue =
              DispatchQueue(
                label:
                  "dev.fluttercommunity.plus."
                  + "connectivity.high-sierra"
              )

            private var timer:
              DispatchSourceTimer?

            private var lastSignature =
              ""

            public var connectivityUpdateHandler:
              ConnectivityUpdateHandler?


            override init() {
              super.init()

              lastSignature =
                signature(
                  for:
                    detectConnectivityTypes()
                )
            }


            deinit {
              stop()
            }


            public var currentConnectivityTypes:
              [ConnectivityType]
            {
              return detectConnectivityTypes()
            }


            public func start() {
              if timer != nil {
                return
              }

              let source =
                DispatchSource
                  .makeTimerSource(
                    queue:
                      queue
                  )

              source.schedule(
                deadline:
                  .now(),
                repeating:
                  .seconds(2),
                leeway:
                  .milliseconds(250)
              )

              source.setEventHandler {
                [weak self] in

                guard let self =
                  self
                else {
                  return
                }

                let current =
                  self
                    .detectConnectivityTypes()

                let signature =
                  self
                    .signature(
                      for:
                        current
                    )

                if signature
                    != self.lastSignature
                {
                  self.lastSignature =
                    signature

                  self
                    .connectivityUpdateHandler?(
                      current
                    )
                }
              }

              timer =
                source

              source.resume()
            }


            public func stop() {
              guard let source =
                timer
              else {
                return
              }

              source.setEventHandler {}

              source.cancel()

              timer =
                nil
            }


            private func detectConnectivityTypes()
              -> [ConnectivityType]
            {
              guard isReachable() else {
                return [.none]
              }

              let active =
                activeInterfaceNames()

              if active.isEmpty {
                return [.other]
              }

              let wifi =
                wifiInterfaceNames()

              var result:
                [ConnectivityType] = []


              if active.contains(
                where: {
                  wifi.contains(
                    $0
                  )
                }
              ) {
                result.append(
                  .wifi
                )
              }


              let ethernet =
                active.contains {
                  interfaceName in

                  interfaceName
                    .hasPrefix(
                      "en"
                    )
                    && !wifi.contains(
                      interfaceName
                    )
                }


              if ethernet {
                result.append(
                  .wiredEthernet
                )
              }


              if result.isEmpty {
                result.append(
                  .other
                )
              }


              return result
            }


            private func isReachable()
              -> Bool
            {
              var address =
                sockaddr_in()

              address.sin_len =
                UInt8(
                  MemoryLayout<
                    sockaddr_in
                  >.size
                )

              address.sin_family =
                sa_family_t(
                  AF_INET
                )


              let reachability:
                SCNetworkReachability? =
                withUnsafePointer(
                  to:
                    &address
                ) {
                  pointer in

                  pointer
                    .withMemoryRebound(
                      to:
                        sockaddr.self,
                      capacity:
                        1
                    ) {
                      sockaddrPointer in

                      SCNetworkReachabilityCreateWithAddress(
                        nil,
                        sockaddrPointer
                      )
                    }
                }


              guard let target =
                reachability
              else {
                return false
              }


              var flags =
                SCNetworkReachabilityFlags()


              guard
                SCNetworkReachabilityGetFlags(
                  target,
                  &flags
                )
              else {
                return false
              }


              return flags.contains(
                  .reachable
                )
                && !flags.contains(
                  .connectionRequired
                )
                && !flags.contains(
                  .interventionRequired
                )
            }


            private func activeInterfaceNames()
              -> Set<String>
            {
              var first:
                UnsafeMutablePointer<
                  ifaddrs
                >?


              guard (
                getifaddrs(
                  &first
                ) == 0
              ),
              let start =
                first
              else {
                return []
              }


              defer {
                freeifaddrs(
                  start
                )
              }


              var result =
                Set<String>()

              var current:
                UnsafeMutablePointer<
                  ifaddrs
                >? =
                start


              while let pointer =
                current
              {
                let interface =
                  pointer.pointee


                if let socket =
                  interface.ifa_addr
                {
                  let family =
                    Int32(
                      socket
                        .pointee
                        .sa_family
                    )

                  let flags =
                    interface
                      .ifa_flags


                  let up =
                    (
                      flags
                      & UInt32(
                        IFF_UP
                      )
                    ) != 0

                  let running =
                    (
                      flags
                      & UInt32(
                        IFF_RUNNING
                      )
                    ) != 0

                  let loopback =
                    (
                      flags
                      & UInt32(
                        IFF_LOOPBACK
                      )
                    ) != 0


                  if (
                    family == AF_INET
                    || family == AF_INET6
                  )
                    && up
                    && running
                    && !loopback
                  {
                    let name =
                      String(
                        cString:
                          interface
                            .ifa_name
                      )

                    if !name.hasPrefix(
                      "awdl"
                    )
                      && !name.hasPrefix(
                        "llw"
                      )
                    {
                      result.insert(
                        name
                      )
                    }
                  }
                }


                current =
                  interface
                    .ifa_next
              }


              return result
            }


            private func wifiInterfaceNames()
              -> Set<String>
            {
              guard let interfaces =
                CWWiFiClient
                  .shared()
                  .interfaces()
              else {
                return []
              }


              return Set(
                interfaces
                  .compactMap {
                    $0.interfaceName
                  }
              )
            }


            private func signature(
              for types:
                [ConnectivityType]
            ) -> String
            {
              return types
                .map {
                  type in

                  switch type {

                  case .none:
                    return "none"

                  case .wiredEthernet:
                    return "ethernet"

                  case .wifi:
                    return "wifi"

                  case .cellular:
                    return "cellular"

                  case .satellite:
                    return "satellite"

                  case .other:
                    return "other"
                  }
                }
                .sorted()
                .joined(
                  separator:
                    ","
                )
            }
          }
          SWIFT


          python3 - "$CONNECTIVITY_PODSPEC" <<'PY'
          import sys
          from pathlib import Path

          path = Path(
              sys.argv[1]
          )

          text = path.read_text()


          if "SystemConfiguration" not in text:
              line = (
                  "  s.frameworks = "
                  "'SystemConfiguration', 'CoreWLAN'\n"
              )

              marker = (
                  "  s.swift_version = '5.0'\n"
              )

              if marker in text:
                  text = text.replace(
                      marker,
                      line + marker,
                      1,
                  )
              else:
                  index = text.rfind(
                      "\nend"
                  )

                  if index == -1:
                      raise SystemExit(
                          "ERROR: Failed to patch "
                          "connectivity_plus podspec."
                      )

                  text = (
                      text[:index]
                      + "\n"
                      + line
                      + text[index:]
                  )


          path.write_text(
              text
          )
          PY


          python3 - "$CONNECTIVITY_PROVIDER" <<'PY'
          import re
          import sys
          from pathlib import Path

          source = Path(
              sys.argv[1]
          ).read_text()

          source = re.sub(
              r"/\*.*?\*/",
              "",
              source,
              flags=re.DOTALL,
          )

          source = re.sub(
              r"//[^\n]*",
              "",
              source,
          )

          forbidden = [
              r"(?m)^\s*import\s+Network\s*$",
              r"\bNWPathMonitor\b",
              r"\bNWPath\b",
          ]

          for pattern in forbidden:
              if re.search(
                  pattern,
                  source,
              ):
                  raise SystemExit(
                      "ERROR: Network.framework "
                      "code remains."
                  )

          print(
              "connectivity_plus source validation passed."
          )
          PY


      # ============================================================
      # Rust / Cargokit
      # ============================================================

      - name: Prepare Cargokit
        working-directory: packages/localsend_isolates/rust_builder/cargokit/build_tool
        shell: bash
        run: |
          set -euxo pipefail
          flutter pub get

      - name: Verify Rust workspace
        shell: bash
        run: |
          set -euxo pipefail

          cargo metadata \
            --format-version=1 \
            --no-deps \
            > diagnostics/cargo-metadata.json


      # ============================================================
      # Patch LocalSend Xcode project.
      #
      # New important changes:
      #
      # - x86_64 only
      # - ONLY_ACTIVE_ARCH=NO
      # - disable hardened runtime for High Sierra
      # - ShareExtension no longer compiles Runner/Shared.swift
      # ============================================================

      - name: Patch LocalSend Xcode project
        shell: bash
        run: |
          set -euxo pipefail

          PBX="app/macos/Runner.xcodeproj/project.pbxproj"

          RELEASE_XCCONFIG="app/macos/Runner/Configs/Release.xcconfig"


          python3 - "$PBX" <<'PY'
          import re
          import sys
          from pathlib import Path


          path = Path(
              sys.argv[1]
          )

          text = path.read_text()


          # --------------------------------------------------------
          # Deployment target -> indirect variable
          # --------------------------------------------------------

          text, count = re.subn(
              r'MACOSX_DEPLOYMENT_TARGET'
              r'\s*=\s*'
              r'[0-9.]+;',
              'MACOSX_DEPLOYMENT_TARGET = '
              '"$(LOCALSEND_LEGACY_MACOS_TARGET)";',
              text,
          )


          if count == 0:
              raise SystemExit(
                  "ERROR: No Xcode deployment targets found."
              )


          # --------------------------------------------------------
          # Hardened Runtime is a Mojave-era feature and is not
          # required for this ad-hoc High Sierra build.
          # --------------------------------------------------------

          text = re.sub(
              r'ENABLE_HARDENED_RUNTIME\s*=\s*YES;',
              'ENABLE_HARDENED_RUNTIME = NO;',
              text,
          )


          # --------------------------------------------------------
          # Insert universal High Sierra settings into every
          # buildSettings dictionary.
          # --------------------------------------------------------

          replacement = (
              "buildSettings = {\n"
              "\t\t\t\t"
              "LOCALSEND_LEGACY_MACOS_TARGET = 10.13;\n"
              "\t\t\t\t"
              "ARCHS = x86_64;\n"
              "\t\t\t\t"
              "EXCLUDED_ARCHS = arm64;\n"
              "\t\t\t\t"
              "ONLY_ACTIVE_ARCH = NO;\n"
              "\t\t\t\t"
              "ENABLE_HARDENED_RUNTIME = NO;\n"
          )


          text = text.replace(
              "buildSettings = {\n",
              replacement,
          )


          text = re.sub(
              r'ONLY_ACTIVE_ARCH\s*=\s*(?:YES|NO);',
              'ONLY_ACTIVE_ARCH = NO;',
              text,
          )


          # --------------------------------------------------------
          # Ad-hoc signing
          # --------------------------------------------------------

          text = re.sub(
              r'DEVELOPMENT_TEAM'
              r'\s*=\s*'
              r'[A-Z0-9]+;',
              'DEVELOPMENT_TEAM = "";',
              text,
          )


          text = re.sub(
              r'CODE_SIGN_STYLE'
              r'\s*=\s*'
              r'Automatic;',
              'CODE_SIGN_STYLE = Manual;',
              text,
          )


          text = re.sub(
              r'CODE_SIGN_IDENTITY'
              r'\s*=\s*'
              r'"(?:'
              r'Apple Development|'
              r'Mac Development|'
              r'Mac Developer'
              r')";',
              'CODE_SIGN_IDENTITY = "-";',
              text,
          )


          text = re.sub(
              r'('
              r'"CODE_SIGN_IDENTITY\[sdk=macosx\*\]"'
              r'\s*=\s*'
              r')'
              r'"(?:'
              r'Apple Development|'
              r'Mac Development|'
              r'Mac Developer'
              r')";',
              r'\1"-";',
              text,
          )


          text = re.sub(
              r'PROVISIONING_PROFILE_SPECIFIER'
              r'\s*=\s*'
              r'"[^"]*";',
              'PROVISIONING_PROFILE_SPECIFIER = "";',
              text,
          )


          # --------------------------------------------------------
          # ShareExtension source phase:
          # remove Runner/Shared.swift.
          #
          # The High Sierra extension receives a dedicated Foundation
          # implementation and therefore needs no CocoaPods at all.
          # --------------------------------------------------------

          source_blocks = list(
              re.finditer(
                  r'('
                  r'[0-9A-F]+'
                  r'\s*/\*\s*Sources\s*\*/'
                  r'\s*=\s*\{'
                  r'.*?'
                  r'files\s*=\s*\('
                  r')'
                  r'(.*?)'
                  r'('
                  r'\);'
                  r'.*?'
                  r'\};'
                  r')',
                  text,
                  flags=re.DOTALL,
              )
          )


          share_source_block = None


          for match in source_blocks:
              body = match.group(2)

              if (
                  "ShareController.swift in Sources"
                  in body
              ):
                  share_source_block = match
                  break


          if share_source_block is None:
              raise SystemExit(
                  "ERROR: ShareExtension Sources phase not found."
              )


          body = share_source_block.group(2)


          body, removed = re.subn(
              r'^.*Shared\.swift in Sources.*$\n?',
              '',
              body,
              count=1,
              flags=re.MULTILINE,
          )


          if removed != 1:
              raise SystemExit(
                  "ERROR: Could not remove Shared.swift "
                  "from ShareExtension."
              )


          new_block = (
              share_source_block.group(1)
              + body
              + share_source_block.group(3)
          )


          text = (
              text[:share_source_block.start()]
              + new_block
              + text[share_source_block.end():]
          )


          # --------------------------------------------------------
          # DockProgress -> exact 3.2.0
          # --------------------------------------------------------

          dock = re.compile(
              r'('
              r'[0-9A-F]+'
              r'\s*/\*\s*'
              r'XCRemoteSwiftPackageReference '
              r'"DockProgress"'
              r'\s*\*/'
              r'\s*=\s*\{'
              r'.*?'
              r'repositoryURL'
              r'\s*=\s*'
              r'"https://github\.com/'
              r'sindresorhus/DockProgress";'
              r'\s*'
              r'requirement\s*=\s*\{'
              r')'
              r'.*?'
              r'('
              r'\};\s*\};'
              r')',
              re.DOTALL,
          )


          match = dock.search(
              text
          )


          if not match:
              raise SystemExit(
                  "ERROR: DockProgress package block not found."
              )


          replacement = (
              match.group(1)
              + "\n"
              + "\t\t\t\tkind = exactVersion;\n"
              + "\t\t\t\tversion = 3.2.0;\n"
              + "\t\t\t"
              + match.group(2)
          )


          text = (
              text[:match.start()]
              + replacement
              + text[match.end():]
          )


          path.write_text(
              text
          )


          # Final validation.
          final = path.read_text()


          if (
              "ShareController.swift in Sources"
              not in final
          ):
              raise SystemExit(
                  "ERROR: ShareController disappeared."
              )


          # Find ShareExtension source block again and ensure
          # Shared.swift is absent.
          blocks = re.findall(
              r'[0-9A-F]+\s*/\*\s*Sources\s*\*/'
              r'\s*=\s*\{.*?files\s*=\s*\((.*?)\);',
              final,
              flags=re.DOTALL,
          )


          share_blocks = [
              block
              for block in blocks
              if "ShareController.swift in Sources"
              in block
          ]


          if len(share_blocks) != 1:
              raise SystemExit(
                  "ERROR: ShareExtension source phase "
                  "validation failed."
              )


          if "Shared.swift in Sources" in share_blocks[0]:
              raise SystemExit(
                  "ERROR: Runner/Shared.swift still belongs "
                  "to ShareExtension."
              )


          print(
              "ShareExtension no longer compiles Runner/Shared.swift."
          )
          PY


          cat >> "$RELEASE_XCCONFIG" <<'EOF'

          // ========================================================
          // LocalSend macOS High Sierra Backport
          // ========================================================

          LOCALSEND_LEGACY_MACOS_TARGET = 10.13
          MACOSX_DEPLOYMENT_TARGET = $(LOCALSEND_LEGACY_MACOS_TARGET)

          ARCHS = x86_64
          EXCLUDED_ARCHS = arm64
          ONLY_ACTIVE_ARCH = NO

          ENABLE_HARDENED_RUNTIME = NO

          CODE_SIGN_IDENTITY = -
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM =

          EOF


          # AppDelegate actor annotation
          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "app/macos/Runner/AppDelegate.swift"
          )

          text = path.read_text()

          text = text.replace(
              "@MainActor private func handleFlutterCall",
              "private func handleFlutterCall",
          )

          path.write_text(text)
          PY


          # Make shared UserDefaults setup robust for ad-hoc signing.
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "app/macos/Runner/Shared.swift"
          )

          text = path.read_text()


          pattern = re.compile(
              r'let teamIdentifierPrefix\s*=\s*'
              r'Bundle\.main\.infoDictionary!'
              r'\["AppIdentifierPrefix"\]\s*as!\s*String'
              r'\s*\n'
              r'let sharedDefaults\s*=\s*'
              r'UserDefaults\(suiteName:\s*'
              r'"\\\(teamIdentifierPrefix\)'
              r'localsend\.shared_group"\)!'
          )


          replacement = r'''let teamIdentifierPrefix =
              (
                  Bundle.main.infoDictionary?[
                      "AppIdentifierPrefix"
                  ] as? String
              )
              ?? ""

          let sharedDefaultsSuiteName =
              teamIdentifierPrefix
              + "localsend.shared_group"

          let sharedDefaults =
              UserDefaults(
                  suiteName:
                      sharedDefaultsSuiteName
              )
              ?? UserDefaults(
                  suiteName:
                      "localsend.shared_group"
              )
              ?? .standard'''


          text, count = pattern.subn(
              replacement,
              text,
              count=1,
          )


          if count != 1:
              raise SystemExit(
                  "ERROR: Could not patch Shared.swift "
                  "UserDefaults setup."
              )


          path.write_text(
              text
          )
          PY


          rm -f \
            app/macos/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved \
            app/macos/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved


      # ============================================================
      # Podfile
      #
      # ShareExtension is intentionally NOT a CocoaPods target.
      # Runner keeps Defaults and all Flutter plugins.
      # ============================================================

      - name: Patch Podfile
        shell: bash
        run: |
          set -euxo pipefail

          PODFILE="app/macos/Podfile"


          python3 - "$PODFILE" <<'PY'
          import re
          import sys
          from pathlib import Path


          path = Path(
              sys.argv[1]
          )

          text = path.read_text()


          # Remove any ShareExtension target that might exist from
          # an older backport iteration.
          text = re.sub(
              r"\n"
              r"target\s+['\"]ShareExtension['\"]\s+do"
              r".*?"
              r"\nend\s*\n",
              "\n",
              text,
              flags=re.DOTALL,
          )


          text, count = re.subn(
              r"^platform\s+:osx,\s*"
              r"['\"][0-9.]+['\"]",
              "legacy_macos_target = '10.13'\n"
              "platform :osx, legacy_macos_target",
              text,
              count=1,
              flags=re.MULTILINE,
          )


          if count != 1:
              raise SystemExit(
                  "ERROR: Podfile platform patch failed."
              )


          text, count = re.subn(
              r"config\.build_settings"
              r"\[['\"]MACOSX_DEPLOYMENT_TARGET['\"]\]"
              r"\s*=\s*"
              r"['\"][0-9.]+['\"]",
              "config.build_settings"
              "['MACOSX_DEPLOYMENT_TARGET'] "
              "= legacy_macos_target",
              text,
          )


          if count == 0:
              raise SystemExit(
                  "ERROR: Pod post_install deployment "
                  "target patch failed."
              )


          needle = (
              "config.build_settings"
              "['MACOSX_DEPLOYMENT_TARGET'] "
              "= legacy_macos_target"
          )


          replacement = (
              needle
              + "\n"
              + "      "
              + "config.build_settings"
              + "['ARCHS'] = 'x86_64'"
              + "\n"
              + "      "
              + "config.build_settings"
              + "['EXCLUDED_ARCHS'] = 'arm64'"
              + "\n"
              + "      "
              + "config.build_settings"
              + "['ONLY_ACTIVE_ARCH'] = 'NO'"
          )


          if (
              "config.build_settings"
              "['ARCHS'] = 'x86_64'"
              not in text
          ):
              text = text.replace(
                  needle,
                  replacement,
                  1,
              )


          text = text.replace(
              "config.build_settings"
              "['ONLY_ACTIVE_ARCH'] = 'YES'",
              "config.build_settings"
              "['ONLY_ACTIVE_ARCH'] = 'NO'",
          )


          path.write_text(
              text
          )
          PY


          ruby -c \
            "$PODFILE"

          cat \
            "$PODFILE"


          if grep -q \
            "target 'ShareExtension'" \
            "$PODFILE"; then

            echo "ERROR:"
            echo "ShareExtension must not be a CocoaPods target."

            exit 1
          fi


      # ============================================================
      # Rewrite ShareExtension to Foundation/AppKit-only.
      #
      # No Defaults.framework.
      # No Flutter.
      # No CocoaPods.
      # No SwiftUI.
      # No UniformTypeIdentifiers.
      # No Swift concurrency.
      # ============================================================

      - name: Backport ShareExtension for High Sierra
        shell: bash
        run: |
          set -euxo pipefail

          UTILITIES="app/macos/ShareExtension/Utilities.swift"

          CONTROLLER="app/macos/ShareExtension/ShareController.swift"


          cp \
            "$UTILITIES" \
            "${UTILITIES}.high-sierra-original"

          cp \
            "$CONTROLLER" \
            "${CONTROLLER}.high-sierra-original"


          cat > "$UTILITIES" <<'SWIFT'
          import AppKit
          import Foundation

          extension Sequence where Element: Sequence {

            func flatten()
              -> [Element.Element]
            {
              return flatMap {
                $0
              }
            }
          }


          struct TextContent {
            var title:
              String?

            var body:
              String?
          }


          let pendingFilesKey =
            "pendingFiles"

          let pendingStringsKey =
            "pendingStrings"


          let extensionSharedDefaults:
            UserDefaults =
          {
            let prefix =
              (
                Bundle.main.infoDictionary?[
                  "AppIdentifierPrefix"
                ] as? String
              )
              ?? ""

            let preferredName =
              prefix
              + "localsend.shared_group"

            if let defaults =
              UserDefaults(
                suiteName:
                  preferredName
              )
            {
              return defaults
            }

            if let defaults =
              UserDefaults(
                suiteName:
                  "localsend.shared_group"
              )
            {
              return defaults
            }

            return .standard
          }()


          extension NSExtensionContext {

            var inputItemsTyped:
              [NSExtensionItem]
            {
              return inputItems
                as? [NSExtensionItem]
                ?? []
            }


            var attachments:
              [NSItemProvider]
            {
              return inputItemsTyped
                .compactMap {
                  $0.attachments
                }
                .flatten()
            }


            var textContent:
              TextContent
            {
              return TextContent(
                title:
                  inputItemsTyped
                    .first?
                    .attributedTitle?
                    .string,
                body:
                  inputItemsTyped
                    .first?
                    .attributedContentText?
                    .string
              )
            }
          }


          extension NSError {

            static let userCancelled =
              NSError(
                domain:
                  NSCocoaErrorDomain,
                code:
                  NSUserCancelledError,
                userInfo:
                  nil
              )
          }


          typealias ExtensionRunCompletion =
            (
              [NSExtensionItem],
              Error?
            ) -> Void


          func createBookmarkForSharedFile(
            at url:
              URL
          ) -> Data?
          {
            do {
              return try (
                url as NSURL
              ).bookmarkData(
                options:
                  .minimalBookmark,
                includingResourceValuesForKeys:
                  nil,
                relativeTo:
                  nil
              )
            } catch {
              print(
                "Failed to create bookmark: "
                + error.localizedDescription
              )

              return nil
            }
          }


          class ExtensionController:
            NSViewController
          {
            override func loadView() {
              view =
                NSView(
                  frame:
                    .zero
                )

              guard let context =
                extensionContext
              else {
                return
              }

              run(
                context
              ) {
                items,
                error in

                DispatchQueue
                  .main
                  .async {

                    if let error =
                      error
                    {
                      context
                        .cancelRequest(
                          withError:
                            error
                        )

                      return
                    }

                    context
                      .completeRequest(
                        returningItems:
                          items,
                        completionHandler:
                          nil
                      )
                  }
              }
            }


            func run(
              _ context:
                NSExtensionContext,
              completion:
                @escaping
                ExtensionRunCompletion
            ) {
              completion(
                [],
                nil
              )
            }
          }


          private func isAppRunning(
            at url:
              URL
          ) -> Bool
          {
            return NSWorkspace
              .shared
              .runningApplications
              .contains {
                $0.bundleURL
                  == url
              }
          }


          func launchAppIfNeeded(
            appURL:
              URL
          ) {
            guard !isAppRunning(
              at:
                appURL
            )
            else {
              return
            }

            _ =
              NSWorkspace
                .shared
                .open(
                  appURL
                )
          }


          func getParentAppURL()
            -> URL
          {
            return Bundle
              .main
              .bundleURL
              .deletingLastPathComponent()
              .deletingLastPathComponent()
              .deletingLastPathComponent()
          }
          SWIFT


          cat > "$CONTROLLER" <<'SWIFT'
          import Foundation

          final class ShareController:
            ExtensionController
          {
            private let urlTypeIdentifier =
              "public.url"


            override func run(
              _ context:
                NSExtensionContext,
              completion:
                @escaping
                ExtensionRunCompletion
            ) {
              let group =
                DispatchGroup()

              let lock =
                NSLock()

              var urls:
                [URL] = []

              var sharedString:
                String?


              for provider
              in context.attachments
              {
                guard
                  provider
                    .hasItemConformingToTypeIdentifier(
                      urlTypeIdentifier
                    )
                else {
                  continue
                }


                group.enter()


                provider.loadItem(
                  forTypeIdentifier:
                    urlTypeIdentifier,
                  options:
                    nil
                ) {
                  item,
                  error in

                  defer {
                    group.leave()
                  }


                  if let error =
                    error
                  {
                    print(
                      "Failed to load URL: "
                      + error.localizedDescription
                    )

                    return
                  }


                  guard let url =
                    self.url(
                      from:
                        item
                    )
                  else {
                    return
                  }


                  lock.lock()

                  if url.isFileURL {
                    urls.append(
                      url
                    )
                  } else {
                    sharedString =
                      url.absoluteString
                  }

                  lock.unlock()
                }
              }


              group.notify(
                queue:
                  .main
              ) {
                lock.lock()

                let collectedURLs =
                  urls

                var collectedString =
                  sharedString

                lock.unlock()


                if let body =
                  context
                    .textContent
                    .body
                {
                  collectedString =
                    body
                }


                if (
                  collectedURLs.isEmpty
                  && collectedString == nil
                ) {
                  completion(
                    [],
                    NSError.userCancelled
                  )

                  return
                }


                var pendingFiles =
                  extensionSharedDefaults
                    .array(
                      forKey:
                        pendingFilesKey
                    )
                    as? [Data]
                  ?? []


                pendingFiles.append(
                  contentsOf:
                    collectedURLs
                      .compactMap {
                        createBookmarkForSharedFile(
                          at:
                            $0
                        )
                      }
                )


                extensionSharedDefaults
                  .set(
                    pendingFiles,
                    forKey:
                      pendingFilesKey
                  )


                if let string =
                  collectedString
                {
                  var pendingStrings =
                    extensionSharedDefaults
                      .stringArray(
                        forKey:
                          pendingStringsKey
                      )
                    ?? []

                  pendingStrings.append(
                    string
                  )

                  extensionSharedDefaults
                    .set(
                      pendingStrings,
                      forKey:
                        pendingStringsKey
                    )
                }


                // Important for an extension that is about to exit.
                _ =
                  extensionSharedDefaults
                    .synchronize()


                launchAppIfNeeded(
                  appURL:
                    getParentAppURL()
                )


                completion(
                  [],
                  nil
                )
              }
            }


            private func url(
              from item:
                Any?
            ) -> URL?
            {
              if let value =
                item as? URL
              {
                return value
              }

              if let value =
                item as? NSURL
              {
                return value
                  as URL
              }

              if let value =
                item as? String
              {
                if let parsed =
                  URL(
                    string:
                      value
                  ),
                  parsed.scheme != nil
                {
                  return parsed
                }

                return URL(
                  fileURLWithPath:
                    value
                )
              }

              if let value =
                item as? NSString
              {
                return url(
                  from:
                    value as String
                )
              }

              return nil
            }
          }
          SWIFT


          python3 - \
            "$UTILITIES" \
            "$CONTROLLER" <<'PY'
          import re
          import sys
          from pathlib import Path


          code = "\n".join(
              Path(path).read_text()
              for path in sys.argv[1:]
          )


          forbidden = {
              "Defaults":
                  r"(?m)^\s*import\s+Defaults\s*$",

              "Flutter":
                  r"(?m)^\s*import\s+Flutter",

              "SwiftUI":
                  r"(?m)^\s*import\s+SwiftUI\s*$",

              "UniformTypeIdentifiers":
                  r"(?m)^\s*import\s+UniformTypeIdentifiers\s*$",

              "UTType":
                  r"\bUTType\b",

              "Task":
                  r"\bTask\b",

              "await":
                  r"\bawait\b",

              "async function":
                  r"\)\s*async(?:\s+throws)?\b",
          }


          for name, pattern in forbidden.items():

              if re.search(
                  pattern,
                  code,
              ):
                  raise SystemExit(
                      f"ERROR: {name} remains "
                      "in ShareExtension."
                  )


          print(
              "ShareExtension is Foundation/AppKit-only."
          )
          PY


      # ============================================================
      # Static validation
      # ============================================================

