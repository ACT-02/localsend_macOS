            || true


          echo
          echo "ShareExtension:"
          echo


          grep -E \
            'ARCHS|EXCLUDED_ARCHS|ONLY_ACTIVE_ARCH|MACOSX_DEPLOYMENT_TARGET|ENABLE_HARDENED_RUNTIME|OTHER_LDFLAGS|FRAMEWORK_SEARCH_PATHS' \
            ../diagnostics/shareextension-build-settings.txt \
            || true


          python3 <<'PY'
          from pathlib import Path
          import re


          for path in [
              Path(
                  "../diagnostics/"
                  "runner-build-settings.txt"
              ),
              Path(
                  "../diagnostics/"
                  "shareextension-build-settings.txt"
              ),
          ]:

              text = path.read_text()


              target = re.search(
                  r"(?m)^\s*MACOSX_DEPLOYMENT_TARGET\s*=\s*(.*?)\s*$",
                  text,
              )


              archs = re.search(
                  r"(?m)^\s*ARCHS\s*=\s*(.*?)\s*$",
                  text,
              )


              active = re.search(
                  r"(?m)^\s*ONLY_ACTIVE_ARCH\s*=\s*(.*?)\s*$",
                  text,
              )


              if not target or target.group(1) != "10.13":
                  raise SystemExit(
                      f"ERROR: {path}: deployment target != 10.13"
                  )


              if not archs or "x86_64" not in archs.group(1).split():
                  raise SystemExit(
                      f"ERROR: {path}: x86_64 missing."
                  )


              if not active or active.group(1) != "NO":
                  raise SystemExit(
                      f"ERROR: {path}: ONLY_ACTIVE_ARCH != NO."
                  )


          print(
              "Effective Xcode settings validated."
          )
          PY


      # ============================================================
      # Build
      # ============================================================

      - name: Build macOS app
        working-directory: app
        shell: bash
        env:
          ARCHS: x86_64
          EXCLUDED_ARCHS: arm64
          ONLY_ACTIVE_ARCH: "NO"
        run: |
          set -o pipefail

          flutter build macos \
            --release \
            -v \
            2>&1 | tee ../flutter-macos-build.log


      # ============================================================
      # Compiler diagnostics
      # ============================================================

      - name: Extract compiler errors
        if: failure()
        shell: bash
        run: |
          set +e

          mkdir -p \
            diagnostics


          python3 <<'PY'
          from pathlib import Path
          import re


          source = Path(
              "flutter-macos-build.log"
          )


          if not source.exists():
              raise SystemExit(0)


          lines = source.read_text(
              errors="replace"
          ).splitlines()


          pattern = re.compile(
              r"(?:"
              r"\berror:"
              r"|"
              r"\bfatal error:"
              r"|"
              r"Undefined symbols for architecture"
              r"|"
              r"symbol\(s\) not found"
              r"|"
              r"ld: "
              r"|"
              r"clang: error:"
              r"|"
              r"\*\* BUILD FAILED \*\*"
              r"|"
              r"The following build commands failed:"
              r")"
          )


          hits = [
              index
              for index, line in enumerate(lines)
              if pattern.search(line)
          ]


          ranges = []


          for index in hits:
              start = max(
                  0,
                  index - 20,
              )

              end = min(
                  len(lines),
                  index + 30,
              )

              if (
                  ranges
                  and start <= ranges[-1][1]
              ):
                  ranges[-1] = (
                      ranges[-1][0],
                      max(
                          ranges[-1][1],
                          end,
                      ),
                  )
              else:
                  ranges.append(
                      (start, end)
                  )


          output = []


          for start, end in ranges:
              output.append(
                  "=" * 100
              )

              for index in range(
                  start,
                  end,
              ):
                  output.append(
                      f"{index + 1}: "
                      f"{lines[index]}"
                  )


          Path(
              "diagnostics/"
              "compiler-errors.txt"
          ).write_text(
              "\n".join(output)
              + "\n"
          )


          print(
              "\n".join(output)
          )
          PY


      # ============================================================
      # Locate app
      # ============================================================

      - name: Locate built application
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          APP="$(
            find \
              build/macos/Build/Products/Release \
              -maxdepth 1 \
              -type d \
              -name '*.app' \
              -print \
              -quit
          )"


          if [ -z "$APP" ]; then
            echo "ERROR: LocalSend.app not found."
            exit 1
          fi


          EXECUTABLE="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$APP/Contents/Info.plist"
          )"


          echo \
            "APP=$APP" \
            >> "$GITHUB_ENV"

          echo \
            "APP_EXECUTABLE=$EXECUTABLE" \
            >> "$GITHUB_ENV"


      # ============================================================
      # Capture original entitlements before modifying nested code.
      # ============================================================

      - name: Capture application entitlements
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p \
            ../diagnostics


          codesign \
            --display \
            --entitlements - \
            --xml \
            "$APP" \
            2>/dev/null \
          | plutil \
              -convert xml1 \
              -o ../diagnostics/LocalSend.entitlements.original.plist \
              -


          plutil -lint \
            ../diagnostics/LocalSend.entitlements.original.plist


      # ============================================================
      # Critical experiment:
      #
      # FlutterMacOS.framework
      #
      # Before:
      #   LC_BUILD_VERSION
      #   minos 10.15
      #
      # After:
      #   LC_VERSION_MIN_MACOSX
      #   version 10.13
      #
      # Also redirect the THREE strong Swift runtime dependencies
      # from /usr/lib/swift to the runtime bundled in LocalSend.app.
      # ============================================================

      - name: Backport FlutterMacOS engine binary
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p \
            ../diagnostics


          FRAMEWORK="$APP/Contents/Frameworks/FlutterMacOS.framework"

          BINARY="$FRAMEWORK/Versions/A/FlutterMacOS"


          test -f \
            "$BINARY"


          cp \
            "$BINARY" \
            ../diagnostics/FlutterMacOS.before-backport


          echo "============================================================"
          echo "FlutterMacOS BEFORE"
          echo "============================================================"


          file \
            "$BINARY"

          lipo \
            -archs \
            "$BINARY"

          otool \
            -l \
            "$BINARY" \
          | awk '
              /cmd LC_VERSION_MIN_MACOSX/ {
                show=1
                count=0
              }

              /cmd LC_BUILD_VERSION/ {
                show=1
                count=0
              }

              show {
                print
                count++

                if (count >= 10) {
                  show=0
                }
              }
            '


          otool \
            -L \
            "$BINARY"


          # --------------------------------------------------------
          # Convert LC_BUILD_VERSION -> LC_VERSION_MIN_MACOSX.
          #
          # vtool specifically retains -set-version-min for deploying
          # final linked Mach-O binaries to older operating systems.
          # --------------------------------------------------------

          TMP="$BINARY.high-sierra"


          rm -f \
            "$TMP"


          xcrun vtool \
            -set-version-min \
              macos \
              10.13 \
              15.2 \
            -replace \
            -output \
              "$TMP" \
            "$BINARY"


          test -f \
            "$TMP"


          mv \
            "$TMP" \
            "$BINARY"


          chmod +x \
            "$BINARY"


          # --------------------------------------------------------
          # FlutterMacOS 3.41.9 strongly links these three Swift
          # libraries from /usr/lib/swift.
          #
          # High Sierra predates the system Swift 5 runtime.
          # The app itself targets 10.13, so Xcode back-deploys the
          # Swift runtime into Contents/Frameworks.
          # --------------------------------------------------------

          STRONG_SWIFT_LIBS=(
            "libswiftCore.dylib"
            "libswiftFoundation.dylib"
            "libswiftCoreGraphics.dylib"
          )


          for LIB in "${STRONG_SWIFT_LIBS[@]}"
          do
            EMBEDDED="$APP/Contents/Frameworks/$LIB"

            if [ ! -f "$EMBEDDED" ]; then

              echo "ERROR:"
              echo "Required back-deployment Swift runtime missing:"
              echo "$EMBEDDED"

              exit 1
            fi


            OLD="/usr/lib/swift/$LIB"

            NEW="@rpath/$LIB"


            if otool \
              -L \
              "$BINARY" \
              | grep -Fq "$OLD"; then

              install_name_tool \
                -change \
                  "$OLD" \
                  "$NEW" \
                "$BINARY"

            else

              echo "ERROR:"
              echo "Expected FlutterMacOS Swift dependency missing:"
              echo "$OLD"

              exit 1
            fi
          done


          # --------------------------------------------------------
          # Patch framework plist if it contains its own minimum
          # system key.
          # --------------------------------------------------------

          FRAMEWORK_PLIST="$FRAMEWORK/Versions/A/Resources/Info.plist"


          if [ -f "$FRAMEWORK_PLIST" ]; then

            if /usr/libexec/PlistBuddy \
              -c 'Print :MinimumOSVersion' \
              "$FRAMEWORK_PLIST" \
              >/dev/null \
              2>&1; then

              /usr/libexec/PlistBuddy \
                -c 'Set :MinimumOSVersion 10.13' \
                "$FRAMEWORK_PLIST"
            fi


            if /usr/libexec/PlistBuddy \
              -c 'Print :LSMinimumSystemVersion' \
              "$FRAMEWORK_PLIST" \
              >/dev/null \
              2>&1; then

              /usr/libexec/PlistBuddy \
                -c 'Set :LSMinimumSystemVersion 10.13' \
                "$FRAMEWORK_PLIST"
            fi

          fi


          # --------------------------------------------------------
          # Audit the embedded Swift runtimes we will actually use.
          # --------------------------------------------------------

          python3 - "$APP" <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path


          app = Path(
              sys.argv[1]
          )


          libraries = [
              "libswiftCore.dylib",
              "libswiftFoundation.dylib",
              "libswiftCoreGraphics.dylib",
          ]


          def parse_version(value):
              parts = [
                  int(part)
                  for part in value.split(".")
              ]

              while len(parts) < 3:
                  parts.append(0)

              return tuple(
                  parts[:3]
              )


          for name in libraries:

              path = (
                  app
                  / "Contents"
                  / "Frameworks"
                  / name
              )


              output = subprocess.check_output(
                  [
                      "otool",
                      "-l",
                      str(path),
                  ],
                  text=True,
              )


              versions = []


              min_match = re.search(
                  r"cmd LC_VERSION_MIN_MACOSX"
                  r".*?"
                  r"\bversion\s+([0-9.]+)",
                  output,
                  flags=re.DOTALL,
              )


              build_match = re.search(
                  r"cmd LC_BUILD_VERSION"
                  r".*?"
                  r"\bminos\s+([0-9.]+)",
                  output,
                  flags=re.DOTALL,
              )


              if min_match:
                  versions.append(
                      min_match.group(1)
                  )


              if build_match:
                  versions.append(
                      build_match.group(1)
                  )


              print(
                  f"{name}: deployment markers = "
                  f"{versions}"
              )


              if not versions:
                  print(
                      f"WARNING: No deployment marker "
                      f"found in {name}"
                  )

                  continue


              for version in versions:
                  if (
                      parse_version(version)
                      > parse_version("10.13")
                  ):
                      raise SystemExit(
                          f"ERROR: {name} itself requires "
                          f"macOS {version}, not High Sierra."
                      )
          PY


          # --------------------------------------------------------
          # Ad-hoc sign modified Flutter framework.
          # --------------------------------------------------------

          codesign \
            --force \
            --sign - \
            "$FRAMEWORK"


          echo
          echo "============================================================"
          echo "FlutterMacOS AFTER"
          echo "============================================================"


          otool \
            -l \
            "$BINARY" \
          | awk '
              /cmd LC_VERSION_MIN_MACOSX/ {
                show=1
                count=0
              }

              /cmd LC_BUILD_VERSION/ {
                show=1
                count=0
              }

              show {
                print
                count++

                if (count >= 10) {
                  show=0
                }
              }
            '


          otool \
            -L \
            "$BINARY"


          if ! otool \
            -l \
            "$BINARY" \
            | grep -A4 \
                'LC_VERSION_MIN_MACOSX' \
            | grep -q \
                'version 10.13'; then

            echo "ERROR:"
            echo "FlutterMacOS is not marked for macOS 10.13."

            exit 1
          fi


          if otool \
            -L \
            "$BINARY" \
            | grep -E \
              '/usr/lib/swift/(libswiftCore|libswiftFoundation|libswiftCoreGraphics)\.dylib'; then

            echo "ERROR:"
            echo "Strong Swift system runtime dependency remains."

            exit 1
          fi


          # Imported-symbol dump for the first real High Sierra test.
          nm \
            -u \
            -m \
            "$BINARY" \
            > ../diagnostics/FlutterMacOS.undefined-symbols.txt \
            2>&1 \
            || true


      # ============================================================
      # Main Info.plist
      # ============================================================

      - name: Force High Sierra minimum in application plist
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          PLIST="$APP/Contents/Info.plist"


          if /usr/libexec/PlistBuddy \
            -c 'Print :LSMinimumSystemVersion' \
            "$PLIST" \
            >/dev/null \
            2>&1; then

            /usr/libexec/PlistBuddy \
              -c 'Set :LSMinimumSystemVersion 10.13' \
              "$PLIST"

          else

            /usr/libexec/PlistBuddy \
              -c 'Add :LSMinimumSystemVersion string 10.13' \
              "$PLIST"

          fi


          /usr/libexec/PlistBuddy \
            -c 'Print :LSMinimumSystemVersion' \
            "$PLIST"


      # ============================================================
      # LaunchAtLogin
      #
      # The legacy helper already targets 10.12, but upstream ships a
      # universal x86_64+arm64 binary.
      #
      # Thin every helper Mach-O to x86_64 and re-sign inside-out.
      # ============================================================

      - name: Normalize and sign LaunchAtLogin helper
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p \
            ../diagnostics


          HELPER="$APP/Contents/Library/LoginItems/LaunchAtLoginHelper.app"


          test -d \
            "$HELPER"


          HELPER_ENTITLEMENTS="../diagnostics/LaunchAtLoginHelper.entitlements.plist"


          cat > "$HELPER_ENTITLEMENTS" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.app-sandbox</key>
            <true/>
          </dict>
          </plist>
          EOF


          # --------------------------------------------------------
          # Thin every fat Mach-O inside the helper.
          # --------------------------------------------------------

          find "$HELPER" \
            -type f \
            -print0 \
          | while IFS= read -r -d '' FILE
            do

              if ! file \
                "$FILE" \
                | grep -q \
                  'Mach-O'; then

                continue
              fi


              ARCHES="$(
                lipo \
                  -archs \
                  "$FILE" \
                  2>/dev/null \
                  || true
              )"


              echo "$FILE"
              echo "  before: $ARCHES"


              if ! echo "$ARCHES" \
                | grep -qw \
                  x86_64; then

                echo "ERROR:"
                echo "Helper Mach-O has no x86_64 slice:"
                echo "$FILE"

                exit 1
              fi


              if echo "$ARCHES" \
                | grep -qw \
                  arm64; then

                TMP="$FILE.x86_64"


                lipo \
                  "$FILE" \
                  -thin \
                    x86_64 \
                  -output \
                    "$TMP"


                mv \
                  "$TMP" \
                  "$FILE"


                chmod +x \
                  "$FILE" \
                  || true
              fi


              FINAL_ARCHES="$(
                lipo \
                  -archs \
                  "$FILE"
              )"


              echo "  after:  $FINAL_ARCHES"


              if echo "$FINAL_ARCHES" \
                | grep -qw \
                  arm64; then

                echo "ERROR:"
                echo "arm64 remains in helper:"
                echo "$FILE"

                exit 1
              fi

            done


          # --------------------------------------------------------
          # Sign helper nested Swift dylibs first.
          # --------------------------------------------------------

          if [ -d \
            "$HELPER/Contents/Frameworks" ]; then

            find \
              "$HELPER/Contents/Frameworks" \
              -type f \
              -print0 \
            | while IFS= read -r -d '' FILE
              do

                if file "$FILE" \
                  | grep -q \
                    'Mach-O'; then

                  codesign \
                    --force \
                    --sign - \
                    "$FILE"
                fi

              done

          fi


          # --------------------------------------------------------
          # Sign helper outer bundle.
          # --------------------------------------------------------

          codesign \
            --force \
            --sign - \
            --preserve-metadata=identifier,requirements \
            --entitlements \
              "$HELPER_ENTITLEMENTS" \
            "$HELPER"


          codesign \
            --verify \
            --strict \
            --verbose=4 \
            "$HELPER"


          HELPER_BINARY="$HELPER/Contents/MacOS/LaunchAtLoginHelper"


          echo
          echo "LaunchAtLogin final:"
          echo


          file \
            "$HELPER_BINARY"

          lipo \
            -archs \
            "$HELPER_BINARY"

          otool \
            -l \
            "$HELPER_BINARY" \
          | awk '
              /cmd LC_VERSION_MIN_MACOSX/ {
                show=1
                count=0
              }

              /cmd LC_BUILD_VERSION/ {
                show=1
                count=0
              }

              show {
                print
                count++

                if (count >= 8) {
                  show=0
                }
              }
            '


      # ============================================================
      # ShareExtension link audit
      #
      # This MUST no longer directly link Runner's Flutter plugins.
      # ============================================================

      - name: Verify ShareExtension isolation
        working-directory: app
