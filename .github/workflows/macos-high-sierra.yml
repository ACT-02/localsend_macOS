                    echo
                    echo "--- Deployment ---"

                    otool \
                      -l \
                      "$FILE" \
                    | awk '
                        /cmd LC_VERSION_MIN_MACOSX/ {
                          capture=1
                          count=0
                        }

                        /cmd LC_BUILD_VERSION/ {
                          capture=1
                          count=0
                        }

                        capture {
                          print
                          count++

                          if (count >= 10) {
                            capture=0
                          }
                        }
                      '

                    echo
                    echo "--- Linked libraries ---"

                    otool \
                      -L \
                      "$FILE" \
                      || true

                  } | tee -a "$REPORT"

                fi

              done

          done


      # ============================================================
