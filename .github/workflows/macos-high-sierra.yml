name: LocalSend macOS High Sierra Backport

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.9"
  RUST_VERSION: "1.97.1"
  LEGACY_MACOS_TARGET: "10.13"
  MACOSX_DEPLOYMENT_TARGET: "10.13"

jobs:
  build:
    name: Build LocalSend for macOS High Sierra
    runs-on: macos-15-intel

    steps:
      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive


      # ============================================================
      # Toolchains
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy


      # ============================================================
      # Flutter 3.41.9 itself generates FlutterMacOS.podspec with:
      #
      #   s.osx.deployment_target = '10.15'
      #
      # Patch the generator, not the ephemeral generated file.
      # ============================================================

      - name: Backport FlutterMacOS podspec generator
        shell: bash
        run: |
          set -euxo pipefail

          PODHELPER="$FLUTTER_ROOT/packages/flutter_tools/bin/podhelper.rb"

          test -f "$PODHELPER"

          cp \
            "$PODHELPER" \
            flutter-podhelper.rb.original

          echo "============================================================"
          echo "FlutterMacOS podspec generator before patch"
          echo "============================================================"

          grep -n \
            "s.osx.deployment_target" \
            "$PODHELPER" \
            || true


          python3 - "$PODHELPER" <<'PY'
          import re
          import sys
          from pathlib import Path


          path = Path(sys.argv[1])
          text = path.read_text()


          if "s.osx.deployment_target = '10.13'" in text:
              print("Already patched.")
          else:
              text, count = re.subn(
                  r"s\.osx\.deployment_target\s*=\s*['\"]10\.15['\"]",
                  "s.osx.deployment_target = '10.13'",
                  text,
                  count=1,
              )

              if count != 1:
                  raise SystemExit(
                      "ERROR: Could not locate FlutterMacOS "
                      "10.15 deployment target in podhelper.rb."
                  )

              path.write_text(text)


          final = path.read_text()

          if "s.osx.deployment_target = '10.13'" not in final:
              raise SystemExit(
                  "ERROR: FlutterMacOS podspec generator "
                  "does not target 10.13 after patch."
              )
          PY


          echo
          echo "============================================================"
          echo "FlutterMacOS podspec generator after patch"
          echo "============================================================"

          grep -n \
            "s.osx.deployment_target" \
            "$PODHELPER"


      # ============================================================
      # Environment
      # ============================================================

      - name: Show build environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Flutter"
          echo "============================================================"
          flutter --version

          echo
          echo "============================================================"
          echo "Dart"
          echo "============================================================"
          dart --version

          echo
          echo "============================================================"
          echo "Rust"
          echo "============================================================"
          rustc --version
          cargo --version
          rustup show

          echo
          echo "============================================================"
          echo "Xcode"
          echo "============================================================"
          xcodebuild -version

          echo
          echo "============================================================"
          echo "Ruby / CocoaPods"
          echo "============================================================"
          ruby --version
          which pod
          pod --version

          echo
          echo "============================================================"
          echo "Runner"
          echo "============================================================"
          sw_vers
          uname -a
          uname -m

          echo
          echo "Target macOS: ${LEGACY_MACOS_TARGET}"
          echo "Architecture: x86_64"


      # ============================================================
      # Remove in_app_purchase / StoreKit.
      #
      # This follows LocalSend's upstream FOSS build mechanism.
      # Current StoreKit plugin requires APIs newer than High Sierra.
      # ============================================================

      - name: Remove in-app purchases for High Sierra
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path


          pubspec = Path("app/pubspec.yaml")
          lines = pubspec.read_text().splitlines()

          foss_lines = [
              line
              for line in lines
              if "# [FOSS_REMOVE]" in line
          ]

          if not foss_lines:
              raise SystemExit(
                  "ERROR: No # [FOSS_REMOVE] dependency "
                  "found in app/pubspec.yaml."
              )

          print("Removing FOSS-marked dependencies:")

          for line in foss_lines:
              print("  " + line.strip())

          pubspec.write_text(
              "\n".join(
                  line
                  for line in lines
                  if "# [FOSS_REMOVE]" not in line
              )
              + "\n"
          )


          files = [
              Path("app/lib/config/init.dart"),
              Path(
                  "app/lib/pages/donation/"
                  "donation_page.dart"
              ),
              Path(
                  "app/lib/pages/donation/"
                  "donation_page_vm.dart"
              ),
          ]


          for path in files:
              text = path.read_text()

              if "// [FOSS_REMOVE_START]" not in text:
                  raise SystemExit(
                      f"ERROR: Missing FOSS_REMOVE_START in {path}"
                  )

              if "// [FOSS_REMOVE_END]" not in text:
                  raise SystemExit(
                      f"ERROR: Missing FOSS_REMOVE_END in {path}"
                  )

              text = text.replace(
                  "// [FOSS_REMOVE_START]",
                  "/*",
              )

              text = text.replace(
                  "// [FOSS_REMOVE_END]",
                  "*/",
              )

              path.write_text(text)


          provider = Path(
              "app/lib/provider/purchase_provider.dart"
          )

          if not provider.exists():
              raise SystemExit(
                  "ERROR: purchase_provider.dart not found."
              )

          provider.unlink()


          donation_page = Path(
              "app/lib/pages/donation/donation_page.dart"
          )

          text = donation_page.read_text()

          text = text.replace(
              "donationPageVmProvider",
              "donationPageNoopVmProvider",
          )

          donation_page.write_text(text)


          if "in_app_purchase:" in pubspec.read_text():
              raise SystemExit(
                  "ERROR: in_app_purchase remains in pubspec."
              )

          print("StoreKit / in-app purchase removed.")
          PY


          rm -f \
            app/macos/Podfile.lock


      # ============================================================
      # Flutter dependencies
      # ============================================================

      - name: Clean Flutter build
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail
          flutter clean

      - name: Flutter pub get
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail
          flutter pub get


      # ============================================================
      # Verify StoreKit is gone
      # ============================================================

      - name: Verify in-app purchase plugin is gone
        shell: bash
        run: |
          set -euxo pipefail

          cd app

          flutter pub deps \
            --style=compact \
            > ../flutter-pub-deps.txt

          cd ..


          if grep -E \
            '(^|[[:space:]])in_app_purchase(_storekit)?([[:space:]]|$)' \
            flutter-pub-deps.txt; then

            echo "ERROR: in_app_purchase remains in dependency graph."
            exit 1
          fi


          if [ -f app/.flutter-plugins-dependencies ]; then

            if grep -q \
              'in_app_purchase_storekit' \
              app/.flutter-plugins-dependencies; then

              echo "ERROR: in_app_purchase_storekit remains in plugin graph."
              exit 1
            fi

          fi


          echo "StoreKit plugin is absent."


      # ============================================================
      # Cargokit / Rust
      # ============================================================

      - name: Prepare Cargokit
        working-directory: packages/localsend_isolates/rust_builder/cargokit/build_tool
        shell: bash
        run: |
          set -euxo pipefail
          flutter pub get

      - name: Verify Rust workspace
        shell: bash
        run: |
          set -euxo pipefail

          test -f Cargo.toml
          test -f rust-toolchain.toml
          test -f packages/localsend_isolates/rust/Cargo.toml

          cargo metadata \
            --format-version=1 \
            --no-deps \
            > /tmp/cargo-metadata.json

          python3 <<'PY'
          import json

          with open("/tmp/cargo-metadata.json", "r") as f:
              metadata = json.load(f)

          print("Rust workspace packages:")

          for package in metadata["packages"]:
              print(
                  f"  {package['name']} "
                  f"{package['version']}"
              )
              print(
                  f"    {package['manifest_path']}"
              )
          PY


      # ============================================================
      # gal 2.3.3
      #
      # LocalSend does not normally use gallery saving on macOS.
      # Remove PhotoKit usage entirely for High Sierra.
      # ============================================================

      - name: Backport gal for High Sierra
        shell: bash
        run: |
          set -euxo pipefail

          PUB_CACHE_ROOT="${PUB_CACHE:-$HOME/.pub-cache}"

          GAL_SWIFT="$(
            find "$PUB_CACHE_ROOT" \
              -type f \
              -path '*/gal-2.3.3/darwin/gal/Sources/gal/GalPlugin.swift' \
              -print \
              -quit
          )"

          GAL_PODSPEC="$(
            find "$PUB_CACHE_ROOT" \
              -type f \
              -path '*/gal-2.3.3/darwin/gal.podspec' \
              -print \
              -quit
          )"


          if [ -z "$GAL_SWIFT" ]; then
            echo "ERROR: GalPlugin.swift not found."
            exit 1
          fi

          if [ -z "$GAL_PODSPEC" ]; then
            echo "ERROR: gal.podspec not found."
            exit 1
          fi


          cp \
            "$GAL_SWIFT" \
            "${GAL_SWIFT}.original"

          cp \
            "$GAL_PODSPEC" \
            "${GAL_PODSPEC}.original"


          cat > "$GAL_SWIFT" <<'SWIFT'
          import Cocoa
          import FlutterMacOS

          public class GalPlugin: NSObject, FlutterPlugin {

            public static func register(
              with registrar: FlutterPluginRegistrar
            ) {
              let channel = FlutterMethodChannel(
                name: "gal",
                binaryMessenger: registrar.messenger
              )

              let instance = GalPlugin()

              registrar.addMethodCallDelegate(
                instance,
                channel: channel
              )
            }

            public func handle(
              _ call: FlutterMethodCall,
              result: @escaping FlutterResult
            ) {
              switch call.method {

              case "hasAccess":
                result(false)

              case "requestAccess":
                result(false)

              case "putVideo",
                   "putImage",
                   "putImageBytes":

                result(
                  FlutterError(
                    code: "ACCESS_DENIED",
                    message:
                      "Direct Photos-library saving is unavailable "
                      + "in the macOS High Sierra build.",
                    details: nil
                  )
                )

              case "open":

                if let url = URL(string: "photos://") {
                  _ = NSWorkspace.shared.open(url)
                }

                result(nil)

              default:
                result(FlutterMethodNotImplemented)
              }
            }
          }
          SWIFT


          if grep -E \
            'import Photos|PHPhotoLibrary|PHAsset|PHFetch' \
            "$GAL_SWIFT"; then

            echo "ERROR: PhotoKit remains in GalPlugin.swift."
            exit 1
          fi


      # ============================================================
      # NEW:
      #
      # Lower deployment targets in every CocoaPods-backed macOS
      # Flutter plugin actually present in this build.
      #
      # CocoaPods checks podspec platform requirements BEFORE
      # post_install, so post_install cannot solve resolver failures.
      #
      # Flutter's .flutter-plugins-dependencies tells us:
      #
      #   - plugin name
      #   - plugin path
      #   - native_build
      #   - shared_darwin_source
      #
      # Match exactly the directories Flutter's podhelper will use.
      # ============================================================

      - name: Backport all macOS Flutter plugin podspecs
        shell: bash
        run: |
          set -euxo pipefail

          PLUGINS_FILE="app/.flutter-plugins-dependencies"

          if [ ! -f "$PLUGINS_FILE" ]; then
            echo "ERROR: $PLUGINS_FILE does not exist."
            exit 1
          fi


          mkdir -p diagnostics

          cp \
            "$PLUGINS_FILE" \
            diagnostics/flutter-plugins-dependencies.json


          python3 <<'PY'
          import json
          import re
          import shutil

          from pathlib import Path


          plugins_file = Path(
              "app/.flutter-plugins-dependencies"
          )

          data = json.loads(
              plugins_file.read_text()
          )


          macos_plugins = (
              data
              .get("plugins", {})
              .get("macos", [])
          )

          spm_enabled = (
              data
              .get(
                  "swift_package_manager_enabled",
                  {},
              )
              .get("macos", False)
          )


          print(
              f"macOS Flutter plugins: "
              f"{len(macos_plugins)}"
          )

          print(
              f"Swift Package Manager enabled: "
              f"{spm_enabled}"
          )

          print()


          report = []
          patched_files = []


          def patch_podspec(path: Path, plugin_name: str):
              original = path.read_text()

              text = original
              changes = []


              # ----------------------------------------------------
              # Common form:
              #
              #   s.osx.deployment_target = '11.0'
              # ----------------------------------------------------

              pattern_osx_target = re.compile(
                  r"("
                  r"[A-Za-z_][A-Za-z0-9_]*"
                  r"\.osx\.deployment_target"
                  r"\s*=\s*"
                  r")"
                  r"(['\"])"
                  r"([0-9.]+)"
                  r"\2"
              )


              def replace_osx(match):
                  old = match.group(3)

                  if old != "10.13":
                      changes.append(
                          f"osx.deployment_target "
                          f"{old} -> 10.13"
                      )

                  return (
                      match.group(1)
                      + match.group(2)
                      + "10.13"
                      + match.group(2)
                  )


              text = pattern_osx_target.sub(
                  replace_osx,
                  text,
              )


              # ----------------------------------------------------
              # Alternative:
              #
              #   s.platform = :osx, '11.0'
              # ----------------------------------------------------

              pattern_platform = re.compile(
                  r"("
                  r"[A-Za-z_][A-Za-z0-9_]*"
                  r"\.platform"
                  r"\s*=\s*"
                  r":osx"
                  r"\s*,\s*"
                  r")"
                  r"(['\"])"
                  r"([0-9.]+)"
                  r"\2"
              )


              def replace_platform(match):
                  old = match.group(3)

                  if old != "10.13":
                      changes.append(
                          f"platform :osx "
                          f"{old} -> 10.13"
                      )

                  return (
                      match.group(1)
                      + match.group(2)
                      + "10.13"
                      + match.group(2)
                  )


              text = pattern_platform.sub(
                  replace_platform,
                  text,
              )


              if text != original:

                  backup = path.with_suffix(
                      path.suffix + ".high-sierra-original"
                  )

                  if not backup.exists():
                      shutil.copy2(
                          path,
                          backup,
                      )

                  path.write_text(text)

                  patched_files.append(
                      str(path)
                  )


              report.append(
                  {
                      "plugin": plugin_name,
                      "podspec": str(path),
                      "changes": changes,
                  }
              )


          for plugin in macos_plugins:

              name = plugin.get("name")
              plugin_path_raw = plugin.get("path")

              native_build = plugin.get(
                  "native_build",
                  True,
              )

              shared_darwin = plugin.get(
                  "shared_darwin_source",
                  False,
              )


              if not name or not plugin_path_raw:
                  continue


              if not native_build:

                  print(
                      f"[skip] {name}: "
                      f"native_build=false"
                  )

                  continue


              plugin_path = Path(
                  plugin_path_raw
              ).expanduser()


              platform_directory = (
                  "darwin"
                  if shared_darwin
                  else "macos"
              )


              platform_path = (
                  plugin_path
                  / platform_directory
              )


              package_swift = (
                  platform_path
                  / name
                  / "Package.swift"
              )


              podspec = (
                  platform_path
                  / f"{name}.podspec"
              )


              print(
                  f"{name}:"
              )
              print(
                  f"  path: {plugin_path}"
              )
              print(
                  f"  platform directory: "
                  f"{platform_directory}"
              )
              print(
                  f"  podspec: {podspec}"
              )
              print(
                  f"  Package.swift: "
                  f"{package_swift.exists()}"
              )


              # If Flutter would install this as a Pod, patch the
              # exact podspec it will pass to CocoaPods.
              if podspec.exists():

                  patch_podspec(
                      podspec,
                      name,
                  )

                  print(
                      "  podspec patched/scanned."
                  )

              else:

                  print(
                      "  no CocoaPods podspec."
                  )

              print()


          report_path = Path(
              "diagnostics/"
              "plugin-podspec-backport-report.json"
          )

          report_path.write_text(
              json.dumps(
                  report,
                  indent=2,
              )
              + "\n"
          )


          print(
              "============================================================"
          )
          print(
              "Patched plugin podspec files"
          )
          print(
              "============================================================"
          )

          if patched_files:

              for path in patched_files:
                  print(path)

          else:

              print(
                  "(No plugin podspec declarations "
                  "needed modification.)"
              )


          print()
          print(
              f"Total scanned plugins: "
              f"{len(macos_plugins)}"
          )

          print(
              f"Total modified podspecs: "
              f"{len(patched_files)}"
          )
          PY


          echo
          echo "============================================================"
          echo "Remaining explicit macOS deployment targets in plugin cache"
          echo "============================================================"

          python3 <<'PY'
          import json
          import re

          from pathlib import Path


          data = json.loads(
              Path(
                  "app/.flutter-plugins-dependencies"
              ).read_text()
          )


          for plugin in (
              data
              .get("plugins", {})
              .get("macos", [])
          ):

              name = plugin.get("name")
              raw_path = plugin.get("path")

              if not name or not raw_path:
                  continue

              if not plugin.get(
                  "native_build",
                  True,
              ):
                  continue

              platform_dir = (
                  "darwin"
                  if plugin.get(
                      "shared_darwin_source",
                      False,
                  )
                  else "macos"
              )

              podspec = (
                  Path(raw_path)
                  / platform_dir
                  / f"{name}.podspec"
              )

              if not podspec.exists():
                  continue

              text = podspec.read_text()

              matches = re.findall(
                  r"(?:"
                  r"\.osx\.deployment_target"
                  r"\s*=\s*"
                  r"['\"][0-9.]+['\"]"
                  r"|"
                  r"\.platform"
                  r"\s*=\s*"
                  r":osx"
                  r"\s*,\s*"
                  r"['\"][0-9.]+['\"]"
                  r")",
                  text,
              )

              if matches:
                  print()
                  print(podspec)

                  for line in text.splitlines():
                      if (
                          ".osx.deployment_target"
                          in line
                          or (
                              ".platform"
                              in line
                              and ":osx"
                              in line
                          )
                      ):
                          print(
                              "  "
                              + line.strip()
                          )
          PY


      # ============================================================
      # LocalSend Xcode project / Podfile
      # ============================================================

      - name: Patch LocalSend for High Sierra
        shell: bash
        run: |
          set -euxo pipefail

          PBX="app/macos/Runner.xcodeproj/project.pbxproj"
          PODFILE="app/macos/Podfile"
          RELEASE_XCCONFIG="app/macos/Runner/Configs/Release.xcconfig"
          APP_DELEGATE="app/macos/Runner/AppDelegate.swift"


          # --------------------------------------------------------
          # project.pbxproj
          # --------------------------------------------------------

          python3 <<'PY'
          from pathlib import Path
          import re


          path = Path(
              "app/macos/Runner.xcodeproj/project.pbxproj"
          )

          text = path.read_text()


          # Flutter migrates literal 10.13 to 10.15.
          # Use an indirect variable instead.
          text, count = re.subn(
              r'MACOSX_DEPLOYMENT_TARGET'
              r'\s*=\s*'
              r'[0-9.]+;',
              'MACOSX_DEPLOYMENT_TARGET = '
              '"$(LOCALSEND_LEGACY_MACOS_TARGET)";',
              text,
          )

          if count == 0:
              raise SystemExit(
                  "ERROR: No deployment target found in pbxproj."
              )


          # Add High Sierra/x86_64 settings to every Xcode
          # configuration.
          if (
              "LOCALSEND_LEGACY_MACOS_TARGET = 10.13;"
              not in text
          ):

              replacement = (
                  "buildSettings = {\n"
                  "\t\t\t\t"
                  "LOCALSEND_LEGACY_MACOS_TARGET = 10.13;\n"
                  "\t\t\t\t"
                  "ARCHS = x86_64;\n"
                  "\t\t\t\t"
                  "EXCLUDED_ARCHS = arm64;\n"
                  "\t\t\t\t"
                  "ONLY_ACTIVE_ARCH = YES;\n"
              )

              text = text.replace(
                  "buildSettings = {\n",
                  replacement,
              )


          # Remove LocalSend upstream signing.
          text = re.sub(
              r'DEVELOPMENT_TEAM'
              r'\s*=\s*'
              r'[A-Z0-9]+;',
              'DEVELOPMENT_TEAM = "";',
              text,
          )

          text = re.sub(
              r'CODE_SIGN_STYLE'
              r'\s*=\s*'
              r'Automatic;',
              'CODE_SIGN_STYLE = Manual;',
              text,
          )

          text = re.sub(
              r'CODE_SIGN_IDENTITY'
              r'\s*=\s*'
              r'"(?:'
              r'Apple Development|'
              r'Mac Development|'
              r'Mac Developer'
              r')";',
              'CODE_SIGN_IDENTITY = "-";',
              text,
          )

          text = re.sub(
              r'('
              r'"CODE_SIGN_IDENTITY\[sdk=macosx\*\]"'
              r'\s*=\s*'
              r')'
              r'"(?:'
              r'Apple Development|'
              r'Mac Development|'
              r'Mac Developer'
              r')";',
              r'\1"-";',
              text,
          )

          text = re.sub(
              r'PROVISIONING_PROFILE_SPECIFIER'
              r'\s*=\s*'
              r'"[^"]*";',
              'PROVISIONING_PROFILE_SPECIFIER = "";',
              text,
          )

          text = re.sub(
              r'PROVISIONING_PROFILE'
              r'\s*=\s*'
              r'"[^"]*";',
              'PROVISIONING_PROFILE = "";',
              text,
          )


          # DockProgress -> exact 3.2.0.
          dock_pattern = re.compile(
              r'('
              r'[0-9A-F]+'
              r'\s*/\*\s*'
              r'XCRemoteSwiftPackageReference '
              r'"DockProgress"'
              r'\s*\*/'
              r'\s*=\s*\{'
              r'.*?'
              r'repositoryURL'
              r'\s*=\s*'
              r'"https://github\.com/'
              r'sindresorhus/DockProgress";'
              r'\s*'
              r'requirement'
              r'\s*=\s*\{'
              r')'
              r'.*?'
              r'('
              r'\};'
              r'\s*'
              r'\};'
              r')',
              re.DOTALL,
          )


          match = dock_pattern.search(text)

          if not match:
              raise SystemExit(
                  "ERROR: DockProgress package block not found."
              )


          replacement = (
              match.group(1)
              + "\n"
              + "\t\t\t\tkind = exactVersion;\n"
              + "\t\t\t\tversion = 3.2.0;\n"
              + "\t\t\t"
              + match.group(2)
          )


          text = (
              text[:match.start()]
              + replacement
              + text[match.end():]
          )


          check = re.compile(
              r'repositoryURL'
              r'\s*=\s*'
              r'"https://github\.com/'
              r'sindresorhus/DockProgress";'
              r'.*?'
              r'kind\s*=\s*exactVersion;'
              r'.*?'
              r'version\s*=\s*3\.2\.0;',
              re.DOTALL,
          )


          if not check.search(text):
              raise SystemExit(
                  "ERROR: DockProgress 3.2.0 patch failed."
              )


          path.write_text(text)
          PY


          # --------------------------------------------------------
          # Actual Release xcconfig
          # --------------------------------------------------------

          cat >> "$RELEASE_XCCONFIG" <<'EOF'

          // ========================================================
          // LocalSend macOS High Sierra Backport
          // ========================================================

          LOCALSEND_LEGACY_MACOS_TARGET = 10.13
          MACOSX_DEPLOYMENT_TARGET = $(LOCALSEND_LEGACY_MACOS_TARGET)

          ARCHS = x86_64
          EXCLUDED_ARCHS = arm64
          ONLY_ACTIVE_ARCH = YES

          CODE_SIGN_IDENTITY = -
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM =

          EOF


          # --------------------------------------------------------
          # Podfile
          # --------------------------------------------------------

          python3 <<'PY'
          from pathlib import Path
          import re


          path = Path(
              "app/macos/Podfile"
          )

          text = path.read_text()


          # Keep 10.13 indirect to evade Flutter's literal migration.
          text, count = re.subn(
              r"^platform"
              r"\s+:osx,"
              r"\s*['\"][0-9.]+['\"]",
              "legacy_macos_target = '10.13'\n"
              "platform :osx, legacy_macos_target",
              text,
              count=1,
              flags=re.MULTILINE,
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: Podfile platform patch failed."
              )


          text, count = re.subn(
              r"config\.build_settings"
              r"\[['\"]"
              r"MACOSX_DEPLOYMENT_TARGET"
              r"['\"]\]"
              r"\s*=\s*"
              r"['\"][0-9.]+['\"]",
              "config.build_settings"
              "['MACOSX_DEPLOYMENT_TARGET'] "
              "= legacy_macos_target",
              text,
          )

          if count == 0:
              raise SystemExit(
                  "ERROR: Pod post_install target patch failed."
              )


          needle = (
              "config.build_settings"
              "['MACOSX_DEPLOYMENT_TARGET'] "
              "= legacy_macos_target"
          )


          if (
              "config.build_settings"
              "['ARCHS'] = 'x86_64'"
              not in text
          ):

              replacement = (
                  needle
                  + "\n"
                  + "      "
                  + "config.build_settings"
                  + "['ARCHS'] = 'x86_64'"
                  + "\n"
                  + "      "
                  + "config.build_settings"
                  + "['EXCLUDED_ARCHS'] = 'arm64'"
                  + "\n"
                  + "      "
                  + "config.build_settings"
                  + "['ONLY_ACTIVE_ARCH'] = 'YES'"
              )

              text = text.replace(
                  needle,
                  replacement,
                  1,
              )


          # ShareExtension compiles Shared.swift which imports Defaults.
          if "target 'ShareExtension' do" not in text:

              share_target = """
          target 'ShareExtension' do
            use_frameworks!
            use_modular_headers!

            pod 'Defaults', '~> 4.2'
          end

          """

              text = text.replace(
                  "\npost_install do |installer|",
                  "\n"
                  + share_target
                  + "post_install do |installer|",
                  1,
              )


          if "target 'ShareExtension' do" not in text:
              raise SystemExit(
                  "ERROR: ShareExtension CocoaPods target missing."
              )


          path.write_text(text)
          PY


          # --------------------------------------------------------
          # Remove unnecessary MainActor.
          # --------------------------------------------------------

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "app/macos/Runner/AppDelegate.swift"
          )

          text = path.read_text()

          text = text.replace(
              "@MainActor private func handleFlutterCall",
              "private func handleFlutterCall",
          )

          path.write_text(text)
          PY


          # --------------------------------------------------------
          # Remove stale SwiftPM locks.
          # --------------------------------------------------------

          rm -f \
            app/macos/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved \
            app/macos/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved


          echo "============================================================"
          echo "Podfile after patch"
          echo "============================================================"

          cat "$PODFILE"

          echo
          echo "============================================================"
          echo "DockProgress after patch"
          echo "============================================================"

          grep -A12 -B2 \
            'XCRemoteSwiftPackageReference "DockProgress"' \
            "$PBX" \
            || true


      # ============================================================
      # Static validation
      # ============================================================

      - name: Validate High Sierra patch
        shell: bash
        run: |
          set -euxo pipefail

          PBX="app/macos/Runner.xcodeproj/project.pbxproj"
          PODFILE="app/macos/Podfile"
          PODHELPER="$FLUTTER_ROOT/packages/flutter_tools/bin/podhelper.rb"


          if grep -q \
            "3W7H4PYMCV" \
            "$PBX"; then

            echo "ERROR: Upstream Team ID remains."
            exit 1
          fi


          if grep -q \
            'MACOSX_DEPLOYMENT_TARGET = 10.13;' \
            "$PBX"; then

            echo "ERROR: Literal 10.13 remains in pbxproj."
            exit 1
          fi


          if grep -q \
            "platform :osx, '10.13'" \
            "$PODFILE"; then

            echo "ERROR: Literal Podfile 10.13 would trigger Flutter migration."
            exit 1
          fi


          if ! grep -q \
            "target 'ShareExtension' do" \
            "$PODFILE"; then

            echo "ERROR: ShareExtension Pod target missing."
            exit 1
          fi


          if grep -q \
            '^ *in_app_purchase:' \
            app/pubspec.yaml; then

            echo "ERROR: in_app_purchase returned."
            exit 1
          fi


          if ! grep -q \
            "s.osx.deployment_target = '10.13'" \
            "$PODHELPER"; then

            echo "ERROR: FlutterMacOS podhelper patch missing."
            exit 1
          fi


          ruby -c "$PODFILE"

          echo "Static High Sierra patch validation passed."


      # ============================================================
      # First Flutter config pass.
