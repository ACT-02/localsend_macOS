          echo
          echo "============================================================"
          echo "ShareExtension settings"
          echo "============================================================"

          grep -E \
            'ARCHS|EXCLUDED_ARCHS|ONLY_ACTIVE_ARCH|MACOSX_DEPLOYMENT_TARGET|LOCALSEND_LEGACY_MACOS_TARGET' \
            ../diagnostics/shareextension-build-settings.txt \
            || true


          python3 <<'PY'
          from pathlib import Path
          import re


          files = [
              Path(
                  "../diagnostics/"
                  "runner-build-settings.txt"
              ),
              Path(
                  "../diagnostics/"
                  "shareextension-build-settings.txt"
              ),
          ]


          for path in files:

              text = path.read_text()


              deployments = re.findall(
                  r"^\s*MACOSX_DEPLOYMENT_TARGET"
                  r"\s*=\s*(.*?)\s*$",
                  text,
                  flags=re.MULTILINE,
