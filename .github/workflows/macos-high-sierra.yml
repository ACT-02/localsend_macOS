name: LocalSend macOS High Sierra Backport

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.9"
  RUST_VERSION: "1.97.1"

  LEGACY_MACOS_TARGET: "10.13"
  MACOSX_DEPLOYMENT_TARGET: "10.13"

jobs:
  build:
    name: Build LocalSend for macOS High Sierra
    runs-on: macos-15-intel

    steps:
      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive


      # ============================================================
      # Toolchains
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - name: Show build environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Flutter"
          echo "============================================================"
          flutter --version

          echo
          echo "============================================================"
          echo "Dart"
          echo "============================================================"
          dart --version

          echo
          echo "============================================================"
          echo "Rust"
          echo "============================================================"
          rustc --version
          cargo --version
          rustup show

          echo
          echo "============================================================"
          echo "Xcode"
          echo "============================================================"
          xcodebuild -version

          echo
          echo "============================================================"
          echo "Runner"
          echo "============================================================"
          sw_vers
          uname -a
          uname -m

          echo
          echo "Target:"
          echo "  macOS ${LEGACY_MACOS_TARGET}"
          echo "  x86_64"


      # ============================================================
      # Remove StoreKit / IAP from the legacy macOS build
      #
      # This mirrors LocalSend's own FOSS build mechanism.
      #
      # We implement it in Python rather than executing
      # remove_proprietary_dependencies.sh because that upstream
      # script uses GNU-style `sed -i`, while GitHub's macOS runner
      # uses BSD sed.
      # ============================================================

      - name: Remove in-app purchases for High Sierra
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path


          # --------------------------------------------------------
          # pubspec.yaml
          #
          # Remove:
          #
          #   in_app_purchase: ... # [FOSS_REMOVE]
          # --------------------------------------------------------

          pubspec = Path("app/pubspec.yaml")

          lines = pubspec.read_text().splitlines()

          new_lines = [
              line
              for line in lines
              if "# [FOSS_REMOVE]" not in line
          ]

          if len(new_lines) == len(lines):
              raise SystemExit(
                  "ERROR: No # [FOSS_REMOVE] dependency "
                  "was found in app/pubspec.yaml."
              )

          pubspec.write_text(
              "\n".join(new_lines) + "\n"
          )


          # --------------------------------------------------------
          # Convert FOSS_REMOVE regions to block comments.
          #
          # This mirrors:
          #
          #   // [FOSS_REMOVE_START] -> /*
          #   // [FOSS_REMOVE_END]   -> */
          # --------------------------------------------------------

          dart_files = [
              Path("app/lib/config/init.dart"),
              Path(
                  "app/lib/pages/donation/"
                  "donation_page.dart"
              ),
              Path(
                  "app/lib/pages/donation/"
                  "donation_page_vm.dart"
              ),
          ]

          for path in dart_files:
              text = path.read_text()

              if "// [FOSS_REMOVE_START]" not in text:
                  raise SystemExit(
                      f"ERROR: FOSS start marker missing: {path}"
                  )

              if "// [FOSS_REMOVE_END]" not in text:
                  raise SystemExit(
                      f"ERROR: FOSS end marker missing: {path}"
                  )

              text = text.replace(
                  "// [FOSS_REMOVE_START]",
                  "/*",
              )

              text = text.replace(
                  "// [FOSS_REMOVE_END]",
                  "*/",
              )

              path.write_text(text)


          # --------------------------------------------------------
          # Remove purchase provider completely.
          # --------------------------------------------------------

          purchase_provider = Path(
              "app/lib/provider/purchase_provider.dart"
          )

          if not purchase_provider.exists():
              raise SystemExit(
                  "ERROR: purchase_provider.dart was not found."
              )

          purchase_provider.unlink()


          # --------------------------------------------------------
          # Donation page now uses LocalSend's built-in noop VM.
          # --------------------------------------------------------

          donation_page = Path(
              "app/lib/pages/donation/donation_page.dart"
          )

          text = donation_page.read_text()

          text = text.replace(
              "donationPageVmProvider",
              "donationPageNoopVmProvider",
          )

          donation_page.write_text(text)


          # --------------------------------------------------------
          # Validation
          # --------------------------------------------------------

          pubspec_text = pubspec.read_text()

          if "in_app_purchase:" in pubspec_text:
              raise SystemExit(
                  "ERROR: in_app_purchase remains in pubspec.yaml."
              )

          if purchase_provider.exists():
              raise SystemExit(
                  "ERROR: purchase_provider.dart still exists."
              )

          print(
              "LocalSend proprietary purchase code "
              "removed for legacy macOS build."
          )
          PY


          # Force CocoaPods to regenerate the lockfile without
          # in_app_purchase_storekit.
          rm -f app/macos/Podfile.lock


          echo
          echo "============================================================"
          echo "pubspec purchase check"
          echo "============================================================"

          grep -n \
            'in_app_purchase' \
            app/pubspec.yaml \
            || true

          echo
          echo "============================================================"
          echo "Donation VM check"
          echo "============================================================"

          grep -n \
            'donationPage.*VmProvider' \
            app/lib/pages/donation/donation_page.dart \
            || true


      # ============================================================
      # Flutter / Dart dependencies
      #
      # IMPORTANT: pub get comes AFTER the IAP removal, so Flutter
      # never generates a macOS plugin entry for
      # in_app_purchase_storekit.
      # ============================================================

      - name: Clean Flutter build
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          flutter clean

      - name: Flutter pub get
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          flutter pub get


      # ============================================================
      # Hard-check that StoreKit plugin is really gone
      # ============================================================

      - name: Verify in-app purchase plugin is gone
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Flutter dependency tree"
          echo "============================================================"

          cd app

          flutter pub deps \
            --style=compact \
            > ../flutter-pub-deps.txt

          if grep -E \
            '(^| )in_app_purchase(_storekit)?([ :]|$)' \
            ../flutter-pub-deps.txt; then

            echo
            echo "ERROR:"
            echo "in_app_purchase is still in the Flutter dependency graph."
            exit 1
          fi

          cd ..

          echo "No in_app_purchase dependency remains."


          if [ -f app/.flutter-plugins-dependencies ]; then

            echo
            echo "============================================================"
            echo ".flutter-plugins-dependencies StoreKit check"
            echo "============================================================"

            if grep -q \
              'in_app_purchase_storekit' \
              app/.flutter-plugins-dependencies; then

              echo "ERROR:"
              echo "Flutter still generated in_app_purchase_storekit."
              exit 1
            fi
          fi

          echo "StoreKit Flutter plugin successfully removed."


      # ============================================================
      # Cargokit / Rust
      # ============================================================

      - name: Prepare Cargokit
        working-directory: packages/localsend_isolates/rust_builder/cargokit/build_tool
        shell: bash
        run: |
          set -euxo pipefail

          flutter pub get

      - name: Verify Rust workspace
        shell: bash
        run: |
          set -euxo pipefail

          test -f Cargo.toml
          test -f rust-toolchain.toml
          test -f packages/localsend_isolates/rust/Cargo.toml

          cargo metadata \
            --format-version=1 \
            --no-deps \
            > /tmp/cargo-metadata.json

          python3 <<'PY'
          import json

          with open("/tmp/cargo-metadata.json", "r") as f:
              metadata = json.load(f)

          print("Rust workspace packages:")

          for package in metadata["packages"]:
              print(
                  f"  {package['name']} "
                  f"{package['version']}"
              )

              print(
                  f"    {package['manifest_path']}"
              )
          PY


      # ============================================================
      # gal 2.3.3 High Sierra shim
      #
      # gal's macOS implementation imports PhotoKit and its podspec
      # declares macOS 11.
      #
      # LocalSend doesn't normally use gallery saving on macOS.
      # Keep Flutter plugin registration but remove PhotoKit.
      # ============================================================

      - name: Backport gal for High Sierra
        shell: bash
        run: |
          set -euxo pipefail

          PUB_CACHE_ROOT="${PUB_CACHE:-$HOME/.pub-cache}"

          GAL_SWIFT="$(
            find "$PUB_CACHE_ROOT" \
              -type f \
              -path '*/gal-2.3.3/darwin/gal/Sources/gal/GalPlugin.swift' \
              -print \
              -quit
          )"

          GAL_PODSPEC="$(
            find "$PUB_CACHE_ROOT" \
              -type f \
              -path '*/gal-2.3.3/darwin/gal.podspec' \
              -print \
              -quit
          )"


          if [ -z "$GAL_SWIFT" ]; then

            echo "ERROR:"
            echo "gal 2.3.3 GalPlugin.swift was not found."

            find "$PUB_CACHE_ROOT" \
              -iname '*gal*' \
              -print \
              || true

            exit 1
          fi


          if [ -z "$GAL_PODSPEC" ]; then

            echo "ERROR:"
            echo "gal 2.3.3 gal.podspec was not found."

            exit 1
          fi


          echo "GalPlugin.swift:"
          echo "$GAL_SWIFT"

          echo
          echo "gal.podspec:"
          echo "$GAL_PODSPEC"


          cp \
            "$GAL_SWIFT" \
            "${GAL_SWIFT}.original"

          cp \
            "$GAL_PODSPEC" \
            "${GAL_PODSPEC}.original"


          # --------------------------------------------------------
          # Lower gal's declared macOS deployment target.
          # --------------------------------------------------------

          python3 - "$GAL_PODSPEC" <<'PY'
          import re
          import sys

          from pathlib import Path


          path = Path(sys.argv[1])

          text = path.read_text()


          text, count = re.subn(
              r"s\.osx\.deployment_target"
              r"\s*=\s*"
              r"['\"][0-9.]+['\"]",
              "s.osx.deployment_target = '10.13'",
              text,
              count=1,
          )


          if count != 1:
              raise SystemExit(
                  "ERROR: Could not patch "
                  "gal macOS deployment target."
              )


          path.write_text(text)
          PY


          # --------------------------------------------------------
          # High Sierra native shim.
          #
          # Preserve:
          #
          #   class GalPlugin
          #   MethodChannel "gal"
          #
          # so GeneratedPluginRegistrant remains valid.
          # --------------------------------------------------------

          cat > "$GAL_SWIFT" <<'SWIFT'
          import Cocoa
          import FlutterMacOS

          public class GalPlugin: NSObject, FlutterPlugin {

            public static func register(
              with registrar: FlutterPluginRegistrar
            ) {
              let channel = FlutterMethodChannel(
                name: "gal",
                binaryMessenger: registrar.messenger
              )

              let instance = GalPlugin()

              registrar.addMethodCallDelegate(
                instance,
                channel: channel
              )
            }

            public func handle(
              _ call: FlutterMethodCall,
              result: @escaping FlutterResult
            ) {
              switch call.method {

              case "hasAccess":
                result(false)

              case "requestAccess":
                result(false)

              case "putVideo",
                   "putImage",
                   "putImageBytes":

                result(
                  FlutterError(
                    code: "ACCESS_DENIED",
                    message:
                      "Direct Photos-library saving is unavailable "
                      + "in the macOS High Sierra build.",
                    details: nil
                  )
                )

              case "open":

                if let url = URL(string: "photos://") {
                  _ = NSWorkspace.shared.open(url)
                }

                result(nil)

              default:
                result(FlutterMethodNotImplemented)
              }
            }
          }
          SWIFT


          echo
          echo "============================================================"
          echo "gal after patch"
          echo "============================================================"

          cat "$GAL_SWIFT"

          echo
          grep -n \
            'deployment_target' \
            "$GAL_PODSPEC" \
            || true


          if grep -E \
            'import Photos|PHPhotoLibrary|PHAsset|PHFetch' \
            "$GAL_SWIFT"; then

            echo "ERROR:"
            echo "PhotoKit APIs remain in gal shim."

            exit 1
          fi

          echo
          echo "gal High Sierra shim installed."


      # ============================================================
      # LocalSend / Xcode High Sierra backport
      # ============================================================

      - name: Patch LocalSend for High Sierra
        shell: bash
        run: |
          set -euxo pipefail

          PBX="app/macos/Runner.xcodeproj/project.pbxproj"
          PODFILE="app/macos/Podfile"
          RELEASE_XCCONFIG="app/macos/Runner/Configs/Release.xcconfig"
          APP_DELEGATE="app/macos/Runner/AppDelegate.swift"

          echo "============================================================"
          echo "LocalSend macOS High Sierra backport"
          echo "Target: macOS 10.13 / x86_64"
          echo "============================================================"


          # ========================================================
          # Xcode project
          # ========================================================

          python3 <<'PY'
          from pathlib import Path
          import re


          pbx = Path(
              "app/macos/Runner.xcodeproj/project.pbxproj"
          )

          text = pbx.read_text()


          # --------------------------------------------------------
          # Deployment targets
          #
          # Flutter 3.41.9 automatically migrates a literal:
          #
          #   MACOSX_DEPLOYMENT_TARGET = 10.13;
          #
          # to 10.15.
          #
          # Use an indirect setting instead.
          # --------------------------------------------------------

          text, deployment_count = re.subn(
              r'MACOSX_DEPLOYMENT_TARGET'
              r'\s*=\s*'
              r'[0-9.]+;',
              'MACOSX_DEPLOYMENT_TARGET = '
              '"$(LOCALSEND_LEGACY_MACOS_TARGET)";',
              text,
          )


          if deployment_count == 0:
              raise SystemExit(
                  "ERROR: No Xcode deployment targets found."
              )


          print(
              f"Patched {deployment_count} "
              "Xcode deployment target(s)."
          )


          # --------------------------------------------------------
          # x86_64-only settings
          #
          # Add to every XCBuildConfiguration.
          # --------------------------------------------------------

          if (
              "LOCALSEND_LEGACY_MACOS_TARGET = 10.13;"
              not in text
          ):

              replacement = (
                  "buildSettings = {\n"
                  "\t\t\t\t"
                  "LOCALSEND_LEGACY_MACOS_TARGET = 10.13;\n"
                  "\t\t\t\t"
                  "ARCHS = x86_64;\n"
                  "\t\t\t\t"
                  "EXCLUDED_ARCHS = arm64;\n"
                  "\t\t\t\t"
                  "ONLY_ACTIVE_ARCH = YES;\n"
              )

              text = text.replace(
                  "buildSettings = {\n",
                  replacement,
              )


          # --------------------------------------------------------
          # Remove upstream developer signing.
          # --------------------------------------------------------

          text = re.sub(
              r'DEVELOPMENT_TEAM'
              r'\s*=\s*'
              r'[A-Z0-9]+;',
              'DEVELOPMENT_TEAM = "";',
              text,
          )


          text = re.sub(
              r'CODE_SIGN_STYLE'
              r'\s*=\s*'
              r'Automatic;',
              'CODE_SIGN_STYLE = Manual;',
              text,
          )


          text = re.sub(
              r'CODE_SIGN_IDENTITY'
              r'\s*=\s*'
              r'"(?:'
              r'Apple Development|'
              r'Mac Development|'
              r'Mac Developer'
              r')";',
              'CODE_SIGN_IDENTITY = "-";',
              text,
          )


          text = re.sub(
              r'('
              r'"CODE_SIGN_IDENTITY\[sdk=macosx\*\]"'
              r'\s*=\s*'
              r')'
              r'"(?:'
              r'Apple Development|'
              r'Mac Development|'
              r'Mac Developer'
              r')";',
              r'\1"-";',
              text,
          )


          text = re.sub(
              r'PROVISIONING_PROFILE_SPECIFIER'
              r'\s*=\s*'
              r'"[^"]*";',
              'PROVISIONING_PROFILE_SPECIFIER = "";',
              text,
          )


          text = re.sub(
              r'PROVISIONING_PROFILE'
              r'\s*=\s*'
              r'"[^"]*";',
              'PROVISIONING_PROFILE = "";',
              text,
          )


          # --------------------------------------------------------
          # DockProgress
          #
          # Find it structurally by repository URL.
          # Do not depend on Xcode's tabs/spaces.
          # --------------------------------------------------------

          dock_pattern = re.compile(
              r'('
              r'[0-9A-F]+'
              r'\s*/\*\s*'
              r'XCRemoteSwiftPackageReference '
              r'"DockProgress"'
              r'\s*\*/'
              r'\s*=\s*\{'
              r'.*?'
              r'repositoryURL'
              r'\s*=\s*'
              r'"https://github\.com/'
              r'sindresorhus/DockProgress";'
              r'\s*'
              r'requirement'
              r'\s*=\s*\{'
              r')'
              r'.*?'
              r'('
              r'\};'
              r'\s*'
              r'\};'
              r')',
              re.DOTALL,
          )


          match = dock_pattern.search(text)


          if not match:
              raise SystemExit(
                  "ERROR: Could not locate "
                  "DockProgress Swift package block."
              )


          replacement = (
              match.group(1)
              + "\n"
              + "\t\t\t\tkind = exactVersion;\n"
              + "\t\t\t\tversion = 3.2.0;\n"
              + "\t\t\t"
              + match.group(2)
          )


          text = (
              text[:match.start()]
              + replacement
              + text[match.end():]
          )


          dock_check = re.compile(
              r'repositoryURL'
              r'\s*=\s*'
              r'"https://github\.com/'
              r'sindresorhus/DockProgress";'
              r'.*?'
              r'kind\s*=\s*exactVersion;'
              r'.*?'
              r'version\s*=\s*3\.2\.0;',
              re.DOTALL,
          )


          if not dock_check.search(text):
              raise SystemExit(
                  "ERROR: DockProgress 3.2.0 "
                  "patch validation failed."
              )


          print(
              "DockProgress patched to exact version 3.2.0."
          )


          pbx.write_text(text)
          PY


          # ========================================================
          # Actual Release xcconfig
          # ========================================================

          cat >> "$RELEASE_XCCONFIG" <<'EOF'

          // ========================================================
          // LocalSend macOS High Sierra Backport
          // ========================================================

          LOCALSEND_LEGACY_MACOS_TARGET = 10.13
          MACOSX_DEPLOYMENT_TARGET = $(LOCALSEND_LEGACY_MACOS_TARGET)

          ARCHS = x86_64
          EXCLUDED_ARCHS = arm64
          ONLY_ACTIVE_ARCH = YES

          CODE_SIGN_IDENTITY = -
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM =

          EOF


          # ========================================================
          # CocoaPods
          # ========================================================

          python3 <<'PY'
          from pathlib import Path
          import re


          podfile = Path(
              "app/macos/Podfile"
          )

          text = podfile.read_text()


          # --------------------------------------------------------
          # Global platform.
          #
          # Do not use literal:
          #
          #   platform :osx, '10.13'
          #
          # because Flutter's migration detects it.
          # --------------------------------------------------------

          text, platform_count = re.subn(
              r"^platform"
              r"\s+:osx,"
              r"\s*['\"][0-9.]+['\"]",
              "legacy_macos_target = '10.13'\n"
              "platform :osx, legacy_macos_target",
              text,
              count=1,
              flags=re.MULTILINE,
          )


          if platform_count != 1:
              raise SystemExit(
                  "ERROR: Could not patch Podfile platform."
              )


          # --------------------------------------------------------
          # Every generated Pod deployment target.
          # --------------------------------------------------------

          text, pod_target_count = re.subn(
              r"config\.build_settings"
              r"\[['\"]"
              r"MACOSX_DEPLOYMENT_TARGET"
              r"['\"]\]"
              r"\s*=\s*"
              r"['\"][0-9.]+['\"]",
              "config.build_settings"
              "['MACOSX_DEPLOYMENT_TARGET'] "
              "= legacy_macos_target",
              text,
          )


          if pod_target_count == 0:
              raise SystemExit(
                  "ERROR: Could not patch "
                  "Pod deployment targets."
              )


          # --------------------------------------------------------
          # Force every Pod to x86_64.
          # --------------------------------------------------------

          needle = (
              "config.build_settings"
              "['MACOSX_DEPLOYMENT_TARGET'] "
              "= legacy_macos_target"
          )


          if (
              "config.build_settings"
              "['ARCHS'] = 'x86_64'"
              not in text
          ):

              replacement = (
                  needle
                  + "\n"
                  + "      "
                  + "config.build_settings"
                  + "['ARCHS'] = 'x86_64'"
                  + "\n"
                  + "      "
                  + "config.build_settings"
                  + "['EXCLUDED_ARCHS'] = 'arm64'"
                  + "\n"
                  + "      "
                  + "config.build_settings"
                  + "['ONLY_ACTIVE_ARCH'] = 'YES'"
              )


              text = text.replace(
                  needle,
                  replacement,
                  1,
              )


          # --------------------------------------------------------
          # ShareExtension compiles Shared.swift, which imports
          # Defaults. Give the extension its own Defaults target.
          # --------------------------------------------------------

          if "target 'ShareExtension' do" not in text:

              share_target = """
          target 'ShareExtension' do
            use_frameworks!
            use_modular_headers!

            pod 'Defaults', '~> 4.2'
          end

          """


              text = text.replace(
                  "\npost_install do |installer|",
                  "\n"
                  + share_target
                  + "post_install do |installer|",
                  1,
              )


          if "target 'ShareExtension' do" not in text:
              raise SystemExit(
                  "ERROR: Failed to create "
                  "ShareExtension CocoaPods target."
              )


          podfile.write_text(text)
          PY


          # ========================================================
          # Remove unnecessary @MainActor.
          # ========================================================

          python3 <<'PY'
          from pathlib import Path


          path = Path(
              "app/macos/Runner/AppDelegate.swift"
          )

          text = path.read_text()


          text = text.replace(
              "@MainActor private func handleFlutterCall",
              "private func handleFlutterCall",
          )


          path.write_text(text)
          PY


          # ========================================================
          # Remove stale SwiftPM locks.
          # ========================================================

          rm -f \
            app/macos/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved \
            app/macos/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved


          echo
          echo "============================================================"
          echo "DockProgress after patch"
          echo "============================================================"

          grep -A12 -B2 \
            'XCRemoteSwiftPackageReference "DockProgress"' \
            "$PBX" \
            || true


          echo
          echo "============================================================"
          echo "Podfile"
          echo "============================================================"

          cat "$PODFILE"


      # ============================================================
      # Static validation
      # ============================================================

      - name: Validate High Sierra patch
        shell: bash
        run: |
          set -euxo pipefail

          PBX="app/macos/Runner.xcodeproj/project.pbxproj"
          PODFILE="app/macos/Podfile"


          if grep -q \
            "3W7H4PYMCV" \
            "$PBX"; then

            echo "ERROR:"
            echo "Upstream Apple Team ID remains."

            exit 1
          fi


          if grep -q \
            'MACOSX_DEPLOYMENT_TARGET = 10.13;' \
            "$PBX"; then

            echo "ERROR:"
            echo "Literal 10.13 remains in pbxproj."

            exit 1
          fi


          if grep -q \
            "platform :osx, '10.13'" \
            "$PODFILE"; then

            echo "ERROR:"
            echo "Literal 10.13 remains in Podfile."

            exit 1
          fi


          python3 <<'PY'
          from pathlib import Path
          import re


          text = Path(
              "app/macos/Runner.xcodeproj/project.pbxproj"
          ).read_text()


          pattern = re.compile(
              r'repositoryURL'
              r'\s*=\s*'
              r'"https://github\.com/'
              r'sindresorhus/DockProgress";'
              r'.*?'
              r'kind\s*=\s*exactVersion;'
              r'.*?'
              r'version\s*=\s*3\.2\.0;',
              re.DOTALL,
          )


          if not pattern.search(text):
              raise SystemExit(
                  "ERROR: DockProgress 3.2.0 "
                  "validation failed."
              )


          print(
              "DockProgress 3.2.0 validation passed."
          )
          PY


          if ! grep -q \
            "target 'ShareExtension' do" \
            "$PODFILE"; then

            echo "ERROR:"
            echo "ShareExtension Pod target missing."

            exit 1
          fi


          if grep -q \
            '^ *in_app_purchase:' \
            app/pubspec.yaml; then

            echo "ERROR:"
            echo "in_app_purchase returned to pubspec.yaml."

            exit 1
          fi


          echo
          echo "Static High Sierra patch validation passed."


      # ============================================================
      # Generate Flutter configuration / CocoaPods
      # ============================================================

      - name: Generate Flutter macOS configuration
        working-directory: app
        shell: bash
        run: |
          set -o pipefail

          flutter build macos \
            --release \
            --config-only \
            -v \
            2>&1 | tee ../flutter-config-only.log


      # ============================================================
      # Validate generated native dependency graph
      # ============================================================

      - name: Verify StoreKit plugin stayed removed
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Podfile.lock"
          echo "============================================================"

          if [ -f macos/Podfile.lock ]; then

            if grep -q \
              'in_app_purchase_storekit' \
              macos/Podfile.lock; then

              echo "ERROR:"
              echo "in_app_purchase_storekit returned to Podfile.lock."

              grep -n \
                'in_app_purchase_storekit' \
                macos/Podfile.lock \
                || true

              exit 1
            fi
          fi


          echo
          echo "============================================================"
          echo "GeneratedPluginRegistrant"
          echo "============================================================"

          REGISTRANT="$(
            find macos \
              -type f \
              -name 'GeneratedPluginRegistrant.swift' \
              -print \
              -quit
          )"


          if [ -n "$REGISTRANT" ]; then

            cat "$REGISTRANT"

            if grep -q \
              'in_app_purchase' \
              "$REGISTRANT"; then

              echo "ERROR:"
              echo "StoreKit plugin still exists in GeneratedPluginRegistrant."

              exit 1
            fi
          fi


          echo
          echo "in_app_purchase_storekit is absent."


      # ============================================================
      # Ensure Flutter didn't silently restore Catalina
      # ============================================================

      - name: Verify Flutter migration bypass
        shell: bash
        run: |
          set -euxo pipefail

          PBX="app/macos/Runner.xcodeproj/project.pbxproj"
          PODFILE="app/macos/Podfile"


          if grep -q \
            'MACOSX_DEPLOYMENT_TARGET = 10.15;' \
            "$PBX"; then

            echo "ERROR:"
            echo "Flutter restored macOS 10.15."

            grep -n \
              'MACOSX_DEPLOYMENT_TARGET = 10.15;' \
              "$PBX"

            exit 1
          fi


          if grep -q \
            "platform :osx, '10.15'" \
            "$PODFILE"; then

            echo "ERROR:"
            echo "Flutter restored Podfile to 10.15."

            exit 1
          fi


          echo "Flutter migration bypass survived."


      # ============================================================
      # Verify gal shim survived config generation
      # ============================================================

      - name: Verify gal High Sierra shim
        shell: bash
        run: |
          set -euxo pipefail

          PUB_CACHE_ROOT="${PUB_CACHE:-$HOME/.pub-cache}"

          GAL_SWIFT="$(
            find "$PUB_CACHE_ROOT" \
              -type f \
              -path '*/gal-2.3.3/darwin/gal/Sources/gal/GalPlugin.swift' \
              -print \
              -quit
          )"

          GAL_PODSPEC="$(
            find "$PUB_CACHE_ROOT" \
              -type f \
              -path '*/gal-2.3.3/darwin/gal.podspec' \
              -print \
              -quit
          )"


          test -n "$GAL_SWIFT"
          test -n "$GAL_PODSPEC"


          if grep -q \
            'import Photos' \
            "$GAL_SWIFT"; then

            echo "ERROR:"
            echo "Original gal PhotoKit implementation returned."

            exit 1
          fi


          if ! grep -q \
            "s.osx.deployment_target = '10.13'" \
            "$GAL_PODSPEC"; then

            echo "ERROR:"
            echo "gal podspec target is not 10.13."

            exit 1
          fi


          echo "gal High Sierra shim survived."


      # ============================================================
      # Verify CocoaPods integration
      # ============================================================

      - name: Verify CocoaPods integration
        working-directory: app/macos
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Generated CocoaPods targets"
          echo "============================================================"

          find \
            "Pods/Target Support Files" \
            -maxdepth 1 \
            -type d \
            -print \
            | sort


          if [ ! -d \
            "Pods/Target Support Files/Pods-ShareExtension" ]; then

            echo "ERROR:"
            echo "Pods-ShareExtension was not generated."

            exit 1
          fi


          if find \
            "Pods/Target Support Files" \
            -iname '*in_app_purchase*' \
            -print \
            | grep -q .; then

            echo "ERROR:"
            echo "StoreKit Pod support files still exist."

            find \
              "Pods/Target Support Files" \
              -iname '*in_app_purchase*' \
              -print

            exit 1
          fi


          echo
          echo "CocoaPods integration looks correct."


      # ============================================================
      # Resolve Swift packages
      # ============================================================

      - name: Resolve Swift packages
        working-directory: app
        shell: bash
        run: |
          set -o pipefail

          mkdir -p \
            build/macos/SourcePackages


          xcodebuild \
            -resolvePackageDependencies \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -clonedSourcePackagesDirPath \
              build/macos/SourcePackages \
            2>&1 | tee ../swiftpm-resolve.log


          echo
          echo "============================================================"
          echo "SwiftPM checkout diagnostics"
          echo "============================================================"


          find \
            build/macos/SourcePackages \
            -maxdepth 3 \
            -type d \
            -print \
            | sort \
            | head -200 \
            || true


          DOCK_DIR="$(
            find \
              build/macos/SourcePackages/checkouts \
              -maxdepth 1 \
              -type d \
              -iname 'DockProgress' \
              -print \
              -quit
          )"


          if [ -n "$DOCK_DIR" ]; then

            echo
            echo "DockProgress checkout:"
            echo "$DOCK_DIR"

            echo
            echo "Tags at HEAD:"

            git \
              -C "$DOCK_DIR" \
              tag --points-at HEAD \
              || true
          fi


          echo
          echo "Package.resolved files, if any:"

          find macos \
            -type f \
            -path '*/swiftpm/Package.resolved' \
            -print \
            -exec cat {} \; \
            || true


      # ============================================================
      # Verify effective Xcode settings
      # ============================================================

      - name: Verify effective Xcode build settings
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p ../diagnostics


          xcodebuild \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -showBuildSettings \
            > ../diagnostics/runner-build-settings.txt


          xcodebuild \
            -project macos/Runner.xcodeproj \
            -target ShareExtension \
            -configuration Release \
            -showBuildSettings \
            > ../diagnostics/shareextension-build-settings.txt


          echo "============================================================"
          echo "Runner"
          echo "============================================================"

          grep -E \
            'ARCHS|EXCLUDED_ARCHS|ONLY_ACTIVE_ARCH|MACOSX_DEPLOYMENT_TARGET|LOCALSEND_LEGACY_MACOS_TARGET' \
            ../diagnostics/runner-build-settings.txt \
            || true


          echo
          echo "============================================================"
          echo "ShareExtension"
          echo "============================================================"

          grep -E \
            'ARCHS|EXCLUDED_ARCHS|ONLY_ACTIVE_ARCH|MACOSX_DEPLOYMENT_TARGET|LOCALSEND_LEGACY_MACOS_TARGET' \
            ../diagnostics/shareextension-build-settings.txt \
            || true


          python3 <<'PY'
          from pathlib import Path
          import re


          files = [
              Path(
                  "../diagnostics/"
                  "runner-build-settings.txt"
              ),

              Path(
                  "../diagnostics/"
                  "shareextension-build-settings.txt"
              ),
          ]


          for path in files:

              text = path.read_text()


              deployment = re.findall(
                  r"^\s*"
                  r"MACOSX_DEPLOYMENT_TARGET"
                  r"\s*=\s*"
                  r"(.*?)\s*$",
                  text,
                  flags=re.MULTILINE,
              )


              archs = re.findall(
                  r"^\s*"
                  r"ARCHS"
                  r"\s*=\s*"
                  r"(.*?)\s*$",
                  text,
                  flags=re.MULTILINE,
              )


              excluded = re.findall(
                  r"^\s*"
                  r"EXCLUDED_ARCHS"
                  r"\s*=\s*"
                  r"(.*?)\s*$",
                  text,
                  flags=re.MULTILINE,
              )


              print()
              print(path)
              print("  deployment:", deployment[:3])
              print("  ARCHS:", archs[:3])
              print("  EXCLUDED_ARCHS:", excluded[:3])


              if not deployment:
                  raise SystemExit(
                      f"ERROR: {path}: "
                      "MACOSX_DEPLOYMENT_TARGET missing."
                  )


              if deployment[0] != "10.13":
                  raise SystemExit(
                      f"ERROR: {path}: "
                      f"target is {deployment[0]!r}; "
                      "expected '10.13'."
                  )


              if not archs:
                  raise SystemExit(
                      f"ERROR: {path}: ARCHS missing."
                  )


              if "x86_64" not in archs[0].split():
                  raise SystemExit(
                      f"ERROR: {path}: "
                      "x86_64 missing from ARCHS."
                  )


              if excluded:

                  if "arm64" not in excluded[0].split():

                      raise SystemExit(
                          f"ERROR: {path}: "
                          "arm64 is not excluded."
                      )


          print()
          print(
              "Effective Xcode settings are correct."
          )
          PY


      # ============================================================
      # Actual build
      #
      # rust_lib_localsend_app is built by Cargokit as part of
      # Flutter/Xcode. Do not run cargo build separately.
      # ============================================================

      - name: Build macOS app
        working-directory: app
        shell: bash
        env:
          ARCHS: x86_64
          EXCLUDED_ARCHS: arm64
        run: |
          set -o pipefail

          echo "============================================================"
          echo "Building LocalSend"
          echo
          echo "Target OS:       macOS High Sierra 10.13"
          echo "Architecture:    x86_64"
          echo "Flutter:         ${FLUTTER_VERSION}"
          echo "Rust:            ${RUST_VERSION}"
          echo "DockProgress:    3.2.0"
          echo "gal:             High Sierra shim"
          echo "StoreKit/IAP:    removed"
          echo "============================================================"


          flutter build macos \
            --release \
            -v \
            2>&1 | tee ../flutter-macos-build.log


      # ============================================================
      # Extract useful compiler errors
      #
      # Print context rather than only grep-matched lines.
      # ============================================================

      - name: Extract compiler errors
        if: failure()
        shell: bash
        run: |
          set +e

          mkdir -p diagnostics


          if [ -f flutter-macos-build.log ]; then

            python3 <<'PY'
          from pathlib import Path
          import re


          source = Path(
              "flutter-macos-build.log"
          )

          output = Path(
              "diagnostics/compiler-errors.txt"
          )


          lines = source.read_text(
              errors="replace"
          ).splitlines()


          pattern = re.compile(
              r"error:|"
              r"fatal error:|"
              r"is only available in macOS|"
              r"introduced in macOS|"
              r"requires macOS|"
              r"\*\* BUILD FAILED \*\*|"
              r"The following build commands failed"
          )


          hit_indexes = [
              index
              for index, line in enumerate(lines)
              if pattern.search(line)
          ]


          ranges = []

          for index in hit_indexes:

              start = max(
                  0,
                  index - 5,
              )

              end = min(
                  len(lines),
                  index + 8,
              )


              if (
                  ranges
                  and start <= ranges[-1][1]
              ):

                  ranges[-1] = (
                      ranges[-1][0],
                      max(
                          ranges[-1][1],
                          end,
                      ),
                  )

              else:

                  ranges.append(
                      (start, end)
                  )


          chunks = []

          for start, end in ranges:

              chunks.append(
                  "=" * 80
              )

              for index in range(start, end):

                  chunks.append(
                      f"{index + 1}: "
                      f"{lines[index]}"
                  )


          output.write_text(
              "\n".join(chunks)
              + ("\n" if chunks else "")
          )


          print(
              output.read_text()
              if output.exists()
              else "No compiler diagnostics extracted."
          )
          PY

          fi


      # ============================================================
      # Locate output
      # ============================================================

      - name: Locate built application
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          APP="$(
            find \
              build/macos/Build/Products/Release \
              -maxdepth 1 \
              -type d \
              -name '*.app' \
              -print \
              -quit
          )"


          if [ -z "$APP" ]; then

            echo "ERROR:"
            echo "No .app bundle was produced."

            exit 1
          fi


          EXECUTABLE="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$APP/Contents/Info.plist"
          )"


          echo \
            "APP=$APP" \
            >> "$GITHUB_ENV"

          echo \
            "APP_EXECUTABLE=$EXECUTABLE" \
            >> "$GITHUB_ENV"


          echo
          echo "Application:"
          echo "$APP"

          echo
          echo "Executable:"
          echo "$EXECUTABLE"


      # ============================================================
      # Architecture verification
      # ============================================================

      - name: Verify x86_64 application
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          MAIN="$APP/Contents/MacOS/$APP_EXECUTABLE"


          file "$MAIN"

          lipo \
            -info \
            "$MAIN"


          ARCHES="$(
            lipo \
              -archs \
              "$MAIN"
          )"


          echo
          echo "Architectures:"
          echo "$ARCHES"


          if ! echo "$ARCHES" \
            | grep -qw x86_64; then

            echo "ERROR:"
            echo "Main executable lacks x86_64."

            exit 1
          fi


          if echo "$ARCHES" \
            | grep -qw arm64; then

            echo "ERROR:"
            echo "arm64 unexpectedly remains."

            exit 1
          fi


      # ============================================================
      # Audit every Mach-O deployment target
      #
      # This is where we will discover whether FlutterMacOS.framework
      # or another remaining native plugin itself requires Catalina
      # or newer.
      # ============================================================

      - name: Audit Mach-O deployment targets
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p ../diagnostics

          REPORT="../diagnostics/macho-deployment-targets.txt"

          : > "$REPORT"


          find "$APP" \
            -type f \
            -print0 \
          | while IFS= read -r -d '' FILE; do

              if file "$FILE" \
                | grep -q "Mach-O"; then

                {
                  echo
                  echo "============================================================"
                  echo "$FILE"
                  echo "============================================================"

                  file "$FILE"

                  echo
                  echo "--- Architectures ---"

                  lipo \
                    -archs \
                    "$FILE" \
                    2>/dev/null \
                    || true

                  echo
                  echo "--- Deployment load commands ---"

                  otool \
                    -l \
                    "$FILE" \
                  | awk '
                      /cmd LC_VERSION_MIN_MACOSX/ {
                        capture=1
                        count=0
                      }

                      /cmd LC_BUILD_VERSION/ {
                        capture=1
                        count=0
                      }

                      capture {
                        print
                        count++

                        if (count >= 10) {
                          capture=0
                        }
                      }
                    '

                  echo
                  echo "--- Linked libraries ---"

                  otool \
                    -L \
                    "$FILE" \
                    || true

                } | tee -a "$REPORT"

              fi

            done


      # ============================================================
      # Signature / entitlement inspection
      # ============================================================

      - name: Inspect code signatures
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p ../diagnostics

          REPORT="../diagnostics/codesign-report.txt"


          {
            echo "============================================================"
            echo "Main application"
            echo "============================================================"

            codesign \
              -dvvv \
              "$APP" \
              2>&1 \
              || true


            echo
            echo "============================================================"
            echo "Main entitlements"
            echo "============================================================"

            codesign \
              -d \
              --entitlements :- \
              "$APP" \
              2>&1 \
              || true


            echo
            echo "============================================================"
            echo "Extensions"
            echo "============================================================"


            find "$APP" \
              -type d \
              -name '*.appex' \
              -print \
            | while read -r EXTENSION; do

                echo
                echo "------------------------------------------------------------"
                echo "$EXTENSION"
                echo "------------------------------------------------------------"

                codesign \
                  -dvvv \
                  "$EXTENSION" \
                  2>&1 \
                  || true

                codesign \
                  -d \
                  --entitlements :- \
                  "$EXTENSION" \
                  2>&1 \
                  || true

              done

          } | tee "$REPORT"


          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=4 \
            "$APP"


      # ============================================================
      # Package
      # ============================================================

      - name: Package High Sierra build
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p release


          OUTPUT="release/LocalSend-macOS-High-Sierra-10.13-x86_64.zip"


          rm -f "$OUTPUT"


          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$APP" \
            "$OUTPUT"


          echo
          echo "Created:"

          ls \
            -lh \
            "$OUTPUT"


      # ============================================================
      # Successful build artifact
      # ============================================================

      - name: Upload High Sierra build
        uses: actions/upload-artifact@v4
        with:
          name: LocalSend-macOS-High-Sierra-10.13-x86_64
          path: app/release/LocalSend-macOS-High-Sierra-10.13-x86_64.zip
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # Diagnostics — always collect
      # ============================================================

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p diagnostics


          cp \
            app/macos/Runner.xcodeproj/project.pbxproj \
            diagnostics/project.pbxproj.after-patch \
            2>/dev/null


          cp \
            app/macos/Podfile \
            diagnostics/Podfile.after-patch \
            2>/dev/null


          cp \
            app/macos/Podfile.lock \
            diagnostics/Podfile.lock.after-patch \
            2>/dev/null


          cp \
            app/pubspec.yaml \
            diagnostics/pubspec.yaml.after-foss-strip \
            2>/dev/null


          cp \
            app/macos/Runner/Configs/Release.xcconfig \
            diagnostics/Release.xcconfig.after-patch \
            2>/dev/null


          cp \
            swiftpm-resolve.log \
            diagnostics/swiftpm-resolve.log \
            2>/dev/null


          cp \
            flutter-config-only.log \
            diagnostics/flutter-config-only.log \
            2>/dev/null


          cp \
            flutter-macos-build.log \
            diagnostics/flutter-macos-build.log \
            2>/dev/null


          cp \
            flutter-pub-deps.txt \
            diagnostics/flutter-pub-deps.txt \
            2>/dev/null


          # --------------------------------------------------------
          # Collect Package.resolved files dynamically.
          # --------------------------------------------------------

          python3 <<'PY'
          from pathlib import Path
          import shutil


          source = Path(
              "app/macos"
          )

          destination = Path(
              "diagnostics"
          )


          destination.mkdir(
              parents=True,
              exist_ok=True,
          )


          files = sorted(
              path
              for path in source.rglob(
                  "Package.resolved"
              )
              if path.parent.name == "swiftpm"
          )


          for index, path in enumerate(
              files,
              start=1,
          ):

              relative = path.relative_to(
                  source
              )


              safe_name = (
                  str(relative)
                  .replace("/", "__")
                  .replace(" ", "_")
              )


              output = destination / (
                  f"Package.resolved."
                  f"{index}__"
                  f"{safe_name}"
              )


              shutil.copy2(
                  path,
                  output,
              )


              print(
                  f"Copied "
                  f"{path} -> {output}"
              )
          PY


          # --------------------------------------------------------
          # Collect patched gal.
          # --------------------------------------------------------

          PUB_CACHE_ROOT="${PUB_CACHE:-$HOME/.pub-cache}"


          GAL_SWIFT="$(
            find "$PUB_CACHE_ROOT" \
              -type f \
              -path '*/gal-2.3.3/darwin/gal/Sources/gal/GalPlugin.swift' \
              -print \
              -quit
          )"


          GAL_PODSPEC="$(
            find "$PUB_CACHE_ROOT" \
              -type f \
              -path '*/gal-2.3.3/darwin/gal.podspec' \
              -print \
              -quit
          )"


          if [ -n "$GAL_SWIFT" ]; then

            cp \
              "$GAL_SWIFT" \
              diagnostics/GalPlugin.swift.after-patch \
              2>/dev/null

            cp \
              "${GAL_SWIFT}.original" \
              diagnostics/GalPlugin.swift.original \
              2>/dev/null
          fi


          if [ -n "$GAL_PODSPEC" ]; then

            cp \
              "$GAL_PODSPEC" \
              diagnostics/gal.podspec.after-patch \
              2>/dev/null

            cp \
              "${GAL_PODSPEC}.original" \
              diagnostics/gal.podspec.original \
              2>/dev/null
          fi


      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LocalSend-High-Sierra-build-diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30
