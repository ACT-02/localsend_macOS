      # ============================================================
      # Effective Xcode build settings
      # ============================================================

      - name: Verify effective Xcode build settings
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p ../diagnostics


          xcodebuild \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
