      # ============================================================

      - name: Extract compiler errors
        if: failure()
        shell: bash
        run: |
          set +e

          mkdir -p diagnostics


          if [ -f flutter-macos-build.log ]; then

            python3 <<'PY'
          from pathlib import Path
          import re


          source = Path(
              "flutter-macos-build.log"
          )

          output = Path(
              "diagnostics/compiler-errors.txt"
          )


          lines = source.read_text(
              errors="replace"
          ).splitlines()


          pattern = re.compile(
              r"error:|"
              r"fatal error:|"
              r"is only available in macOS|"
              r"introduced in macOS|"
              r"requires macOS|"
              r"\*\* BUILD FAILED \*\*|"
              r"The following build commands failed"
          )


          hits = [
              index
              for index, line in enumerate(lines)
              if pattern.search(line)
          ]


          ranges = []


          for index in hits:

              start = max(
                  0,
                  index - 10,
              )

              end = min(
                  len(lines),
                  index + 14,
              )


              if (
                  ranges
                  and start <= ranges[-1][1]
              ):

                  ranges[-1] = (
                      ranges[-1][0],
                      max(
                          ranges[-1][1],
                          end,
                      ),
                  )

              else:

                  ranges.append(
                      (start, end)
                  )


          output_lines = []


          for start, end in ranges:

              output_lines.append(
                  "=" * 80
              )

              for index in range(
                  start,
                  end,
              ):

                  output_lines.append(
                      f"{index + 1}: "
                      f"{lines[index]}"
                  )


          output.write_text(
              "\n".join(output_lines)
              + (
                  "\n"
                  if output_lines
                  else ""
              )
          )


          print(
              output.read_text()
              if output.exists()
              else ""
          )
          PY

          fi


      # ============================================================
