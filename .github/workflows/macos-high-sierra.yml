            --force \
            --sign - \
            --preserve-metadata=identifier,requirements \
            --entitlements \
              "$ENTITLEMENTS" \
            "$APP"


          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=4 \
            "$APP"


      # ============================================================
      # Final architecture validation
      # ============================================================

      - name: Verify final x86_64 application
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          MAIN="$APP/Contents/MacOS/$APP_EXECUTABLE"


          MAIN_ARCHS="$(
            lipo \
              -archs \
              "$MAIN"
          )"


          echo \
