name: LocalSend macOS High Sierra Backport

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.9"
  RUST_VERSION: "1.97.1"
  LEGACY_MACOS_TARGET: "10.13"
  MACOSX_DEPLOYMENT_TARGET: "10.13"

jobs:
  build:
    name: Build LocalSend for macOS High Sierra
    runs-on: macos-15-intel

    steps:
      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive


      # ============================================================
      # Toolchains
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy


      # ============================================================
      # FlutterMacOS CocoaPods minimum target
      #
      # Flutter 3.41.9 generates:
      #
      #   Flutter/ephemeral/FlutterMacOS.podspec
      #
      # from:
      #
      #   packages/flutter_tools/bin/podhelper.rb
      #
      # Upstream target: 10.15
      # Legacy target:   10.13
      # ============================================================

      - name: Backport FlutterMacOS podspec generator
        shell: bash
        run: |
          set -euxo pipefail

          PODHELPER="$FLUTTER_ROOT/packages/flutter_tools/bin/podhelper.rb"

          test -f "$PODHELPER"

          cp \
            "$PODHELPER" \
            flutter-podhelper.rb.original

          echo "============================================================"
          echo "FlutterMacOS podhelper before patch"
          echo "============================================================"

          grep -n \
            "s.osx.deployment_target" \
            "$PODHELPER" \
            || true

          python3 - "$PODHELPER" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          if "s.osx.deployment_target = '10.13'" not in text:
              text, count = re.subn(
                  r"s\.osx\.deployment_target\s*=\s*['\"]10\.15['\"]",
                  "s.osx.deployment_target = '10.13'",
                  text,
                  count=1,
              )

              if count != 1:
                  raise SystemExit(
                      "ERROR: Could not locate FlutterMacOS "
                      "10.15 deployment target in podhelper.rb."
                  )

              path.write_text(text)

          final = path.read_text()

          if "s.osx.deployment_target = '10.13'" not in final:
              raise SystemExit(
                  "ERROR: FlutterMacOS podspec generator "
                  "does not target 10.13."
              )

          print("FlutterMacOS podspec generator -> macOS 10.13")
          PY

          echo
          echo "============================================================"
          echo "FlutterMacOS podhelper after patch"
          echo "============================================================"

          grep -n \
            "s.osx.deployment_target" \
            "$PODHELPER"


      # ============================================================
      # Environment
      # ============================================================

      - name: Show build environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Flutter"
          echo "============================================================"
          flutter --version

          echo
          echo "============================================================"
          echo "Dart"
          echo "============================================================"
          dart --version

          echo
          echo "============================================================"
          echo "Rust"
          echo "============================================================"
          rustc --version
          cargo --version
          rustup show

          echo
          echo "============================================================"
          echo "Xcode"
          echo "============================================================"
          xcodebuild -version

          echo
          echo "============================================================"
          echo "Ruby / CocoaPods"
          echo "============================================================"
          ruby --version
          which pod
          pod --version

          echo
          echo "============================================================"
          echo "Runner"
          echo "============================================================"
          sw_vers
          uname -a
          uname -m

          echo
          echo "Target macOS: ${LEGACY_MACOS_TARGET}"
          echo "Architecture: x86_64"


      # ============================================================
      # Remove StoreKit / IAP
      #
      # LocalSend upstream marks in_app_purchase with [FOSS_REMOVE].
      # Current StoreKit implementation needs newer macOS APIs.
      # ============================================================

      - name: Remove in-app purchases for High Sierra
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          pubspec = Path("app/pubspec.yaml")
          lines = pubspec.read_text().splitlines()

          foss_lines = [
              line
              for line in lines
              if "# [FOSS_REMOVE]" in line
          ]

          if not foss_lines:
              raise SystemExit(
                  "ERROR: No # [FOSS_REMOVE] dependency "
                  "found in app/pubspec.yaml."
              )

          print("Removing FOSS-marked dependencies:")

          for line in foss_lines:
              print("  " + line.strip())

          pubspec.write_text(
              "\n".join(
                  line
                  for line in lines
                  if "# [FOSS_REMOVE]" not in line
              )
              + "\n"
          )

          files = [
              Path("app/lib/config/init.dart"),
              Path(
                  "app/lib/pages/donation/"
                  "donation_page.dart"
              ),
              Path(
                  "app/lib/pages/donation/"
                  "donation_page_vm.dart"
              ),
          ]

          for path in files:
              text = path.read_text()

              if "// [FOSS_REMOVE_START]" not in text:
                  raise SystemExit(
                      f"ERROR: Missing FOSS_REMOVE_START in {path}"
                  )

              if "// [FOSS_REMOVE_END]" not in text:
                  raise SystemExit(
                      f"ERROR: Missing FOSS_REMOVE_END in {path}"
                  )

              text = text.replace(
                  "// [FOSS_REMOVE_START]",
                  "/*",
              )

              text = text.replace(
                  "// [FOSS_REMOVE_END]",
                  "*/",
              )

              path.write_text(text)

          provider = Path(
              "app/lib/provider/purchase_provider.dart"
          )

          if not provider.exists():
              raise SystemExit(
                  "ERROR: purchase_provider.dart not found."
              )

          provider.unlink()

          donation_page = Path(
              "app/lib/pages/donation/donation_page.dart"
          )

          text = donation_page.read_text()

          text = text.replace(
              "donationPageVmProvider",
              "donationPageNoopVmProvider",
          )

          donation_page.write_text(text)

          if "in_app_purchase:" in pubspec.read_text():
              raise SystemExit(
                  "ERROR: in_app_purchase remains in pubspec."
              )

          print("StoreKit / in-app purchase removed.")
          PY

          rm -f \
            app/macos/Podfile.lock


      # ============================================================
      # Flutter dependencies
      # ============================================================

      - name: Clean Flutter build
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail
          flutter clean

      - name: Flutter pub get
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail
          flutter pub get


      # ============================================================
      # Verify StoreKit is really gone
      # ============================================================

      - name: Verify in-app purchase plugin is gone
        shell: bash
        run: |
          set -euxo pipefail

          cd app

          flutter pub deps \
            --style=compact \
            > ../flutter-pub-deps.txt

          cd ..

          if grep -E \
            '(^|[[:space:]])in_app_purchase(_storekit)?([[:space:]]|$)' \
            flutter-pub-deps.txt; then

            echo "ERROR:"
            echo "in_app_purchase remains in dependency graph."

            exit 1
          fi

          if [ -f app/.flutter-plugins-dependencies ]; then

            if grep -q \
              'in_app_purchase_storekit' \
              app/.flutter-plugins-dependencies; then

              echo "ERROR:"
              echo "in_app_purchase_storekit remains in plugin graph."

              exit 1
            fi

          fi

          echo "StoreKit plugin is absent."


      # ============================================================
      # Lower every actual CocoaPods-backed Flutter macOS plugin
      # declaration to macOS 10.13.
      #
      # This only bypasses podspec declaration gates.
      # Real API compatibility is handled separately below.
      # ============================================================

      - name: Backport macOS Flutter plugin podspecs
        shell: bash
        run: |
          set -euxo pipefail

          PLUGINS_FILE="app/.flutter-plugins-dependencies"

          test -f "$PLUGINS_FILE"

          mkdir -p diagnostics

          cp \
            "$PLUGINS_FILE" \
            diagnostics/flutter-plugins-dependencies.json

          python3 <<'PY'
          import json
          import re
          import shutil
          from pathlib import Path

          plugins_file = Path(
              "app/.flutter-plugins-dependencies"
          )

          data = json.loads(
              plugins_file.read_text()
          )

          plugins = (
              data
              .get("plugins", {})
              .get("macos", [])
          )

          report = []

          for plugin in plugins:
              name = plugin.get("name")
              raw_path = plugin.get("path")

              if not name or not raw_path:
                  continue

              if not plugin.get("native_build", True):
                  continue

              platform_dir = (
                  "darwin"
                  if plugin.get(
                      "shared_darwin_source",
                      False,
                  )
                  else "macos"
              )

              podspec = (
                  Path(raw_path)
                  / platform_dir
                  / f"{name}.podspec"
              )

              if not podspec.exists():
                  report.append({
                      "plugin": name,
                      "podspec": None,
                      "status": "no podspec",
                  })
                  continue

              original = podspec.read_text()
              text = original

              text = re.sub(
                  r"("
                  r"[A-Za-z_][A-Za-z0-9_]*"
                  r"\.osx\.deployment_target"
                  r"\s*=\s*"
                  r")"
                  r"(['\"])"
                  r"[0-9.]+"
                  r"\2",
                  r"\1'10.13'",
                  text,
              )

              text = re.sub(
                  r"("
                  r"[A-Za-z_][A-Za-z0-9_]*"
                  r"\.platform"
                  r"\s*=\s*"
                  r":osx"
                  r"\s*,\s*"
                  r")"
                  r"(['\"])"
                  r"[0-9.]+"
                  r"\2",
                  r"\1'10.13'",
                  text,
              )

              if text != original:
                  backup = podspec.with_suffix(
                      podspec.suffix
                      + ".high-sierra-original"
                  )

                  if not backup.exists():
                      shutil.copy2(
                          podspec,
                          backup,
                      )

                  podspec.write_text(text)

                  status = "patched"
              else:
                  status = "unchanged"

              report.append({
                  "plugin": name,
                  "podspec": str(podspec),
                  "status": status,
              })

              print(
                  f"{name}: {status}: {podspec}"
              )

          Path(
              "diagnostics/"
              "plugin-podspec-backport-report.json"
          ).write_text(
              json.dumps(
                  report,
                  indent=2,
              )
              + "\n"
          )
          PY


      # ============================================================
      # gal 2.3.3
      #
      # Remove PhotoKit implementation on High Sierra.
      # ============================================================

      - name: Backport gal for High Sierra
        shell: bash
        run: |
          set -euxo pipefail

          PUB_CACHE_ROOT="${PUB_CACHE:-$HOME/.pub-cache}"

          GAL_SWIFT="$(
            find "$PUB_CACHE_ROOT" \
              -type f \
              -path '*/gal-2.3.3/darwin/gal/Sources/gal/GalPlugin.swift' \
              -print \
              -quit
          )"

          if [ -z "$GAL_SWIFT" ]; then
            echo "ERROR: GalPlugin.swift not found."
            exit 1
          fi

          cp \
            "$GAL_SWIFT" \
            "${GAL_SWIFT}.original"

          cat > "$GAL_SWIFT" <<'SWIFT'
          import Cocoa
          import FlutterMacOS

          public class GalPlugin: NSObject, FlutterPlugin {

            public static func register(
              with registrar: FlutterPluginRegistrar
            ) {
              let channel = FlutterMethodChannel(
                name: "gal",
                binaryMessenger: registrar.messenger
              )

              let instance = GalPlugin()

              registrar.addMethodCallDelegate(
                instance,
                channel: channel
              )
            }

            public func handle(
              _ call: FlutterMethodCall,
              result: @escaping FlutterResult
            ) {
              switch call.method {

              case "hasAccess":
                result(false)

              case "requestAccess":
                result(false)

              case "putVideo",
                   "putImage",
                   "putImageBytes":

                result(
                  FlutterError(
                    code: "ACCESS_DENIED",
                    message:
                      "Direct Photos-library saving is unavailable "
                      + "in the macOS High Sierra build.",
                    details: nil
                  )
                )

              case "open":

                if let url = URL(string: "photos://") {
                  _ = NSWorkspace.shared.open(url)
                }

                result(nil)

              default:
                result(FlutterMethodNotImplemented)
              }
            }
          }
          SWIFT

          if grep -E \
            'import Photos|PHPhotoLibrary|PHAsset|PHFetch' \
            "$GAL_SWIFT"; then

            echo "ERROR: PhotoKit remains in GalPlugin.swift."
            exit 1
          fi

          echo "gal High Sierra shim installed."


      # ============================================================
      # connectivity_plus 7.3.1 High Sierra backport
      #
      # Upstream:
      #
      #   import Network
      #   NWPathMonitor
      #
      # Network.framework / NWPathMonitor requires macOS 10.14.
      #
      # Replacement:
      #
      #   SystemConfiguration -> reachability
      #   CoreWLAN            -> Wi-Fi interface names
      #   getifaddrs          -> active BSD network interfaces
      #   Dispatch timer      -> connectivity change stream
      #
      # Flutter MethodChannel/EventChannel API is unchanged.
      # ============================================================

      - name: Backport connectivity_plus for High Sierra
        shell: bash
        run: |
          set -euxo pipefail

          PLUGINS_FILE="app/.flutter-plugins-dependencies"

          test -f "$PLUGINS_FILE"

          CONNECTIVITY_ROOT="$(
            python3 <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path(
                  "app/.flutter-plugins-dependencies"
              ).read_text()
          )

          for plugin in (
              data
              .get("plugins", {})
              .get("macos", [])
          ):
              if plugin.get("name") == "connectivity_plus":
                  print(plugin["path"])
                  break
          PY
          )"

          if [ -z "$CONNECTIVITY_ROOT" ]; then
            echo "ERROR:"
            echo "connectivity_plus is missing from the macOS plugin graph."

            exit 1
          fi

          CONNECTIVITY_SOURCE="$CONNECTIVITY_ROOT/macos/connectivity_plus/Sources/connectivity_plus"
          CONNECTIVITY_PROVIDER="$CONNECTIVITY_SOURCE/PathMonitorConnectivityProvider.swift"
          CONNECTIVITY_PODSPEC="$CONNECTIVITY_ROOT/macos/connectivity_plus.podspec"

          echo "============================================================"
          echo "connectivity_plus"
          echo "============================================================"

          echo "Root:"
          echo "$CONNECTIVITY_ROOT"

          echo
          echo "Provider:"
          echo "$CONNECTIVITY_PROVIDER"

          echo
          echo "Podspec:"
          echo "$CONNECTIVITY_PODSPEC"

          test -f "$CONNECTIVITY_PROVIDER"
          test -f "$CONNECTIVITY_PODSPEC"

          cp \
            "$CONNECTIVITY_PROVIDER" \
            "${CONNECTIVITY_PROVIDER}.high-sierra-original"

          cp \
            "$CONNECTIVITY_PODSPEC" \
            "${CONNECTIVITY_PODSPEC}.high-sierra-specific-original"


          # --------------------------------------------------------
          # Replace NWPathMonitor with a High Sierra provider.
          # --------------------------------------------------------

          cat > "$CONNECTIVITY_PROVIDER" <<'SWIFT'
          import Foundation
          import SystemConfiguration
          import CoreWLAN
          import Darwin

          /// High Sierra implementation of connectivity_plus.
          ///
          /// connectivity_plus 7.3.1 normally uses NWPathMonitor,
          /// which requires macOS 10.14 or newer.
          ///
          /// This implementation preserves the existing
          /// ConnectivityProvider interface and therefore keeps the
          /// current Flutter MethodChannel and EventChannel protocol.
          public class PathMonitorConnectivityProvider:
            NSObject,
            ConnectivityProvider
          {
            private let queue = DispatchQueue(
              label:
                "dev.fluttercommunity.plus.connectivity.high-sierra"
            )

            private var timer: DispatchSourceTimer?

            private var lastSignature = ""

            public var connectivityUpdateHandler:
              ConnectivityUpdateHandler?


            override init() {
              super.init()

              lastSignature = signature(
                for: detectConnectivityTypes()
              )
            }


            deinit {
              stop()
            }


            public var currentConnectivityTypes:
              [ConnectivityType]
            {
              return detectConnectivityTypes()
            }


            public func start() {
              if timer != nil {
                return
              }

              let source = DispatchSource.makeTimerSource(
                queue: queue
              )

              source.schedule(
                deadline: .now(),
                repeating: .seconds(2),
                leeway: .milliseconds(250)
              )

              source.setEventHandler { [weak self] in
                guard let self = self else {
                  return
                }

                let current =
                  self.detectConnectivityTypes()

                let currentSignature =
                  self.signature(
                    for: current
                  )

                if currentSignature != self.lastSignature {
                  self.lastSignature =
                    currentSignature

                  self.connectivityUpdateHandler?(
                    current
                  )
                }
              }

              timer = source
              source.resume()
            }


            public func stop() {
              guard let source = timer else {
                return
              }

              source.setEventHandler {}
              source.cancel()

              timer = nil
            }


            /// Returns connectivity types using APIs available on
            /// macOS High Sierra.
            ///
            /// Reachability determines whether the machine currently
            /// has a usable network route. Active BSD interfaces are
            /// then classified as Wi-Fi or Ethernet.
            private func detectConnectivityTypes()
              -> [ConnectivityType]
            {
              guard isReachable() else {
                return [.none]
              }

              let activeInterfaces =
                activeInterfaceNames()

              if activeInterfaces.isEmpty {
                return [.other]
              }

              let wifiInterfaces =
                wifiInterfaceNames()

              var result:
                [ConnectivityType] = []


              if activeInterfaces.contains(
                where: {
                  wifiInterfaces.contains($0)
                }
              ) {
                result.append(.wifi)
              }


              let hasEthernet =
                activeInterfaces.contains {
                  interfaceName in

                  interfaceName.hasPrefix("en")
                    && !wifiInterfaces.contains(
                      interfaceName
                    )
                }

              if hasEthernet {
                result.append(.wiredEthernet)
              }


              if result.isEmpty {
                result.append(.other)
              }

              return result
            }


            /// Uses SCNetworkReachability against the default IPv4
            /// route. This API predates High Sierra by many releases.
            private func isReachable() -> Bool {
              var zeroAddress =
                sockaddr_in()

              zeroAddress.sin_len =
                UInt8(
                  MemoryLayout<
                    sockaddr_in
                  >.size
                )

              zeroAddress.sin_family =
                sa_family_t(AF_INET)


              let reachability:
                SCNetworkReachability? =
                withUnsafePointer(
                  to: &zeroAddress
                ) {
                  pointer in

                  pointer.withMemoryRebound(
                    to: sockaddr.self,
                    capacity: 1
                  ) {
                    sockaddrPointer in

                    SCNetworkReachabilityCreateWithAddress(
                      nil,
                      sockaddrPointer
                    )
                  }
                }


              guard let target =
                reachability
              else {
                return false
              }


              var flags =
                SCNetworkReachabilityFlags()


              guard SCNetworkReachabilityGetFlags(
                target,
                &flags
              )
              else {
                return false
              }


              let reachable =
                flags.contains(
                  .reachable
                )

              let connectionRequired =
                flags.contains(
                  .connectionRequired
                )

              let interventionRequired =
                flags.contains(
                  .interventionRequired
                )


              return reachable
                && !connectionRequired
                && !interventionRequired
            }


            /// Returns currently active, non-loopback IPv4/IPv6
            /// interfaces using getifaddrs().
            private func activeInterfaceNames()
              -> Set<String>
            {
              var firstAddress:
                UnsafeMutablePointer<ifaddrs>?


              guard getifaddrs(
                &firstAddress
              ) == 0,
              let first = firstAddress
              else {
                return []
              }


              defer {
                freeifaddrs(
                  firstAddress
                )
              }


              var result =
                Set<String>()

              var pointer:
                UnsafeMutablePointer<ifaddrs>? =
                first


              while let current =
                pointer
              {
                let interface =
                  current.pointee


                if let address =
                  interface.ifa_addr
                {
                  let family =
                    Int32(
                      address
                        .pointee
                        .sa_family
                    )

                  let flags =
                    interface.ifa_flags

                  let isUp =
                    (
                      flags
                      & UInt32(IFF_UP)
                    ) != 0

                  let isRunning =
                    (
                      flags
                      & UInt32(IFF_RUNNING)
                    ) != 0

                  let isLoopback =
                    (
                      flags
                      & UInt32(IFF_LOOPBACK)
                    ) != 0


                  if (
                    family == AF_INET
                    || family == AF_INET6
                  )
                    && isUp
                    && isRunning
                    && !isLoopback
                  {
                    let name =
                      String(
                        cString:
                          interface.ifa_name
                      )

                    // awdl/llw are Apple peer-to-peer helper
                    // interfaces and aren't useful as the primary
                    // connectivity type here.
                    if !name.hasPrefix(
                      "awdl"
                    )
                      && !name.hasPrefix(
                        "llw"
                      )
                    {
                      result.insert(
                        name
                      )
                    }
                  }
                }


                pointer =
                  interface.ifa_next
              }


              return result
            }


            /// Ask CoreWLAN which BSD interface names are Wi-Fi.
            ///
            /// CWWiFiClient exists on High Sierra and avoids assuming
            /// that en0 is always Wi-Fi or always Ethernet.
            private func wifiInterfaceNames()
              -> Set<String>
            {
              let client =
                CWWiFiClient.shared()


              guard let interfaces =
                client.interfaces()
              else {
                return []
              }


              return Set(
                interfaces.compactMap {
                  $0.interfaceName
                }
              )
            }


            /// ConnectivityType itself doesn't declare Equatable in
            /// connectivity_plus 7.3.1, so create a stable textual
            /// signature for change detection.
            private func signature(
              for types:
                [ConnectivityType]
            ) -> String
            {
              return types
                .map {
                  type in

                  switch type {
                  case .none:
                    return "none"

                  case .wiredEthernet:
                    return "ethernet"

                  case .wifi:
                    return "wifi"

                  case .cellular:
                    return "cellular"

                  case .satellite:
                    return "satellite"

                  case .other:
                    return "other"
                  }
                }
                .sorted()
                .joined(
                  separator: ","
                )
            }
          }
          SWIFT


          # --------------------------------------------------------
          # Ensure CocoaPods links the two High Sierra frameworks.
          # --------------------------------------------------------

          python3 - "$CONNECTIVITY_PODSPEC" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          framework_line = (
              "  s.frameworks = "
              "'SystemConfiguration', 'CoreWLAN'\n"
          )

          if "SystemConfiguration" not in text:
              marker = (
                  "  s.swift_version = '5.0'\n"
              )

              if marker in text:
                  text = text.replace(
                      marker,
                      framework_line
                      + marker,
                      1,
                  )
              else:
                  index = text.rfind("\nend")

                  if index == -1:
                      raise SystemExit(
                          "ERROR: Could not patch "
                          "connectivity_plus podspec."
                      )

                  text = (
                      text[:index]
                      + "\n"
                      + framework_line
                      + text[index:]
                  )

          path.write_text(text)
          PY


          echo
          echo "============================================================"
          echo "Patched connectivity provider"
          echo "============================================================"

          cat "$CONNECTIVITY_PROVIDER"


          echo
          echo "============================================================"
          echo "Patched connectivity_plus podspec"
          echo "============================================================"

          cat "$CONNECTIVITY_PODSPEC"


          echo
          echo "============================================================"
          echo "Validate Network.framework is gone"
          echo "============================================================"

          if grep -E \
            'import Network|NWPath|NWPathMonitor' \
            "$CONNECTIVITY_PROVIDER"; then

            echo "ERROR:"
            echo "Network.framework API remains in connectivity provider."

            exit 1
          fi


          if ! grep -q \
            'import SystemConfiguration' \
            "$CONNECTIVITY_PROVIDER"; then

            echo "ERROR:"
            echo "SystemConfiguration provider was not installed."

            exit 1
          fi


          if ! grep -q \
            'SystemConfiguration' \
            "$CONNECTIVITY_PODSPEC"; then

            echo "ERROR:"
            echo "SystemConfiguration is not linked in the podspec."

            exit 1
          fi


          echo
          echo "connectivity_plus High Sierra provider installed."


      # ============================================================
      # Rust / Cargokit
      # ============================================================

      - name: Prepare Cargokit
        working-directory: packages/localsend_isolates/rust_builder/cargokit/build_tool
        shell: bash
        run: |
          set -euxo pipefail
          flutter pub get

      - name: Verify Rust workspace
        shell: bash
        run: |
          set -euxo pipefail

          test -f Cargo.toml
          test -f rust-toolchain.toml
          test -f packages/localsend_isolates/rust/Cargo.toml

          cargo metadata \
            --format-version=1 \
            --no-deps \
            > /tmp/cargo-metadata.json

          python3 <<'PY'
          import json

          with open(
              "/tmp/cargo-metadata.json",
              "r",
          ) as file:
              metadata = json.load(
                  file
              )

          print(
              "Rust workspace packages:"
          )

          for package in metadata["packages"]:
              print(
                  f"  {package['name']} "
                  f"{package['version']}"
              )

              print(
                  f"    "
                  f"{package['manifest_path']}"
              )
          PY


      # ============================================================
      # LocalSend Xcode project / Podfile
      # ============================================================

      - name: Patch LocalSend for High Sierra
        shell: bash
        run: |
          set -euxo pipefail

          PBX="app/macos/Runner.xcodeproj/project.pbxproj"
          PODFILE="app/macos/Podfile"
          RELEASE_XCCONFIG="app/macos/Runner/Configs/Release.xcconfig"
          APP_DELEGATE="app/macos/Runner/AppDelegate.swift"


          # --------------------------------------------------------
          # project.pbxproj
          # --------------------------------------------------------

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "app/macos/Runner.xcodeproj/project.pbxproj"
          )

          text = path.read_text()


          # Flutter migrates literal macOS 10.13 entries to 10.15.
          text, count = re.subn(
              r'MACOSX_DEPLOYMENT_TARGET'
              r'\s*=\s*'
              r'[0-9.]+;',
              'MACOSX_DEPLOYMENT_TARGET = '
              '"$(LOCALSEND_LEGACY_MACOS_TARGET)";',
              text,
          )

          if count == 0:
              raise SystemExit(
                  "ERROR: No deployment targets found in pbxproj."
              )


          # Force all project configurations to 10.13/x86_64.
          if (
              "LOCALSEND_LEGACY_MACOS_TARGET = 10.13;"
              not in text
          ):

              replacement = (
                  "buildSettings = {\n"
                  "\t\t\t\t"
                  "LOCALSEND_LEGACY_MACOS_TARGET = 10.13;\n"
                  "\t\t\t\t"
                  "ARCHS = x86_64;\n"
                  "\t\t\t\t"
                  "EXCLUDED_ARCHS = arm64;\n"
                  "\t\t\t\t"
                  "ONLY_ACTIVE_ARCH = YES;\n"
              )

              text = text.replace(
                  "buildSettings = {\n",
                  replacement,
              )


          # Remove upstream Apple signing.
          text = re.sub(
              r'DEVELOPMENT_TEAM'
              r'\s*=\s*'
              r'[A-Z0-9]+;',
              'DEVELOPMENT_TEAM = "";',
              text,
          )

          text = re.sub(
              r'CODE_SIGN_STYLE'
              r'\s*=\s*'
              r'Automatic;',
              'CODE_SIGN_STYLE = Manual;',
              text,
          )

          text = re.sub(
              r'CODE_SIGN_IDENTITY'
              r'\s*=\s*'
              r'"(?:'
              r'Apple Development|'
              r'Mac Development|'
              r'Mac Developer'
              r')";',
              'CODE_SIGN_IDENTITY = "-";',
              text,
          )

          text = re.sub(
              r'('
              r'"CODE_SIGN_IDENTITY\[sdk=macosx\*\]"'
              r'\s*=\s*'
              r')'
              r'"(?:'
              r'Apple Development|'
              r'Mac Development|'
              r'Mac Developer'
              r')";',
              r'\1"-";',
              text,
          )

          text = re.sub(
              r'PROVISIONING_PROFILE_SPECIFIER'
              r'\s*=\s*'
              r'"[^"]*";',
              'PROVISIONING_PROFILE_SPECIFIER = "";',
              text,
          )

          text = re.sub(
              r'PROVISIONING_PROFILE'
              r'\s*=\s*'
              r'"[^"]*";',
              'PROVISIONING_PROFILE = "";',
              text,
          )


          # DockProgress -> exact 3.2.0.
          dock_pattern = re.compile(
              r'('
              r'[0-9A-F]+'
              r'\s*/\*\s*'
              r'XCRemoteSwiftPackageReference '
              r'"DockProgress"'
              r'\s*\*/'
              r'\s*=\s*\{'
              r'.*?'
              r'repositoryURL'
              r'\s*=\s*'
              r'"https://github\.com/'
              r'sindresorhus/DockProgress";'
              r'\s*'
              r'requirement'
              r'\s*=\s*\{'
              r')'
              r'.*?'
              r'('
              r'\};'
              r'\s*'
              r'\};'
              r')',
              re.DOTALL,
          )

          match = dock_pattern.search(
              text
          )

          if not match:
              raise SystemExit(
                  "ERROR: DockProgress package block not found."
              )

          replacement = (
              match.group(1)
              + "\n"
              + "\t\t\t\tkind = exactVersion;\n"
              + "\t\t\t\tversion = 3.2.0;\n"
              + "\t\t\t"
              + match.group(2)
          )

          text = (
              text[:match.start()]
              + replacement
              + text[match.end():]
          )

          check = re.compile(
              r'repositoryURL'
              r'\s*=\s*'
              r'"https://github\.com/'
              r'sindresorhus/DockProgress";'
              r'.*?'
              r'kind\s*=\s*exactVersion;'
              r'.*?'
              r'version\s*=\s*3\.2\.0;',
              re.DOTALL,
          )

          if not check.search(text):
              raise SystemExit(
                  "ERROR: DockProgress 3.2.0 patch failed."
              )

          path.write_text(text)
          PY


          # --------------------------------------------------------
          # Actual Release xcconfig
          # --------------------------------------------------------

          cat >> "$RELEASE_XCCONFIG" <<'EOF'

          // ========================================================
          // LocalSend macOS High Sierra Backport
          // ========================================================

          LOCALSEND_LEGACY_MACOS_TARGET = 10.13
          MACOSX_DEPLOYMENT_TARGET = $(LOCALSEND_LEGACY_MACOS_TARGET)

          ARCHS = x86_64
          EXCLUDED_ARCHS = arm64
          ONLY_ACTIVE_ARCH = YES

          CODE_SIGN_IDENTITY = -
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM =

          EOF


          # --------------------------------------------------------
          # Podfile
          # --------------------------------------------------------

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "app/macos/Podfile"
          )

          text = path.read_text()


          # Indirect variable avoids Flutter's literal 10.13 migrator.
          text, count = re.subn(
              r"^platform"
              r"\s+:osx,"
              r"\s*['\"][0-9.]+['\"]",
              "legacy_macos_target = '10.13'\n"
              "platform :osx, legacy_macos_target",
              text,
              count=1,
              flags=re.MULTILINE,
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: Podfile platform patch failed."
              )


          text, count = re.subn(
              r"config\.build_settings"
              r"\[['\"]"
              r"MACOSX_DEPLOYMENT_TARGET"
              r"['\"]\]"
              r"\s*=\s*"
              r"['\"][0-9.]+['\"]",
              "config.build_settings"
              "['MACOSX_DEPLOYMENT_TARGET'] "
              "= legacy_macos_target",
              text,
          )

          if count == 0:
              raise SystemExit(
                  "ERROR: Pod deployment target patch failed."
              )


          needle = (
              "config.build_settings"
              "['MACOSX_DEPLOYMENT_TARGET'] "
              "= legacy_macos_target"
          )

          if (
              "config.build_settings"
              "['ARCHS'] = 'x86_64'"
              not in text
          ):

              replacement = (
                  needle
                  + "\n"
                  + "      "
                  + "config.build_settings"
                  + "['ARCHS'] = 'x86_64'"
                  + "\n"
                  + "      "
                  + "config.build_settings"
                  + "['EXCLUDED_ARCHS'] = 'arm64'"
                  + "\n"
                  + "      "
                  + "config.build_settings"
                  + "['ONLY_ACTIVE_ARCH'] = 'YES'"
              )

              text = text.replace(
                  needle,
                  replacement,
                  1,
              )


          # ShareExtension compiles Shared.swift which imports Defaults.
          if "target 'ShareExtension' do" not in text:

              share_target = """
          target 'ShareExtension' do
            use_frameworks!
            use_modular_headers!

            pod 'Defaults', '~> 4.2'
          end

          """

              text = text.replace(
                  "\npost_install do |installer|",
                  "\n"
                  + share_target
                  + "post_install do |installer|",
                  1,
              )

          if "target 'ShareExtension' do" not in text:
              raise SystemExit(
                  "ERROR: ShareExtension CocoaPods target missing."
              )

          path.write_text(text)
          PY


          # --------------------------------------------------------
          # Remove AppDelegate @MainActor.
          # --------------------------------------------------------

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "app/macos/Runner/AppDelegate.swift"
          )

          text = path.read_text()

          text = text.replace(
              "@MainActor private func handleFlutterCall",
              "private func handleFlutterCall",
          )

          path.write_text(text)
          PY


          # --------------------------------------------------------
          # Remove stale SwiftPM resolutions.
          # --------------------------------------------------------

          rm -f \
            app/macos/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved \
            app/macos/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved


          echo "============================================================"
          echo "Podfile after patch"
          echo "============================================================"

          cat "$PODFILE"

          echo
          echo "============================================================"
          echo "DockProgress after patch"
          echo "============================================================"

          grep -A12 -B2 \
            'XCRemoteSwiftPackageReference "DockProgress"' \
            "$PBX" \
            || true


      # ============================================================
      # Static validation
      # ============================================================

      - name: Validate High Sierra patch
        shell: bash
        run: |
          set -euxo pipefail

          PBX="app/macos/Runner.xcodeproj/project.pbxproj"
          PODFILE="app/macos/Podfile"
          PODHELPER="$FLUTTER_ROOT/packages/flutter_tools/bin/podhelper.rb"

          if grep -q \
            "3W7H4PYMCV" \
            "$PBX"; then

            echo "ERROR: Upstream Team ID remains."
            exit 1
          fi

          if grep -q \
            'MACOSX_DEPLOYMENT_TARGET = 10.13;' \
            "$PBX"; then

            echo "ERROR:"
            echo "Literal 10.13 remains in pbxproj."

            exit 1
          fi

          if grep -q \
            "platform :osx, '10.13'" \
            "$PODFILE"; then

            echo "ERROR:"
            echo "Literal Podfile target would trigger Flutter migration."

            exit 1
          fi

          if ! grep -q \
            "target 'ShareExtension' do" \
            "$PODFILE"; then

            echo "ERROR:"
            echo "ShareExtension Pod target missing."

            exit 1
          fi

          if grep -q \
            '^ *in_app_purchase:' \
            app/pubspec.yaml; then

            echo "ERROR:"
            echo "in_app_purchase returned."

            exit 1
          fi

          if ! grep -q \
            "s.osx.deployment_target = '10.13'" \
            "$PODHELPER"; then

            echo "ERROR:"
            echo "FlutterMacOS podhelper patch missing."

            exit 1
          fi

          ruby -c "$PODFILE"

          echo
          echo "Static validation passed."


      # ============================================================
      # First Flutter configuration pass
      #
      # Allow CocoaPods failure here so standalone pod install can
      # show its complete resolver error.
      # ============================================================

      - name: Generate Flutter macOS configuration - first pass
        id: flutter_config_first
        continue-on-error: true
        working-directory: app
        shell: bash
        run: |
          set -o pipefail

          flutter build macos \
            --release \
            --config-only \
            -v \
            2>&1 | tee ../flutter-config-first.log


      # ============================================================
      # Explicit CocoaPods install
      # ============================================================

      - name: Install CocoaPods dependencies explicitly
        working-directory: app/macos
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "First Flutter config outcome"
          echo "============================================================"

          echo "${{ steps.flutter_config_first.outcome }}"

          echo
          echo "============================================================"
          echo "Ruby / CocoaPods"
          echo "============================================================"

          ruby --version
          which pod
          pod --version

          echo
          echo "============================================================"
          echo "Podfile syntax"
          echo "============================================================"

          ruby -c Podfile


          GENERATED_XCCONFIG="Flutter/ephemeral/Flutter-Generated.xcconfig"

          if [ ! -f "$GENERATED_XCCONFIG" ]; then

            echo "ERROR:"
            echo "$GENERATED_XCCONFIG does not exist."

            exit 1
          fi


          echo
          echo "============================================================"
          echo "Flutter generated xcconfig"
          echo "============================================================"

          cat "$GENERATED_XCCONFIG"


          echo
          echo "============================================================"
          echo "CocoaPods environment"
          echo "============================================================"

          pod env \
            2>&1 | tee ../../pod-env.log


          rm -rf Pods
          rm -f Podfile.lock


          echo
          echo "============================================================"
          echo "pod install --verbose"
          echo "============================================================"

          set +e

          pod install \
            --verbose \
            2>&1 | tee ../../pod-install.log

          POD_STATUS="${PIPESTATUS[0]}"

          set -e


          echo
          echo "============================================================"
          echo "Generated FlutterMacOS.podspec"
          echo "============================================================"

          FLUTTER_MACOS_PODSPEC="Flutter/ephemeral/FlutterMacOS.podspec"

          if [ -f "$FLUTTER_MACOS_PODSPEC" ]; then
            cat "$FLUTTER_MACOS_PODSPEC"
          else
            echo "(not generated)"
          fi


          if [ "$POD_STATUS" -ne 0 ]; then

            echo
            echo "============================================================"
            echo "CocoaPods failure summary"
            echo "============================================================"

            grep -n -A15 -B5 \
              -E \
              '^\[!\]|higher minimum deployment target|could not find compatible versions|ERROR|Error' \
              ../../pod-install.log \
              | tail -n 300 \
              || true

            exit "$POD_STATUS"
          fi


          if [ ! -f "$FLUTTER_MACOS_PODSPEC" ]; then
            echo "ERROR: FlutterMacOS.podspec missing."
            exit 1
          fi

          if ! grep -q \
            "s.osx.deployment_target = '10.13'" \
            "$FLUTTER_MACOS_PODSPEC"; then

            echo "ERROR:"
            echo "FlutterMacOS.podspec does not target 10.13."

            exit 1
          fi

          echo
          echo "CocoaPods dependency resolution succeeded."


      # ============================================================
      # Final Flutter configuration pass
      # ============================================================

      - name: Finalize Flutter macOS configuration
        working-directory: app
        shell: bash
        run: |
          set -o pipefail

          flutter build macos \
            --release \
            --config-only \
            -v \
            2>&1 | tee ../flutter-config-final.log


      # ============================================================
      # Verify StoreKit and FlutterMacOS after regeneration
      # ============================================================

      - name: Verify generated native dependency graph
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          PODSPEC="macos/Flutter/ephemeral/FlutterMacOS.podspec"

          test -f "$PODSPEC"

          if ! grep -q \
            "s.osx.deployment_target = '10.13'" \
            "$PODSPEC"; then

            echo "ERROR:"
            echo "FlutterMacOS.podspec returned above 10.13."

            exit 1
          fi


          if [ -f macos/Podfile.lock ]; then

            if grep -q \
              'in_app_purchase_storekit' \
              macos/Podfile.lock; then

              echo "ERROR:"
              echo "StoreKit returned to Podfile.lock."

              exit 1
            fi

          fi


          REGISTRANT="$(
            find macos \
              -type f \
              -name 'GeneratedPluginRegistrant.swift' \
              -print \
              -quit
          )"

          if [ -n "$REGISTRANT" ]; then

            if grep -q \
              'in_app_purchase' \
              "$REGISTRANT"; then

              echo "ERROR:"
              echo "StoreKit remains in GeneratedPluginRegistrant."

              cat "$REGISTRANT"

              exit 1
            fi

          fi

          echo "Generated native dependency graph is correct."


      # ============================================================
      # Verify Flutter project migration bypass
      # ============================================================

      - name: Verify Flutter migration bypass
        shell: bash
        run: |
          set -euxo pipefail

          PBX="app/macos/Runner.xcodeproj/project.pbxproj"
          PODFILE="app/macos/Podfile"

          if grep -q \
            'MACOSX_DEPLOYMENT_TARGET = 10.15;' \
            "$PBX"; then

            echo "ERROR:"
            echo "Flutter restored pbxproj to 10.15."

            exit 1
          fi

          if grep -q \
            "platform :osx, '10.15'" \
            "$PODFILE"; then

            echo "ERROR:"
            echo "Flutter restored Podfile to 10.15."

            exit 1
          fi


      # ============================================================
      # CocoaPods integration
      # ============================================================

      - name: Verify CocoaPods integration
        working-directory: app/macos
        shell: bash
        run: |
          set -euxo pipefail

          find \
            "Pods/Target Support Files" \
            -maxdepth 1 \
            -type d \
            -print \
            | sort

          if [ ! -d \
            "Pods/Target Support Files/Pods-ShareExtension" ]; then

            echo "ERROR:"
            echo "Pods-ShareExtension missing."

            exit 1
          fi

          if find \
            "Pods/Target Support Files" \
            -iname '*in_app_purchase*' \
            -print \
            | grep -q .; then

            echo "ERROR:"
            echo "StoreKit Pod support files remain."

            exit 1
          fi


      # ============================================================
      # Swift Package Manager
      # ============================================================

      - name: Resolve Swift packages
        working-directory: app
        shell: bash
        run: |
          set -o pipefail

          mkdir -p \
            build/macos/SourcePackages

          xcodebuild \
            -resolvePackageDependencies \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -clonedSourcePackagesDirPath \
              build/macos/SourcePackages \
            2>&1 | tee ../swiftpm-resolve.log


          echo
          echo "============================================================"
          echo "SwiftPM checkouts"
          echo "============================================================"

          find \
            build/macos/SourcePackages \
            -maxdepth 3 \
            -type d \
            -print \
            | sort \
            | head -200 \
            || true


          DOCK_DIR="$(
            find \
              build/macos/SourcePackages/checkouts \
              -maxdepth 1 \
              -type d \
              -iname 'DockProgress' \
              -print \
              -quit
          )"

          if [ -n "$DOCK_DIR" ]; then

            echo
            echo "DockProgress tags at HEAD:"

            git \
              -C "$DOCK_DIR" \
              tag --points-at HEAD \
              || true

          fi


          echo
          echo "Package.resolved files:"

          find macos \
            -type f \
            -path '*/swiftpm/Package.resolved' \
            -print \
            -exec cat {} \; \
            || true


      # ============================================================
      # Effective Xcode settings
      # ============================================================

      - name: Verify effective Xcode build settings
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p ../diagnostics

          xcodebuild \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -showBuildSettings \
            > ../diagnostics/runner-build-settings.txt

          xcodebuild \
            -project macos/Runner.xcodeproj \
            -target ShareExtension \
            -configuration Release \
            -showBuildSettings \
            > ../diagnostics/shareextension-build-settings.txt


          echo "============================================================"
          echo "Runner settings"
          echo "============================================================"

          grep -E \
            'ARCHS|EXCLUDED_ARCHS|ONLY_ACTIVE_ARCH|MACOSX_DEPLOYMENT_TARGET|LOCALSEND_LEGACY_MACOS_TARGET' \
            ../diagnostics/runner-build-settings.txt \
            || true


          echo
          echo "============================================================"
          echo "ShareExtension settings"
          echo "============================================================"

          grep -E \
            'ARCHS|EXCLUDED_ARCHS|ONLY_ACTIVE_ARCH|MACOSX_DEPLOYMENT_TARGET|LOCALSEND_LEGACY_MACOS_TARGET' \
            ../diagnostics/shareextension-build-settings.txt \
            || true


          python3 <<'PY'
          from pathlib import Path
          import re

          files = [
              Path(
                  "../diagnostics/"
                  "runner-build-settings.txt"
              ),
              Path(
                  "../diagnostics/"
                  "shareextension-build-settings.txt"
              ),
          ]

          for path in files:
              text = path.read_text()

              deployments = re.findall(
                  r"^\s*MACOSX_DEPLOYMENT_TARGET"
                  r"\s*=\s*(.*?)\s*$",
                  text,
                  flags=re.MULTILINE,
              )

              archs = re.findall(
                  r"^\s*ARCHS"
                  r"\s*=\s*(.*?)\s*$",
                  text,
                  flags=re.MULTILINE,
              )

              excluded = re.findall(
                  r"^\s*EXCLUDED_ARCHS"
                  r"\s*=\s*(.*?)\s*$",
                  text,
                  flags=re.MULTILINE,
              )

              print()
              print(path)

              print(
                  "  deployment:",
                  deployments[:3],
              )

              print(
                  "  ARCHS:",
                  archs[:3],
              )

              print(
                  "  EXCLUDED_ARCHS:",
                  excluded[:3],
              )

              if not deployments:
                  raise SystemExit(
                      f"ERROR: {path}: deployment target missing."
                  )

              if deployments[0] != "10.13":
                  raise SystemExit(
                      f"ERROR: {path}: "
                      f"deployment target = {deployments[0]!r}"
                  )

              if not archs:
                  raise SystemExit(
                      f"ERROR: {path}: ARCHS missing."
                  )

              if "x86_64" not in archs[0].split():
                  raise SystemExit(
                      f"ERROR: {path}: x86_64 missing."
                  )

              if (
                  excluded
                  and "arm64"
                  not in excluded[0].split()
              ):
                  raise SystemExit(
                      f"ERROR: {path}: arm64 not excluded."
                  )

          print()
          print("Effective build settings are correct.")
          PY


      # ============================================================
      # Flutter Engine audit
      #
      # The fake FlutterMacOS podspec now says 10.13.
      # The actual prebuilt engine may still carry a newer Mach-O
      # deployment target. Record it now.
      # ============================================================

      - name: Inspect FlutterMacOS engine
        shell: bash
        run: |
          set -euxo pipefail

          flutter precache --macos

          mkdir -p diagnostics

          REPORT="diagnostics/flutter-engine-audit-prebuild.txt"

          : > "$REPORT"

          ENGINE_ROOT="$FLUTTER_ROOT/bin/cache/artifacts/engine"

          for ENGINE_DIR in \
            "$ENGINE_ROOT/darwin-x64" \
            "$ENGINE_ROOT/darwin-x64-release"
          do

            if [ ! -d "$ENGINE_DIR" ]; then

              echo "WARNING: Missing:"
              echo "$ENGINE_DIR"

              continue
            fi

            find "$ENGINE_DIR" \
              -type f \
              -print0 \
            | while IFS= read -r -d '' FILE; do

                if file "$FILE" \
                  | grep -q "Mach-O"; then

                  {
                    echo
                    echo "============================================================"
                    echo "$FILE"
                    echo "============================================================"

                    file "$FILE"

                    echo
                    echo "--- Architectures ---"

                    lipo \
                      -archs \
                      "$FILE" \
                      2>/dev/null \
                      || true

                    echo
                    echo "--- Deployment ---"

                    otool \
                      -l \
                      "$FILE" \
                    | awk '
                        /cmd LC_VERSION_MIN_MACOSX/ {
                          capture=1
                          count=0
                        }

                        /cmd LC_BUILD_VERSION/ {
                          capture=1
                          count=0
                        }

                        capture {
                          print
                          count++

                          if (count >= 10) {
                            capture=0
                          }
                        }
                      '

                    echo
                    echo "--- Linked libraries ---"

                    otool \
                      -L \
                      "$FILE" \
                      || true

                  } | tee -a "$REPORT"

                fi

              done

          done


      # ============================================================
      # Actual build
      # ============================================================

      - name: Build macOS app
        working-directory: app
        shell: bash
        env:
          ARCHS: x86_64
          EXCLUDED_ARCHS: arm64
        run: |
          set -o pipefail

          echo "============================================================"
          echo "Building LocalSend"
          echo
          echo "Target OS:          macOS High Sierra 10.13"
          echo "Architecture:       x86_64"
          echo "Flutter:            ${FLUTTER_VERSION}"
          echo "Rust:               ${RUST_VERSION}"
          echo "DockProgress:       3.2.0"
          echo "gal:                High Sierra shim"
          echo "StoreKit/IAP:       removed"
          echo "Plugin podspecs:    10.13"
          echo "connectivity_plus:  SystemConfiguration/CoreWLAN"
          echo "============================================================"

          flutter build macos \
            --release \
            -v \
            2>&1 | tee ../flutter-macos-build.log


      # ============================================================
      # Compiler diagnostics
      # ============================================================

      - name: Extract compiler errors
        if: failure()
        shell: bash
        run: |
          set +e

          mkdir -p diagnostics

          if [ -f flutter-macos-build.log ]; then

            python3 <<'PY'
          from pathlib import Path
          import re

          source = Path(
              "flutter-macos-build.log"
          )

          output = Path(
              "diagnostics/compiler-errors.txt"
          )

          lines = source.read_text(
              errors="replace"
          ).splitlines()

          pattern = re.compile(
              r"error:|"
              r"fatal error:|"
              r"is only available in macOS|"
              r"introduced in macOS|"
              r"requires macOS|"
              r"building for macOS|"
              r"\*\* BUILD FAILED \*\*|"
              r"The following build commands failed"
          )

          hits = [
              index
              for index, line in enumerate(lines)
              if pattern.search(line)
          ]

          ranges = []

          for index in hits:
              start = max(
                  0,
                  index - 12,
              )

              end = min(
                  len(lines),
                  index + 16,
              )

              if (
                  ranges
                  and start <= ranges[-1][1]
              ):
                  ranges[-1] = (
                      ranges[-1][0],
                      max(
                          ranges[-1][1],
                          end,
                      ),
                  )
              else:
                  ranges.append(
                      (start, end)
                  )

          output_lines = []

          for start, end in ranges:
              output_lines.append(
                  "=" * 80
              )

              for index in range(
                  start,
                  end,
              ):
                  output_lines.append(
                      f"{index + 1}: "
                      f"{lines[index]}"
                  )

          output.write_text(
              "\n".join(output_lines)
              + (
                  "\n"
                  if output_lines
                  else ""
              )
          )

          if output.exists():
              print(
                  output.read_text()
              )
          PY

          fi


      # ============================================================
      # Locate built app
      # ============================================================

      - name: Locate built application
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          APP="$(
            find \
              build/macos/Build/Products/Release \
              -maxdepth 1 \
              -type d \
              -name '*.app' \
              -print \
              -quit
          )"

          if [ -z "$APP" ]; then

            echo "ERROR:"
            echo "No .app bundle was produced."

            exit 1
          fi

          EXECUTABLE="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$APP/Contents/Info.plist"
          )"

          echo \
            "APP=$APP" \
            >> "$GITHUB_ENV"

          echo \
            "APP_EXECUTABLE=$EXECUTABLE" \
            >> "$GITHUB_ENV"

          echo "APP=$APP"
          echo "EXECUTABLE=$EXECUTABLE"


      # ============================================================
      # Main binary architecture
      # ============================================================

      - name: Verify x86_64 application
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          MAIN="$APP/Contents/MacOS/$APP_EXECUTABLE"

          file "$MAIN"

          lipo \
            -info \
            "$MAIN"

          ARCHES="$(
            lipo \
              -archs \
              "$MAIN"
          )"

          echo "Architectures: $ARCHES"

          if ! echo "$ARCHES" \
            | grep -qw x86_64; then

            echo "ERROR:"
            echo "Main executable lacks x86_64."

            exit 1
          fi

          if echo "$ARCHES" \
            | grep -qw arm64; then

            echo "ERROR:"
            echo "arm64 unexpectedly remains."

            exit 1
          fi


      # ============================================================
      # Audit all built Mach-O binaries
      # ============================================================

      - name: Audit Mach-O deployment targets
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p ../diagnostics

          REPORT="../diagnostics/macho-deployment-targets.txt"

          : > "$REPORT"

          find "$APP" \
            -type f \
            -print0 \
          | while IFS= read -r -d '' FILE; do

              if file "$FILE" \
                | grep -q "Mach-O"; then

                {
                  echo
                  echo "============================================================"
                  echo "$FILE"
                  echo "============================================================"

                  file "$FILE"

                  echo
                  echo "--- Architectures ---"

                  lipo \
                    -archs \
                    "$FILE" \
                    2>/dev/null \
                    || true

                  echo
                  echo "--- Deployment ---"

                  otool \
                    -l \
                    "$FILE" \
                  | awk '
                      /cmd LC_VERSION_MIN_MACOSX/ {
                        capture=1
                        count=0
                      }

                      /cmd LC_BUILD_VERSION/ {
                        capture=1
                        count=0
                      }

                      capture {
                        print
                        count++

                        if (count >= 10) {
                          capture=0
                        }
                      }
                    '

                  echo
                  echo "--- Linked libraries ---"

                  otool \
                    -L \
                    "$FILE" \
                    || true

                } | tee -a "$REPORT"

              fi

            done


      # ============================================================
      # Signatures
      # ============================================================

      - name: Inspect code signatures
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p ../diagnostics

          REPORT="../diagnostics/codesign-report.txt"

          {
            echo "============================================================"
            echo "Main application"
            echo "============================================================"

            codesign \
              -dvvv \
              "$APP" \
              2>&1 \
              || true

            echo
            echo "============================================================"
            echo "Main entitlements"
            echo "============================================================"

            codesign \
              -d \
              --entitlements :- \
              "$APP" \
              2>&1 \
              || true

            echo
            echo "============================================================"
            echo "Extensions"
            echo "============================================================"

            find "$APP" \
              -type d \
              -name '*.appex' \
              -print \
            | while read -r EXTENSION; do

                echo
                echo "------------------------------------------------------------"
                echo "$EXTENSION"
                echo "------------------------------------------------------------"

                codesign \
                  -dvvv \
                  "$EXTENSION" \
                  2>&1 \
                  || true

                codesign \
                  -d \
                  --entitlements :- \
                  "$EXTENSION" \
                  2>&1 \
                  || true

              done

          } | tee "$REPORT"

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=4 \
            "$APP"


      # ============================================================
      # Package
      # ============================================================

      - name: Package High Sierra build
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p release

          OUTPUT="release/LocalSend-macOS-High-Sierra-10.13-x86_64.zip"

          rm -f "$OUTPUT"

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$APP" \
            "$OUTPUT"

          ls -lh "$OUTPUT"


      # ============================================================
      # Successful build artifact
      # ============================================================

      - name: Upload High Sierra build
        uses: actions/upload-artifact@v4
        with:
          name: LocalSend-macOS-High-Sierra-10.13-x86_64
          path: app/release/LocalSend-macOS-High-Sierra-10.13-x86_64.zip
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # Diagnostics — always
      # ============================================================

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p diagnostics


          cp \
            app/macos/Runner.xcodeproj/project.pbxproj \
            diagnostics/project.pbxproj.after-patch \
            2>/dev/null

          cp \
            app/macos/Podfile \
            diagnostics/Podfile.after-patch \
            2>/dev/null

          cp \
            app/macos/Podfile.lock \
            diagnostics/Podfile.lock.after-patch \
            2>/dev/null

          cp \
            app/pubspec.yaml \
            diagnostics/pubspec.yaml.after-foss-strip \
            2>/dev/null

          cp \
            app/.flutter-plugins-dependencies \
            diagnostics/flutter-plugins-dependencies.json \
            2>/dev/null

          cp \
            app/macos/Runner/Configs/Release.xcconfig \
            diagnostics/Release.xcconfig.after-patch \
            2>/dev/null

          cp \
            flutter-config-first.log \
            diagnostics/flutter-config-first.log \
            2>/dev/null

          cp \
            flutter-config-final.log \
            diagnostics/flutter-config-final.log \
            2>/dev/null

          cp \
            pod-install.log \
            diagnostics/pod-install.log \
            2>/dev/null

          cp \
            pod-env.log \
            diagnostics/pod-env.log \
            2>/dev/null

          cp \
            swiftpm-resolve.log \
            diagnostics/swiftpm-resolve.log \
            2>/dev/null

          cp \
            flutter-macos-build.log \
            diagnostics/flutter-macos-build.log \
            2>/dev/null

          cp \
            flutter-pub-deps.txt \
            diagnostics/flutter-pub-deps.txt \
            2>/dev/null

          cp \
            flutter-podhelper.rb.original \
            diagnostics/flutter-podhelper.rb.original \
            2>/dev/null

          cp \
            "$FLUTTER_ROOT/packages/flutter_tools/bin/podhelper.rb" \
            diagnostics/flutter-podhelper.rb.after-patch \
            2>/dev/null

          cp \
            app/macos/Flutter/ephemeral/FlutterMacOS.podspec \
            diagnostics/FlutterMacOS.podspec.generated \
            2>/dev/null

          cp \
            app/macos/Flutter/ephemeral/Flutter-Generated.xcconfig \
            diagnostics/Flutter-Generated.xcconfig \
            2>/dev/null


          # --------------------------------------------------------
          # SwiftPM resolutions
          # --------------------------------------------------------

          python3 <<'PY'
          from pathlib import Path
          import shutil

          source = Path(
              "app/macos"
          )

          destination = Path(
              "diagnostics"
          )

          destination.mkdir(
              parents=True,
              exist_ok=True,
          )

          files = sorted(
              path
              for path in source.rglob(
                  "Package.resolved"
              )
              if path.parent.name == "swiftpm"
          )

          for index, path in enumerate(
              files,
              start=1,
          ):
              relative = path.relative_to(
                  source
              )

              safe_name = (
                  str(relative)
                  .replace("/", "__")
                  .replace(" ", "_")
              )

              output = destination / (
                  f"Package.resolved."
                  f"{index}__"
                  f"{safe_name}"
              )

              shutil.copy2(
                  path,
                  output,
              )
          PY


          # --------------------------------------------------------
          # Collect patched plugin podspecs
          # --------------------------------------------------------

          python3 <<'PY'
          import json
          import shutil
          from pathlib import Path

          plugins_file = Path(
              "app/.flutter-plugins-dependencies"
          )

          destination = Path(
              "diagnostics/plugin-podspecs"
          )

          destination.mkdir(
              parents=True,
              exist_ok=True,
          )

          if plugins_file.exists():

              data = json.loads(
                  plugins_file.read_text()
              )

              for plugin in (
                  data
                  .get("plugins", {})
                  .get("macos", [])
              ):
                  name = plugin.get("name")
                  raw_path = plugin.get("path")

                  if not name or not raw_path:
                      continue

                  platform_dir = (
                      "darwin"
                      if plugin.get(
                          "shared_darwin_source",
                          False,
                      )
                      else "macos"
                  )

                  podspec = (
                      Path(raw_path)
                      / platform_dir
                      / f"{name}.podspec"
                  )

                  if podspec.exists():
                      shutil.copy2(
                          podspec,
                          destination
                          / f"{name}.podspec.after-patch",
                      )

                  backup = podspec.with_suffix(
                      podspec.suffix
                      + ".high-sierra-original"
                  )

                  if backup.exists():
                      shutil.copy2(
                          backup,
                          destination
                          / f"{name}.podspec.original",
                      )
          PY


          # --------------------------------------------------------
          # connectivity_plus sources
          # --------------------------------------------------------

          CONNECTIVITY_ROOT="$(
            python3 <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "app/.flutter-plugins-dependencies"
          )

          if path.exists():
              data = json.loads(
                  path.read_text()
              )

              for plugin in (
                  data
                  .get("plugins", {})
                  .get("macos", [])
              ):
                  if plugin.get("name") == "connectivity_plus":
                      print(
                          plugin.get(
                              "path",
                              "",
                          )
                      )
                      break
          PY
          )"

          if [ -n "$CONNECTIVITY_ROOT" ]; then

            CONNECTIVITY_PROVIDER="$CONNECTIVITY_ROOT/macos/connectivity_plus/Sources/connectivity_plus/PathMonitorConnectivityProvider.swift"

            CONNECTIVITY_PODSPEC="$CONNECTIVITY_ROOT/macos/connectivity_plus.podspec"

            cp \
              "$CONNECTIVITY_PROVIDER" \
              diagnostics/ConnectivityProvider.high-sierra.swift \
              2>/dev/null

            cp \
              "${CONNECTIVITY_PROVIDER}.high-sierra-original" \
              diagnostics/ConnectivityProvider.original.swift \
              2>/dev/null

            cp \
              "$CONNECTIVITY_PODSPEC" \
              diagnostics/connectivity_plus.podspec.after-patch \
              2>/dev/null

            cp \
              "${CONNECTIVITY_PODSPEC}.high-sierra-specific-original" \
              diagnostics/connectivity_plus.podspec.before-specific-patch \
              2>/dev/null

          fi


          # --------------------------------------------------------
          # gal source
          # --------------------------------------------------------

          PUB_CACHE_ROOT="${PUB_CACHE:-$HOME/.pub-cache}"

          GAL_SWIFT="$(
            find "$PUB_CACHE_ROOT" \
              -type f \
              -path '*/gal-2.3.3/darwin/gal/Sources/gal/GalPlugin.swift' \
              -print \
              -quit
          )"

          if [ -n "$GAL_SWIFT" ]; then

            cp \
              "$GAL_SWIFT" \
              diagnostics/GalPlugin.swift.after-patch \
              2>/dev/null

            cp \
              "${GAL_SWIFT}.original" \
              diagnostics/GalPlugin.swift.original \
              2>/dev/null

          fi


      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LocalSend-High-Sierra-build-diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30
