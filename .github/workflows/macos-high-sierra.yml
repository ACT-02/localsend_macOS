              echo "$ENGINE_DIR"

              continue
            fi


            find "$ENGINE_DIR" \
              -type f \
              -print0 \
            | while IFS= read -r -d '' FILE; do

                if file "$FILE" \
                  | grep -q "Mach-O"; then

