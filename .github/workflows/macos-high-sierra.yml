          otool \
            -l \
            "$FLUTTER_BINARY" \
          | awk '
              /cmd LC_VERSION_MIN_MACOSX/ {
                show=1
                count=0
              }

              /cmd LC_BUILD_VERSION/ {
                show=1
                count=0
              }

              show {
                print
                count++

                if (count >= 10) {
                  show=0
                }
              }
            '


      # ============================================================
      # Final signature audit
      # ============================================================

      - name: Inspect final code signatures
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          {
