          fi


      # ============================================================
      # Verify StoreKit stayed removed
      # ============================================================

      - name: Verify StoreKit plugin stayed removed
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail


          if [ -f macos/Podfile.lock ]; then

            if grep -q \
