                  flags=re.DOTALL,
              ):
                  missing.append(
                      name
                  )


          if missing:

              print(
                  "ERROR: ShareExtension "
                  "High Sierra patch incomplete:"
              )

              for name in missing:
                  print(
                      f"  missing {name}"
                  )

              raise SystemExit(
                  1
              )


          print(
              "PASS: ShareExtension High Sierra "
              "source validation passed."
          )
          PY


