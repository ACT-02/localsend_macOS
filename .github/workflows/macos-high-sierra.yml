          if [ -f "$FLUTTER_MACOS_PODSPEC" ]; then

            cat "$FLUTTER_MACOS_PODSPEC"

          else

            echo "(not generated)"

          fi


          if [ "$POD_STATUS" -ne 0 ]; then

            echo
            echo "============================================================"
            echo "CocoaPods failure summary"
            echo "============================================================"

            grep -n -A15 -B5 \
              -E \
              '^\[!\]|higher minimum deployment target|could not find compatible versions|ERROR|Error' \
              ../../pod-install.log \
              | tail -n 300 \
              || true

            exit "$POD_STATUS"
          fi


          if [ ! -f "$FLUTTER_MACOS_PODSPEC" ]; then

            echo "ERROR:"
            echo "FlutterMacOS.podspec missing."

            exit 1
          fi


          if ! grep -q \
            "s.osx.deployment_target = '10.13'" \
            "$FLUTTER_MACOS_PODSPEC"; then

            echo "ERROR:"
            echo "FlutterMacOS.podspec "
            echo "does not target 10.13."

            exit 1
          fi


          echo
          echo "CocoaPods dependency resolution succeeded."


      # ============================================================
      # Final Flutter config pass
      # ============================================================

      - name: Finalize Flutter macOS configuration
        working-directory: app
        shell: bash
        run: |
          set -o pipefail

          flutter build macos \
            --release \
            --config-only \
            -v \
            2>&1 | tee ../flutter-config-final.log


      # ============================================================
      # Native graph validation
      # ============================================================

      - name: Verify generated native dependency graph
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          PODSPEC="macos/Flutter/ephemeral/FlutterMacOS.podspec"

          test -f \
            "$PODSPEC"


          if ! grep -q \
            "s.osx.deployment_target = '10.13'" \
            "$PODSPEC"; then

            echo "ERROR:"
            echo "FlutterMacOS.podspec returned above 10.13."

            exit 1
          fi


          if [ -f macos/Podfile.lock ]; then

            if grep -q \
