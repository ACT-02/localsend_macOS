          )"


          if [ "$ARCHES" != "x86_64" ]; then

            echo "ERROR:"
            echo "ShareExtension is not x86_64-only:"
            echo "$ARCHES"

            exit 1
          fi


      # ============================================================
      # Re-sign outer LocalSend.app LAST.
      #
      # Engine, Info.plist and login helper were modified above.
      # ============================================================

      - name: Re-sign LocalSend application
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          ENTITLEMENTS="../diagnostics/LocalSend.entitlements.original.plist"


          test -f \
            "$ENTITLEMENTS"


