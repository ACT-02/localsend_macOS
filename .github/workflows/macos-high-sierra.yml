name: LocalSend macOS High Sierra Backport

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.9"
  RUST_VERSION: "1.97.1"
  LEGACY_MACOS_TARGET: "10.13"
  MACOSX_DEPLOYMENT_TARGET: "10.13"

jobs:
  build:
    name: Build LocalSend for macOS High Sierra
    runs-on: macos-15-intel

    steps:
      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive


      # ============================================================
      # Toolchains
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy


      # ============================================================
      # FlutterMacOS fake podspec
      # ============================================================

      - name: Backport FlutterMacOS podspec generator
        shell: bash
        run: |
          set -euxo pipefail

          PODHELPER="$FLUTTER_ROOT/packages/flutter_tools/bin/podhelper.rb"

          test -f "$PODHELPER"

          cp \
            "$PODHELPER" \
            flutter-podhelper.rb.original

          echo "============================================================"
          echo "FlutterMacOS podhelper before patch"
          echo "============================================================"

          grep -n \
            "s.osx.deployment_target" \
            "$PODHELPER" \
            || true

          python3 - "$PODHELPER" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          if "s.osx.deployment_target = '10.13'" not in text:
              text, count = re.subn(
                  r"s\.osx\.deployment_target\s*=\s*['\"]10\.15['\"]",
                  "s.osx.deployment_target = '10.13'",
                  text,
                  count=1,
              )

              if count != 1:
                  raise SystemExit(
                      "ERROR: Could not find FlutterMacOS "
                      "10.15 deployment target in podhelper.rb."
                  )

              path.write_text(text)

          final = path.read_text()

          if "s.osx.deployment_target = '10.13'" not in final:
              raise SystemExit(
                  "ERROR: FlutterMacOS podspec generator "
                  "does not target 10.13."
              )

          print(
              "FlutterMacOS podspec generator patched to 10.13."
          )
          PY

          echo
          echo "============================================================"
          echo "FlutterMacOS podhelper after patch"
          echo "============================================================"

          grep -n \
            "s.osx.deployment_target" \
            "$PODHELPER"


      # ============================================================
      # Environment
      # ============================================================

      - name: Show build environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Flutter"
          echo "============================================================"
          flutter --version

          echo
          echo "============================================================"
          echo "Dart"
          echo "============================================================"
          dart --version

          echo
          echo "============================================================"
          echo "Rust"
          echo "============================================================"
          rustc --version
          cargo --version
          rustup show

          echo
          echo "============================================================"
          echo "Xcode"
          echo "============================================================"
          xcodebuild -version

          echo
          echo "============================================================"
          echo "Ruby / CocoaPods"
          echo "============================================================"
          ruby --version
          which pod
          pod --version

          echo
          echo "============================================================"
          echo "Runner"
          echo "============================================================"
          sw_vers
          uname -a
          uname -m

          echo
          echo "Target macOS: ${LEGACY_MACOS_TARGET}"
          echo "Architecture: x86_64"


      # ============================================================
      # Remove StoreKit / IAP
      # ============================================================

      - name: Remove in-app purchases for High Sierra
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          pubspec = Path("app/pubspec.yaml")
          lines = pubspec.read_text().splitlines()

          foss_lines = [
              line
              for line in lines
              if "# [FOSS_REMOVE]" in line
          ]

          if not foss_lines:
              raise SystemExit(
                  "ERROR: No # [FOSS_REMOVE] dependency "
                  "found in app/pubspec.yaml."
              )

          print("Removing FOSS-marked dependencies:")

          for line in foss_lines:
              print("  " + line.strip())

          pubspec.write_text(
              "\n".join(
                  line
                  for line in lines
                  if "# [FOSS_REMOVE]" not in line
              )
              + "\n"
          )

          dart_files = [
              Path(
                  "app/lib/config/init.dart"
              ),
              Path(
                  "app/lib/pages/donation/"
                  "donation_page.dart"
              ),
              Path(
                  "app/lib/pages/donation/"
                  "donation_page_vm.dart"
              ),
          ]

          for path in dart_files:
              text = path.read_text()

              if "// [FOSS_REMOVE_START]" not in text:
                  raise SystemExit(
                      f"ERROR: Missing FOSS_REMOVE_START: {path}"
                  )

              if "// [FOSS_REMOVE_END]" not in text:
                  raise SystemExit(
                      f"ERROR: Missing FOSS_REMOVE_END: {path}"
                  )

              text = text.replace(
                  "// [FOSS_REMOVE_START]",
                  "/*",
              )

              text = text.replace(
                  "// [FOSS_REMOVE_END]",
                  "*/",
              )

              path.write_text(text)

          purchase_provider = Path(
              "app/lib/provider/purchase_provider.dart"
          )

          if not purchase_provider.exists():
              raise SystemExit(
                  "ERROR: purchase_provider.dart not found."
              )

          purchase_provider.unlink()

          donation_page = Path(
              "app/lib/pages/donation/donation_page.dart"
          )

          text = donation_page.read_text()

          text = text.replace(
              "donationPageVmProvider",
              "donationPageNoopVmProvider",
          )

          donation_page.write_text(text)

          if "in_app_purchase:" in pubspec.read_text():
              raise SystemExit(
                  "ERROR: in_app_purchase remains in pubspec.yaml."
              )

          print(
              "StoreKit / in-app purchase removed."
          )
          PY

          rm -f \
            app/macos/Podfile.lock


      # ============================================================
      # Flutter dependencies
      # ============================================================

      - name: Clean Flutter build
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail
          flutter clean

      - name: Flutter pub get
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail
          flutter pub get


      # ============================================================
      # Verify StoreKit removal
      # ============================================================

      - name: Verify in-app purchase plugin is gone
        shell: bash
        run: |
          set -euxo pipefail

          cd app

          flutter pub deps \
            --style=compact \
            > ../flutter-pub-deps.txt

          cd ..

          if grep -E \
            '(^|[[:space:]])in_app_purchase(_storekit)?([[:space:]]|$)' \
            flutter-pub-deps.txt; then

            echo "ERROR:"
            echo "in_app_purchase remains in dependency graph."

            exit 1
          fi

          if [ -f app/.flutter-plugins-dependencies ]; then

            if grep -q \
              'in_app_purchase_storekit' \
              app/.flutter-plugins-dependencies; then

              echo "ERROR:"
              echo "in_app_purchase_storekit remains in plugin graph."

              exit 1
            fi

          fi

          echo "StoreKit plugin is absent."


      # ============================================================
      # Lower Flutter plugin podspecs to 10.13
      # ============================================================

      - name: Backport macOS Flutter plugin podspecs
        shell: bash
        run: |
          set -euxo pipefail

          PLUGINS_FILE="app/.flutter-plugins-dependencies"

          test -f "$PLUGINS_FILE"

          mkdir -p diagnostics

          cp \
            "$PLUGINS_FILE" \
            diagnostics/flutter-plugins-dependencies.json

          python3 <<'PY'
          import json
          import re
          import shutil
          from pathlib import Path

          plugins_file = Path(
              "app/.flutter-plugins-dependencies"
          )

          data = json.loads(
              plugins_file.read_text()
          )

          plugins = (
              data
              .get("plugins", {})
              .get("macos", [])
          )

          report = []

          for plugin in plugins:
              name = plugin.get("name")
              raw_path = plugin.get("path")

              if not name or not raw_path:
                  continue

              if not plugin.get(
                  "native_build",
                  True,
              ):
                  continue

              platform_dir = (
                  "darwin"
                  if plugin.get(
                      "shared_darwin_source",
                      False,
                  )
                  else "macos"
              )

              podspec = (
                  Path(raw_path)
                  / platform_dir
                  / f"{name}.podspec"
              )

              if not podspec.exists():
                  report.append({
                      "plugin": name,
                      "podspec": None,
                      "status": "no podspec",
                  })

                  continue

              original = podspec.read_text()
              text = original

              text = re.sub(
                  r"("
                  r"[A-Za-z_][A-Za-z0-9_]*"
                  r"\.osx\.deployment_target"
                  r"\s*=\s*"
                  r")"
                  r"(['\"])"
                  r"[0-9.]+"
                  r"\2",
                  r"\1'10.13'",
                  text,
              )

              text = re.sub(
                  r"("
                  r"[A-Za-z_][A-Za-z0-9_]*"
                  r"\.platform"
                  r"\s*=\s*"
                  r":osx"
                  r"\s*,\s*"
                  r")"
                  r"(['\"])"
                  r"[0-9.]+"
                  r"\2",
                  r"\1'10.13'",
                  text,
              )

              if text != original:
                  backup = podspec.with_suffix(
                      podspec.suffix
                      + ".high-sierra-original"
                  )

                  if not backup.exists():
                      shutil.copy2(
                          podspec,
                          backup,
                      )

                  podspec.write_text(text)

                  status = "patched"
              else:
                  status = "unchanged"

              report.append({
                  "plugin": name,
                  "podspec": str(podspec),
                  "status": status,
              })

              print(
                  f"{name}: {status}: {podspec}"
              )

          Path(
              "diagnostics/"
              "plugin-podspec-backport-report.json"
          ).write_text(
              json.dumps(
                  report,
                  indent=2,
              )
              + "\n"
          )
          PY


      # ============================================================
      # gal High Sierra shim
      # ============================================================

      - name: Backport gal for High Sierra
        shell: bash
        run: |
          set -euxo pipefail

          PUB_CACHE_ROOT="${PUB_CACHE:-$HOME/.pub-cache}"

          GAL_SWIFT="$(
            find "$PUB_CACHE_ROOT" \
              -type f \
              -path '*/gal-2.3.3/darwin/gal/Sources/gal/GalPlugin.swift' \
              -print \
              -quit
          )"

          if [ -z "$GAL_SWIFT" ]; then

            echo "ERROR:"
            echo "GalPlugin.swift not found."

            exit 1
          fi

          cp \
            "$GAL_SWIFT" \
            "${GAL_SWIFT}.original"

          cat > "$GAL_SWIFT" <<'SWIFT'
          import Cocoa
          import FlutterMacOS

          public class GalPlugin:
            NSObject,
            FlutterPlugin
          {
            public static func register(
              with registrar:
                FlutterPluginRegistrar
            ) {
              let channel =
                FlutterMethodChannel(
                  name: "gal",
                  binaryMessenger:
                    registrar.messenger
                )

              let instance =
                GalPlugin()

              registrar
                .addMethodCallDelegate(
                  instance,
                  channel: channel
                )
            }


            public func handle(
              _ call:
                FlutterMethodCall,
              result:
                @escaping
                FlutterResult
            ) {
              switch call.method {

              case "hasAccess":
                result(false)

              case "requestAccess":
                result(false)

              case "putVideo",
                   "putImage",
                   "putImageBytes":

                result(
                  FlutterError(
                    code:
                      "ACCESS_DENIED",
                    message:
                      "Direct Photos-library saving is unavailable "
                      + "in the macOS High Sierra build.",
                    details:
                      nil
                  )
                )

              case "open":

                if let url =
                  URL(
                    string:
                      "photos://"
                  )
                {
                  _ =
                    NSWorkspace
                      .shared
                      .open(
                        url
                      )
                }

                result(nil)

              default:
                result(
                  FlutterMethodNotImplemented
                )
              }
            }
          }
          SWIFT

          if grep -E \
            '^[[:space:]]*import[[:space:]]+Photos([[:space:]]|$)' \
            "$GAL_SWIFT"; then

            echo "ERROR:"
            echo "Photos import remains in GalPlugin.swift."

            exit 1
          fi

          echo "gal High Sierra shim installed."


      # ============================================================
      # connectivity_plus High Sierra provider
      # ============================================================

      - name: Backport connectivity_plus for High Sierra
        shell: bash
        run: |
          set -euxo pipefail

          CONNECTIVITY_ROOT="$(
            python3 <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path(
                  "app/.flutter-plugins-dependencies"
              ).read_text()
          )

          for plugin in (
              data
              .get("plugins", {})
              .get("macos", [])
          ):
              if plugin.get("name") == "connectivity_plus":
                  print(plugin["path"])
                  break
          PY
          )"

          if [ -z "$CONNECTIVITY_ROOT" ]; then

            echo "ERROR:"
            echo "connectivity_plus missing from plugin graph."

            exit 1
          fi

          CONNECTIVITY_SOURCE="$CONNECTIVITY_ROOT/macos/connectivity_plus/Sources/connectivity_plus"

          CONNECTIVITY_PROVIDER="$CONNECTIVITY_SOURCE/PathMonitorConnectivityProvider.swift"

          CONNECTIVITY_PODSPEC="$CONNECTIVITY_ROOT/macos/connectivity_plus.podspec"

          test -f "$CONNECTIVITY_PROVIDER"
          test -f "$CONNECTIVITY_PODSPEC"

          cp \
            "$CONNECTIVITY_PROVIDER" \
            "${CONNECTIVITY_PROVIDER}.high-sierra-original"

          cp \
            "$CONNECTIVITY_PODSPEC" \
            "${CONNECTIVITY_PODSPEC}.high-sierra-specific-original"

          cat > "$CONNECTIVITY_PROVIDER" <<'SWIFT'
          import Foundation
          import SystemConfiguration
          import CoreWLAN
          import Darwin

          public class PathMonitorConnectivityProvider:
            NSObject,
            ConnectivityProvider
          {
            private let queue =
              DispatchQueue(
                label:
                  "dev.fluttercommunity.plus.connectivity.high-sierra"
              )

            private var timer:
              DispatchSourceTimer?

            private var lastSignature =
              ""

            public var connectivityUpdateHandler:
              ConnectivityUpdateHandler?


            override init() {
              super.init()

              lastSignature =
                signature(
                  for:
                    detectConnectivityTypes()
                )
            }


            deinit {
              stop()
            }


            public var currentConnectivityTypes:
              [ConnectivityType]
            {
              return detectConnectivityTypes()
            }


            public func start() {
              if timer != nil {
                return
              }

              let source =
                DispatchSource
                  .makeTimerSource(
                    queue:
                      queue
                  )

              source.schedule(
                deadline:
                  .now(),
                repeating:
                  .seconds(2),
                leeway:
                  .milliseconds(250)
              )

              source.setEventHandler {
                [weak self] in

                guard let self =
                  self
                else {
                  return
                }

                let current =
                  self
                    .detectConnectivityTypes()

                let currentSignature =
                  self
                    .signature(
                      for:
                        current
                    )

                if (
                  currentSignature
                  != self.lastSignature
                ) {
                  self.lastSignature =
                    currentSignature

                  self
                    .connectivityUpdateHandler?(
                      current
                    )
                }
              }

              timer =
                source

              source.resume()
            }


            public func stop() {
              guard let source =
                timer
              else {
                return
              }

              source.setEventHandler {}

              source.cancel()

              timer =
                nil
            }


            private func detectConnectivityTypes()
              -> [ConnectivityType]
            {
              guard isReachable() else {
                return [.none]
              }

              let active =
                activeInterfaceNames()

              if active.isEmpty {
                return [.other]
              }

              let wifi =
                wifiInterfaceNames()

              var result:
                [ConnectivityType] = []

              if active.contains(
                where: {
                  wifi.contains(
                    $0
                  )
                }
              ) {
                result.append(
                  .wifi
                )
              }

              let hasEthernet =
                active.contains {
                  interfaceName in

                  interfaceName
                    .hasPrefix("en")
                    && !wifi.contains(
                      interfaceName
                    )
                }

              if hasEthernet {
                result.append(
                  .wiredEthernet
                )
              }

              if result.isEmpty {
                result.append(
                  .other
                )
              }

              return result
            }


            private func isReachable()
              -> Bool
            {
              var zeroAddress =
                sockaddr_in()

              zeroAddress.sin_len =
                UInt8(
                  MemoryLayout<
                    sockaddr_in
                  >.size
                )

              zeroAddress.sin_family =
                sa_family_t(
                  AF_INET
                )

              let reachability:
                SCNetworkReachability? =
                withUnsafePointer(
                  to:
                    &zeroAddress
                ) {
                  pointer in

                  pointer
                    .withMemoryRebound(
                      to:
                        sockaddr.self,
                      capacity:
                        1
                    ) {
                      address in

                      SCNetworkReachabilityCreateWithAddress(
                        nil,
                        address
                      )
                    }
                }

              guard let target =
                reachability
              else {
                return false
              }

              var flags =
                SCNetworkReachabilityFlags()

              guard
                SCNetworkReachabilityGetFlags(
                  target,
                  &flags
                )
              else {
                return false
              }

              if !flags.contains(
                .reachable
              ) {
                return false
              }

              if flags.contains(
                .connectionRequired
              ) {
                return false
              }

              if flags.contains(
                .interventionRequired
              ) {
                return false
              }

              return true
            }


            private func activeInterfaceNames()
              -> Set<String>
            {
              var firstAddress:
                UnsafeMutablePointer<
                  ifaddrs
                >?

              guard (
                getifaddrs(
                  &firstAddress
                ) == 0
              ),
              let first =
                firstAddress
              else {
                return []
              }

              defer {
                freeifaddrs(
                  first
                )
              }

              var result =
                Set<String>()

              var pointer:
                UnsafeMutablePointer<
                  ifaddrs
                >? =
                first

              while let current =
                pointer
              {
                let interface =
                  current.pointee

                if let address =
                  interface.ifa_addr
                {
                  let family =
                    Int32(
                      address
                        .pointee
                        .sa_family
                    )

                  let flags =
                    interface.ifa_flags

                  let isUp =
                    (
                      flags
                      & UInt32(
                        IFF_UP
                      )
                    ) != 0

                  let isRunning =
                    (
                      flags
                      & UInt32(
                        IFF_RUNNING
                      )
                    ) != 0

                  let isLoopback =
                    (
                      flags
                      & UInt32(
                        IFF_LOOPBACK
                      )
                    ) != 0

                  if (
                    family == AF_INET
                    || family == AF_INET6
                  )
                    && isUp
                    && isRunning
                    && !isLoopback
                  {
                    let name =
                      String(
                        cString:
                          interface
                            .ifa_name
                      )

                    if (
                      !name.hasPrefix(
                        "awdl"
                      )
                      && !name.hasPrefix(
                        "llw"
                      )
                    ) {
                      result.insert(
                        name
                      )
                    }
                  }
                }

                pointer =
                  interface
                    .ifa_next
              }

              return result
            }


            private func wifiInterfaceNames()
              -> Set<String>
            {
              let client =
                CWWiFiClient.shared()

              guard let interfaces =
                client.interfaces()
              else {
                return []
              }

              return Set(
                interfaces
                  .compactMap {
                    interface in

                    interface
                      .interfaceName
                  }
              )
            }


            private func signature(
              for types:
                [ConnectivityType]
            ) -> String
            {
              return types
                .map {
                  type in

                  switch type {

                  case .none:
                    return "none"

                  case .wiredEthernet:
                    return "ethernet"

                  case .wifi:
                    return "wifi"

                  case .cellular:
                    return "cellular"

                  case .satellite:
                    return "satellite"

                  case .other:
                    return "other"
                  }
                }
                .sorted()
                .joined(
                  separator:
                    ","
                )
            }
          }
          SWIFT


          python3 - "$CONNECTIVITY_PODSPEC" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          if (
              "SystemConfiguration"
              not in text
              or "CoreWLAN"
              not in text
          ):
              framework_line = (
                  "  s.frameworks = "
                  "'SystemConfiguration', 'CoreWLAN'\n"
              )

              marker = (
                  "  s.swift_version = '5.0'\n"
              )

              if marker in text:
                  text = text.replace(
                      marker,
                      framework_line
                      + marker,
                      1,
                  )
              else:
                  end_index = text.rfind(
                      "\nend"
                  )

                  if end_index == -1:
                      raise SystemExit(
                          "ERROR: Could not patch "
                          "connectivity_plus podspec."
                      )

                  text = (
                      text[:end_index]
                      + "\n"
                      + framework_line
                      + text[end_index:]
                  )

          path.write_text(text)
          PY


          python3 - "$CONNECTIVITY_PROVIDER" <<'PY'
          import re
          import sys
          from pathlib import Path

          source = Path(
              sys.argv[1]
          ).read_text()

          code = re.sub(
              r"/\*.*?\*/",
              "",
              source,
              flags=re.DOTALL,
          )

          code = re.sub(
              r"//[^\n]*",
              "",
              code,
          )

          forbidden = {
              "import Network":
                  r"(?m)^\s*import\s+Network\s*$",
              "NWPathMonitor":
                  r"\bNWPathMonitor\b",
              "NWPath":
                  r"\bNWPath\b",
              "NWInterface":
                  r"\bNWInterface\b",
          }

          found = []

          for name, pattern in forbidden.items():
              if re.search(
                  pattern,
                  code,
              ):
                  found.append(
                      name
                  )

          if found:
              print(
                  "ERROR: Network.framework code remains:"
              )

              for name in found:
                  print(
                      f"  {name}"
                  )

              raise SystemExit(1)

          required = {
              "SystemConfiguration":
                  r"(?m)^\s*import\s+SystemConfiguration\s*$",
              "CoreWLAN":
                  r"(?m)^\s*import\s+CoreWLAN\s*$",
              "SCNetworkReachability":
                  r"\bSCNetworkReachability\b",
              "getifaddrs":
                  r"\bgetifaddrs\b",
          }

          missing = []

          for name, pattern in required.items():
              if not re.search(
                  pattern,
                  code,
              ):
                  missing.append(
                      name
                  )

          if missing:
              print(
                  "ERROR: High Sierra connectivity "
                  "provider incomplete:"
              )

              for name in missing:
                  print(
                      f"  missing {name}"
                  )

              raise SystemExit(1)

          print(
              "connectivity_plus High Sierra "
              "validation passed."
          )
          PY


      # ============================================================
      # Rust / Cargokit
      # ============================================================

      - name: Prepare Cargokit
        working-directory: packages/localsend_isolates/rust_builder/cargokit/build_tool
        shell: bash
        run: |
          set -euxo pipefail
          flutter pub get

      - name: Verify Rust workspace
        shell: bash
        run: |
          set -euxo pipefail

          test -f Cargo.toml
          test -f rust-toolchain.toml
          test -f packages/localsend_isolates/rust/Cargo.toml

          cargo metadata \
            --format-version=1 \
            --no-deps \
            > /tmp/cargo-metadata.json

          python3 <<'PY'
          import json

          with open(
              "/tmp/cargo-metadata.json",
              "r",
          ) as file:
              metadata = json.load(
                  file
              )

          print(
