      # ============================================================
      # Code signing
      # ============================================================

      - name: Inspect code signatures
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p ../diagnostics

          REPORT="../diagnostics/codesign-report.txt"


          {
            echo "============================================================"
            echo "Main application"
            echo "============================================================"

            codesign \
              -dvvv \
              "$APP" \
              2>&1 \
              || true

            echo
            echo "============================================================"
            echo "Main entitlements"
            echo "============================================================"

            codesign \
              -d \
              --entitlements :- \
              "$APP" \
              2>&1 \
              || true

            echo
            echo "============================================================"
            echo "Extensions"
            echo "============================================================"

            find "$APP" \
              -type d \
              -name '*.appex' \
              -print \
            | while read -r EXTENSION; do

                echo
                echo "------------------------------------------------------------"
                echo "$EXTENSION"
                echo "------------------------------------------------------------"

                codesign \
                  -dvvv \
                  "$EXTENSION" \
                  2>&1 \
                  || true

                codesign \
                  -d \
                  --entitlements :- \
                  "$EXTENSION" \
                  2>&1 \
                  || true

              done

          } | tee "$REPORT"


          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=4 \
            "$APP"


      # ============================================================
      # Package
      # ============================================================

      - name: Package High Sierra build
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p release

          OUTPUT="release/LocalSend-macOS-High-Sierra-10.13-x86_64.zip"

          rm -f "$OUTPUT"

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$APP" \
            "$OUTPUT"

          ls -lh "$OUTPUT"


      # ============================================================
      # Build artifact
      # ============================================================

      - name: Upload High Sierra build
        uses: actions/upload-artifact@v4
        with:
          name: LocalSend-macOS-High-Sierra-10.13-x86_64
          path: app/release/LocalSend-macOS-High-Sierra-10.13-x86_64.zip
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # Diagnostics
      # ============================================================

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p diagnostics


          cp \
            app/macos/Runner.xcodeproj/project.pbxproj \
            diagnostics/project.pbxproj.after-patch \
            2>/dev/null

          cp \
            app/macos/Podfile \
            diagnostics/Podfile.after-patch \
            2>/dev/null

          cp \
            app/macos/Podfile.lock \
            diagnostics/Podfile.lock.after-patch \
            2>/dev/null

          cp \
            app/pubspec.yaml \
            diagnostics/pubspec.yaml.after-foss-strip \
            2>/dev/null

          cp \
            app/.flutter-plugins-dependencies \
            diagnostics/flutter-plugins-dependencies.json \
            2>/dev/null

          cp \
            app/macos/Runner/Configs/Release.xcconfig \
            diagnostics/Release.xcconfig.after-patch \
            2>/dev/null

          cp \
            flutter-config-first.log \
            diagnostics/flutter-config-first.log \
            2>/dev/null

          cp \
            flutter-config-final.log \
            diagnostics/flutter-config-final.log \
            2>/dev/null

          cp \
            pod-install.log \
            diagnostics/pod-install.log \
            2>/dev/null

          cp \
            pod-env.log \
            diagnostics/pod-env.log \
            2>/dev/null

          cp \
            swiftpm-resolve.log \
            diagnostics/swiftpm-resolve.log \
            2>/dev/null

          cp \
            flutter-macos-build.log \
            diagnostics/flutter-macos-build.log \
            2>/dev/null

          cp \
            flutter-pub-deps.txt \
            diagnostics/flutter-pub-deps.txt \
            2>/dev/null

          cp \
            flutter-podhelper.rb.original \
            diagnostics/flutter-podhelper.rb.original \
            2>/dev/null

          cp \
            "$FLUTTER_ROOT/packages/flutter_tools/bin/podhelper.rb" \
            diagnostics/flutter-podhelper.rb.after-patch \
            2>/dev/null

          cp \
            app/macos/Flutter/ephemeral/FlutterMacOS.podspec \
            diagnostics/FlutterMacOS.podspec.generated \
            2>/dev/null

          cp \
            app/macos/Flutter/ephemeral/Flutter-Generated.xcconfig \
            diagnostics/Flutter-Generated.xcconfig \
            2>/dev/null


          # --------------------------------------------------------
          # Package.resolved files
          # --------------------------------------------------------

          python3 <<'PY'
          from pathlib import Path
          import shutil


          source = Path("app/macos")
          destination = Path("diagnostics")

          destination.mkdir(
              parents=True,
              exist_ok=True,
          )


          files = sorted(
              path
              for path in source.rglob(
                  "Package.resolved"
              )
              if path.parent.name == "swiftpm"
          )


          for index, path in enumerate(
              files,
              start=1,
          ):

              relative = path.relative_to(
                  source
              )

              safe_name = (
                  str(relative)
                  .replace("/", "__")
                  .replace(" ", "_")
              )

              output = destination / (
                  f"Package.resolved."
                  f"{index}__"
                  f"{safe_name}"
              )

              shutil.copy2(
                  path,
                  output,
              )

              print(
                  f"Copied {path} -> {output}"
              )
          PY


          # --------------------------------------------------------
          # Collect every modified Flutter plugin podspec and its
          # original backup.
          # --------------------------------------------------------

          python3 <<'PY'
          import json
          import shutil

          from pathlib import Path


          plugins_file = Path(
              "app/.flutter-plugins-dependencies"
          )

          destination = Path(
              "diagnostics/plugin-podspecs"
          )

          destination.mkdir(
              parents=True,
              exist_ok=True,
          )


          if plugins_file.exists():

              data = json.loads(
                  plugins_file.read_text()
              )

              for plugin in (
                  data
                  .get("plugins", {})
                  .get("macos", [])
              ):

                  name = plugin.get("name")
                  raw_path = plugin.get("path")

                  if not name or not raw_path:
                      continue

                  platform_dir = (
                      "darwin"
                      if plugin.get(
                          "shared_darwin_source",
                          False,
                      )
                      else "macos"
                  )

                  podspec = (
                      Path(raw_path)
                      / platform_dir
                      / f"{name}.podspec"
                  )

                  if podspec.exists():

                      shutil.copy2(
                          podspec,
                          destination
                          / f"{name}.podspec.after-patch",
                      )

                  backup = podspec.with_suffix(
                      podspec.suffix
                      + ".high-sierra-original"
                  )

                  if backup.exists():

                      shutil.copy2(
                          backup,
                          destination
                          / f"{name}.podspec.original",
                      )
          PY


          # --------------------------------------------------------
          # gal source
          # --------------------------------------------------------

          PUB_CACHE_ROOT="${PUB_CACHE:-$HOME/.pub-cache}"

          GAL_SWIFT="$(
            find "$PUB_CACHE_ROOT" \
              -type f \
              -path '*/gal-2.3.3/darwin/gal/Sources/gal/GalPlugin.swift' \
              -print \
              -quit
          )"

          if [ -n "$GAL_SWIFT" ]; then

            cp \
              "$GAL_SWIFT" \
              diagnostics/GalPlugin.swift.after-patch \
              2>/dev/null

            cp \
              "${GAL_SWIFT}.original" \
              diagnostics/GalPlugin.swift.original \
              2>/dev/null

          fi


      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LocalSend-High-Sierra-build-diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30
