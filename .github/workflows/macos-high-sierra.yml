name: LocalSend macOS High Sierra Backport

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.9"
  RUST_VERSION: "1.97.1"

  LEGACY_MACOS_TARGET: "10.13"
  MACOSX_DEPLOYMENT_TARGET: "10.13"

jobs:
  build:
    name: Build LocalSend for macOS High Sierra
    runs-on: macos-15-intel

    steps:
      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive


      # ============================================================
      # Toolchains
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - name: Show build environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Flutter"
          echo "============================================================"
          flutter --version

          echo
          echo "============================================================"
          echo "Dart"
          echo "============================================================"
          dart --version

          echo
          echo "============================================================"
          echo "Rust"
          echo "============================================================"
          rustc --version
          cargo --version
          rustup show

          echo
          echo "============================================================"
          echo "Xcode"
          echo "============================================================"
          xcodebuild -version

          echo
          echo "============================================================"
          echo "Runner"
          echo "============================================================"
          sw_vers
          uname -a
          uname -m

          echo
          echo "Target macOS: ${LEGACY_MACOS_TARGET}"
          echo "Target architecture: x86_64"


      # ============================================================
      # Dependencies
      # ============================================================

      - name: Clean Flutter build
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail
          flutter clean

      - name: Flutter pub get
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail
          flutter pub get

      - name: Prepare Cargokit
        working-directory: packages/localsend_isolates/rust_builder/cargokit/build_tool
        shell: bash
        run: |
          set -euxo pipefail
          flutter pub get

      - name: Verify Rust workspace
        shell: bash
        run: |
          set -euxo pipefail

          test -f Cargo.toml
          test -f rust-toolchain.toml
          test -f packages/localsend_isolates/rust/Cargo.toml

          cargo metadata \
            --format-version=1 \
            --no-deps \
            > /tmp/cargo-metadata.json

          python3 <<'PY'
          import json

          with open("/tmp/cargo-metadata.json", "r") as f:
              metadata = json.load(f)

          print("Rust workspace packages:")

          for package in metadata["packages"]:
              print(f"  {package['name']} {package['version']}")
              print(f"    {package['manifest_path']}")
          PY


      # ============================================================
      # gal 2.3.3 High Sierra backport
      #
      # gal's current macOS implementation uses Photos APIs and
      # declares macOS 11.0 in its podspec.
      #
      # LocalSend does not need gallery saving for its normal macOS
      # receive path, so replace the native implementation with a
      # compatibility stub while preserving Flutter registration.
      # ============================================================

      - name: Backport gal for High Sierra
        shell: bash
        run: |
          set -euxo pipefail

          PUB_CACHE_ROOT="${PUB_CACHE:-$HOME/.pub-cache}"

          echo "PUB_CACHE_ROOT=$PUB_CACHE_ROOT"

          GAL_SWIFT="$(
            find "$PUB_CACHE_ROOT" \
              -type f \
              -path '*/gal-2.3.3/darwin/gal/Sources/gal/GalPlugin.swift' \
              -print \
              -quit
          )"

          GAL_PODSPEC="$(
            find "$PUB_CACHE_ROOT" \
              -type f \
              -path '*/gal-2.3.3/darwin/gal.podspec' \
              -print \
              -quit
          )"

          if [ -z "$GAL_SWIFT" ]; then
            echo "ERROR: gal 2.3.3 GalPlugin.swift was not found."
            find "$PUB_CACHE_ROOT" \
              -iname '*gal*' \
              -print \
              || true
            exit 1
          fi

          if [ -z "$GAL_PODSPEC" ]; then
            echo "ERROR: gal 2.3.3 gal.podspec was not found."
            exit 1
          fi

          echo
          echo "GalPlugin.swift:"
          echo "$GAL_SWIFT"

          echo
          echo "gal.podspec:"
          echo "$GAL_PODSPEC"

          cp "$GAL_SWIFT" "${GAL_SWIFT}.original"
          cp "$GAL_PODSPEC" "${GAL_PODSPEC}.original"


          # --------------------------------------------------------
          # Lower gal's declared macOS deployment target.
          # --------------------------------------------------------

          python3 - "$GAL_PODSPEC" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          text = text.replace(
              "s.osx.deployment_target = '11.0'",
              "s.osx.deployment_target = '10.13'",
          )

          path.write_text(text)
          PY


          # --------------------------------------------------------
          # Replace native macOS implementation.
          #
          # Keep the same plugin class and MethodChannel name so
          # GeneratedPluginRegistrant continues to work normally.
          # --------------------------------------------------------

          cat > "$GAL_SWIFT" <<'SWIFT'
          import Cocoa
          import FlutterMacOS

          public class GalPlugin: NSObject, FlutterPlugin {

            public static func register(
              with registrar: FlutterPluginRegistrar
            ) {
              let channel = FlutterMethodChannel(
                name: "gal",
                binaryMessenger: registrar.messenger
              )

              let instance = GalPlugin()

              registrar.addMethodCallDelegate(
                instance,
                channel: channel
              )
            }

            public func handle(
              _ call: FlutterMethodCall,
              result: @escaping FlutterResult
            ) {
              switch call.method {

              case "hasAccess":
                // LocalSend's High Sierra build does not expose
                // direct Photos-library writing.
                result(false)

              case "requestAccess":
                result(false)

              case "putVideo",
                   "putImage",
                   "putImageBytes":

                result(
                  FlutterError(
                    code: "ACCESS_DENIED",
                    message:
                      "Direct Photos-library saving is unavailable "
                      + "in the macOS High Sierra build.",
                    details: nil
                  )
                )

              case "open":
                if let url = URL(string: "photos://") {
                  _ = NSWorkspace.shared.open(url)
                }

                result(nil)

              default:
                result(FlutterMethodNotImplemented)
              }
            }
          }
          SWIFT


          echo
          echo "============================================================"
          echo "Patched GalPlugin.swift"
          echo "============================================================"

          cat "$GAL_SWIFT"

          echo
          echo "============================================================"
          echo "Patched gal.podspec"
          echo "============================================================"

          grep -n \
            'deployment_target' \
            "$GAL_PODSPEC" \
            || true


          echo
          echo "============================================================"
          echo "Verify Photos APIs are absent"
          echo "============================================================"

          if grep -E \
            'import Photos|PHPhotoLibrary|PHAsset|PHFetch|PHPhotos' \
            "$GAL_SWIFT"; then

            echo "ERROR: PhotoKit APIs remain in patched GalPlugin.swift."
            exit 1
          fi

          echo "gal High Sierra shim installed."


      # ============================================================
      # High Sierra project backport
      # ============================================================

      - name: Patch LocalSend for High Sierra
        shell: bash
        run: |
          set -euxo pipefail

          PBX="app/macos/Runner.xcodeproj/project.pbxproj"
          PODFILE="app/macos/Podfile"
          RELEASE_XCCONFIG="app/macos/Runner/Configs/Release.xcconfig"
          APP_DELEGATE="app/macos/Runner/AppDelegate.swift"

          echo "============================================================"
          echo "LocalSend macOS High Sierra backport"
          echo "Target: macOS 10.13 / x86_64"
          echo "============================================================"


          # ========================================================
          # Xcode project
          #
          # Flutter 3.41.9 automatically migrates literal 10.13
          # deployment targets to 10.15.
          #
          # Therefore project.pbxproj uses an indirect variable.
          # ========================================================

          python3 <<'PY'
          from pathlib import Path
          import re

          pbx = Path(
              "app/macos/Runner.xcodeproj/project.pbxproj"
          )

          text = pbx.read_text()


          # --------------------------------------------------------
          # Deployment targets
          # --------------------------------------------------------

          text = re.sub(
              r'MACOSX_DEPLOYMENT_TARGET = [0-9.]+;',
              'MACOSX_DEPLOYMENT_TARGET = "$(LOCALSEND_LEGACY_MACOS_TARGET)";',
              text,
          )


          # --------------------------------------------------------
          # Remove upstream Apple Developer signing
          # --------------------------------------------------------

          text = re.sub(
              r'DEVELOPMENT_TEAM = [A-Z0-9]+;',
              'DEVELOPMENT_TEAM = "";',
              text,
          )

          text = text.replace(
              "CODE_SIGN_STYLE = Automatic;",
              "CODE_SIGN_STYLE = Manual;",
          )

          text = re.sub(
              r'CODE_SIGN_IDENTITY = "(?:Apple Development|Mac Development|Mac Developer)";',
              'CODE_SIGN_IDENTITY = "-";',
              text,
          )

          text = re.sub(
              r'("CODE_SIGN_IDENTITY\[sdk=macosx\*\]"\s*=\s*)'
              r'"(?:Apple Development|Mac Development|Mac Developer)";',
              r'\1"-";',
              text,
          )

          text = re.sub(
              r'PROVISIONING_PROFILE_SPECIFIER = "[^"]*";',
              'PROVISIONING_PROFILE_SPECIFIER = "";',
              text,
          )

          text = re.sub(
              r'PROVISIONING_PROFILE = "[^"]*";',
              'PROVISIONING_PROFILE = "";',
              text,
          )


          # --------------------------------------------------------
          # DockProgress
          #
          # Current project:
          #
          #   minimumVersion = 4.3.1
          #
          # High Sierra backport:
          #
          #   exactVersion = 3.2.0
          # --------------------------------------------------------

          old = """requirement = {
                          kind = upToNextMajorVersion;
                          minimumVersion = 4.3.1;
                      };"""

          new = """requirement = {
                          kind = exactVersion;
                          version = 3.2.0;
                      };"""

          if old not in text:
              raise SystemExit(
                  "ERROR: Expected DockProgress 4.3.1 "
                  "package requirement was not found."
              )

          text = text.replace(old, new, 1)

          pbx.write_text(text)
          PY


          # ========================================================
          # Actual Release xcconfig
          # ========================================================

          cat >> "$RELEASE_XCCONFIG" <<'EOF'

          // ========================================================
          // LocalSend macOS High Sierra Backport
          // ========================================================

          LOCALSEND_LEGACY_MACOS_TARGET = 10.13
          MACOSX_DEPLOYMENT_TARGET = $(LOCALSEND_LEGACY_MACOS_TARGET)

          // High Sierra is Intel-only.
          ARCHS = x86_64
          EXCLUDED_ARCHS = arm64
          ONLY_ACTIVE_ARCH = YES

          // GitHub CI ad-hoc signing.
          CODE_SIGN_IDENTITY = -
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM =

          EOF


          # ========================================================
          # CocoaPods
          #
          # Avoid:
          #
          #   platform :osx, '10.13'
          #
          # because Flutter 3.41.9 detects that literal form.
          # ========================================================

          python3 <<'PY'
          from pathlib import Path
          import re

          podfile = Path("app/macos/Podfile")
          text = podfile.read_text()


          # --------------------------------------------------------
          # Global platform
          # --------------------------------------------------------

          text = re.sub(
              r"^platform\s+:osx,\s*['\"][0-9.]+['\"]",
              "legacy_macos_target = '10.13'\n"
              "platform :osx, legacy_macos_target",
              text,
              count=1,
              flags=re.MULTILINE,
          )


          # --------------------------------------------------------
          # Every Pod target
          # --------------------------------------------------------

          text = re.sub(
              r"config\.build_settings\[['\"]MACOSX_DEPLOYMENT_TARGET['\"]\]"
              r"\s*=\s*['\"][0-9.]+['\"]",
              "config.build_settings['MACOSX_DEPLOYMENT_TARGET'] = "
              "legacy_macos_target",
              text,
          )


          # --------------------------------------------------------
          # ShareExtension
          #
          # Shared.swift imports Defaults, so ShareExtension needs
          # its own CocoaPods target containing Defaults.
          # --------------------------------------------------------

          if "target 'ShareExtension' do" not in text:

              share_target = """
          target 'ShareExtension' do
            use_frameworks!
            use_modular_headers!

            pod 'Defaults', '~> 4.2'
          end

          """

              text = text.replace(
                  "\npost_install do |installer|",
                  "\n"
                  + share_target
                  + "post_install do |installer|",
                  1,
              )


          if "target 'ShareExtension' do" not in text:
              raise SystemExit(
                  "ERROR: Failed to add ShareExtension pod target."
              )


          # --------------------------------------------------------
          # Strengthen post_install.
          #
          # Ensure every generated Pod is x86_64 / macOS 10.13.
          # --------------------------------------------------------

          needle = (
              "config.build_settings['MACOSX_DEPLOYMENT_TARGET'] "
              "= legacy_macos_target"
          )

          replacement = (
              needle
              + "\n"
              + "      config.build_settings['ARCHS'] = 'x86_64'\n"
              + "      config.build_settings['EXCLUDED_ARCHS'] = 'arm64'\n"
              + "      config.build_settings['ONLY_ACTIVE_ARCH'] = 'YES'"
          )

          if "config.build_settings['ARCHS'] = 'x86_64'" not in text:
              text = text.replace(
                  needle,
                  replacement,
                  1,
              )

          podfile.write_text(text)
          PY


          # ========================================================
          # Avoid unnecessary Swift Concurrency annotation.
          # ========================================================

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "app/macos/Runner/AppDelegate.swift"
          )

          text = path.read_text()

          text = text.replace(
              "@MainActor private func handleFlutterCall",
              "private func handleFlutterCall",
          )

          path.write_text(text)
          PY


          # ========================================================
          # Remove stale SwiftPM resolutions.
          #
          # Xcode can use either location.
          # ========================================================

          rm -f \
            app/macos/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved \
            app/macos/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved


          # ========================================================
          # Diagnostics
          # ========================================================

          echo
          echo "============================================================"
          echo "Deployment targets"
          echo "============================================================"

          grep -nE \
            'MACOSX_DEPLOYMENT_TARGET|LOCALSEND_LEGACY_MACOS_TARGET' \
            "$PBX" \
            || true

          echo
          echo "============================================================"
          echo "Signing"
          echo "============================================================"

          grep -nE \
            'DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE' \
            "$PBX" \
            || true

          echo
          echo "============================================================"
          echo "Release.xcconfig"
          echo "============================================================"

          cat "$RELEASE_XCCONFIG"

          echo
          echo "============================================================"
          echo "Podfile"
          echo "============================================================"

          cat "$PODFILE"

          echo
          echo "============================================================"
          echo "DockProgress"
          echo "============================================================"

          grep -A10 -B2 \
            'XCRemoteSwiftPackageReference "DockProgress"' \
            "$PBX" \
            || true

          echo
          echo "============================================================"
          echo "AppDelegate"
          echo "============================================================"

          grep -n \
            'MainActor\|handleFlutterCall' \
            "$APP_DELEGATE" \
            || true


      # ============================================================
      # Static validation
      # ============================================================

      - name: Validate High Sierra patch
        shell: bash
        run: |
          set -euxo pipefail

          PBX="app/macos/Runner.xcodeproj/project.pbxproj"
          PODFILE="app/macos/Podfile"

          echo "Checking upstream developer identity..."

          if grep -q "3W7H4PYMCV" "$PBX"; then
            echo "ERROR: Upstream Team ID remains."
            grep -n "3W7H4PYMCV" "$PBX"
            exit 1
          fi


          echo "Checking Flutter migration-triggering literals..."

          if grep -q \
            'MACOSX_DEPLOYMENT_TARGET = 10.13;' \
            "$PBX"; then

            echo "ERROR: Literal 10.13 remains in pbxproj."
            exit 1
          fi


          if grep -q \
            "platform :osx, '10.13'" \
            "$PODFILE"; then

            echo "ERROR: Literal 10.13 remains in Podfile."
            exit 1
          fi


          echo "Checking DockProgress backport..."

          if ! grep -q \
            'version = 3.2.0;' \
            "$PBX"; then

            echo "ERROR: DockProgress 3.2.0 is not configured."
            exit 1
          fi


          echo "Checking ShareExtension pod target..."

          if ! grep -q \
            "target 'ShareExtension' do" \
            "$PODFILE"; then

            echo "ERROR: ShareExtension pod target missing."
            exit 1
          fi


          echo "Static High Sierra patch validation passed."


      # ============================================================
      # Generate Flutter macOS configuration
      # ============================================================

      - name: Generate Flutter macOS configuration
        working-directory: app
        shell: bash
        run: |
          set -o pipefail

          flutter build macos \
            --release \
            --config-only \
            -v \
            2>&1 | tee ../flutter-config-only.log


      # ============================================================
      # Confirm Flutter did not silently migrate back to 10.15
      # ============================================================

      - name: Verify Flutter migration bypass
        shell: bash
        run: |
          set -euxo pipefail

          PBX="app/macos/Runner.xcodeproj/project.pbxproj"
          PODFILE="app/macos/Podfile"

          if grep -q \
            'MACOSX_DEPLOYMENT_TARGET = 10.15;' \
            "$PBX"; then

            echo "ERROR: Flutter restored macOS 10.15:"
            grep -n \
              'MACOSX_DEPLOYMENT_TARGET = 10.15;' \
              "$PBX"

            exit 1
          fi


          if grep -q \
            "platform :osx, '10.15'" \
            "$PODFILE"; then

            echo "ERROR: Flutter restored Podfile to 10.15."
            exit 1
          fi

          echo "Flutter migration bypass survived."


      # ============================================================
      # Verify gal shim survived Flutter pub/config generation
      # ============================================================

      - name: Verify gal High Sierra shim
        shell: bash
        run: |
          set -euxo pipefail

          PUB_CACHE_ROOT="${PUB_CACHE:-$HOME/.pub-cache}"

          GAL_SWIFT="$(
            find "$PUB_CACHE_ROOT" \
              -type f \
              -path '*/gal-2.3.3/darwin/gal/Sources/gal/GalPlugin.swift' \
              -print \
              -quit
          )"

          GAL_PODSPEC="$(
            find "$PUB_CACHE_ROOT" \
              -type f \
              -path '*/gal-2.3.3/darwin/gal.podspec' \
              -print \
              -quit
          )"

          test -n "$GAL_SWIFT"
          test -n "$GAL_PODSPEC"

          if grep -q \
            'import Photos' \
            "$GAL_SWIFT"; then

            echo "ERROR: Original gal PhotoKit source returned."
            exit 1
          fi


          if ! grep -q \
            "s.osx.deployment_target = '10.13'" \
            "$GAL_PODSPEC"; then

            echo "ERROR: gal podspec target is not 10.13."
            exit 1
          fi

          echo "gal shim survived."


      # ============================================================
      # CocoaPods verification
      # ============================================================

      - name: Verify CocoaPods integration
        working-directory: app/macos
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Generated CocoaPods targets"
          echo "============================================================"

          find "Pods/Target Support Files" \
            -maxdepth 1 \
            -type d \
            -print \
            | sort

          echo
          echo "============================================================"
          echo "ShareExtension Pods integration"
          echo "============================================================"

          if [ ! -d \
            "Pods/Target Support Files/Pods-ShareExtension" ]; then

            echo "ERROR: Pods-ShareExtension was not generated."
            exit 1
          fi

          find \
            "Pods/Target Support Files/Pods-ShareExtension" \
            -maxdepth 1 \
            -type f \
            -print \
            | sort


      # ============================================================
      # Resolve Swift packages
      #
      # Do not assume Package.resolved's final path.
      # ============================================================

      - name: Resolve Swift packages
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Resolve Swift packages"
          echo "============================================================"

          xcodebuild \
            -resolvePackageDependencies \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            2>&1 | tee ../swiftpm-resolve.log


          echo
          echo "============================================================"
          echo "Locate and validate Package.resolved"
          echo "============================================================"

          python3 <<'PY'
          import json
          from pathlib import Path

          files = sorted(
              path
              for path in Path("macos").rglob("Package.resolved")
              if path.parent.name == "swiftpm"
          )

          if not files:
              raise SystemExit(
                  "ERROR: SwiftPM resolved successfully but "
                  "no Package.resolved was found."
              )

          print(
              f"Found {len(files)} Package.resolved file(s):"
          )

          active = []

          for path in files:
              print()
              print("=" * 60)
              print(path)
              print("=" * 60)

              raw = path.read_text()
              print(raw)

              data = json.loads(raw)

              versions = {}

              for pin in data.get("pins", []):
                  identity = pin.get("identity")
                  version = pin.get("state", {}).get("version")
                  versions[identity] = version

              if "dockprogress" in versions:
                  active.append((path, versions))

          if not active:
              raise SystemExit(
                  "ERROR: No Package.resolved contains DockProgress."
              )

          for path, versions in active:
              dock = versions.get("dockprogress")
              launch = versions.get("launchatlogin-legacy")

              print()
              print(f"Validating: {path}")
              print(f"DockProgress: {dock}")
              print(f"LaunchAtLogin-Legacy: {launch}")

              if dock != "3.2.0":
                  raise SystemExit(
                      f"ERROR: DockProgress resolved to {dock!r}, "
                      "expected '3.2.0'."
                  )

              if launch != "5.0.2":
                  raise SystemExit(
                      f"ERROR: LaunchAtLogin-Legacy resolved "
                      f"to {launch!r}, expected '5.0.2'."
                  )

          print()
          print("SwiftPM package versions are correct.")
          PY


      # ============================================================
      # Effective Xcode build settings
      # ============================================================

      - name: Verify effective Xcode build settings
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p ../diagnostics

          echo "============================================================"
          echo "Runner effective settings"
          echo "============================================================"

          xcodebuild \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -showBuildSettings \
            > ../diagnostics/runner-build-settings.txt

          grep -E \
            'ARCHS|EXCLUDED_ARCHS|ONLY_ACTIVE_ARCH|MACOSX_DEPLOYMENT_TARGET|LOCALSEND_LEGACY_MACOS_TARGET' \
            ../diagnostics/runner-build-settings.txt \
            || true


          echo
          echo "============================================================"
          echo "ShareExtension effective settings"
          echo "============================================================"

          xcodebuild \
            -project macos/Runner.xcodeproj \
            -target ShareExtension \
            -configuration Release \
            -showBuildSettings \
            > ../diagnostics/shareextension-build-settings.txt

          grep -E \
            'ARCHS|EXCLUDED_ARCHS|ONLY_ACTIVE_ARCH|MACOSX_DEPLOYMENT_TARGET|LOCALSEND_LEGACY_MACOS_TARGET' \
            ../diagnostics/shareextension-build-settings.txt \
            || true


          echo
          echo "============================================================"
          echo "Hard validation"
          echo "============================================================"

          python3 <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("../diagnostics/runner-build-settings.txt"),
              Path("../diagnostics/shareextension-build-settings.txt"),
          ]

          for path in files:
              text = path.read_text()

              print()
              print(f"Checking {path}")

              deployment = re.findall(
                  r"^\s*MACOSX_DEPLOYMENT_TARGET\s*=\s*(.*?)\s*$",
                  text,
                  flags=re.MULTILINE,
              )

              archs = re.findall(
                  r"^\s*ARCHS\s*=\s*(.*?)\s*$",
                  text,
                  flags=re.MULTILINE,
              )

              excluded = re.findall(
                  r"^\s*EXCLUDED_ARCHS\s*=\s*(.*?)\s*$",
                  text,
                  flags=re.MULTILINE,
              )

              print("  MACOSX_DEPLOYMENT_TARGET:", deployment[:3])
              print("  ARCHS:", archs[:3])
              print("  EXCLUDED_ARCHS:", excluded[:3])

              if not deployment:
                  raise SystemExit(
                      f"ERROR: {path}: deployment target missing."
                  )

              if deployment[0] != "10.13":
                  raise SystemExit(
                      f"ERROR: {path}: deployment target is "
                      f"{deployment[0]!r}; expected '10.13'."
                  )

              if not archs:
                  raise SystemExit(
                      f"ERROR: {path}: ARCHS missing."
                  )

              if "x86_64" not in archs[0].split():
                  raise SystemExit(
                      f"ERROR: {path}: x86_64 missing from ARCHS."
                  )

              if excluded:
                  if "arm64" not in excluded[0].split():
                      raise SystemExit(
                          f"ERROR: {path}: arm64 is not excluded."
                      )

          print()
          print("Effective Xcode settings are correct.")
          PY


      # ============================================================
      # Build
      #
      # Rust is intentionally NOT manually built here.
      # Cargokit builds rust_lib_localsend_app from the native
      # Flutter/Xcode build.
      # ============================================================

      - name: Build macOS app
        working-directory: app
        shell: bash
        env:
          ARCHS: x86_64
          EXCLUDED_ARCHS: arm64
        run: |
          set -o pipefail

          echo "============================================================"
          echo "Building LocalSend"
          echo
          echo "Target OS:       macOS High Sierra 10.13"
          echo "Architecture:    x86_64"
          echo "Flutter:         ${FLUTTER_VERSION}"
          echo "Rust:            ${RUST_VERSION}"
          echo "DockProgress:    3.2.0"
          echo "gal:             High Sierra shim"
          echo "============================================================"

          flutter build macos \
            --release \
            -v \
            2>&1 | tee ../flutter-macos-build.log


      # ============================================================
      # Extract useful errors if build failed
      # ============================================================

      - name: Extract compiler errors
        if: failure()
        shell: bash
        run: |
          set +e

          mkdir -p diagnostics

          if [ -f flutter-macos-build.log ]; then
            grep -nE \
              'error:|fatal error:|is only available in macOS|introduced in macOS|requires macOS|BUILD FAILED|The following build commands failed' \
              flutter-macos-build.log \
              > diagnostics/compiler-errors.txt \
              || true

            echo "============================================================"
            echo "Compiler errors"
            echo "============================================================"

            tail -n 300 \
              diagnostics/compiler-errors.txt \
              || true
          fi


      # ============================================================
      # Locate output
      # ============================================================

      - name: Locate built application
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          APP="$(
            find build/macos/Build/Products/Release \
              -maxdepth 1 \
              -type d \
              -name '*.app' \
              -print \
              -quit
          )"

          if [ -z "$APP" ]; then
            echo "ERROR: No .app bundle was produced."
            exit 1
          fi

          EXECUTABLE="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$APP/Contents/Info.plist"
          )"

          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "APP_EXECUTABLE=$EXECUTABLE" >> "$GITHUB_ENV"

          echo
          echo "Application:"
          echo "$APP"

          echo
          echo "Executable:"
          echo "$EXECUTABLE"


      # ============================================================
      # Architecture verification
      # ============================================================

      - name: Verify x86_64 application
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          MAIN="$APP/Contents/MacOS/$APP_EXECUTABLE"

          file "$MAIN"
          lipo -info "$MAIN"

          ARCHES="$(lipo -archs "$MAIN")"

          echo "Architectures: $ARCHES"

          if ! echo "$ARCHES" | grep -qw x86_64; then
            echo "ERROR: Main executable lacks x86_64."
            exit 1
          fi

          if echo "$ARCHES" | grep -qw arm64; then
            echo "ERROR: arm64 unexpectedly remains."
            exit 1
          fi


      # ============================================================
      # Audit every Mach-O
      #
      # This will tell us whether FlutterMacOS.framework or another
      # plugin is still physically built for a newer macOS.
      # ============================================================

      - name: Audit Mach-O deployment targets
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p ../diagnostics

          REPORT="../diagnostics/macho-deployment-targets.txt"
          : > "$REPORT"

          find "$APP" -type f -print0 |
          while IFS= read -r -d '' FILE; do

            if file "$FILE" | grep -q "Mach-O"; then

              {
                echo
                echo "============================================================"
                echo "$FILE"
                echo "============================================================"

                file "$FILE"

                echo
                echo "--- Architectures ---"
                lipo -archs "$FILE" 2>/dev/null || true

                echo
                echo "--- Deployment load commands ---"

                otool -l "$FILE" |
                awk '
                  /cmd LC_VERSION_MIN_MACOSX/ {
                    capture=1
                    count=0
                  }

                  /cmd LC_BUILD_VERSION/ {
                    capture=1
                    count=0
                  }

                  capture {
                    print
                    count++

                    if (count >= 10) {
                      capture=0
                    }
                  }
                '

                echo
                echo "--- Linked libraries ---"
                otool -L "$FILE" || true

              } | tee -a "$REPORT"

            fi

          done


      # ============================================================
      # Linked libraries
      # ============================================================

      - name: Audit linked libraries
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p ../diagnostics

          REPORT="../diagnostics/linked-libraries.txt"
          : > "$REPORT"

          find "$APP" -type f -print0 |
          while IFS= read -r -d '' FILE; do

            if file "$FILE" | grep -q "Mach-O"; then

              {
                echo
                echo "============================================================"
                echo "$FILE"
                echo "============================================================"

                otool -L "$FILE" || true

              } >> "$REPORT"

            fi

          done

          cat "$REPORT"


      # ============================================================
      # Signatures and entitlements
      #
      # Do not blindly re-sign the whole bundle with
      # codesign --deep --force, because ShareExtension entitlements
      # could be destroyed.
      # ============================================================

      - name: Inspect code signatures
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p ../diagnostics

          REPORT="../diagnostics/codesign-report.txt"

          {
            echo "============================================================"
            echo "Main application signature"
            echo "============================================================"

            codesign -dvvv "$APP" 2>&1 || true

            echo
            echo "============================================================"
            echo "Main application entitlements"
            echo "============================================================"

            codesign \
              -d \
              --entitlements :- \
              "$APP" \
              2>&1 || true

            echo
            echo "============================================================"
            echo "Embedded extensions"
            echo "============================================================"

            find "$APP" -type d -name '*.appex' -print |
            while read -r EXTENSION; do

              echo
              echo "------------------------------------------------------------"
              echo "$EXTENSION"
              echo "------------------------------------------------------------"

              codesign -dvvv "$EXTENSION" 2>&1 || true

              codesign \
                -d \
                --entitlements :- \
                "$EXTENSION" \
                2>&1 || true

            done

          } | tee "$REPORT"

          echo
          echo "============================================================"
          echo "Verify bundle"
          echo "============================================================"

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=4 \
            "$APP"


      # ============================================================
      # Package
      # ============================================================

      - name: Package High Sierra build
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p release

          OUTPUT="release/LocalSend-macOS-High-Sierra-10.13-x86_64.zip"

          rm -f "$OUTPUT"

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$APP" \
            "$OUTPUT"

          echo
          echo "Created:"
          ls -lh "$OUTPUT"


      # ============================================================
      # Upload successful build
      # ============================================================

      - name: Upload High Sierra build
        uses: actions/upload-artifact@v4
        with:
          name: LocalSend-macOS-High-Sierra-10.13-x86_64
          path: app/release/LocalSend-macOS-High-Sierra-10.13-x86_64.zip
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # Diagnostics — always collect
      # ============================================================

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p diagnostics


          cp \
            app/macos/Runner.xcodeproj/project.pbxproj \
            diagnostics/project.pbxproj.after-patch \
            2>/dev/null


          cp \
            app/macos/Podfile \
            diagnostics/Podfile.after-patch \
            2>/dev/null


          cp \
            app/macos/Runner/Configs/Release.xcconfig \
            diagnostics/Release.xcconfig.after-patch \
            2>/dev/null


          cp \
            swiftpm-resolve.log \
            diagnostics/swiftpm-resolve.log \
            2>/dev/null


          cp \
            flutter-config-only.log \
            diagnostics/flutter-config-only.log \
            2>/dev/null


          cp \
            flutter-macos-build.log \
            diagnostics/flutter-macos-build.log \
            2>/dev/null


          # --------------------------------------------------------
          # Collect all Package.resolved files without assuming
          # one specific Xcode workspace path.
          # --------------------------------------------------------

          python3 <<'PY'
          from pathlib import Path
          import shutil

          source = Path("app/macos")
          destination = Path("diagnostics")

          destination.mkdir(
              parents=True,
              exist_ok=True,
          )

          files = sorted(
              path
              for path in source.rglob("Package.resolved")
              if path.parent.name == "swiftpm"
          )

          for index, path in enumerate(files, start=1):

              relative = path.relative_to(source)

              safe_name = str(relative).replace(
                  "/",
                  "__",
              )

              output = destination / (
                  f"Package.resolved.{index}__{safe_name}"
              )

              shutil.copy2(
                  path,
                  output,
              )

              print(
                  f"Copied {path} -> {output}"
              )
          PY


          # --------------------------------------------------------
          # Collect patched gal source and podspec.
          # --------------------------------------------------------

          PUB_CACHE_ROOT="${PUB_CACHE:-$HOME/.pub-cache}"

          GAL_SWIFT="$(
            find "$PUB_CACHE_ROOT" \
              -type f \
              -path '*/gal-2.3.3/darwin/gal/Sources/gal/GalPlugin.swift' \
              -print \
              -quit
          )"

          GAL_PODSPEC="$(
            find "$PUB_CACHE_ROOT" \
              -type f \
              -path '*/gal-2.3.3/darwin/gal.podspec' \
              -print \
              -quit
          )"

          if [ -n "$GAL_SWIFT" ]; then
            cp \
              "$GAL_SWIFT" \
              diagnostics/GalPlugin.swift.after-patch \
              2>/dev/null

            cp \
              "${GAL_SWIFT}.original" \
              diagnostics/GalPlugin.swift.original \
              2>/dev/null
          fi

          if [ -n "$GAL_PODSPEC" ]; then
            cp \
              "$GAL_PODSPEC" \
              diagnostics/gal.podspec.after-patch \
              2>/dev/null

            cp \
              "${GAL_PODSPEC}.original" \
              diagnostics/gal.podspec.original \
              2>/dev/null
          fi


      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LocalSend-High-Sierra-build-diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30
