          python3 - "$APP" <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          app = Path(sys.argv[1])
          libraries = [
              "libswiftCore.dylib",
              "libswiftFoundation.dylib",
              "libswiftCoreGraphics.dylib",
          ]

          def parse_version(value):
              parts = [int(part) for part in value.split(".")]
              while len(parts) < 3:
                  parts.append(0)
              return tuple(parts[:3])

          for name in libraries:
              path = app / "Contents" / "Frameworks" / name
              output = subprocess.check_output(["otool", "-l", str(path)], text=True)
              versions = []

              minimum = re.search(
                  r"cmd LC_VERSION_MIN_MACOSX.*?\bversion\s+([0-9.]+)",
                  output,
                  flags=re.DOTALL,
              )
              build = re.search(
                  r"cmd LC_BUILD_VERSION.*?\bminos\s+([0-9.]+)",
                  output,
                  flags=re.DOTALL,
              )

              if minimum:
                  versions.append(minimum.group(1))
              if build:
                  versions.append(build.group(1))

              print(f"{name}: deployment markers = {versions}")
              for version in versions:
                  if parse_version(version) > parse_version("10.13"):
                      raise SystemExit(f"ERROR: {name} requires macOS {version}.")
          PY

          codesign --force --sign - "$FRAMEWORK"

          echo "============================================================"
          echo "FlutterMacOS AFTER"
          echo "============================================================"
          otool -l "$BINARY" | awk '
            /cmd LC_VERSION_MIN_MACOSX/ { show=1; count=0 }
            /cmd LC_BUILD_VERSION/ { show=1; count=0 }
            show { print; count++; if (count >= 10) show=0 }
          '
          otool -L "$BINARY"

          if ! otool -l "$BINARY" | grep -A4 'LC_VERSION_MIN_MACOSX' | grep -q 'version 10.13'; then
            echo "ERROR: FlutterMacOS is not marked for macOS 10.13."
            exit 1
          fi

          if otool -L "$BINARY" | grep -E '/usr/lib/swift/(libswiftCore|libswiftFoundation|libswiftCoreGraphics)\.dylib'; then
            echo "ERROR: Strong Swift system runtime dependency remains in FlutterMacOS."
            exit 1
          fi

          nm -u -m "$BINARY" > ../diagnostics/FlutterMacOS.undefined-symbols.txt 2>&1 || true

      - name: Force High Sierra minimum in application plist
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail
          PLIST="$APP/Contents/Info.plist"

          if /usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$PLIST" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c 'Set :LSMinimumSystemVersion 10.13' "$PLIST"
          else
            /usr/libexec/PlistBuddy -c 'Add :LSMinimumSystemVersion string 10.13' "$PLIST"
          fi

          /usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$PLIST"

      - name: Normalize and sign LaunchAtLogin helper
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ../diagnostics
          HELPER="$APP/Contents/Library/LoginItems/LaunchAtLoginHelper.app"
          test -d "$HELPER"
          HELPER_ENTITLEMENTS="../diagnostics/LaunchAtLoginHelper.entitlements.plist"

          cat > "$HELPER_ENTITLEMENTS" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.app-sandbox</key>
            <true/>
          </dict>
          </plist>
          EOF

          find "$HELPER" -type f -print0 \
          | while IFS= read -r -d '' FILE; do
              if ! file "$FILE" | grep -q 'Mach-O'; then
                continue
              fi

              ARCHES="$(lipo -archs "$FILE" 2>/dev/null || true)"
              echo "$FILE :: before=$ARCHES"

              if ! echo "$ARCHES" | grep -qw x86_64; then
                echo "ERROR: Helper Mach-O has no x86_64 slice: $FILE"
                exit 1
              fi

              if echo "$ARCHES" | grep -qw arm64; then
                TMP="$FILE.x86_64"
                lipo "$FILE" -thin x86_64 -output "$TMP"
                mv "$TMP" "$FILE"
                chmod +x "$FILE" || true
              fi

              FINAL_ARCHES="$(lipo -archs "$FILE")"
              echo "$FILE :: after=$FINAL_ARCHES"

              if echo "$FINAL_ARCHES" | grep -qw arm64; then
                echo "ERROR: arm64 remains in helper: $FILE"
                exit 1
              fi
            done

          if [ -d "$HELPER/Contents/Frameworks" ]; then
            find "$HELPER/Contents/Frameworks" -type f -print0 \
            | while IFS= read -r -d '' FILE; do
                if file "$FILE" | grep -q 'Mach-O'; then
                  codesign --force --sign - "$FILE"
                fi
              done
          fi

          codesign \
            --force \
            --sign - \
            --preserve-metadata=identifier,requirements \
            --entitlements "$HELPER_ENTITLEMENTS" \
            "$HELPER"

          codesign --verify --strict --verbose=4 "$HELPER"

          HELPER_BINARY="$HELPER/Contents/MacOS/LaunchAtLoginHelper"
          file "$HELPER_BINARY"
          lipo -archs "$HELPER_BINARY"
          otool -l "$HELPER_BINARY" | awk '
            /cmd LC_VERSION_MIN_MACOSX/ { show=1; count=0 }
            /cmd LC_BUILD_VERSION/ { show=1; count=0 }
            show { print; count++; if (count >= 8) show=0 }
          '

      - name: Verify ShareExtension isolation
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail
          EXTENSION="$APP/Contents/PlugIns/ShareExtension.appex"
          BINARY="$EXTENSION/Contents/MacOS/ShareExtension"
          test -f "$BINARY"

          otool -L "$BINARY" \
            | tee ../diagnostics/ShareExtension.linked-libraries.txt

          python3 - ../diagnostics/ShareExtension.linked-libraries.txt <<'PY'
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text()
          forbidden = [
              "Defaults.framework",
              "connectivity_plus.framework",
              "desktop_drop.framework",
              "device_info_plus.framework",
              "dynamic_color.framework",
              "file_picker.framework",
              "file_selector_macos.framework",
              "gal.framework",
              "network_info_plus.framework",
              "open_file_mac.framework",
              "package_info_plus.framework",
              "pasteboard.framework",
              "photo_manager.framework",
              "rust_lib_localsend_app.framework",
              "screen_retriever_macos.framework",
              "shared_preferences_foundation.framework",
              "tray_manager.framework",
              "uri_content.framework",
              "url_launcher_macos.framework",
              "video_player_avfoundation.framework",
              "wakelock_plus.framework",
              "window_manager.framework",
              "/Photos.framework/",
              "/PhotosUI.framework/",
              "/CoreWLAN.framework/",
              "/SystemConfiguration.framework/",
          ]

          found = [token for token in forbidden if token in text]
          if found:
              print("ERROR: ShareExtension is still polluted:")
              for token in found:
                  print("  " + token)
              raise SystemExit(1)

          print("PASS: ShareExtension links no Runner/CocoaPods frameworks.")
          PY

          ARCHES="$(lipo -archs "$BINARY")"
          if [ "$ARCHES" != "x86_64" ]; then
            echo "ERROR: ShareExtension is not x86_64-only: $ARCHES"
            exit 1
          fi

          otool -l "$BINARY" | awk '
            /cmd LC_VERSION_MIN_MACOSX/ { show=1; count=0 }
            /cmd LC_BUILD_VERSION/ { show=1; count=0 }
            show { print; count++; if (count >= 8) show=0 }
          '

      - name: Re-sign LocalSend application
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail
          ENTITLEMENTS="../diagnostics/LocalSend.entitlements.original.plist"
          test -f "$ENTITLEMENTS"

          codesign \
            --force \
            --sign - \
            --preserve-metadata=identifier,requirements \
            --entitlements "$ENTITLEMENTS" \
            "$APP"

          codesign --verify --deep --strict --verbose=4 "$APP"

      - name: Verify final x86_64 application
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail
          MAIN="$APP/Contents/MacOS/$APP_EXECUTABLE"
          MAIN_ARCHS="$(lipo -archs "$MAIN")"
          echo "Main executable: $MAIN_ARCHS"

          if [ "$MAIN_ARCHS" != "x86_64" ]; then
            echo "ERROR: Main executable is not x86_64-only."
            exit 1
          fi

          ARM64_REPORT="../diagnostics/remaining-arm64-binaries.txt"
          : > "$ARM64_REPORT"

          find "$APP" -type f -print0 \
          | while IFS= read -r -d '' FILE; do
              if ! file "$FILE" | grep -q 'Mach-O'; then
                continue
              fi
              ARCHES="$(lipo -archs "$FILE" 2>/dev/null || true)"
              if echo "$ARCHES" | grep -qw arm64; then
                echo "$FILE :: $ARCHES" | tee -a "$ARM64_REPORT"
              fi
            done

          if [ -s "$ARM64_REPORT" ]; then
            echo "WARNING: Some nested binaries remain universal."
            cat "$ARM64_REPORT"
          fi

      - name: Audit final Mach-O deployment targets
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail
          REPORT="../diagnostics/macho-deployment-targets.txt"
          : > "$REPORT"

          find "$APP" -type f -print0 \
          | while IFS= read -r -d '' FILE; do
              if ! file "$FILE" | grep -q 'Mach-O'; then
                continue
              fi

              {
                echo
                echo "============================================================"
                echo "$FILE"
                echo "============================================================"
                file "$FILE"
                echo "--- Architectures ---"
                lipo -archs "$FILE" 2>/dev/null || true
                echo "--- Deployment ---"
                otool -l "$FILE" | awk '
                  /cmd LC_VERSION_MIN_MACOSX/ { show=1; count=0 }
                  /cmd LC_BUILD_VERSION/ { show=1; count=0 }
                  show { print; count++; if (count >= 10) show=0 }
                '
                echo "--- Linked libraries ---"
                otool -L "$FILE" || true
              } >> "$REPORT"
            done

          FLUTTER_BINARY="$APP/Contents/Frameworks/FlutterMacOS.framework/Versions/A/FlutterMacOS"
          echo "============================================================"
          echo "Final FlutterMacOS deployment marker"
          echo "============================================================"
          otool -l "$FLUTTER_BINARY" | awk '
            /cmd LC_VERSION_MIN_MACOSX/ { show=1; count=0 }
            /cmd LC_BUILD_VERSION/ { show=1; count=0 }
            show { print; count++; if (count >= 10) show=0 }
          '

      - name: Inspect final code signatures
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          {
            echo "============================================================"
            echo "LocalSend"
            echo "============================================================"
            codesign --display --verbose=4 "$APP" 2>&1

            echo
            echo "============================================================"
            echo "LocalSend entitlements"
            echo "============================================================"
            codesign --display --entitlements - --xml "$APP" 2>/dev/null || true

            echo
            echo "============================================================"
            echo "FlutterMacOS"
            echo "============================================================"
            codesign --display --verbose=4 "$APP/Contents/Frameworks/FlutterMacOS.framework" 2>&1

            echo
            echo "============================================================"
            echo "ShareExtension"
            echo "============================================================"
            codesign --display --verbose=4 "$APP/Contents/PlugIns/ShareExtension.appex" 2>&1

            echo
            echo "============================================================"
            echo "LaunchAtLoginHelper"
            echo "============================================================"
            codesign --display --verbose=4 "$APP/Contents/Library/LoginItems/LaunchAtLoginHelper.app" 2>&1
          } | tee ../diagnostics/codesign-report.txt

          codesign --verify --deep --strict --verbose=4 "$APP"

      - name: Package High Sierra build
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release
          OUTPUT="release/LocalSend-macOS-High-Sierra-10.13-x86_64.zip"
          rm -f "$OUTPUT"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$OUTPUT"
          ls -lh "$OUTPUT"

      - name: Upload High Sierra build
        id: upload_build
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: LocalSend-macOS-High-Sierra-10.13-x86_64
          path: app/release/LocalSend-macOS-High-Sierra-10.13-x86_64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Retry High Sierra build upload
        if: steps.upload_build.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: LocalSend-macOS-High-Sierra-10.13-x86_64-retry
          path: app/release/LocalSend-macOS-High-Sierra-10.13-x86_64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics

          cp app/macos/Runner.xcodeproj/project.pbxproj diagnostics/project.pbxproj.after-patch 2>/dev/null
          cp app/macos/Podfile diagnostics/Podfile.after-patch 2>/dev/null
          cp app/macos/Podfile.lock diagnostics/Podfile.lock.after-patch 2>/dev/null
          cp app/pubspec.yaml diagnostics/pubspec.yaml.after-foss-strip 2>/dev/null
          cp app/.flutter-plugins-dependencies diagnostics/flutter-plugins-dependencies.json 2>/dev/null
          cp app/macos/Runner/Configs/Release.xcconfig diagnostics/Release.xcconfig.after-patch 2>/dev/null
          cp app/macos/Flutter/Flutter-Release.xcconfig diagnostics/Flutter-Release.xcconfig 2>/dev/null
          cp app/macos/Flutter/Flutter-Debug.xcconfig diagnostics/Flutter-Debug.xcconfig 2>/dev/null
          cp app/macos/Runner/Shared.swift diagnostics/Runner-Shared.after-patch.swift 2>/dev/null
          cp app/macos/ShareExtension/Utilities.swift diagnostics/ShareExtension-Utilities.high-sierra.swift 2>/dev/null
          cp app/macos/ShareExtension/ShareController.swift diagnostics/ShareController.high-sierra.swift 2>/dev/null
          cp flutter-config-first.log diagnostics/flutter-config-first.log 2>/dev/null
          cp flutter-config-final.log diagnostics/flutter-config-final.log 2>/dev/null
          cp flutter-macos-build.log diagnostics/flutter-macos-build.log 2>/dev/null
          cp pod-install.log diagnostics/pod-install.log 2>/dev/null
          cp pod-env.log diagnostics/pod-env.log 2>/dev/null
          cp swiftpm-resolve.log diagnostics/swiftpm-resolve.log 2>/dev/null
          cp flutter-pub-deps.txt diagnostics/flutter-pub-deps.txt 2>/dev/null
          cp flutter-podhelper.rb.original diagnostics/flutter-podhelper.rb.original 2>/dev/null
          cp "$FLUTTER_ROOT/packages/flutter_tools/bin/podhelper.rb" diagnostics/flutter-podhelper.rb.after-patch 2>/dev/null
          cp app/macos/Flutter/ephemeral/FlutterMacOS.podspec diagnostics/FlutterMacOS.podspec.generated 2>/dev/null

          FINAL_FLUTTER="$(find app/build/macos/Build/Products/Release -path '*/FlutterMacOS.framework/Versions/A/FlutterMacOS' -type f -print -quit)"
          if [ -n "$FINAL_FLUTTER" ]; then
            cp "$FINAL_FLUTTER" diagnostics/FlutterMacOS.after-backport 2>/dev/null
          fi

      - name: Pack diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          rm -f LocalSend-High-Sierra-build-diagnostics.zip
          if [ -d diagnostics ]; then
            ditto \
              -c \
              -k \
              --sequesterRsrc \
              --keepParent \
              diagnostics \
              LocalSend-High-Sierra-build-diagnostics.zip
          fi

      - name: Upload build diagnostics
        id: upload_diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: LocalSend-High-Sierra-build-diagnostics
          path: LocalSend-High-Sierra-build-diagnostics.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Retry diagnostics upload
        if: >
          always() &&
          steps.upload_diagnostics.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: LocalSend-High-Sierra-build-diagnostics-retry
          path: LocalSend-High-Sierra-build-diagnostics.zip
          if-no-files-found: warn
          retention-days: 30
