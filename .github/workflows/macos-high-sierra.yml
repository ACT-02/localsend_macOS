          echo "============================================================"

          echo "${{ steps.flutter_config_first.outcome }}"


          echo
          echo "============================================================"
          echo "Ruby / CocoaPods"
          echo "============================================================"

          which ruby
          ruby --version
          which pod
          pod --version


          echo
          echo "============================================================"
          echo "Podfile syntax"
          echo "============================================================"

          ruby -c Podfile


          GENERATED_XCCONFIG="Flutter/ephemeral/Flutter-Generated.xcconfig"


          if [ ! -f "$GENERATED_XCCONFIG" ]; then

            echo "ERROR:"
            echo "$GENERATED_XCCONFIG does not exist."
            echo "See flutter-config-first.log."

            exit 1
          fi


          echo
          echo "============================================================"
          echo "Flutter generated xcconfig"
          echo "============================================================"

          cat "$GENERATED_XCCONFIG"


          echo
          echo "============================================================"
          echo "CocoaPods environment"
          echo "============================================================"

          pod env \
            2>&1 | tee ../../pod-env.log


          rm -rf Pods
          rm -f Podfile.lock


          echo
          echo "============================================================"
          echo "pod install --verbose"
          echo "============================================================"


          set +e

          pod install \
            --verbose \
            2>&1 | tee ../../pod-install.log

          POD_STATUS="${PIPESTATUS[0]}"

          set -e


          echo
          echo "============================================================"
          echo "Generated FlutterMacOS.podspec"
          echo "============================================================"


          FLUTTER_MACOS_PODSPEC="Flutter/ephemeral/FlutterMacOS.podspec"


          if [ -f "$FLUTTER_MACOS_PODSPEC" ]; then
            cat "$FLUTTER_MACOS_PODSPEC"
          else
            echo "(not generated)"
          fi


          if [ "$POD_STATUS" -ne 0 ]; then

            echo
            echo "============================================================"
            echo "CocoaPods failure summary"
            echo "============================================================"

            grep -n -A12 -B4 \
              -E \
              '^\[!\]|required a higher minimum deployment target|could not find compatible versions|ERROR|Error' \
              ../../pod-install.log \
              | tail -n 200 \
              || true

            echo
            echo "ERROR:"
            echo "pod install failed with status $POD_STATUS."

            exit "$POD_STATUS"
          fi


          if [ ! -f "$FLUTTER_MACOS_PODSPEC" ]; then
            echo "ERROR: FlutterMacOS.podspec was not generated."
            exit 1
          fi


          if ! grep -q \
            "s.osx.deployment_target = '10.13'" \
            "$FLUTTER_MACOS_PODSPEC"; then

            echo "ERROR:"
            echo "FlutterMacOS.podspec does not target 10.13."

            exit 1
          fi


          echo
          echo "CocoaPods dependency resolution succeeded."


      # ============================================================
      # Final Flutter config pass
      # ============================================================

      - name: Finalize Flutter macOS configuration
        working-directory: app
        shell: bash
        run: |
          set -o pipefail

