                  r"\.\s*main\s*"
                  r"\.\s*async\s*\{",

              "NSWorkspace.open":
                  r"NSWorkspace\s*"
                  r"\.\s*shared\s*"
                  r"\.\s*open\s*\(",
          }


          missing = []


          for name, pattern in required.items():

              if not re.search(
                  pattern,
