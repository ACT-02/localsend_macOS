            --config-only \
            -v \
            2>&1 | tee ../flutter-config-final.log


      # ============================================================
      # Validate generated FlutterMacOS podspec
      # ============================================================

      - name: Verify FlutterMacOS podspec target
        working-directory: app/macos
        shell: bash
        run: |
