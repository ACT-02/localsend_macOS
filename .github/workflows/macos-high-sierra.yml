      # ============================================================
      # Effective Xcode settings
      # ============================================================

      - name: Verify effective Xcode build settings
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p \
            ../diagnostics


          xcodebuild \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -showBuildSettings \
            > ../diagnostics/runner-build-settings.txt


          xcodebuild \
            -project macos/Runner.xcodeproj \
            -target ShareExtension \
            -configuration Release \
            -showBuildSettings \
            > ../diagnostics/shareextension-build-settings.txt


          echo "============================================================"
          echo "Runner settings"
          echo "============================================================"

          grep -E \
            'ARCHS|EXCLUDED_ARCHS|ONLY_ACTIVE_ARCH|MACOSX_DEPLOYMENT_TARGET|LOCALSEND_LEGACY_MACOS_TARGET' \
            ../diagnostics/runner-build-settings.txt \
            || true


          echo
          echo "============================================================"
          echo "ShareExtension settings"
          echo "============================================================"

          grep -E \
            'ARCHS|EXCLUDED_ARCHS|ONLY_ACTIVE_ARCH|MACOSX_DEPLOYMENT_TARGET|LOCALSEND_LEGACY_MACOS_TARGET' \
            ../diagnostics/shareextension-build-settings.txt \
            || true


          python3 <<'PY'
          from pathlib import Path
          import re

          files = [
              Path(
                  "../diagnostics/"
                  "runner-build-settings.txt"
              ),
              Path(
                  "../diagnostics/"
                  "shareextension-build-settings.txt"
              ),
          ]

          for path in files:
              text = path.read_text()

              deployments = re.findall(
                  r"^\s*MACOSX_DEPLOYMENT_TARGET"
                  r"\s*=\s*(.*?)\s*$",
                  text,
                  flags=re.MULTILINE,
              )

              archs = re.findall(
                  r"^\s*ARCHS"
                  r"\s*=\s*(.*?)\s*$",
                  text,
                  flags=re.MULTILINE,
              )

              excluded = re.findall(
                  r"^\s*EXCLUDED_ARCHS"
                  r"\s*=\s*(.*?)\s*$",
                  text,
                  flags=re.MULTILINE,
              )

              only_active = re.findall(
                  r"^\s*ONLY_ACTIVE_ARCH"
                  r"\s*=\s*(.*?)\s*$",
                  text,
                  flags=re.MULTILINE,
              )

              print()
              print(path)

              print(
                  "  deployment:",
                  deployments[:3],
              )

              print(
                  "  ARCHS:",
                  archs[:3],
              )

              print(
                  "  EXCLUDED_ARCHS:",
                  excluded[:3],
              )

              print(
                  "  ONLY_ACTIVE_ARCH:",
                  only_active[:3],
              )


              if not deployments:
                  raise SystemExit(
                      f"ERROR: {path}: "
                      "deployment target missing."
                  )


              if deployments[0] != "10.13":
                  raise SystemExit(
                      f"ERROR: {path}: "
                      f"deployment target = "
                      f"{deployments[0]!r}"
                  )


              if not archs:
                  raise SystemExit(
                      f"ERROR: {path}: ARCHS missing."
                  )


              if "x86_64" not in archs[0].split():
                  raise SystemExit(
                      f"ERROR: {path}: x86_64 missing."
                  )


              if (
                  excluded
                  and "arm64"
                  not in excluded[0].split()
              ):
                  raise SystemExit(
                      f"ERROR: {path}: arm64 not excluded."
                  )


              if not only_active:
                  raise SystemExit(
                      f"ERROR: {path}: "
                      "ONLY_ACTIVE_ARCH missing."
                  )


              if only_active[0] != "NO":
                  raise SystemExit(
                      f"ERROR: {path}: "
                      f"ONLY_ACTIVE_ARCH = "
                      f"{only_active[0]!r}; "
                      "expected NO."
                  )


          print()
          print(
              "Effective build settings are correct."
          )
          PY


      # ============================================================
      # Flutter Engine audit before build
      # ============================================================

      - name: Inspect FlutterMacOS engine
        shell: bash
        run: |
          set -euxo pipefail

          flutter precache --macos

          mkdir -p \
            diagnostics

          REPORT="diagnostics/flutter-engine-audit-prebuild.txt"

          : > "$REPORT"

          ENGINE_ROOT="$FLUTTER_ROOT/bin/cache/artifacts/engine"


          for ENGINE_DIR in \
            "$ENGINE_ROOT/darwin-x64" \
            "$ENGINE_ROOT/darwin-x64-release"
          do

            if [ ! -d "$ENGINE_DIR" ]; then

