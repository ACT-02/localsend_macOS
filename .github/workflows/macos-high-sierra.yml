          find "$APP" \
            -type f \
            -print0 \
          | while IFS= read -r -d '' FILE
            do

              if ! file "$FILE" \
                | grep -q \
                  'Mach-O'; then

                continue
              fi


              ARCHES="$(
                lipo \
                  -archs \
                  "$FILE" \
                  2>/dev/null \
                  || true
              )"


              if echo "$ARCHES" \
                | grep -qw \
