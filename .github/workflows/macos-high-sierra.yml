name: LocalSend macOS High Sierra Backport

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.9"
  RUST_VERSION: "1.97.1"
  LEGACY_MACOS_TARGET: "10.13"
  MACOSX_DEPLOYMENT_TARGET: "10.13"

jobs:
  build:
    name: Build LocalSend for macOS High Sierra
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - name: Backport FlutterMacOS podspec generator
        shell: bash
        run: |
          set -euxo pipefail
          PODHELPER="$FLUTTER_ROOT/packages/flutter_tools/bin/podhelper.rb"
          test -f "$PODHELPER"
          cp "$PODHELPER" flutter-podhelper.rb.original

          python3 - "$PODHELPER" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          if "s.osx.deployment_target = '10.13'" not in text:
              text, count = re.subn(
                  r"s\.osx\.deployment_target\s*=\s*['\"]10\.15['\"]",
                  "s.osx.deployment_target = '10.13'",
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(
                      "ERROR: FlutterMacOS 10.15 deployment target not found in podhelper.rb."
                  )
              path.write_text(text)

          if "s.osx.deployment_target = '10.13'" not in path.read_text():
              raise SystemExit("ERROR: FlutterMacOS podspec generator patch failed.")
          PY

          grep -n "s.osx.deployment_target" "$PODHELPER"

      - name: Show build environment
        shell: bash
        run: |
          set -euxo pipefail
          flutter --version
          dart --version
          rustc --version
          cargo --version
          xcodebuild -version
          ruby --version
          pod --version
          sw_vers
          uname -a
          uname -m
          xcrun --find vtool
          xcrun --find install_name_tool

      - name: Remove in-app purchases
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          pubspec = Path("app/pubspec.yaml")
          lines = pubspec.read_text().splitlines()
          marked = [line for line in lines if "# [FOSS_REMOVE]" in line]
          if not marked:
              raise SystemExit("ERROR: No # [FOSS_REMOVE] dependency found.")

          pubspec.write_text(
              "\n".join(line for line in lines if "# [FOSS_REMOVE]" not in line) + "\n"
          )

          for path in [
              Path("app/lib/config/init.dart"),
              Path("app/lib/pages/donation/donation_page.dart"),
              Path("app/lib/pages/donation/donation_page_vm.dart"),
          ]:
              text = path.read_text()
              if "// [FOSS_REMOVE_START]" not in text or "// [FOSS_REMOVE_END]" not in text:
                  raise SystemExit(f"ERROR: FOSS block markers missing in {path}")
              path.write_text(
                  text.replace("// [FOSS_REMOVE_START]", "/*")
                      .replace("// [FOSS_REMOVE_END]", "*/")
              )

          provider = Path("app/lib/provider/purchase_provider.dart")
          if not provider.exists():
              raise SystemExit("ERROR: purchase_provider.dart missing.")
          provider.unlink()

          donation = Path("app/lib/pages/donation/donation_page.dart")
          donation.write_text(
              donation.read_text().replace(
                  "donationPageVmProvider",
                  "donationPageNoopVmProvider",
              )
          )

          if "in_app_purchase:" in pubspec.read_text():
              raise SystemExit("ERROR: in_app_purchase remains in pubspec.yaml.")
          PY

          rm -f app/macos/Podfile.lock

      - name: Flutter clean
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail
          flutter clean

      - name: Flutter pub get
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail
          flutter pub get

      - name: Verify StoreKit removal
        shell: bash
        run: |
          set -euxo pipefail
          cd app
          flutter pub deps --style=compact > ../flutter-pub-deps.txt
          cd ..

          if grep -E '(^|[[:space:]])in_app_purchase(_storekit)?([[:space:]]|$)' flutter-pub-deps.txt; then
            echo "ERROR: in_app_purchase remains in dependency graph."
            exit 1
          fi

          if grep -q 'in_app_purchase_storekit' app/.flutter-plugins-dependencies; then
            echo "ERROR: in_app_purchase_storekit remains in Flutter plugin graph."
            exit 1
          fi

      - name: Backport macOS Flutter plugin podspecs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p diagnostics
          cp app/.flutter-plugins-dependencies diagnostics/flutter-plugins-dependencies.json

          python3 <<'PY'
          import json
          import re
          import shutil
          from pathlib import Path

          plugins_file = Path("app/.flutter-plugins-dependencies")
          data = json.loads(plugins_file.read_text())
          plugins = data.get("plugins", {}).get("macos", [])
          report = []

          for plugin in plugins:
              name = plugin.get("name")
              raw_path = plugin.get("path")
              if not name or not raw_path or not plugin.get("native_build", True):
                  continue

              platform_dir = "darwin" if plugin.get("shared_darwin_source", False) else "macos"
              podspec = Path(raw_path) / platform_dir / f"{name}.podspec"

              if not podspec.exists():
                  report.append({"plugin": name, "status": "no podspec"})
                  continue

              original = podspec.read_text()
              text = original
              text = re.sub(
                  r"([A-Za-z_][A-Za-z0-9_]*\.osx\.deployment_target\s*=\s*)(['\"])[0-9.]+\2",
                  r"\1'10.13'",
                  text,
              )
              text = re.sub(
                  r"([A-Za-z_][A-Za-z0-9_]*\.platform\s*=\s*:osx\s*,\s*)(['\"])[0-9.]+\2",
                  r"\1'10.13'",
                  text,
              )

              if text != original:
                  backup = podspec.with_suffix(podspec.suffix + ".high-sierra-original")
                  if not backup.exists():
                      shutil.copy2(podspec, backup)
                  podspec.write_text(text)
                  status = "patched"
              else:
                  status = "unchanged"

              report.append({"plugin": name, "podspec": str(podspec), "status": status})
              print(f"{name}: {status}: {podspec}")

          Path("diagnostics/plugin-podspec-backport-report.json").write_text(
              json.dumps(report, indent=2) + "\n"
          )
          PY

      - name: Backport gal for High Sierra
        shell: bash
        run: |
          set -euxo pipefail
          PUB_CACHE_ROOT="${PUB_CACHE:-$HOME/.pub-cache}"
          GAL_SWIFT="$(find "$PUB_CACHE_ROOT" -type f -path '*/gal-2.3.3/darwin/gal/Sources/gal/GalPlugin.swift' -print -quit)"
          if [ -z "$GAL_SWIFT" ]; then
            echo "ERROR: GalPlugin.swift not found."
            exit 1
          fi

          cp "$GAL_SWIFT" "${GAL_SWIFT}.original"

          cat > "$GAL_SWIFT" <<'SWIFT'
          import Cocoa
          import FlutterMacOS

          public class GalPlugin: NSObject, FlutterPlugin {
            public static func register(with registrar: FlutterPluginRegistrar) {
              let channel = FlutterMethodChannel(
                name: "gal",
                binaryMessenger: registrar.messenger
              )
              registrar.addMethodCallDelegate(GalPlugin(), channel: channel)
            }

            public func handle(
              _ call: FlutterMethodCall,
              result: @escaping FlutterResult
            ) {
              switch call.method {
              case "hasAccess", "requestAccess":
                result(false)
              case "putVideo", "putImage", "putImageBytes":
                result(
                  FlutterError(
                    code: "ACCESS_DENIED",
                    message: "Direct Photos-library saving is unavailable in the macOS High Sierra build.",
                    details: nil
                  )
                )
              case "open":
                if let url = URL(string: "photos://") {
                  _ = NSWorkspace.shared.open(url)
                }
                result(nil)
              default:
                result(FlutterMethodNotImplemented)
              }
            }
          }
          SWIFT

          if grep -E '^[[:space:]]*import[[:space:]]+Photos([[:space:]]|$)' "$GAL_SWIFT"; then
            echo "ERROR: Photos import remains in GalPlugin.swift."
            exit 1
          fi

      - name: Backport connectivity_plus for High Sierra
        shell: bash
        run: |
          set -euxo pipefail

          CONNECTIVITY_ROOT="$(
            python3 <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("app/.flutter-plugins-dependencies").read_text())
          for plugin in data.get("plugins", {}).get("macos", []):
              if plugin.get("name") == "connectivity_plus":
                  print(plugin["path"])
                  break
          PY
          )"

          if [ -z "$CONNECTIVITY_ROOT" ]; then
            echo "ERROR: connectivity_plus missing from plugin graph."
            exit 1
          fi

          SOURCE="$CONNECTIVITY_ROOT/macos/connectivity_plus/Sources/connectivity_plus/PathMonitorConnectivityProvider.swift"
          PODSPEC="$CONNECTIVITY_ROOT/macos/connectivity_plus.podspec"
          test -f "$SOURCE"
          test -f "$PODSPEC"
          cp "$SOURCE" "${SOURCE}.high-sierra-original"
          cp "$PODSPEC" "${PODSPEC}.high-sierra-specific-original"

          cat > "$SOURCE" <<'SWIFT'
          import Foundation
          import SystemConfiguration
          import CoreWLAN
          import Darwin

          public class PathMonitorConnectivityProvider: NSObject, ConnectivityProvider {
            private let queue = DispatchQueue(
              label: "dev.fluttercommunity.plus.connectivity.high-sierra"
            )
            private var timer: DispatchSourceTimer?
            private var lastSignature = ""
            public var connectivityUpdateHandler: ConnectivityUpdateHandler?

            override init() {
              super.init()
              lastSignature = signature(for: detectConnectivityTypes())
            }

            deinit {
              stop()
            }

            public var currentConnectivityTypes: [ConnectivityType] {
              return detectConnectivityTypes()
            }

            public func start() {
              if timer != nil { return }
              let source = DispatchSource.makeTimerSource(queue: queue)
              source.schedule(
                deadline: .now(),
                repeating: .seconds(2),
                leeway: .milliseconds(250)
              )
              source.setEventHandler { [weak self] in
                guard let self = self else { return }
                let current = self.detectConnectivityTypes()
                let currentSignature = self.signature(for: current)
                if currentSignature != self.lastSignature {
                  self.lastSignature = currentSignature
                  self.connectivityUpdateHandler?(current)
                }
              }
              timer = source
              source.resume()
            }

            public func stop() {
              guard let source = timer else { return }
              source.setEventHandler {}
              source.cancel()
              timer = nil
            }

            private func detectConnectivityTypes() -> [ConnectivityType] {
              guard isReachable() else { return [.none] }
              let active = activeInterfaceNames()
              if active.isEmpty { return [.other] }
              let wifi = wifiInterfaceNames()
              var result: [ConnectivityType] = []

              if active.contains(where: { wifi.contains($0) }) {
                result.append(.wifi)
              }

              let ethernet = active.contains { interfaceName in
                interfaceName.hasPrefix("en") && !wifi.contains(interfaceName)
              }
              if ethernet { result.append(.wiredEthernet) }
              if result.isEmpty { result.append(.other) }
              return result
            }

            private func isReachable() -> Bool {
              var address = sockaddr_in()
              address.sin_len = UInt8(MemoryLayout<sockaddr_in>.size)
              address.sin_family = sa_family_t(AF_INET)

              let reachability: SCNetworkReachability? = withUnsafePointer(to: &address) { pointer in
                pointer.withMemoryRebound(to: sockaddr.self, capacity: 1) { sockaddrPointer in
                  SCNetworkReachabilityCreateWithAddress(nil, sockaddrPointer)
                }
              }

              guard let target = reachability else { return false }
              var flags = SCNetworkReachabilityFlags()
              guard SCNetworkReachabilityGetFlags(target, &flags) else { return false }

              return flags.contains(.reachable)
                && !flags.contains(.connectionRequired)
                && !flags.contains(.interventionRequired)
            }

            private func activeInterfaceNames() -> Set<String> {
              var first: UnsafeMutablePointer<ifaddrs>?
              guard getifaddrs(&first) == 0, let start = first else { return [] }
              defer { freeifaddrs(start) }

              var result = Set<String>()
              var current: UnsafeMutablePointer<ifaddrs>? = start

              while let pointer = current {
                let interface = pointer.pointee
                if let socket = interface.ifa_addr {
                  let family = Int32(socket.pointee.sa_family)
                  let flags = interface.ifa_flags
                  let up = (flags & UInt32(IFF_UP)) != 0
                  let running = (flags & UInt32(IFF_RUNNING)) != 0
                  let loopback = (flags & UInt32(IFF_LOOPBACK)) != 0

                  if (family == AF_INET || family == AF_INET6)
                    && up && running && !loopback
                  {
                    let name = String(cString: interface.ifa_name)
                    if !name.hasPrefix("awdl") && !name.hasPrefix("llw") {
                      result.insert(name)
                    }
                  }
                }
                current = interface.ifa_next
              }

              return result
            }

            private func wifiInterfaceNames() -> Set<String> {
              guard let interfaces = CWWiFiClient.shared().interfaces() else { return [] }
              return Set(interfaces.compactMap { $0.interfaceName })
            }

            private func signature(for types: [ConnectivityType]) -> String {
              return types.map { type in
                switch type {
                case .none: return "none"
                case .wiredEthernet: return "ethernet"
                case .wifi: return "wifi"
                case .cellular: return "cellular"
                case .satellite: return "satellite"
                case .other: return "other"
                }
              }
              .sorted()
              .joined(separator: ",")
            }
          }
          SWIFT

          python3 - "$PODSPEC" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          if "SystemConfiguration" not in text or "CoreWLAN" not in text:
              framework_line = "  s.frameworks = 'SystemConfiguration', 'CoreWLAN'\n"
              marker = "  s.swift_version = '5.0'\n"
              if marker in text:
                  text = text.replace(marker, framework_line + marker, 1)
              else:
                  index = text.rfind("\nend")
                  if index == -1:
                      raise SystemExit("ERROR: Could not patch connectivity_plus podspec.")
                  text = text[:index] + "\n" + framework_line + text[index:]

          path.write_text(text)
          PY

          python3 - "$SOURCE" <<'PY'
          import re
          import sys
          from pathlib import Path

          source = Path(sys.argv[1]).read_text()
          source = re.sub(r"/\*.*?\*/", "", source, flags=re.DOTALL)
          source = re.sub(r"//[^\n]*", "", source)

          for pattern in [
              r"(?m)^\s*import\s+Network\s*$",
              r"\bNWPathMonitor\b",
              r"\bNWPath\b",
              r"\bNWInterface\b",
          ]:
              if re.search(pattern, source):
                  raise SystemExit("ERROR: Network.framework API remains in connectivity_plus.")

          print("PASS: connectivity_plus High Sierra shim validated.")
          PY

      - name: Prepare Cargokit
        working-directory: packages/localsend_isolates/rust_builder/cargokit/build_tool
        shell: bash
        run: |
          set -euxo pipefail
          flutter pub get

      - name: Verify Rust workspace
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p diagnostics
          cargo metadata --format-version=1 --no-deps > diagnostics/cargo-metadata.json

      # The project-level Release.xcconfig includes Flutter-Release.xcconfig,
      # which includes Pods-Runner.release.xcconfig. ShareExtension therefore
      # needs target-level empty overrides so it cannot inherit Runner Pods.
      - name: Patch LocalSend Xcode project
        shell: bash
        run: |
          set -euxo pipefail
          PBX="app/macos/Runner.xcodeproj/project.pbxproj"
          RELEASE_XCCONFIG="app/macos/Runner/Configs/Release.xcconfig"

          python3 - "$PBX" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          # --------------------------------------------------------
          # Deployment / Intel / High Sierra settings
          # --------------------------------------------------------
          text, count = re.subn(
              r'MACOSX_DEPLOYMENT_TARGET\s*=\s*[0-9.]+;',
              'MACOSX_DEPLOYMENT_TARGET = "$(LOCALSEND_LEGACY_MACOS_TARGET)";',
              text,
          )
          if count == 0:
              raise SystemExit("ERROR: No Xcode deployment targets found.")

          text = re.sub(
              r'ENABLE_HARDENED_RUNTIME\s*=\s*YES;',
              'ENABLE_HARDENED_RUNTIME = NO;',
              text,
          )

          global_settings = (
              "buildSettings = {\n"
              "\t\t\t\tLOCALSEND_LEGACY_MACOS_TARGET = 10.13;\n"
              "\t\t\t\tARCHS = x86_64;\n"
              "\t\t\t\tEXCLUDED_ARCHS = arm64;\n"
              "\t\t\t\tONLY_ACTIVE_ARCH = NO;\n"
              "\t\t\t\tENABLE_HARDENED_RUNTIME = NO;\n"
          )
          text = text.replace("buildSettings = {\n", global_settings)
          text = re.sub(
              r'ONLY_ACTIVE_ARCH\s*=\s*(?:YES|NO);',
              'ONLY_ACTIVE_ARCH = NO;',
              text,
          )

          # --------------------------------------------------------
          # Ad-hoc signing
          # --------------------------------------------------------
          text = re.sub(
              r'DEVELOPMENT_TEAM\s*=\s*[A-Z0-9]+;',
              'DEVELOPMENT_TEAM = "";',
              text,
          )
          text = re.sub(
              r'CODE_SIGN_STYLE\s*=\s*Automatic;',
              'CODE_SIGN_STYLE = Manual;',
              text,
          )
          text = re.sub(
              r'CODE_SIGN_IDENTITY\s*=\s*"(?:Apple Development|Mac Development|Mac Developer)";',
              'CODE_SIGN_IDENTITY = "-";',
              text,
          )
          text = re.sub(
              r'("CODE_SIGN_IDENTITY\[sdk=macosx\*\]"\s*=\s*)"(?:Apple Development|Mac Development|Mac Developer)";',
              r'\1"-";',
              text,
          )
          text = re.sub(
              r'PROVISIONING_PROFILE_SPECIFIER\s*=\s*"[^"]*";',
              'PROVISIONING_PROFILE_SPECIFIER = "";',
              text,
          )

          # --------------------------------------------------------
          # Find ShareExtension's target configuration list.
          # --------------------------------------------------------
          target_match = re.search(
              r'[0-9A-F]+\s*/\*\s*ShareExtension\s*\*/\s*=\s*\{'
              r'.*?buildConfigurationList\s*=\s*([0-9A-F]+)\s*/\*\s*'
              r'Build configuration list for PBXNativeTarget "ShareExtension"\s*\*/;',
              text,
              flags=re.DOTALL,
          )
          if not target_match:
              raise SystemExit("ERROR: ShareExtension target configuration list not found.")

          config_list_id = target_match.group(1)
          config_list_match = re.search(
              re.escape(config_list_id)
              + r'\s*/\*\s*Build configuration list for PBXNativeTarget "ShareExtension"\s*\*/'
              + r'\s*=\s*\{.*?buildConfigurations\s*=\s*\((.*?)\);.*?\};',
              text,
              flags=re.DOTALL,
          )
          if not config_list_match:
              raise SystemExit("ERROR: ShareExtension configuration list body not found.")

          config_pairs = re.findall(
              r'([0-9A-F]+)\s*/\*\s*(Debug|Release|Profile)\s*\*/',
              config_list_match.group(1),
          )
          if len(config_pairs) != 3:
              raise SystemExit(
                  f"ERROR: Expected Debug/Release/Profile ShareExtension configs; got {config_pairs!r}."
              )

          isolation_settings = [
              'OTHER_LDFLAGS = "";',
              'FRAMEWORK_SEARCH_PATHS = "";',
              'HEADER_SEARCH_PATHS = "";',
              'OTHER_SWIFT_FLAGS = "";',
              'GCC_PREPROCESSOR_DEFINITIONS = "";',
              'PODS_ROOT = "";',
              'PODS_PODFILE_DIR_PATH = "";',
          ]

          # --------------------------------------------------------
          # Inject target-level settings into each ShareExtension
          # XCBuildConfiguration. These override project-level
          # Pods-Runner settings. Do NOT use $(inherited).
          # --------------------------------------------------------
          for config_id, config_name in config_pairs:
              pattern = re.compile(
                  r'('
                  + re.escape(config_id)
                  + r'\s*/\*\s*'
                  + re.escape(config_name)
                  + r'\s*\*/\s*=\s*\{\s*isa\s*=\s*XCBuildConfiguration;'
                  + r'\s*buildSettings\s*=\s*\{\n)'
                  + r'(.*?)'
                  + r'(\n\s*\};.*?\n\s*name\s*=\s*'
                  + re.escape(config_name)
                  + r';\s*\n\s*\};)',
                  flags=re.DOTALL,
              )
              match = pattern.search(text)
              if not match:
                  raise SystemExit(
                      f"ERROR: ShareExtension {config_name} buildSettings block not found."
                  )

              body = match.group(2)
              keys = [
                  "OTHER_LDFLAGS",
                  "FRAMEWORK_SEARCH_PATHS",
                  "HEADER_SEARCH_PATHS",
                  "OTHER_SWIFT_FLAGS",
                  "GCC_PREPROCESSOR_DEFINITIONS",
                  "PODS_ROOT",
                  "PODS_PODFILE_DIR_PATH",
              ]

              for key in keys:
                  body = re.sub(
                      r'^\s*' + re.escape(key) + r'\s*=\s*.*?;\s*$\n?',
                      '',
                      body,
                      flags=re.MULTILINE,
                  )
                  body = re.sub(
                      r'^\s*' + re.escape(key) + r'\s*=\s*\(.*?^\s*\);\s*$\n?',
                      '',
                      body,
                      flags=re.MULTILINE | re.DOTALL,
                  )

              injected = "".join(
                  "\t\t\t\t" + setting + "\n"
                  for setting in isolation_settings
              ) + body

              text = (
                  text[:match.start()]
                  + match.group(1)
                  + injected
                  + match.group(3)
                  + text[match.end():]
              )

          # --------------------------------------------------------
          # Remove Runner/Shared.swift from ShareExtension Sources.
          # --------------------------------------------------------
          source_blocks = list(re.finditer(
              r'([0-9A-F]+\s*/\*\s*Sources\s*\*/\s*=\s*\{.*?files\s*=\s*\()'
              r'(.*?)'
              r'(\);.*?\};)',
              text,
              flags=re.DOTALL,
          ))

          share_source = None
          for match in source_blocks:
              if "ShareController.swift in Sources" in match.group(2):
                  share_source = match
                  break

          if share_source is None:
              raise SystemExit("ERROR: ShareExtension Sources phase not found.")

          body = share_source.group(2)
          body, removed = re.subn(
              r'^.*Shared\.swift in Sources.*$\n?',
              '',
              body,
              count=1,
              flags=re.MULTILINE,
          )
          if removed != 1:
              raise SystemExit("ERROR: Could not remove Shared.swift from ShareExtension.")

          text = (
              text[:share_source.start()]
              + share_source.group(1)
              + body
              + share_source.group(3)
              + text[share_source.end():]
          )

          # --------------------------------------------------------
          # DockProgress -> exact 3.2.0
          # --------------------------------------------------------
          dock = re.compile(
              r'('
              r'[0-9A-F]+\s*/\*\s*XCRemoteSwiftPackageReference "DockProgress"\s*\*/'
              r'\s*=\s*\{.*?repositoryURL\s*=\s*'
              r'"https://github\.com/sindresorhus/DockProgress";'
              r'\s*requirement\s*=\s*\{'
              r')'
              r'.*?'
              r'(\};\s*\};)',
              re.DOTALL,
          )
          match = dock.search(text)
          if not match:
              raise SystemExit("ERROR: DockProgress package block not found.")

          replacement = (
              match.group(1)
              + "\n\t\t\t\tkind = exactVersion;\n"
              + "\t\t\t\tversion = 3.2.0;\n\t\t\t"
              + match.group(2)
          )
          text = text[:match.start()] + replacement + text[match.end():]

          path.write_text(text)

          # --------------------------------------------------------
          # CORRECTED validation.
          #
          # Previous workflow did:
          #   start = final.find(config_id)
          #   next_config = final.find("isa = XCBuildConfiguration;")
          #
          # The first `isa` found was the CURRENT config's own isa,
          # so the validation section was truncated before
          # buildSettings and falsely failed.
          #
          # Match the complete XCBuildConfiguration instead.
          # --------------------------------------------------------
          final = path.read_text()

          for config_id, config_name in config_pairs:
              validation = re.compile(
                  re.escape(config_id)
                  + r'\s*/\*\s*'
                  + re.escape(config_name)
                  + r'\s*\*/\s*=\s*\{'
                  + r'.*?isa\s*=\s*XCBuildConfiguration;'
                  + r'.*?buildSettings\s*=\s*\{'
                  + r'(.*?)'
                  + r'\n\s*\};'
                  + r'.*?\n\s*name\s*=\s*'
                  + re.escape(config_name)
                  + r';\s*\n\s*\};',
                  flags=re.DOTALL,
              )

              match = validation.search(final)
              if not match:
                  raise SystemExit(
                      f"ERROR: Could not re-read ShareExtension {config_name} "
                      "XCBuildConfiguration after patch."
                  )

              build_settings = match.group(1)
              missing = [
                  setting
                  for setting in isolation_settings
                  if setting not in build_settings
              ]
              if missing:
                  raise SystemExit(
                      f"ERROR: ShareExtension {config_name} isolation settings "
                      f"missing after patch: {missing!r}"
                  )

              print(
                  f"PASS: ShareExtension {config_name} isolation settings present."
              )

          print(
              "PASS: ShareExtension target configurations explicitly "
              "override Runner/CocoaPods linker settings."
