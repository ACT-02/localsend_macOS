          set -euxo pipefail

          flutter precache --macos


          mkdir -p diagnostics

          REPORT="diagnostics/flutter-engine-audit-prebuild.txt"

          : > "$REPORT"


          ENGINE_ROOT="$FLUTTER_ROOT/bin/cache/artifacts/engine"


          for ENGINE_DIR in \
            "$ENGINE_ROOT/darwin-x64" \
            "$ENGINE_ROOT/darwin-x64-release"
          do

            if [ ! -d "$ENGINE_DIR" ]; then

              echo "WARNING: Missing:"
              echo "$ENGINE_DIR"

              continue
            fi


            find "$ENGINE_DIR" \
              -type f \
              -print0 \
            | while IFS= read -r -d '' FILE; do

                if file "$FILE" \
                  | grep -q "Mach-O"; then

                  {
                    echo
                    echo "============================================================"
                    echo "$FILE"
                    echo "============================================================"

                    file "$FILE"

                    echo
                    echo "--- Architectures ---"

                    lipo \
