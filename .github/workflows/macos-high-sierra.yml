      # ============================================================
      # LocalSend project / Podfile
      # ============================================================

      - name: Patch LocalSend for High Sierra
        shell: bash
        run: |
          set -euxo pipefail

          PBX="app/macos/Runner.xcodeproj/project.pbxproj"

          PODFILE="app/macos/Podfile"

          RELEASE_XCCONFIG="app/macos/Runner/Configs/Release.xcconfig"


          # --------------------------------------------------------
          # project.pbxproj
          # --------------------------------------------------------

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "app/macos/Runner.xcodeproj/project.pbxproj"
          )

          text = path.read_text()

          text, count = re.subn(
              r'MACOSX_DEPLOYMENT_TARGET'
              r'\s*=\s*'
              r'[0-9.]+;',
              'MACOSX_DEPLOYMENT_TARGET = '
              '"$(LOCALSEND_LEGACY_MACOS_TARGET)";',
              text,
          )

          if count == 0:
              raise SystemExit(
                  "ERROR: No deployment targets "
                  "found in pbxproj."
              )


          # --------------------------------------------------------
          # Force Intel-only.
          #
          # IMPORTANT:
          #
          # ONLY_ACTIVE_ARCH must be NO for Release.
          #
          # LaunchAtLogin-Legacy uses this setting to determine
          # whether it should perform release cleanup.
          #
          # ARCHS=x86_64 still guarantees Intel-only output.
          # --------------------------------------------------------

          if (
              "LOCALSEND_LEGACY_MACOS_TARGET = 10.13;"
              not in text
          ):
              replacement = (
                  "buildSettings = {\n"
                  "\t\t\t\t"
                  "LOCALSEND_LEGACY_MACOS_TARGET = 10.13;\n"
                  "\t\t\t\t"
                  "ARCHS = x86_64;\n"
                  "\t\t\t\t"
                  "EXCLUDED_ARCHS = arm64;\n"
                  "\t\t\t\t"
                  "ONLY_ACTIVE_ARCH = NO;\n"
              )

              text = text.replace(
                  "buildSettings = {\n",
                  replacement,
              )


          # If an earlier form is somehow already present, normalize
          # all ONLY_ACTIVE_ARCH values to NO.
          text = re.sub(
              r'ONLY_ACTIVE_ARCH\s*=\s*(?:YES|NO);',
              'ONLY_ACTIVE_ARCH = NO;',
              text,
          )


          # --------------------------------------------------------
          # Signing
          # --------------------------------------------------------

          text = re.sub(
              r'DEVELOPMENT_TEAM'
              r'\s*=\s*'
              r'[A-Z0-9]+;',
              'DEVELOPMENT_TEAM = "";',
              text,
          )

          text = re.sub(
              r'CODE_SIGN_STYLE'
              r'\s*=\s*'
              r'Automatic;',
              'CODE_SIGN_STYLE = Manual;',
              text,
          )

          text = re.sub(
              r'CODE_SIGN_IDENTITY'
              r'\s*=\s*'
              r'"(?:'
              r'Apple Development|'
              r'Mac Development|'
              r'Mac Developer'
              r')";',
              'CODE_SIGN_IDENTITY = "-";',
              text,
          )

          text = re.sub(
              r'('
              r'"CODE_SIGN_IDENTITY\[sdk=macosx\*\]"'
              r'\s*=\s*'
              r')'
              r'"(?:'
              r'Apple Development|'
              r'Mac Development|'
              r'Mac Developer'
              r')";',
              r'\1"-";',
              text,
          )

          text = re.sub(
              r'PROVISIONING_PROFILE_SPECIFIER'
              r'\s*=\s*'
              r'"[^"]*";',
              'PROVISIONING_PROFILE_SPECIFIER = "";',
              text,
          )

          text = re.sub(
              r'PROVISIONING_PROFILE'
              r'\s*=\s*'
              r'"[^"]*";',
              'PROVISIONING_PROFILE = "";',
              text,
          )


          # --------------------------------------------------------
          # DockProgress 4.x -> exact 3.2.0
          # --------------------------------------------------------

          dock_pattern = re.compile(
              r'('
              r'[0-9A-F]+'
              r'\s*/\*\s*'
              r'XCRemoteSwiftPackageReference '
              r'"DockProgress"'
              r'\s*\*/'
              r'\s*=\s*\{'
              r'.*?'
              r'repositoryURL'
              r'\s*=\s*'
              r'"https://github\.com/'
              r'sindresorhus/DockProgress";'
              r'\s*'
              r'requirement'
              r'\s*=\s*\{'
              r')'
              r'.*?'
              r'('
              r'\};'
              r'\s*'
              r'\};'
              r')',
              re.DOTALL,
          )

          match = dock_pattern.search(
              text
          )

          if not match:
              raise SystemExit(
                  "ERROR: DockProgress package "
                  "block not found."
              )

          replacement = (
              match.group(1)
              + "\n"
              + "\t\t\t\tkind = exactVersion;\n"
              + "\t\t\t\tversion = 3.2.0;\n"
              + "\t\t\t"
              + match.group(2)
          )

          text = (
              text[:match.start()]
              + replacement
              + text[match.end():]
          )

          check = re.compile(
              r'repositoryURL'
              r'\s*=\s*'
              r'"https://github\.com/'
              r'sindresorhus/DockProgress";'
              r'.*?'
              r'kind\s*=\s*exactVersion;'
              r'.*?'
              r'version\s*=\s*3\.2\.0;',
              re.DOTALL,
          )

          if not check.search(
              text
          ):
              raise SystemExit(
                  "ERROR: DockProgress 3.2.0 "
                  "patch failed."
              )

          path.write_text(
              text
          )
          PY


          # --------------------------------------------------------
          # Release xcconfig
          # --------------------------------------------------------

          cat >> "$RELEASE_XCCONFIG" <<'EOF'

          // ========================================================
          // LocalSend macOS High Sierra Backport
          // ========================================================

          LOCALSEND_LEGACY_MACOS_TARGET = 10.13
          MACOSX_DEPLOYMENT_TARGET = $(LOCALSEND_LEGACY_MACOS_TARGET)

          ARCHS = x86_64
          EXCLUDED_ARCHS = arm64

          // LaunchAtLogin-Legacy requires this to be NO for
          // distribution/release builds.
          ONLY_ACTIVE_ARCH = NO

          CODE_SIGN_IDENTITY = -
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM =

          EOF


          # --------------------------------------------------------
          # Podfile
          # --------------------------------------------------------

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "app/macos/Podfile"
          )

          text = path.read_text()

          text, count = re.subn(
              r"^platform"
              r"\s+:osx,"
              r"\s*['\"][0-9.]+['\"]",
              "legacy_macos_target = '10.13'\n"
              "platform :osx, legacy_macos_target",
              text,
              count=1,
              flags=re.MULTILINE,
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: Podfile platform patch failed."
              )

          text, count = re.subn(
              r"config\.build_settings"
              r"\[['\"]"
              r"MACOSX_DEPLOYMENT_TARGET"
              r"['\"]\]"
              r"\s*=\s*"
              r"['\"][0-9.]+['\"]",
              "config.build_settings"
              "['MACOSX_DEPLOYMENT_TARGET'] "
              "= legacy_macos_target",
              text,
          )

          if count == 0:
              raise SystemExit(
                  "ERROR: Pod deployment target "
                  "patch failed."
              )

          needle = (
              "config.build_settings"
              "['MACOSX_DEPLOYMENT_TARGET'] "
              "= legacy_macos_target"
          )

          if (
              "config.build_settings"
              "['ARCHS'] = 'x86_64'"
              not in text
          ):
              replacement = (
                  needle
                  + "\n"
                  + "      "
                  + "config.build_settings"
                  + "['ARCHS'] = 'x86_64'"
                  + "\n"
                  + "      "
                  + "config.build_settings"
                  + "['EXCLUDED_ARCHS'] = 'arm64'"
                  + "\n"
                  + "      "
                  + "config.build_settings"
                  + "['ONLY_ACTIVE_ARCH'] = 'NO'"
              )

              text = text.replace(
                  needle,
                  replacement,
                  1,
              )

          text = text.replace(
              "config.build_settings['ONLY_ACTIVE_ARCH'] = 'YES'",
              "config.build_settings['ONLY_ACTIVE_ARCH'] = 'NO'",
          )

          if "target 'ShareExtension' do" not in text:
              share_target = """
          target 'ShareExtension' do
            use_frameworks!
            use_modular_headers!

            pod 'Defaults', '~> 4.2'
          end

          """

              text = text.replace(
                  "\npost_install do |installer|",
                  "\n"
                  + share_target
                  + "post_install do |installer|",
                  1,
              )

          if "target 'ShareExtension' do" not in text:
              raise SystemExit(
                  "ERROR: ShareExtension "
                  "CocoaPods target missing."
              )

          path.write_text(
              text
          )
          PY


          # --------------------------------------------------------
          # AppDelegate MainActor
          # --------------------------------------------------------

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "app/macos/Runner/AppDelegate.swift"
          )

          text = path.read_text()

          text = text.replace(
              "@MainActor private func handleFlutterCall",
              "private func handleFlutterCall",
          )

          path.write_text(
              text
          )
          PY


          rm -f \
            app/macos/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved \
            app/macos/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved


          echo "============================================================"
          echo "Podfile after patch"
          echo "============================================================"

          cat "$PODFILE"

          echo
          echo "============================================================"
          echo "DockProgress after patch"
          echo "============================================================"

          grep -A12 -B2 \
            'XCRemoteSwiftPackageReference "DockProgress"' \
            "$PBX" \
            || true


      # ============================================================
