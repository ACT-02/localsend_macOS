            if /usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$FRAMEWORK_PLIST" >/dev/null 2>&1; then
              /usr/libexec/PlistBuddy -c 'Set :LSMinimumSystemVersion 10.13' "$FRAMEWORK_PLIST"
            fi
