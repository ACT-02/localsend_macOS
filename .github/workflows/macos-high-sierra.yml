          STRONG_SWIFT_LIBS=(
            "libswiftCore.dylib"
            "libswiftFoundation.dylib"
            "libswiftCoreGraphics.dylib"
          )

          for LIB in "${STRONG_SWIFT_LIBS[@]}"; do
