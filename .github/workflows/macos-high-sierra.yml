name: LocalSend macOS High Sierra Backport

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.9"
  RUST_VERSION: "1.97.1"
  LEGACY_MACOS_TARGET: "10.13"
  MACOSX_DEPLOYMENT_TARGET: "10.13"

jobs:
  build:
    name: Build LocalSend for macOS High Sierra
    runs-on: macos-15-intel

    steps:
      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive


      # ============================================================
      # Toolchains
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - name: Show build environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Flutter"
          echo "============================================================"
          flutter --version

          echo
          echo "============================================================"
          echo "Dart"
          echo "============================================================"
          dart --version

          echo
          echo "============================================================"
          echo "Rust"
          echo "============================================================"
          rustc --version
          cargo --version
          rustup show

          echo
          echo "============================================================"
          echo "Xcode"
          echo "============================================================"
          xcodebuild -version

          echo
          echo "============================================================"
          echo "Runner"
          echo "============================================================"
          sw_vers
          uname -a
          uname -m

          echo
          echo "Target macOS: ${LEGACY_MACOS_TARGET}"
          echo "Architecture: x86_64"


      # ============================================================
      # Remove StoreKit / in-app purchase
      #
      # This mirrors LocalSend's upstream FOSS build path.
      # High Sierra cannot compile the current StoreKit plugin because
      # it uses Swift Concurrency and macOS 10.14.4 / 10.15 APIs.
      # ============================================================

      - name: Remove in-app purchases for High Sierra
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path


          pubspec = Path("app/pubspec.yaml")
          original_lines = pubspec.read_text().splitlines()

          filtered_lines = [
              line
              for line in original_lines
              if "# [FOSS_REMOVE]" not in line
          ]

          if len(filtered_lines) == len(original_lines):
              raise SystemExit(
                  "ERROR: No # [FOSS_REMOVE] dependency was found "
                  "in app/pubspec.yaml."
              )

          pubspec.write_text(
              "\n".join(filtered_lines) + "\n"
          )


          dart_files = [
              Path("app/lib/config/init.dart"),
              Path(
                  "app/lib/pages/donation/"
                  "donation_page.dart"
              ),
              Path(
                  "app/lib/pages/donation/"
                  "donation_page_vm.dart"
              ),
          ]

          for path in dart_files:
              text = path.read_text()

              if "// [FOSS_REMOVE_START]" not in text:
                  raise SystemExit(
                      f"ERROR: FOSS_REMOVE_START missing in {path}"
                  )

              if "// [FOSS_REMOVE_END]" not in text:
                  raise SystemExit(
                      f"ERROR: FOSS_REMOVE_END missing in {path}"
                  )

              text = text.replace(
                  "// [FOSS_REMOVE_START]",
                  "/*",
              )

              text = text.replace(
                  "// [FOSS_REMOVE_END]",
                  "*/",
              )

              path.write_text(text)


          purchase_provider = Path(
              "app/lib/provider/purchase_provider.dart"
          )

          if not purchase_provider.exists():
              raise SystemExit(
                  "ERROR: purchase_provider.dart was not found."
              )

          purchase_provider.unlink()


          donation_page = Path(
              "app/lib/pages/donation/donation_page.dart"
          )

          text = donation_page.read_text()

          text = text.replace(
              "donationPageVmProvider",
              "donationPageNoopVmProvider",
          )

          donation_page.write_text(text)


          if "in_app_purchase:" in pubspec.read_text():
              raise SystemExit(
                  "ERROR: in_app_purchase remains in pubspec.yaml."
              )

          if purchase_provider.exists():
              raise SystemExit(
                  "ERROR: purchase_provider.dart still exists."
              )

          print(
              "StoreKit / in-app purchase code removed."
          )
          PY

          # Do not keep a stale CocoaPods resolution containing
          # in_app_purchase_storekit.
          rm -f app/macos/Podfile.lock

          echo
          echo "============================================================"
          echo "FOSS patch check"
          echo "============================================================"

          grep -n \
            'in_app_purchase' \
            app/pubspec.yaml \
            || true

          grep -n \
            'donationPage.*VmProvider' \
            app/lib/pages/donation/donation_page.dart \
            || true


      # ============================================================
      # Flutter dependencies
      #
      # pub get intentionally happens AFTER removing IAP.
      # ============================================================

      - name: Clean Flutter build
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail
          flutter clean

      - name: Flutter pub get
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail
          flutter pub get


      # ============================================================
      # Verify StoreKit is absent from Flutter dependency graph
      # ============================================================

      - name: Verify in-app purchase plugin is gone
        shell: bash
        run: |
          set -euxo pipefail

          cd app

          flutter pub deps \
            --style=compact \
            > ../flutter-pub-deps.txt

          if grep -E \
            '(^|[[:space:]])in_app_purchase(_storekit)?([[:space:]]|$)' \
            ../flutter-pub-deps.txt; then

            echo
            echo "ERROR:"
            echo "in_app_purchase remains in the dependency graph."
            exit 1
          fi

          cd ..

          if [ -f app/.flutter-plugins-dependencies ]; then

            if grep -q \
              'in_app_purchase_storekit' \
              app/.flutter-plugins-dependencies; then

              echo "ERROR:"
              echo "Flutter still generated in_app_purchase_storekit."
              exit 1
            fi
          fi

          echo "StoreKit Flutter plugin is absent."


      # ============================================================
      # Rust / Cargokit
      # ============================================================

      - name: Prepare Cargokit
        working-directory: packages/localsend_isolates/rust_builder/cargokit/build_tool
        shell: bash
        run: |
          set -euxo pipefail
          flutter pub get

      - name: Verify Rust workspace
        shell: bash
        run: |
          set -euxo pipefail

          test -f Cargo.toml
          test -f rust-toolchain.toml
          test -f packages/localsend_isolates/rust/Cargo.toml

          cargo metadata \
            --format-version=1 \
            --no-deps \
            > /tmp/cargo-metadata.json

          python3 <<'PY'
          import json

          with open("/tmp/cargo-metadata.json", "r") as f:
              metadata = json.load(f)

          print("Rust workspace packages:")

          for package in metadata["packages"]:
              print(
                  f"  {package['name']} "
                  f"{package['version']}"
              )
              print(
                  f"    {package['manifest_path']}"
              )
          PY


      # ============================================================
      # gal 2.3.3 High Sierra compatibility shim
      #
      # Current gal macOS implementation uses PhotoKit.
      # LocalSend does not normally use gallery saving on macOS.
      # Preserve plugin registration while removing PhotoKit.
      # ============================================================

      - name: Backport gal for High Sierra
        shell: bash
        run: |
          set -euxo pipefail

          PUB_CACHE_ROOT="${PUB_CACHE:-$HOME/.pub-cache}"

          GAL_SWIFT="$(
            find "$PUB_CACHE_ROOT" \
              -type f \
              -path '*/gal-2.3.3/darwin/gal/Sources/gal/GalPlugin.swift' \
              -print \
              -quit
          )"

          GAL_PODSPEC="$(
            find "$PUB_CACHE_ROOT" \
              -type f \
              -path '*/gal-2.3.3/darwin/gal.podspec' \
              -print \
              -quit
          )"

          if [ -z "$GAL_SWIFT" ]; then
            echo "ERROR: GalPlugin.swift was not found."
            find "$PUB_CACHE_ROOT" -iname '*gal*' -print || true
            exit 1
          fi

          if [ -z "$GAL_PODSPEC" ]; then
            echo "ERROR: gal.podspec was not found."
            exit 1
          fi

          cp \
            "$GAL_SWIFT" \
            "${GAL_SWIFT}.original"

          cp \
            "$GAL_PODSPEC" \
            "${GAL_PODSPEC}.original"


          python3 - "$GAL_PODSPEC" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          text, count = re.subn(
              r"s\.osx\.deployment_target"
              r"\s*=\s*"
              r"['\"][0-9.]+['\"]",
              "s.osx.deployment_target = '10.13'",
              text,
              count=1,
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: Could not patch gal deployment target."
              )

          path.write_text(text)
          PY


          cat > "$GAL_SWIFT" <<'SWIFT'
          import Cocoa
          import FlutterMacOS

          public class GalPlugin: NSObject, FlutterPlugin {

            public static func register(
              with registrar: FlutterPluginRegistrar
            ) {
              let channel = FlutterMethodChannel(
                name: "gal",
                binaryMessenger: registrar.messenger
              )

              let instance = GalPlugin()

              registrar.addMethodCallDelegate(
                instance,
                channel: channel
              )
            }

            public func handle(
              _ call: FlutterMethodCall,
              result: @escaping FlutterResult
            ) {
              switch call.method {

              case "hasAccess":
                result(false)

              case "requestAccess":
                result(false)

              case "putVideo",
                   "putImage",
                   "putImageBytes":

                result(
                  FlutterError(
                    code: "ACCESS_DENIED",
                    message:
                      "Direct Photos-library saving is unavailable "
                      + "in the macOS High Sierra build.",
                    details: nil
                  )
                )

              case "open":

                if let url = URL(string: "photos://") {
                  _ = NSWorkspace.shared.open(url)
                }

                result(nil)

              default:
                result(FlutterMethodNotImplemented)
              }
            }
          }
          SWIFT


          if grep -E \
            'import Photos|PHPhotoLibrary|PHAsset|PHFetch' \
            "$GAL_SWIFT"; then

            echo "ERROR: PhotoKit API remains in gal shim."
            exit 1
          fi

          echo "gal High Sierra shim installed."


      # ============================================================
      # Patch Xcode project / Podfile / signing
      # ============================================================

      - name: Patch LocalSend for High Sierra
        shell: bash
        run: |
          set -euxo pipefail

          PBX="app/macos/Runner.xcodeproj/project.pbxproj"
          PODFILE="app/macos/Podfile"
          RELEASE_XCCONFIG="app/macos/Runner/Configs/Release.xcconfig"
          APP_DELEGATE="app/macos/Runner/AppDelegate.swift"

          echo "============================================================"
          echo "LocalSend macOS High Sierra backport"
          echo "Target: macOS 10.13 / x86_64"
          echo "============================================================"


          # --------------------------------------------------------
          # Xcode project
          # --------------------------------------------------------

          python3 <<'PY'
          from pathlib import Path
          import re


          pbx = Path(
              "app/macos/Runner.xcodeproj/project.pbxproj"
          )

          text = pbx.read_text()


          # Flutter 3.41.9 migrates literal 10.13 targets back to
          # 10.15. Use an indirect build variable instead.
          text, deployment_count = re.subn(
              r'MACOSX_DEPLOYMENT_TARGET'
              r'\s*=\s*'
              r'[0-9.]+;',
              'MACOSX_DEPLOYMENT_TARGET = '
              '"$(LOCALSEND_LEGACY_MACOS_TARGET)";',
              text,
          )

          if deployment_count == 0:
              raise SystemExit(
                  "ERROR: No Xcode deployment targets were found."
              )

          print(
              f"Patched {deployment_count} "
              "Xcode deployment target(s)."
          )


          # Put the legacy target and architecture into every
          # XCBuildConfiguration.
          if (
              "LOCALSEND_LEGACY_MACOS_TARGET = 10.13;"
              not in text
          ):

              replacement = (
                  "buildSettings = {\n"
                  "\t\t\t\t"
                  "LOCALSEND_LEGACY_MACOS_TARGET = 10.13;\n"
                  "\t\t\t\t"
                  "ARCHS = x86_64;\n"
                  "\t\t\t\t"
                  "EXCLUDED_ARCHS = arm64;\n"
                  "\t\t\t\t"
                  "ONLY_ACTIVE_ARCH = YES;\n"
              )

              text = text.replace(
                  "buildSettings = {\n",
                  replacement,
              )


          # Remove upstream Apple development signing.
          text = re.sub(
              r'DEVELOPMENT_TEAM'
              r'\s*=\s*'
              r'[A-Z0-9]+;',
              'DEVELOPMENT_TEAM = "";',
              text,
          )

          text = re.sub(
              r'CODE_SIGN_STYLE'
              r'\s*=\s*'
              r'Automatic;',
              'CODE_SIGN_STYLE = Manual;',
              text,
          )

          text = re.sub(
              r'CODE_SIGN_IDENTITY'
              r'\s*=\s*'
              r'"(?:'
              r'Apple Development|'
              r'Mac Development|'
              r'Mac Developer'
              r')";',
              'CODE_SIGN_IDENTITY = "-";',
              text,
          )

          text = re.sub(
              r'('
              r'"CODE_SIGN_IDENTITY\[sdk=macosx\*\]"'
              r'\s*=\s*'
              r')'
              r'"(?:'
              r'Apple Development|'
              r'Mac Development|'
              r'Mac Developer'
              r')";',
              r'\1"-";',
              text,
          )

          text = re.sub(
              r'PROVISIONING_PROFILE_SPECIFIER'
              r'\s*=\s*'
              r'"[^"]*";',
              'PROVISIONING_PROFILE_SPECIFIER = "";',
              text,
          )

          text = re.sub(
              r'PROVISIONING_PROFILE'
              r'\s*=\s*'
              r'"[^"]*";',
              'PROVISIONING_PROFILE = "";',
              text,
          )


          # DockProgress 4.3.1 -> exact 3.2.0.
          # Match structurally, not by indentation.
          dock_pattern = re.compile(
              r'('
              r'[0-9A-F]+'
              r'\s*/\*\s*'
              r'XCRemoteSwiftPackageReference '
              r'"DockProgress"'
              r'\s*\*/'
              r'\s*=\s*\{'
              r'.*?'
              r'repositoryURL'
              r'\s*=\s*'
              r'"https://github\.com/'
              r'sindresorhus/DockProgress";'
              r'\s*'
              r'requirement'
              r'\s*=\s*\{'
              r')'
              r'.*?'
              r'('
              r'\};'
              r'\s*'
              r'\};'
              r')',
              re.DOTALL,
          )

          match = dock_pattern.search(text)

          if not match:
              raise SystemExit(
                  "ERROR: Could not locate DockProgress "
                  "Swift package block."
              )

          replacement = (
              match.group(1)
              + "\n"
              + "\t\t\t\tkind = exactVersion;\n"
              + "\t\t\t\tversion = 3.2.0;\n"
              + "\t\t\t"
              + match.group(2)
          )

          text = (
              text[:match.start()]
              + replacement
              + text[match.end():]
          )


          dock_check = re.compile(
              r'repositoryURL'
              r'\s*=\s*'
              r'"https://github\.com/'
              r'sindresorhus/DockProgress";'
              r'.*?'
              r'kind\s*=\s*exactVersion;'
              r'.*?'
              r'version\s*=\s*3\.2\.0;',
              re.DOTALL,
          )

          if not dock_check.search(text):
              raise SystemExit(
                  "ERROR: DockProgress 3.2.0 "
                  "patch validation failed."
              )

          print(
              "DockProgress patched to exact version 3.2.0."
          )

          pbx.write_text(text)
          PY


          # --------------------------------------------------------
          # Real Release xcconfig
          # --------------------------------------------------------

          cat >> "$RELEASE_XCCONFIG" <<'EOF'

          // ========================================================
          // LocalSend macOS High Sierra Backport
          // ========================================================

          LOCALSEND_LEGACY_MACOS_TARGET = 10.13
          MACOSX_DEPLOYMENT_TARGET = $(LOCALSEND_LEGACY_MACOS_TARGET)

          ARCHS = x86_64
          EXCLUDED_ARCHS = arm64
          ONLY_ACTIVE_ARCH = YES

          CODE_SIGN_IDENTITY = -
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM =

          EOF


          # --------------------------------------------------------
          # CocoaPods Podfile
          # --------------------------------------------------------

          python3 <<'PY'
          from pathlib import Path
          import re


          podfile = Path("app/macos/Podfile")
          text = podfile.read_text()


          # Keep 10.13 in a Ruby variable so Flutter's literal
          # deployment-target migrator does not rewrite it.
          text, platform_count = re.subn(
              r"^platform"
              r"\s+:osx,"
              r"\s*['\"][0-9.]+['\"]",
              "legacy_macos_target = '10.13'\n"
              "platform :osx, legacy_macos_target",
              text,
              count=1,
              flags=re.MULTILINE,
          )

          if platform_count != 1:
              raise SystemExit(
                  "ERROR: Could not patch Podfile platform."
              )


          text, pod_target_count = re.subn(
              r"config\.build_settings"
              r"\[['\"]"
              r"MACOSX_DEPLOYMENT_TARGET"
              r"['\"]\]"
              r"\s*=\s*"
              r"['\"][0-9.]+['\"]",
              "config.build_settings"
              "['MACOSX_DEPLOYMENT_TARGET'] "
              "= legacy_macos_target",
              text,
          )

          if pod_target_count == 0:
              raise SystemExit(
                  "ERROR: Could not patch Pod deployment target."
              )


          # All Pods must be Intel-only.
          needle = (
              "config.build_settings"
              "['MACOSX_DEPLOYMENT_TARGET'] "
              "= legacy_macos_target"
          )

          if (
              "config.build_settings['ARCHS'] = 'x86_64'"
              not in text
          ):

              replacement = (
                  needle
                  + "\n"
                  + "      "
                  + "config.build_settings"
                  + "['ARCHS'] = 'x86_64'"
                  + "\n"
                  + "      "
                  + "config.build_settings"
                  + "['EXCLUDED_ARCHS'] = 'arm64'"
                  + "\n"
                  + "      "
                  + "config.build_settings"
                  + "['ONLY_ACTIVE_ARCH'] = 'YES'"
              )

              text = text.replace(
                  needle,
                  replacement,
                  1,
              )


          # ShareExtension also compiles Shared.swift, which imports
          # Defaults. Give it a proper CocoaPods target.
          if "target 'ShareExtension' do" not in text:

              share_target = """
          target 'ShareExtension' do
            use_frameworks!
            use_modular_headers!

            pod 'Defaults', '~> 4.2'
          end

          """

              text = text.replace(
                  "\npost_install do |installer|",
                  "\n"
                  + share_target
                  + "post_install do |installer|",
                  1,
              )


          if "target 'ShareExtension' do" not in text:
              raise SystemExit(
                  "ERROR: Failed to create "
                  "ShareExtension CocoaPods target."
              )


          podfile.write_text(text)
          PY


          # --------------------------------------------------------
          # Remove unnecessary MainActor annotation from LocalSend's
          # native channel glue.
          # --------------------------------------------------------

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "app/macos/Runner/AppDelegate.swift"
          )

          text = path.read_text()

          text = text.replace(
              "@MainActor private func handleFlutterCall",
              "private func handleFlutterCall",
          )

          path.write_text(text)
          PY


          # Remove stale SwiftPM locks.
          rm -f \
            app/macos/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved \
            app/macos/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved


          echo
          echo "============================================================"
          echo "Podfile after patch"
          echo "============================================================"

          cat "$PODFILE"

          echo
          echo "============================================================"
          echo "DockProgress after patch"
          echo "============================================================"

          grep -A12 -B2 \
            'XCRemoteSwiftPackageReference "DockProgress"' \
            "$PBX" \
            || true


      # ============================================================
      # Static validation
      # ============================================================

      - name: Validate High Sierra patch
        shell: bash
        run: |
          set -euxo pipefail

          PBX="app/macos/Runner.xcodeproj/project.pbxproj"
          PODFILE="app/macos/Podfile"


          if grep -q "3W7H4PYMCV" "$PBX"; then
            echo "ERROR: Upstream Apple Team ID remains."
            exit 1
          fi


          if grep -q \
            'MACOSX_DEPLOYMENT_TARGET = 10.13;' \
            "$PBX"; then

            echo "ERROR: Literal 10.13 remains in pbxproj."
            exit 1
          fi


          if grep -q \
            "platform :osx, '10.13'" \
            "$PODFILE"; then

            echo "ERROR: Literal 10.13 remains in Podfile."
            exit 1
          fi


          if ! grep -q \
            "target 'ShareExtension' do" \
            "$PODFILE"; then

            echo "ERROR: ShareExtension Pod target missing."
            exit 1
          fi


          if grep -q \
            '^ *in_app_purchase:' \
            app/pubspec.yaml; then

            echo "ERROR: in_app_purchase returned to pubspec.yaml."
            exit 1
          fi


          ruby -c "$PODFILE"

          echo "Static High Sierra patch validation passed."


      # ============================================================
      # First Flutter config pass
      #
      # Flutter creates Flutter-Generated.xcconfig before invoking
      # CocoaPods. If CocoaPods fails, allow the job to continue so
      # the next step can run pod install directly and reveal the
      # actual CocoaPods error.
      # ============================================================

      - name: Generate Flutter macOS configuration - first pass
        id: flutter_config_first
        continue-on-error: true
        working-directory: app
        shell: bash
        run: |
          set -o pipefail

          flutter build macos \
            --release \
            --config-only \
            -v \
            2>&1 | tee ../flutter-config-first.log


      # ============================================================
      # CocoaPods — run outside Flutter
      #
      # This is intentionally explicit. If CocoaPods is the problem,
      # its actual [!] error will now appear in the Actions log.
      # ============================================================

      - name: Install CocoaPods dependencies explicitly
        working-directory: app/macos
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "First Flutter config pass outcome"
          echo "============================================================"
          echo "${{ steps.flutter_config_first.outcome }}"

          echo
          echo "============================================================"
          echo "Ruby"
          echo "============================================================"

          which ruby
          ruby --version

          echo
          echo "============================================================"
          echo "CocoaPods"
          echo "============================================================"

          which pod
          pod --version

          echo
          echo "============================================================"
          echo "Podfile syntax"
          echo "============================================================"

          ruby -c Podfile

          echo
          echo "============================================================"
          echo "Flutter generated Xcode config"
          echo "============================================================"

          GENERATED_XCCONFIG="Flutter/ephemeral/Flutter-Generated.xcconfig"

          if [ ! -f "$GENERATED_XCCONFIG" ]; then
            echo "ERROR:"
            echo "$GENERATED_XCCONFIG does not exist."
            echo
            echo "The first Flutter config pass failed before generating"
            echo "the Xcode configuration. See flutter-config-first.log."
            exit 1
          fi

          cat "$GENERATED_XCCONFIG"

          echo
          echo "============================================================"
          echo "Actual Podfile"
          echo "============================================================"

          cat Podfile

          echo
          echo "============================================================"
          echo "CocoaPods environment"
          echo "============================================================"

          pod env \
            2>&1 | tee ../../pod-env.log

          echo
          echo "============================================================"
          echo "Fresh pod install --verbose"
          echo "============================================================"

          rm -rf Pods

          pod install \
            --verbose \
            2>&1 | tee ../../pod-install.log


      # ============================================================
      # Finalize Flutter native configuration
      #
      # After standalone pod install succeeds, Flutter should now
      # complete its own config-only pass too.
      # ============================================================

      - name: Finalize Flutter macOS configuration
        working-directory: app
        shell: bash
        run: |
          set -o pipefail

          flutter build macos \
            --release \
            --config-only \
            -v \
            2>&1 | tee ../flutter-config-final.log


      # ============================================================
      # Verify StoreKit stayed removed
      # ============================================================

      - name: Verify StoreKit plugin stayed removed
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          if [ -f macos/Podfile.lock ]; then

            if grep -q \
              'in_app_purchase_storekit' \
              macos/Podfile.lock; then

              echo "ERROR:"
              echo "in_app_purchase_storekit returned to Podfile.lock."

              grep -n \
                'in_app_purchase_storekit' \
                macos/Podfile.lock \
                || true

              exit 1
            fi
          fi


          REGISTRANT="$(
            find macos \
              -type f \
              -name 'GeneratedPluginRegistrant.swift' \
              -print \
              -quit
          )"


          if [ -n "$REGISTRANT" ]; then

            echo "GeneratedPluginRegistrant:"
            cat "$REGISTRANT"

            if grep -q \
              'in_app_purchase' \
              "$REGISTRANT"; then

              echo "ERROR:"
              echo "StoreKit plugin remains in registrant."
              exit 1
            fi
          fi


          echo "StoreKit plugin remains absent."


      # ============================================================
      # Verify Flutter didn't migrate us back to Catalina
      # ============================================================

      - name: Verify Flutter migration bypass
        shell: bash
        run: |
          set -euxo pipefail

          PBX="app/macos/Runner.xcodeproj/project.pbxproj"
          PODFILE="app/macos/Podfile"


          if grep -q \
            'MACOSX_DEPLOYMENT_TARGET = 10.15;' \
            "$PBX"; then

            echo "ERROR:"
            echo "Flutter restored macOS 10.15."

            grep -n \
              'MACOSX_DEPLOYMENT_TARGET = 10.15;' \
              "$PBX"

            exit 1
          fi


          if grep -q \
            "platform :osx, '10.15'" \
            "$PODFILE"; then

            echo "ERROR:"
            echo "Flutter restored Podfile to 10.15."
            exit 1
          fi


          echo "Flutter migration bypass survived."


      # ============================================================
      # Verify gal shim survived Flutter / CocoaPods
      # ============================================================

      - name: Verify gal High Sierra shim
        shell: bash
        run: |
          set -euxo pipefail

          PUB_CACHE_ROOT="${PUB_CACHE:-$HOME/.pub-cache}"

          GAL_SWIFT="$(
            find "$PUB_CACHE_ROOT" \
              -type f \
              -path '*/gal-2.3.3/darwin/gal/Sources/gal/GalPlugin.swift' \
              -print \
              -quit
          )"

          GAL_PODSPEC="$(
            find "$PUB_CACHE_ROOT" \
              -type f \
              -path '*/gal-2.3.3/darwin/gal.podspec' \
              -print \
              -quit
          )"


          test -n "$GAL_SWIFT"
          test -n "$GAL_PODSPEC"


          if grep -q \
            'import Photos' \
            "$GAL_SWIFT"; then

            echo "ERROR:"
            echo "Original gal PhotoKit implementation returned."
            exit 1
          fi


          if ! grep -q \
            "s.osx.deployment_target = '10.13'" \
            "$GAL_PODSPEC"; then

            echo "ERROR:"
            echo "gal podspec deployment target is not 10.13."
            exit 1
          fi


          echo "gal High Sierra shim survived."


      # ============================================================
      # Verify CocoaPods targets
      # ============================================================

      - name: Verify CocoaPods integration
        working-directory: app/macos
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Generated CocoaPods targets"
          echo "============================================================"

          find \
            "Pods/Target Support Files" \
            -maxdepth 1 \
            -type d \
            -print \
            | sort


          if [ ! -d \
            "Pods/Target Support Files/Pods-ShareExtension" ]; then

            echo "ERROR:"
            echo "Pods-ShareExtension was not generated."
            exit 1
          fi


          if find \
            "Pods/Target Support Files" \
            -iname '*in_app_purchase*' \
            -print \
            | grep -q .; then

            echo "ERROR:"
            echo "StoreKit Pod support files still exist."

            find \
              "Pods/Target Support Files" \
              -iname '*in_app_purchase*' \
              -print

            exit 1
          fi


          echo "CocoaPods integration looks correct."


      # ============================================================
      # Swift Package Manager
      # ============================================================

      - name: Resolve Swift packages
        working-directory: app
        shell: bash
        run: |
          set -o pipefail

          mkdir -p \
            build/macos/SourcePackages


          xcodebuild \
            -resolvePackageDependencies \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -clonedSourcePackagesDirPath \
              build/macos/SourcePackages \
            2>&1 | tee ../swiftpm-resolve.log


          echo
          echo "============================================================"
          echo "SwiftPM checkouts"
          echo "============================================================"

          find \
            build/macos/SourcePackages \
            -maxdepth 3 \
            -type d \
            -print \
            | sort \
            | head -200 \
            || true


          DOCK_DIR="$(
            find \
              build/macos/SourcePackages/checkouts \
              -maxdepth 1 \
              -type d \
              -iname 'DockProgress' \
              -print \
              -quit
          )"


          if [ -n "$DOCK_DIR" ]; then

            echo
            echo "DockProgress checkout:"
            echo "$DOCK_DIR"

            echo
            echo "Tags at HEAD:"

            git \
              -C "$DOCK_DIR" \
              tag --points-at HEAD \
              || true
          fi


          echo
          echo "Package.resolved files, if any:"

          find macos \
            -type f \
            -path '*/swiftpm/Package.resolved' \
            -print \
            -exec cat {} \; \
            || true


      # ============================================================
      # Verify effective Xcode settings
      # ============================================================

      - name: Verify effective Xcode build settings
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p ../diagnostics


          xcodebuild \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -showBuildSettings \
            > ../diagnostics/runner-build-settings.txt


          xcodebuild \
            -project macos/Runner.xcodeproj \
            -target ShareExtension \
            -configuration Release \
            -showBuildSettings \
            > ../diagnostics/shareextension-build-settings.txt


          echo "============================================================"
          echo "Runner"
          echo "============================================================"

          grep -E \
            'ARCHS|EXCLUDED_ARCHS|ONLY_ACTIVE_ARCH|MACOSX_DEPLOYMENT_TARGET|LOCALSEND_LEGACY_MACOS_TARGET' \
            ../diagnostics/runner-build-settings.txt \
            || true


          echo
          echo "============================================================"
          echo "ShareExtension"
          echo "============================================================"

          grep -E \
            'ARCHS|EXCLUDED_ARCHS|ONLY_ACTIVE_ARCH|MACOSX_DEPLOYMENT_TARGET|LOCALSEND_LEGACY_MACOS_TARGET' \
            ../diagnostics/shareextension-build-settings.txt \
            || true


          python3 <<'PY'
          from pathlib import Path
          import re


          files = [
              Path(
                  "../diagnostics/"
                  "runner-build-settings.txt"
              ),
              Path(
                  "../diagnostics/"
                  "shareextension-build-settings.txt"
              ),
          ]


          for path in files:
              text = path.read_text()

              deployment = re.findall(
                  r"^\s*"
                  r"MACOSX_DEPLOYMENT_TARGET"
                  r"\s*=\s*"
                  r"(.*?)\s*$",
                  text,
                  flags=re.MULTILINE,
              )

              archs = re.findall(
                  r"^\s*"
                  r"ARCHS"
                  r"\s*=\s*"
                  r"(.*?)\s*$",
                  text,
                  flags=re.MULTILINE,
              )

              excluded = re.findall(
                  r"^\s*"
                  r"EXCLUDED_ARCHS"
                  r"\s*=\s*"
                  r"(.*?)\s*$",
                  text,
                  flags=re.MULTILINE,
              )

              print()
              print(path)
              print("  deployment:", deployment[:3])
              print("  ARCHS:", archs[:3])
              print("  EXCLUDED_ARCHS:", excluded[:3])

              if not deployment:
                  raise SystemExit(
                      f"ERROR: {path}: deployment target missing."
                  )

              if deployment[0] != "10.13":
                  raise SystemExit(
                      f"ERROR: {path}: "
                      f"target is {deployment[0]!r}; "
                      "expected '10.13'."
                  )

              if not archs:
                  raise SystemExit(
                      f"ERROR: {path}: ARCHS missing."
                  )

              if "x86_64" not in archs[0].split():
                  raise SystemExit(
                      f"ERROR: {path}: x86_64 missing."
                  )

              if excluded:
                  if "arm64" not in excluded[0].split():
                      raise SystemExit(
                          f"ERROR: {path}: arm64 is not excluded."
                      )


          print()
          print("Effective Xcode settings are correct.")
          PY


      # ============================================================
      # Actual build
      #
      # Rust is built by Cargokit through Flutter/Xcode.
      # ============================================================

      - name: Build macOS app
        working-directory: app
        shell: bash
        env:
          ARCHS: x86_64
          EXCLUDED_ARCHS: arm64
        run: |
          set -o pipefail

          echo "============================================================"
          echo "Building LocalSend"
          echo
          echo "Target OS:       macOS High Sierra 10.13"
          echo "Architecture:    x86_64"
          echo "Flutter:         ${FLUTTER_VERSION}"
          echo "Rust:            ${RUST_VERSION}"
          echo "DockProgress:    3.2.0"
          echo "gal:             High Sierra shim"
          echo "StoreKit/IAP:    removed"
          echo "============================================================"


          flutter build macos \
            --release \
            -v \
            2>&1 | tee ../flutter-macos-build.log


      # ============================================================
      # Extract compiler errors with surrounding context
      # ============================================================

      - name: Extract compiler errors
        if: failure()
        shell: bash
        run: |
          set +e

          mkdir -p diagnostics

          if [ -f flutter-macos-build.log ]; then

            python3 <<'PY'
          from pathlib import Path
          import re


          source = Path("flutter-macos-build.log")
          output = Path(
              "diagnostics/compiler-errors.txt"
          )

          lines = source.read_text(
              errors="replace"
          ).splitlines()

          pattern = re.compile(
              r"error:|"
              r"fatal error:|"
              r"is only available in macOS|"
              r"introduced in macOS|"
              r"requires macOS|"
              r"\*\* BUILD FAILED \*\*|"
              r"The following build commands failed"
          )

          hit_indexes = [
              index
              for index, line in enumerate(lines)
              if pattern.search(line)
          ]

          ranges = []

          for index in hit_indexes:

              start = max(
                  0,
                  index - 6,
              )

              end = min(
                  len(lines),
                  index + 10,
              )

              if (
                  ranges
                  and start <= ranges[-1][1]
              ):

                  ranges[-1] = (
                      ranges[-1][0],
                      max(
                          ranges[-1][1],
                          end,
                      ),
                  )

              else:
                  ranges.append(
                      (start, end)
                  )


          chunks = []

          for start, end in ranges:

              chunks.append(
                  "=" * 80
              )

              for index in range(start, end):

                  chunks.append(
                      f"{index + 1}: "
                      f"{lines[index]}"
                  )


          output.write_text(
              "\n".join(chunks)
              + ("\n" if chunks else "")
          )

          print(
              output.read_text()
              if output.exists()
              else "No compiler diagnostics extracted."
          )
          PY

          fi


      # ============================================================
      # Locate final app
      # ============================================================

      - name: Locate built application
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          APP="$(
            find \
              build/macos/Build/Products/Release \
              -maxdepth 1 \
              -type d \
              -name '*.app' \
              -print \
              -quit
          )"


          if [ -z "$APP" ]; then
            echo "ERROR: No .app bundle was produced."
            exit 1
          fi


          EXECUTABLE="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$APP/Contents/Info.plist"
          )"


          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "APP_EXECUTABLE=$EXECUTABLE" >> "$GITHUB_ENV"

          echo
          echo "Application:"
          echo "$APP"

          echo
          echo "Executable:"
          echo "$EXECUTABLE"


      # ============================================================
      # Verify x86_64
      # ============================================================

      - name: Verify x86_64 application
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          MAIN="$APP/Contents/MacOS/$APP_EXECUTABLE"

          file "$MAIN"
          lipo -info "$MAIN"

          ARCHES="$(
            lipo \
              -archs \
              "$MAIN"
          )"

          echo
          echo "Architectures:"
          echo "$ARCHES"


          if ! echo "$ARCHES" \
            | grep -qw x86_64; then

            echo "ERROR: Main executable lacks x86_64."
            exit 1
          fi


          if echo "$ARCHES" \
            | grep -qw arm64; then

            echo "ERROR: arm64 unexpectedly remains."
            exit 1
          fi


      # ============================================================
      # Audit all Mach-O deployment targets
      # ============================================================

      - name: Audit Mach-O deployment targets
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p ../diagnostics

          REPORT="../diagnostics/macho-deployment-targets.txt"
          : > "$REPORT"


          find "$APP" \
            -type f \
            -print0 \
          | while IFS= read -r -d '' FILE; do

              if file "$FILE" \
                | grep -q "Mach-O"; then

                {
                  echo
                  echo "============================================================"
                  echo "$FILE"
                  echo "============================================================"

                  file "$FILE"

                  echo
                  echo "--- Architectures ---"

                  lipo \
                    -archs \
                    "$FILE" \
                    2>/dev/null \
                    || true

                  echo
                  echo "--- Deployment load commands ---"

                  otool \
                    -l \
                    "$FILE" \
                  | awk '
                      /cmd LC_VERSION_MIN_MACOSX/ {
                        capture=1
                        count=0
                      }

                      /cmd LC_BUILD_VERSION/ {
                        capture=1
                        count=0
                      }

                      capture {
                        print
                        count++

                        if (count >= 10) {
                          capture=0
                        }
                      }
                    '

                  echo
                  echo "--- Linked libraries ---"

                  otool \
                    -L \
                    "$FILE" \
                    || true

                } | tee -a "$REPORT"

              fi

            done


      # ============================================================
      # Code signatures and entitlements
      # ============================================================

      - name: Inspect code signatures
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p ../diagnostics

          REPORT="../diagnostics/codesign-report.txt"


          {
            echo "============================================================"
            echo "Main application"
            echo "============================================================"

            codesign \
              -dvvv \
              "$APP" \
              2>&1 \
              || true


            echo
            echo "============================================================"
            echo "Main entitlements"
            echo "============================================================"

            codesign \
              -d \
              --entitlements :- \
              "$APP" \
              2>&1 \
              || true


            echo
            echo "============================================================"
            echo "Extensions"
            echo "============================================================"


            find "$APP" \
              -type d \
              -name '*.appex' \
              -print \
            | while read -r EXTENSION; do

                echo
                echo "------------------------------------------------------------"
                echo "$EXTENSION"
                echo "------------------------------------------------------------"

                codesign \
                  -dvvv \
                  "$EXTENSION" \
                  2>&1 \
                  || true

                codesign \
                  -d \
                  --entitlements :- \
                  "$EXTENSION" \
                  2>&1 \
                  || true

              done

          } | tee "$REPORT"


          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=4 \
            "$APP"


      # ============================================================
      # Package
      # ============================================================

      - name: Package High Sierra build
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p release

          OUTPUT="release/LocalSend-macOS-High-Sierra-10.13-x86_64.zip"

          rm -f "$OUTPUT"

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$APP" \
            "$OUTPUT"

          echo
          echo "Created:"
          ls -lh "$OUTPUT"


      # ============================================================
      # Upload successful app
      # ============================================================

      - name: Upload High Sierra build
        uses: actions/upload-artifact@v4
        with:
          name: LocalSend-macOS-High-Sierra-10.13-x86_64
          path: app/release/LocalSend-macOS-High-Sierra-10.13-x86_64.zip
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # Diagnostics — always collect
      # ============================================================

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p diagnostics


          cp \
            app/macos/Runner.xcodeproj/project.pbxproj \
            diagnostics/project.pbxproj.after-patch \
            2>/dev/null


          cp \
            app/macos/Podfile \
            diagnostics/Podfile.after-patch \
            2>/dev/null


          cp \
            app/macos/Podfile.lock \
            diagnostics/Podfile.lock.after-patch \
            2>/dev/null


          cp \
            app/pubspec.yaml \
            diagnostics/pubspec.yaml.after-foss-strip \
            2>/dev/null


          cp \
            app/macos/Runner/Configs/Release.xcconfig \
            diagnostics/Release.xcconfig.after-patch \
            2>/dev/null


          cp \
            flutter-config-first.log \
            diagnostics/flutter-config-first.log \
            2>/dev/null


          cp \
            flutter-config-final.log \
            diagnostics/flutter-config-final.log \
            2>/dev/null


          cp \
            pod-install.log \
            diagnostics/pod-install.log \
            2>/dev/null


          cp \
            pod-env.log \
            diagnostics/pod-env.log \
            2>/dev/null


          cp \
            swiftpm-resolve.log \
            diagnostics/swiftpm-resolve.log \
            2>/dev/null


          cp \
            flutter-macos-build.log \
            diagnostics/flutter-macos-build.log \
            2>/dev/null


          cp \
            flutter-pub-deps.txt \
            diagnostics/flutter-pub-deps.txt \
            2>/dev/null


          # --------------------------------------------------------
          # Collect Package.resolved dynamically
          # --------------------------------------------------------

          python3 <<'PY'
          from pathlib import Path
          import shutil


          source = Path("app/macos")
          destination = Path("diagnostics")

          destination.mkdir(
              parents=True,
              exist_ok=True,
          )

          files = sorted(
              path
              for path in source.rglob("Package.resolved")
              if path.parent.name == "swiftpm"
          )

          for index, path in enumerate(
              files,
              start=1,
          ):

              relative = path.relative_to(source)

              safe_name = (
                  str(relative)
                  .replace("/", "__")
                  .replace(" ", "_")
              )

              output = destination / (
                  f"Package.resolved."
                  f"{index}__"
                  f"{safe_name}"
              )

              shutil.copy2(
                  path,
                  output,
              )

              print(
                  f"Copied {path} -> {output}"
              )
          PY


          # --------------------------------------------------------
          # Collect patched gal files
          # --------------------------------------------------------

          PUB_CACHE_ROOT="${PUB_CACHE:-$HOME/.pub-cache}"

          GAL_SWIFT="$(
            find "$PUB_CACHE_ROOT" \
              -type f \
              -path '*/gal-2.3.3/darwin/gal/Sources/gal/GalPlugin.swift' \
              -print \
              -quit
          )"

          GAL_PODSPEC="$(
            find "$PUB_CACHE_ROOT" \
              -type f \
              -path '*/gal-2.3.3/darwin/gal.podspec' \
              -print \
              -quit
          )"


          if [ -n "$GAL_SWIFT" ]; then

            cp \
              "$GAL_SWIFT" \
              diagnostics/GalPlugin.swift.after-patch \
              2>/dev/null

            cp \
              "${GAL_SWIFT}.original" \
              diagnostics/GalPlugin.swift.original \
              2>/dev/null
          fi


          if [ -n "$GAL_PODSPEC" ]; then

            cp \
              "$GAL_PODSPEC" \
              diagnostics/gal.podspec.after-patch \
              2>/dev/null

            cp \
              "${GAL_PODSPEC}.original" \
              diagnostics/gal.podspec.original \
              2>/dev/null
          fi


      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LocalSend-High-Sierra-build-diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30
